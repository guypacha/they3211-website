<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><script>try{var y3=localStorage.getItem("y3211-theme");if(y3==="light"||y3==="dark")document.documentElement.dataset.theme=y3}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>מגרש האימונים 3211</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column mobile app; top bar with XP, views swap in place; the game board is an SVG "electrical panel" scaled to width. */
:root{
  --bg:#F3F7FB; --surface:#FFFFFF; --ink:#0B2A45; --muted:#5A6B7F; --line:#D3DFEB;
  --accent:#0A6BB0; --accent-2:#0F86D8; --accent-soft:#E4F0FA;
  --good:#1D8A57; --good-soft:#E3F4EB; --warn:#C8650F; --warn-soft:#FCEFE2; --bad:#C9302A; --bad-soft:#FBE7E5;
  --panel:#DCE5EE; --panel-hole:#B9C8D7; --comp:#FFFFFF; --comp-edge:#8FA3B8;
  --wire-red:#D3302A; --wire-black:#1C1F24; --wire-edge:#FFFFFF; --star:#F2B01E;
  --f-head:"Rubik","Heebo",system-ui,sans-serif; --f-body:"Heebo",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131F; --surface:#0F2134; --ink:#E5EEF7; --muted:#93A7BC; --line:#22394F;
  --accent:#4BAEF2; --accent-2:#7CC8F8; --accent-soft:#12304A;
  --good:#4CC98A; --good-soft:#123426; --warn:#F09A4A; --warn-soft:#3A2613; --bad:#F2675F; --bad-soft:#3A1715;
  --panel:#16293D; --panel-hole:#0C1A29; --comp:#1E3550; --comp-edge:#4F6B88;
  --wire-red:#E8473F; --wire-black:#0A0C0F; --wire-edge:#8DA2B8; --star:#F5C04A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08131F; --surface:#0F2134; --ink:#E5EEF7; --muted:#93A7BC; --line:#22394F;
  --accent:#4BAEF2; --accent-2:#7CC8F8; --accent-soft:#12304A;
  --good:#4CC98A; --good-soft:#123426; --warn:#F09A4A; --warn-soft:#3A2613; --bad:#F2675F; --bad-soft:#3A1715;
  --panel:#16293D; --panel-hole:#0C1A29; --comp:#1E3550; --comp-edge:#4F6B88;
  --wire-red:#E8473F; --wire-black:#0A0C0F; --wire-edge:#8DA2B8; --star:#F5C04A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.term:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;background:none;border:0;padding:0}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:13px}
.brand b{font-family:var(--f-head);font-size:17px;white-space:nowrap}
@media (max-width:460px){.brand small,.xp .track,.xp .mono{display:none}.brand b{font-size:15px}.bar{gap:6px}.bar .tabbtn{padding:6px 9px}}.brand{min-width:0}.brand>span:last-child{min-width:0}.brand b{display:block;overflow:hidden;text-overflow:ellipsis}@media (max-width:430px){.brand b{display:none}}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1}
.xp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.xp .lvl{font-family:var(--f-head);font-weight:700;color:var(--ink);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.xp .track{width:72px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.xp .fill{height:100%;background:var(--accent);transition:width .6s}
.tabbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.tabbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:#fff;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* login */
.login{display:grid;gap:16px;padding-top:24px}
.login .hero{display:flex;flex-direction:column;gap:8px}
.login h1{font-size:clamp(28px,7vw,40px);font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px}

/* world map */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.world{display:flex;flex-direction:column;gap:8px;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;min-height:132px}
.world.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.world.off{opacity:.62;cursor:default}
.world .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.world h3{font-size:18px}
.world .meta{font-size:13px;color:var(--muted);margin-top:auto}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}

/* mission path */
.path{display:flex;flex-direction:column;gap:0;position:relative}
.mission{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 0;text-align:right;background:none;border:0;width:100%}
.mission .node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:18px;border:3px solid var(--line);background:var(--surface);position:relative;z-index:1}
.mission.done .node{background:var(--good);border-color:var(--good);color:#fff}
.mission.open .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.mission.lock{cursor:default}
.mission.lock .node{color:var(--muted)}
.mission h3{font-size:17px}
.mission p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.path::before{content:"";position:absolute;right:25px;top:30px;bottom:30px;width:3px;background:var(--line)}
.stars{display:flex;gap:2px;direction:ltr}
.stars svg{width:18px;height:18px}

/* game */
.gamehead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.gamehead h2{font-size:22px}
.goal{font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.boardwrap{background:var(--panel);border-radius:18px;padding:6px;position:relative;touch-action:manipulation}
.board{display:block;width:100%;height:auto;max-height:72vh;user-select:none;-webkit-user-select:none}
.board text{font-family:var(--f-head);fill:var(--ink)}
.board .lbl{font-size:13px;font-weight:700}
.board .sub{font-size:10.5px;fill:var(--muted);font-family:var(--f-mono)}
.board .tag{font-family:var(--f-mono);font-size:11px;font-weight:700}
.comp{fill:var(--comp);stroke:var(--comp-edge);stroke-width:1.5}
.hole{fill:var(--panel-hole)}
.term{cursor:pointer;touch-action:none}
.learn{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.lcard .mono{white-space:nowrap}.lcard{display:grid;gap:8px;align-content:start}.lcard h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center}.lcard p{margin:0;line-height:1.6}
.lnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;flex:none}
.lart{border-radius:12px;padding:6px;background:#EEF3F8;color:#0B2A45}.lart svg{direction:ltr;width:100%;height:auto;display:block}.lart text{fill:#0B2A45}
.dragline{fill:none;stroke:var(--accent-2);stroke-width:5;stroke-linecap:round;stroke-dasharray:8 6;pointer-events:none}.dragline.snap{stroke-dasharray:none}
.wire.unset .core{stroke-dasharray:6 5}.qbadge circle{fill:var(--accent-2);stroke:#fff;stroke-width:2}.qbadge text{fill:#fff;font:700 13px var(--f-mono)}
.term .hit{fill:transparent}
.term .stud{stroke:var(--comp-edge);stroke-width:2;fill:#C7CFD8}
.term.pos .ring{stroke:var(--wire-red)} .term.neg .ring{stroke:var(--wire-black)}
.term .ring{fill:none;stroke-width:2.5;stroke:#8A939E}
.term.sel .stud{fill:var(--accent-2)}
.term.sel .halo{opacity:1}
.term .halo{fill:none;stroke:var(--accent-2);stroke-width:3;opacity:0;animation:pulse 1s infinite}
@keyframes pulse{0%{r:11}100%{r:19;stroke-opacity:0}}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.wire .edge{stroke:var(--wire-edge);stroke-opacity:.9}
.wire.hot .core{animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{from{stroke:#FF8A1F}to{stroke:#FFD15A}}
.wire.bad .edge{stroke:var(--bad);stroke-opacity:1}
.wire.live .flow{stroke:#FFE36E;stroke-dasharray:2 12;animation:flow .6s linear infinite;opacity:1}
.wire .flow{opacity:0}
@keyframes flow{to{stroke-dashoffset:-14}}
.smoke{fill:var(--muted);opacity:.0;animation:smoke 1.6s ease-out infinite}
@keyframes smoke{0%{opacity:.55;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-34px) scale(1.6)}}
.spark{stroke:#FFC83A;stroke-width:3;stroke-linecap:round;animation:spark .45s ease-out infinite}
@keyframes spark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.4)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ledon{animation:led 1.2s linear infinite}
@keyframes led{0%{fill:#FF4D4D}33%{fill:#4DFF88}66%{fill:#4DA6FF}}

/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--f-mono);font-weight:700;font-size:14px;min-width:64px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip .sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-inline-start:6px;border:1px solid var(--wire-edge)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* feedback */
.result{display:flex;flex-direction:column;gap:10px}
.err{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px;border-radius:12px;background:var(--bad-soft)}
.err.w{background:var(--warn-soft)}
.err .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font-weight:800;font-family:var(--f-head)}
.err.w .ic{background:var(--warn)}
.err p{margin:0}
.win{background:var(--good-soft);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.win .stars svg{width:30px;height:30px}
.win h3{font-size:22px;color:var(--good)}
.manual{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px}
.manual table{border-collapse:collapse;width:100%;font-size:14px}
.manual th,.manual td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}

/* mentor */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.m{border-collapse:collapse;min-width:640px;width:100%;font-size:14px}
table.m th,table.m td{padding:10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.m th{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.p-done{background:var(--good-soft);color:var(--good)} .p-stuck{background:var(--bad-soft);color:var(--bad)} .p-none{color:var(--muted)} .p-prog{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-head);font-size:26px}
.demo{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
/* missions 4-7 */
.opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:right;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt small{color:var(--muted);font-size:13px}
.opts{display:grid;gap:8px}
.opts.three{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.can-y{stroke:#E2BE12}.can-g{stroke:#24955A}
.link{fill:none;stroke-width:3.2;stroke-linecap:round}
.linkhit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.lk.bad .link{stroke:var(--bad)}
.lk.live .flowdot{opacity:1}
.flowdot{fill:#FFE36E;opacity:0}
.idtag{cursor:pointer}
.idtag rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.idtag.bad rect{fill:var(--bad-soft);stroke:var(--bad)}
.idtag text{font-family:var(--f-mono)!important;font-size:12px;font-weight:700;fill:var(--accent)!important}
.idtag.bad text{fill:var(--bad)!important}
.itile{cursor:pointer}
.itile .frame{fill:var(--comp);stroke:var(--comp-edge);stroke-width:1.2}
.itile.mk .frame{stroke:var(--bad);stroke-width:3.5}
.itile .badge{opacity:0}
.itile.mk .badge{opacity:1}
.itile.ok .frame{stroke:var(--good);stroke-width:3.5}
.itile.miss .frame{stroke:var(--warn);stroke-width:3.5;stroke-dasharray:6 4}
.itile:focus-visible{outline:none}.itile:focus-visible .frame{stroke:var(--accent-2);stroke-width:3.5}
.graph text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.board .tag,.board .sub,.graph text,.idtag text{direction:ltr;unicode-bidi:isolate}
.vline{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
.thr{stroke:var(--bad);stroke-dasharray:5 4;stroke-width:1.5}
.qcount{font-size:13px;color:var(--muted)}
.why{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0}

.world{cursor:pointer}.world.full{border-color:var(--good)}
.tabbtn.site{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:32px;white-space:nowrap}.bar .tabbtn.site{margin-inline-start:auto}.login>.tabbtn.site{justify-self:start;margin-bottom:8px}.bar .tabbtn.lang{margin-inline-start:0}.tabbtn.lang{font-family:var(--f-mono);font-weight:700}
@media (max-width:460px){.xp .mono,.brand small{display:none}}
@media (max-width:380px){.xp{display:none}}
/* ==== WORLDS CSS ==== */
/* engines */
.qcard{display:flex;flex-direction:column;gap:12px}
.glabel{margin:0 0 6px;font-weight:700;font-size:14px;color:var(--muted)}
.art{display:flex;justify-content:center;background:var(--panel);border-radius:14px;padding:10px;min-height:60px}
.art svg{width:100%;max-width:420px;height:auto;max-height:240px}
.partpic{width:100%;height:auto;max-height:110px}
.art .partpic{max-height:150px}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:6px 10px}
.slot.fill{border-style:solid;padding:0;border:0}
.slot .num{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.stepbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:52px}
.stepbtn small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.slot.ok .stepbtn{border-color:var(--good);background:var(--good-soft)}
.slot.no .stepbtn{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:grid;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.bankbtn{background:var(--accent-soft);border-color:transparent}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mtile{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px}
.mtile .partbox{background:#F4F7FA;border-radius:10px;padding:8px;display:grid;place-items:center;height:110px}
.mtile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mtile.ok{border-color:var(--good);background:var(--good-soft)}
.mtile.no{border-color:var(--bad);background:var(--bad-soft)}
.mtile .role{color:var(--muted);font-size:13px;line-height:1.35;text-align:right}
.namechip{font-family:var(--f-body);min-width:0}
.sl{display:flex;flex-direction:column;gap:4px}
.sl label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.sl input{width:100%;accent-color:var(--accent);height:28px}
.simgrid{display:grid;gap:14px}
@media (min-width:640px){.simgrid.two{grid-template-columns:1fr 1fr}}
.meter{display:flex;flex-direction:column;gap:4px;font-size:13px}
.meter .bar2{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter .bar2 i{display:block;height:100%;background:var(--accent);transition:width .15s}
.meter.hot .bar2 i{background:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{background:var(--panel);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.kv span{font-size:12px;color:var(--muted)}.kv b{font-family:var(--f-mono);font-size:17px;direction:ltr;unicode-bidi:isolate;text-align:right}
.kv .bad b{color:var(--bad)}.kv .good b{color:var(--good)}
.sim{display:block;width:100%;height:auto;background:var(--surface);border-radius:14px}
.sim text{font-family:var(--f-head);fill:var(--ink);font-size:12px}
.sim .m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pulse{animation:pulse2 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse2{50%{transform:scale(1.25);opacity:.6}}
.build>*{animation:dropin .5s both}
@keyframes dropin{from{opacity:0;transform:translateY(-14px)}}
.tablex{border-collapse:collapse;width:100%;font-size:14px}

function pdhBox(x,y,w,h,t,s){

}

/* twisted pair along a curve P(t), t in 0..1: returns two paths, half a twist apart */
function twistD(P,amp,pitch){
  const n=60,pts=[];let L=0,prev=P(0);for(let i=0;i<=n;i++){const q=P(i/n);L+=Math.hypot(q.x-prev.x,q.y-prev.y);prev=q;pts.push(q)}
  const tw=Math.max(1,Math.round(L/pitch)),out=[[],[]];
  pts.forEach((q,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(n,i+1)],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
    const o=amp*Math.sin(Math.PI*2*tw*i/n);
    out[0].push((i?"L":"M")+(q.x+nx*o).toFixed(1)+" "+(q.y+ny*o).toFixed(1));out[1].push((i?"L":"M")+(q.x-nx*o).toFixed(1)+" "+(q.y-ny*o).toFixed(1))});
  return out.map(a=>a.join(""))}
function wirePath(a,b,k){
  const my=(a.y+b.y)/2+((k%3)-1)*16;
  return `M${a.x} ${a.y}V${my}H${b.x}V${b.y}`;
}
function wireMid(a,b,k){ // a point on the wire path, away from terminals, for the "?" badge
  const my=(a.y+b.y)/2+((k%3)-1)*16,P=[[a.x,a.y],[a.x,my],[b.x,my],[b.x,b.y]];
  const L=[0];for(let i=1;i<4;i++)L.push(L[i-1]+Math.abs(P[i][0]-P[i-1][0])+Math.abs(P[i][1]-P[i-1][1]));
  const at=f=>{const d=L[3]*f;for(let i=1;i<4;i++)if(d<=L[i]){const s=L[i]-L[i-1]||1,u=(d-L[i-1])/s;return {x:P[i-1][0]+(P[i][0]-P[i-1][0])*u,y:P[i-1][1]+(P[i][1]-P[i-1][1])*u}}return {x:b.x,y:b.y}};
  for(const f of [.5,.38,.62,.28,.72]){const q=at(f);if(!G.L.terms.some(t=>Math.hypot(t.x-q.x,t.y-q.y)<26))return q}

/* ---------- game logic ---------- */
let ANIMS=[];const stopAnims=()=>{ANIMS.forEach(f=>{try{f()}catch(e){}});ANIMS=[]};
function startGame(id){
  G={id,L:LEVELS[id],wires:[],sel:null,attempts:0,hint:false,errors:null,flags:{},fx:[],phase:"play",n:0,learned:false};
  if(MODS[id])MODS[id].init();
  view="game";render();window.scrollTo(0,0);
}
function bindGame(){
  if(typeof LEARN!=="undefined"&&LEARN[G.id]){
    if(!G.learned){const b=document.getElementById("learned");if(b)b.addEventListener("click",()=>{G.learned=true;render();window.scrollTo(0,0)});return}
    const r=document.getElementById("relearn");if(r)r.addEventListener("click",()=>{closeSheet();G.learned=false;render();window.scrollTo(0,0)});
  }
  if(MODS[G.id]){MODS[G.id].bind();return}
  const svg=app.querySelector(".board");if(!svg)return;
  dragWire(svg,()=>G.L.terms,tapTerm,(a,b)=>{G.sel=a;tapTerm(b)});
  svg.querySelectorAll(".wire").forEach(el=>el.addEventListener("click",()=>editWire(el.dataset.w)));
  const on=(id,f)=>{const b=document.getElementById(id);if(b)b.addEventListener("click",f)};
  on("check",check);on("clear",()=>{if(G.phase==="win")return;G.wires=[];G.flags={};G.fx=[];G.errors=null;render()});
  on("hint",()=>{if(!G.hint){G.hint=true;render()}});
  on("man",()=>{G.manualOpen=!G.manualOpen;render()});
  on("solve",showSolution);
  if(G.phase==="win")animateDevices();
}
function tapTerm(id){
  if(G.phase==="win")return;
  if(!G.sel){G.sel=id;render();return}
  if(G.sel===id){G.sel=null;render();return}
  const a=T(G.sel),b=T(id);
  const kinds=[a.kind,b.kind].sort().join("-");
  if(kinds==="ch-dev")addWire({a:a.kind==="ch"?a.id:b.id,b:a.kind==="ch"?b.id:a.id,type:"pair"});
  else if(kinds==="pw-pw")addWire({a:a.id,b:b.id,type:"single"});
  else{G.sel=id;render();toast(a.kind==="dev"&&b.kind==="dev"?"התקן מתחבר לערוץ ב־PDH, לא להתקן אחר":a.kind==="ch"&&b.kind==="ch"?"מחברים ערוץ להתקן, לא ערוץ לערוץ":"ערוצי ה־PDH מתחברים להתקנים, לא לסוללה");return}
}
function addWire(w){
  if(G.wires.some(x=>(x.a===w.a&&x.b===w.b)||(x.a===w.b&&x.b===w.a))){G.sel=null;render();toast("כבר יש חוט בין השניים");return}
  w.id="w"+(++G.n);w.color=null;w.gauge=null;G.wires.push(w);G.sel=null;clearFx();render();
  toast(w.type==="pair"?"החוט מחובר. לחצו עליו כדי לבחור עובי":"החוט מחובר. לחצו עליו כדי לבחור צבע ועובי");
}
const wireDone=w=>w.gauge&&(w.type==="pair"||w.color);
function editWire(wid){if(G.phase==="win")return;const w=G.wires.find(x=>x.id===wid);openSheet(Object.assign({},w),true)}
function openSheet(w,existing){
  closeSheet();
  w.color=w.color||(w.type==="single"?null:undefined);w.gauge=w.gauge||null;
  const a=T(w.a),b=T(w.b);
  const el=document.createElement("div");el.className="sheet";el.setAttribute("role","dialog");el.setAttribute("aria-label","הגדרת חוט");
  const draw=()=>{
    el.innerHTML=`<div class="in"><h3 style="font-size:18px">${existing?"חוט":"חוט חדש"}: ${a.name} ← ${b.name}</h3>
    ${w.type==="single"?`<div><p style="margin:0 0 6px" class="muted">צבע</p><div class="chips">
      <button class="chip" data-c="red" aria-pressed="${w.color==="red"}">אדום<span class="sw" style="background:var(--wire-red)"></span></button>
      <button class="chip" data-c="black" aria-pressed="${w.color==="black"}">שחור<span class="sw" style="background:var(--wire-black)"></span></button></div></div>`
      :`<p style="margin:0" class="muted">כבל זוגי: אדום לפלוס, שחור למינוס.</p>`}
    <div><p style="margin:0 0 6px" class="muted">עובי (AWG)</p><div class="chips">${GAUGES.map(g=>`<button class="chip" data-g="${g}" aria-pressed="${w.gauge===g}">${g}</button>`).join("")}</div></div>
    <div class="row"><button class="btn" id="ok" ${existing||wireDone(w)?"":"disabled"}>${existing?"סגור":"חבר"}</button>
      ${existing?`<button class="btn ghost" id="del" style="color:var(--bad)">מחק חוט</button>`:`<button class="btn ghost" id="cancel">ביטול</button>`}</div></div>`;
    const live=()=>{if(existing){const i=G.wires.findIndex(x=>x.id===w.id);if(i>=0){G.wires[i]=Object.assign({},w);clearFx();render()}}draw()};
    el.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{w.color=c.dataset.c;live()});
    el.querySelectorAll("[data-g]").forEach(c=>c.onclick=()=>{w.gauge=+c.dataset.g;live()});
    const cn=el.querySelector("#cancel");if(cn)cn.onclick=()=>{closeSheet();G.sel=null;render()};
    const d=el.querySelector("#del");if(d)d.onclick=()=>{G.wires=G.wires.filter(x=>x.id!==w.id);clearFx();closeSheet();render()};
    el.querySelector("#ok").onclick=()=>{
      if(existing){const i=G.wires.findIndex(x=>x.id===w.id);G.wires[i]=w}
      else{w.id="w"+(++G.n);G.wires.push(w)}
      G.sel=null;clearFx();closeSheet();render()};
  };
  draw();document.body.appendChild(el);sheet=el;
  const first=el.querySelector(".chip");if(first)first.focus();
}
function closeSheet(){if(sheet){sheet.remove();sheet=null}}
/* drag from one terminal to another to lay a wire; a tap without a drag still selects (tap-tap also works) */
function dragWire(svg,terms,onTap,onConnect){
  const toSvg=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
  const near=(q,skip)=>{let best=null,bd=30;terms().forEach(t=>{const d=Math.hypot(t.x-q.x,t.y-q.y);if(d<bd&&t.id!==skip){bd=d;best=t}});return best};
  svg.querySelectorAll(".term").forEach(el=>{
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onTap(el.dataset.t)}});
    el.addEventListener("pointerdown",e=>{
      if(G.phase==="win"||e.button>0)return;e.preventDefault();
      const id=el.dataset.t,a=terms().find(t=>t.id===id),start={x:e.clientX,y:e.clientY};let moved=false,line=null,hot=null;
      try{svg.setPointerCapture(e.pointerId)}catch(_){}
      const move=ev=>{if(ev.pointerId!==e.pointerId)return;
        if(!moved&&Math.hypot(ev.clientX-start.x,ev.clientY-start.y)<8)return;
        if(!moved){moved=true;line=document.createElementNS("http://www.w3.org/2000/svg","path");line.setAttribute("class","dragline");svg.insertBefore(line,svg.querySelector(".term"));el.classList.add("sel")}
        const q=toSvg(ev),t=near(q,id);
        line.setAttribute("d",`M${a.x} ${a.y}L${t?t.x:q.x} ${t?t.y:q.y}`);line.classList.toggle("snap",!!t);
        if(hot!==t){if(hot){const h=svg.querySelector(`.term[data-t="${hot.id}"]`);if(h)h.classList.remove("sel")}hot=t;if(t){const h=svg.querySelector(`.term[data-t="${t.id}"]`);if(h)h.classList.add("sel")}}};
      const up=ev=>{if(ev.pointerId!==e.pointerId)return;svg.removeEventListener("pointermove",move);svg.removeEventListener("pointerup",up);svg.removeEventListener("pointercancel",up);
        if(line)line.remove();
        if(!moved){onTap(id);return}
        const t=ev.type==="pointerup"?near(toSvg(ev),id):null;
        if(t)onConnect(id,t.id);else{G.sel=null;render()}};
      svg.addEventListener("pointermove",move);svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
    });
  });
}
function clearFx(){G.flags={};G.fx=[];G.errors=null}
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

/* union-find over power terminals */
function nets(wires,withBreaker){
  const p={};const f=x=>{p[x]=p[x]||x;return p[x]===x?x:(p[x]=f(p[x]))};const u=(a,b)=>{p[f(a)]=f(b)};
  wires.forEach(w=>u(w.a,w.b));if(withBreaker)u("BR1","BR2");return (a,b)=>f(a)===f(b);
}
function evaluate(){
  const L=G.L,errs=[],flags={},fx=[];
  const mark=(ids,cls)=>ids.forEach(i=>flags[i]=(flags[i]?flags[i]+" ":"")+cls);
  const mid=w=>{const a=T(w.a),b=T(w.b);return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
  if(L.power){
    const pw=G.wires.filter(w=>w.type==="single");
    const same=nets(pw,true),sameNoBr=nets(pw,false);
    if(same("B+","B-")){
      errs.push({text:"<b>קצר!</b> הפלוס של הסוללה מחובר ישר למינוס. בסוללה אמיתית זה מאות אמפרים בשבריר שנייה: חוטים נמסים ויכולה להתחיל שריפה."});
      mark(pw.map(w=>w.id),"bad");["B+","B-"].forEach(id=>{const t=T(id);fx.push(sparkAt(t.x,t.y))});
    }else{
      if(same("P+","B-")||same("P-","B+")){errs.push({text:"<b>קוטביות הפוכה.</b> ה־PDH מקבל מינוס איפה שצריך פלוס. ככה שורפים את ה־PDH ואת הבקרים."});mark(pw.map(w=>w.id),"bad")}
      else{
        if(!same("P+","B+"))errs.push({text:"ה־PDH לא מקבל פלוס מהסוללה. הפלוס צריך להגיע אליו דרך המפסק הראשי."});
        if(!same("P-","B-"))errs.push({text:"המינוס של ה־PDH לא חוזר לסוללה. בלי מעגל סגור לא זורם זרם."});
      }
      const direct=pw.filter(w=>[w.a,w.b].sort().join()==="BR1,BR2");
      if(direct.length){errs.push({text:"<b>חוט בין שני הברגים של המפסק</b> עוקף אותו. המפסק כבר לא יכול לכבות את הרובוט."});mark(direct.map(w=>w.id),"bad")}
      else if(sameNoBr("B+","P+")){errs.push({text:"<b>עקפת את המפסק הראשי.</b> בלי מפסק אין דרך לכבות את הרובוט בחירום, והוא לא יעבור ביקורת."});mark(pw.filter(w=>w.a==="B+"||w.b==="B+").map(w=>w.id),"bad")}
      const thin=pw.filter(w=>w.gauge>6);
      if(thin.length){errs.push({text:`חוט ${thin.map(w=>w.gauge+" AWG").join(", ")} דק מדי לנתיב הראשי. כל הזרם של הרובוט עובר פה, לפעמים יותר מ־100A. צריך <b class="mono">6 AWG</b> או עבה יותר.`});
        mark(thin.map(w=>w.id),"hot");thin.forEach(w=>fx.push(smokeAt(mid(w))))}
      const posSide=id=>same(id,"B+"),wrongCol=pw.filter(w=>(posSide(w.a)&&w.color!=="red")||(!posSide(w.a)&&same(w.a,"B-")&&w.color!=="black"));
      if(wrongCol.length){errs.push({sev:"w",text:"<b>צבע לא נכון.</b> פלוס בחוט אדום, מינוס בחוט שחור, כדי שכל מי שמסתכל על הלוח יבין מה הוא רואה. זה גם נבדק בביקורת."});mark(wrongCol.map(w=>w.id),"bad")}
    }
  }
  const pairs=G.wires.filter(w=>w.type==="pair");
  const chs=L.terms.filter(t=>t.kind==="ch"),devs=L.terms.filter(t=>t.kind==="dev");
  chs.forEach(c=>{const ws=pairs.filter(w=>w.a===c.id);if(ws.length>1){errs.push({text:`<b>${c.name}</b> מזין יותר מהתקן אחד. כל התקן מקבל ערוץ ונתיך משלו.`});mark(ws.map(w=>w.id),"bad")}});
  devs.forEach(d=>{
    const ws=pairs.filter(w=>w.b===d.id);
    if(!ws.length){errs.push({text:`<b>${d.name}</b> לא מחובר לשום ערוץ.`});return}
    if(ws.length>1){errs.push({text:`<b>${d.name}</b> מחובר ליותר מערוץ אחד.`});mark(ws.map(w=>w.id),"bad");return}
    const w=ws[0],c=T(w.a);
    if(c.amps<d.need){errs.push({text:`<b>${d.name}</b> צריך נתיך ${d.need}A וחיברת אותו לערוץ עם ${c.amps}A. הנתיך יקפוץ באמצע מקצה והמנוע ייכבה.`});mark([w.id],"bad")}
    else if(c.amps>d.need){errs.push({text:`<b>${d.name}</b> צריך נתיך ${d.need}A וחיברת אותו לערוץ עם ${c.amps}A. נתיך גדול מדי לא מגן: אם יהיה קצר, החוט יישרף לפני שהנתיך יקפוץ.`});mark([w.id],"bad")}
    const req=GAUGE_FOR[c.amps];
    if(w.gauge>req){errs.push({text:`כבל <span class="mono">${w.gauge} AWG</span> אל ${d.name} דק מדי לנתיך ${c.amps}A. צריך לפחות <b class="mono">${req} AWG</b>. החוט מתחמם לפני שהנתיך מספיק לקפוץ.`});mark([w.id],"hot");fx.push(smokeAt(mid(w)))}
  });
  return {errs,flags,fx};
}
function sparkAt(x,y){let s="";for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line class="spark" style="transform-origin:${x}px ${y}px" x1="${x+Math.cos(a)*8}" y1="${y+Math.sin(a)*8}" x2="${x+Math.cos(a)*20}" y2="${y+Math.sin(a)*20}"/>`}return s}
function smokeAt(p){return [0,1,2].map(i=>`<circle class="smoke" cx="${p.x+(i-1)*7}" cy="${p.y-4}" r="6" style="animation-delay:${i*.45}s;transform-box:fill-box;transform-origin:center"/>`).join("")}
function check(){
  closeSheet();G.sel=null;
  const un=G.wires.filter(w=>!wireDone(w));
  if(un.length){G.flags={};un.forEach(w=>G.flags[w.id]="bad");G.fx=[];G.errors=[{text:`<b>${un.length===1?"יש חוט אחד":`יש ${un.length} חוטים`} בלי ${un.some(w=>w.type==="single")?"צבע או עובי":"עובי"}</b> (מסומנים ב־?). לחצו על כל חוט ובחרו.`}];render();const r=app.querySelector(".result");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});return}
  G.attempts++;
  const {errs,flags,fx}=evaluate();
  G.flags=flags;G.fx=fx;G.errors=errs;
  if(!errs.length){win(false);return}
  render();
  const r=app.querySelector(".result");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function win(shown){
  G.phase="win";G.shown=shown;G.errors=null;G.fx=[];
  G.wires.forEach(w=>G.flags[w.id]="live");
  let st=shown?0:G.attempts===1?3:G.attempts<=3?2:1;if(G.hint&&st>1)st--;
  G.earned=st;const prev=S.m[G.id]||{stars:0,attempts:0};
  const gain=shown?0:Math.max(0,(st*30+10)-(prev.done?prev.stars*30+10:0));
  G.gain=gain;S.xp+=gain;
  S.m[G.id]={done:true,stars:Math.max(prev.stars||0,st),attempts:(prev.attempts||0)+1,at:Date.now()};
  save();render();
  const r=app.querySelector(".win");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function showSolution(){
  G.wires=G.L.solution.map((s,i)=>Object.assign({id:"s"+i,type:s.color?"single":"pair"},s));
  win(true);
}
function animateDevices(){
  app.querySelectorAll(".dv .rotor").forEach(r=>r.classList.add("spin"));
  app.querySelectorAll(".dv .led").forEach((r,i)=>{r.classList.add("ledon");r.style.animationDelay=(i*.15)+"s"});
}
/* track failed attempts for the mentor view */
function recordAttempt(){if(!G||G.phase==="win")return;const r=S.m[G.id]||{stars:0,attempts:0};r.attempts=(r.attempts||0)+1;S.m[G.id]=r;save()}

/* ---------- missions 4-7: shared helpers ---------- */
function starsFor(attempts,hint){let st=attempts<=1?3:attempts<=3?2:1;if(hint&&st>1)st--;return st}
function award(st,shown){
  const prev=S.m[G.id]||{stars:0,attempts:0};
  const gain=shown?0:Math.max(0,(st*30+10)-(prev.done?(prev.stars||0)*30+10:0));
  S.xp+=gain;
  S.m[G.id]=Object.assign({},prev,{done:true,stars:Math.max(prev.stars||0,shown?0:st),attempts:(prev.attempts||0)+1,at:Date.now()});
  G.phase="win";G.shown=shown;G.earned=shown?0:st;G.gain=gain;save();
}
function failAttempt(){const r=S.m[G.id]||{stars:0,attempts:0};r.attempts=(r.attempts||0)+1;S.m[G.id]=r;save()}
function headHtml(L,note){
  return `<section class="gamehead"><div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 280px">

    <h2>${L.title}</h2><p class="goal" style="margin:0">${L.goal}</p>${note?`<p class="note" style="margin:0">${note}</p>`:""}</div></section>`;
}
function winHtml(text){
  return `<div class="win"><h3>${G.shown?"זה הפתרון":"עברת!"}</h3>${stars(G.earned)}
    <p style="margin:0">${G.shown?"עברנו על הפתרון ביחד. נסו שוב בלי עזרה כדי לקבל כוכבים.":`קיבלת <b class="mono">+${G.gain} XP</b>. ${text||""}`}</p>
    <div class="row"><button class="btn" data-go="world">לשביל המשימות</button><button class="btn ghost" data-play="${G.id}">שחק שוב</button></div></div>`;
}
function errsHtml(errs,solveLabel){

    ${G.attempts>=2?`<button class="btn ghost small" id="solve" style="align-self:flex-start">${solveLabel||"הצג פתרון (בלי כוכבים)"}</button>`:""}</div>`;
}
const on=(id,f)=>{const b=document.getElementById(id);if(b)b.addEventListener("click",f)};
const scrollTo_=sel=>{const r=app.querySelector(sel);if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"})};

/* ---------- mission 4: CAN chain ---------- */
const CAN={
  title:"שרשרת CAN",
  goal:"חברו את כל ההתקנים לשרשרת CAN אחת, מה־roboRIO עד הנגד, ותנו לכל מנוע מספר ID לפי הקונבנציה שלנו: הנעה <span class=\"mono\">0–9</span>, אינטייק <span class=\"mono\">10–19</span>, זרוע <span class=\"mono\">20–29</span>.",
  hint:"שרשרת אחת בלי הסתעפויות: roboRIO בקצה אחד, נגד 120Ω בקצה השני, וכל מנוע באמצע. צהוב תמיד לצהוב. כל מנוע מקבל ID אחר, בטווח של המערכת שלו.",
  SYS:{K1:["הנעה",0],K2:["הנעה",0],K3:["אינטייק",10],K4:["זרוע",20]},
  vb:"0 0 400 560",
  terms:[
    {id:"RIO",x:200,y:122,name:"roboRIO"},
    {id:"K1",x:85,y:210,name:"הנעה שמאל"},{id:"K2",x:315,y:210,name:"הנעה ימין"},
    {id:"K3",x:85,y:360,name:"אינטייק"},{id:"K4",x:315,y:360,name:"זרוע"},
    {id:"TR",x:200,y:490,name:"נגד 120Ω"}],
  init(){G.links=[];G.ids={K1:0,K2:0,K3:0,K4:0};G.flags={}},
  T(id){return CAN.terms.find(t=>t.id===id)},
  draw(){
    const rio=`<rect class="comp" x="110" y="30" width="180" height="92" rx="16"/><text class="lbl" x="200" y="66" text-anchor="middle" style="font-size:16px">roboRIO</text>
      <text class="sub" x="200" y="86" text-anchor="middle">CAN · 120Ω built-in</text>`;
    const motor=t=>{const x=t.x,y=t.y,idb=(G.flags["id"+t.id]||"");
      return `<rect class="comp" x="${x-56}" y="${y}" width="112" height="122" rx="18"/>
      <g class="dv"><circle cx="${x}" cy="${y+40}" r="20" fill="var(--ink)"/><circle cx="${x}" cy="${y+40}" r="13" fill="none" stroke="var(--comp)" stroke-width="2"/><path class="rotor" d="M${x} ${y+28}v24M${x-12} ${y+40}h24" stroke="var(--comp)" stroke-width="3"/></g>
      <text class="lbl" x="${x}" y="${y+80}" text-anchor="middle" style="font-size:11.5px">${t.name.replace("מנוע ","")}</text>

    const tr=`<rect class="comp" x="150" y="490" width="100" height="44" rx="22"/><text class="tag" x="200" y="517" text-anchor="middle">120Ω</text>`;
    return rio+CAN.terms.filter(t=>t.id[0]==="K").map(motor).join("")+tr;
  },
  linkSvg(l,k){
    const a=CAN.T(l.a),b=CAN.T(l.b),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const off=(k%2?1:-1)*28,cx=mx-dy/len*off,cy=my+dx/len*off,nx=-dy/len*3.2,ny=dx/len*3.2;
    const P=(s1,s2)=>`M${a.x+nx*s1} ${a.y+ny*s1}Q${cx} ${cy} ${b.x+nx*s2} ${b.y+ny*s2}`;
    const mid=`M${a.x} ${a.y}Q${cx} ${cy} ${b.x} ${b.y}`,Q=t=>({x:(1-t)*(1-t)*a.x+2*(1-t)*t*cx+t*t*b.x,y:(1-t)*(1-t)*a.y+2*(1-t)*t*cy+t*t*b.y});

  view(){
    const svg=`<svg class="board" viewBox="${CAN.vb}" role="application" aria-label="לוח CAN">${CAN.draw()}${G.links.map((l,k)=>CAN.linkSvg(l,k)).join("")}${CAN.terms.map(t=>termSvg(t,G.sel===t.id)).join("")}</svg>`;

  bind(){

  linkSheet(l,existing){

  },
  idSheet(k){
    if(G.phase==="win")return;closeSheet();const t=CAN.T(k);
    const el=document.createElement("div");el.className="sheet";el.setAttribute("role","dialog");el.setAttribute("aria-label","מספר ID");
    el.innerHTML=`<div class="in"><h3 style="font-size:18px">מספר ID: ${t.name}</h3><p class="muted" style="margin:0">ממפעל, לכל המנועים יש ID 0. ה־ID נקבע בתוכנה של היצרן לפני שמחברים לרובוט.</p>
      ${[["הנעה",0],["אינטייק",10],["זרוע",20]].map(([nm,b])=>`<div><p class="muted" style="margin:0 0 4px;font-size:13px">${nm} <bdi class="mono">${b}–${b+9}</bdi></p><div class="chips">${Array.from({length:10},(_,i)=>b+i).map(n=>`<button class="chip" data-n="${n}" aria-pressed="${G.ids[k]===n}">${n}</button>`).join("")}</div></div>`).join("")}
      <div class="row"><button class="btn ghost" id="cancel">סגור</button></div></div>`;
    el.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{G.ids[k]=+b.dataset.n;G.flags={};G.errors=null;closeSheet();render()});
    el.querySelector("#cancel").onclick=()=>{closeSheet();render()};
    document.body.appendChild(el);sheet=el;el.querySelector(".chip").focus();
  },
  check(){
    closeSheet();G.attempts++;G.sel=null;const errs=[],flags={},L=G.links,deg={};
    const mark=(ids,c)=>ids.forEach(i=>flags[i]=c);
    CAN.terms.forEach(t=>deg[t.id]=0);L.forEach(l=>{deg[l.a]++;deg[l.b]++});
    const nm=id=>`<b>${CAN.T(id).name}</b>`;
    CAN.terms.filter(t=>deg[t.id]>2).forEach(t=>{errs.push({text:`${nm(t.id)} מחובר לשלושה כבלים או יותר. CAN הוא שרשרת, לא כוכב: כל התקן מקבל כבל נכנס וכבל יוצא, בלי הסתעפויות.`});mark(L.filter(l=>l.a===t.id||l.b===t.id).map(l=>l.id),"bad")});
    const lonely=CAN.terms.filter(t=>deg[t.id]===0&&t.id!=="TR");
    lonely.forEach(t=>errs.push({text:`${nm(t.id)} לא מחובר ל־CAN בכלל. ה־roboRIO לא רואה אותו, והמנוע לא יזוז.`}));
    if(deg.TR===0)errs.push({text:"<b>אין נגד בסוף השרשרת.</b> בלי טרמינציה האות חוזר מהקצה ומתנגש בעצמו: שגיאות CAN, ומנועים שמגמגמים או נעלמים באמצע מקצה."});
    if(deg.TR===2)errs.push({text:"<b>הנגד באמצע השרשרת.</b> נגד 120Ω שמים רק בקצה, אחרי ההתקן האחרון."});
    if(deg.RIO===2)errs.push({text:"<b>ה־roboRIO באמצע השרשרת.</b> יש בו נגד 120Ω מובנה, ולכן הוא צריך להיות קצה אחד של השרשרת. הנגד הוא הקצה השני."});
    const p={};const f=x=>{p[x]=p[x]||x;return p[x]===x?x:(p[x]=f(p[x]))};
    let loop=false;L.forEach(l=>{if(f(l.a)===f(l.b))loop=true;p[f(l.a)]=f(l.b)});
    if(loop)errs.push({text:"<b>יצרת לולאה.</b> השרשרת חוזרת לעצמה ואין לה שני קצוות. ב־CAN צריך קו אחד עם התחלה וסוף."});
    const used=CAN.terms.filter(t=>deg[t.id]>0),roots=new Set(used.map(t=>f(t.id)));
    if(roots.size>1)errs.push({text:"<b>השרשרת קטועה.</b> יש שני חלקים שלא מחוברים זה לזה. התקנים בחלק שלא מגיע ל־roboRIO לא יקבלו פקודות."});
    const crossed=L.filter(l=>l.cross);
    if(crossed.length){errs.push({text:`<b>הצלבת צהוב וירוק</b> (${crossed.length===1?"כבל אחד":crossed.length+" כבלים"}, מסומן באדום). צהוב הוא CAN High וירוק הוא CAN Low. צהוב תמיד לצהוב וירוק לירוק, אחרת אף התקן אחרי ההצלבה לא מדבר עם ה־roboRIO.`});mark(crossed.map(l=>l.id),"bad")}
    const byId={};["K1","K2","K3","K4"].forEach(k=>(byId[G.ids[k]]=byId[G.ids[k]]||[]).push(k));
    Object.entries(byId).filter(([,ks])=>ks.length>1).forEach(([n,ks])=>{errs.push({text:`${ks.length} מנועים עם <span class="mono">ID ${n}</span>. כשה־roboRIO שולח פקודה ל־ID ${n}, הוא לא יודע לאיזה מנוע היא שייכת. לכל מנוע מאותו סוג צריך ID משלו.`});ks.forEach(k=>flags["id"+k]="bad")});
    ["K1","K2","K3","K4"].forEach(k=>{const [nm,b]=CAN.SYS[k],n=G.ids[k];if(n<b||n>b+9){errs.push({text:`<b>${CAN.T(k).name}</b> קיבל <span class="mono">ID ${n}</span>, אבל אצלנו מערכת ה${nm} משתמשת ב־<span class="mono">${b}–${b+9}</span>. ככה כשרואים ID בלוג יודעים מיד לאיזו מערכת הוא שייך.`});flags["id"+k]="bad"}});
    G.flags=flags;G.errors=errs;
    if(!errs.length){CAN.winFx();award(starsFor(G.attempts,G.hint),false)}else failAttempt();
    render();scrollTo_(G.phase==="win"?".win":".result");
  },
  winFx(){G.flags={};G.links.forEach(l=>G.flags[l.id]="live")}
};

/* ---------- mission 6: push on a battery ---------- */
const BATT={
  title:"דחיפה על סוללה",
  goal:"רבע גמר. היריב דוחף אתכם 15 שניות. בחרו סוללה מהעגלה והגבלת זרם למנועי ההנעה, ונצחו בדחיפה בלי בראון־אאוט.",
  bats:[
    {id:"a",name:"סוללה 3",sub:"נטענה הלילה · <bdi>13.0V</bdi> · <bdi>0.011Ω</bdi>",v:13.0,r:0.011},
    {id:"b",name:"סוללה 1",sub:"משנת 2022 · <bdi>12.6V</bdi> · <bdi>0.026Ω</bdi>",v:12.6,r:0.026},
    {id:"c",name:"סוללה 5",sub:"מהמקצה הקודם · <bdi>12.2V</bdi> · <bdi>0.014Ω</bdi>",v:12.2,r:0.014}],
  lims:[{id:0,name:"בלי הגבלה",sub:"כל מנוע מושך כמה שהוא צריך"},{id:60,name:"60A למנוע",sub:"הגבלת זרם בתוכנה"},{id:40,name:"40A למנוע",sub:"הגבלת זרם בתוכנה"}],
  RW:0.008,BO:6.8,NEED:220,
  init(){G.bat=null;G.lim=null;G.run=null},
  sim(){
    const b=BATT.bats.find(x=>x.id===G.bat),per=G.lim||100,I0=per*4,pts=[];let off=0,bo=0,pos=0,soc=0;
    for(let t=0;t<=15;t+=0.1){
      const I=off>0?0:I0,voc=b.v-soc;soc+=I*0.1*0.00006;
      let V=voc-I*(b.r+BATT.RW);
      if(off<=0&&V<BATT.BO){off=0.5;bo++;V=BATT.BO-0.15}
      off-=0.1;pos=Math.max(-1,Math.min(1,pos+(I-BATT.NEED)*0.1*0.0009));
      pts.push({t,V:Math.max(4,V),I,pos});
    }
    const minV=Math.min(...pts.map(p=>p.V));
    return {pts,bo,I0,minV,win:!bo&&I0>=BATT.NEED};
  },
  view(){
    const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${G.run&&G.run.playing?"disabled":""}><b>${o.name}</b><small>${o.sub}</small></button>`).join("");
    const r=G.run;
    const X=t=>36+t/15*354,Y=v=>200-(v-4)/10*180;
    const shown=r?r.pts.slice(0,r.k||r.pts.length):[];
    const line=shown.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.V).toFixed(1)).join("");
    const last=shown[shown.length-1];

      render();requestAnimationFrame(step)};
    requestAnimationFrame(step);
  }
};

function makeLicense(id,o){const LIC={id,title:o.title,goal:o.goal||"עשר שאלות מכל העולם. צריך 8 נכונות כדי לעבור לחלק המעשי בסדנה.",Q:o.Q,practical:o.practical,
  init(){const ix=LIC.Q.map((_,i)=>i).sort(()=>Math.random()-.5).slice(0,10);G.qs=ix;G.perm=LIC.Q.map(q=>q.o.map((_,i)=>i).sort(()=>Math.random()-.5));G.i=0;G.pick=null;G.checked=false;G.score=0;G.done=false},
  view(){
    if(G.done){
      const pass=G.score>=8;
      return headHtml(LIC,"")+(pass?`<div class="win"><h3>עברת את החלק הממוחשב</h3>${stars(G.earned)}
        <p style="margin:0"><b class="mono">${G.score}/10</b> · קיבלת <b class="mono">+${G.gain} XP</b>. עכשיו החלק המעשי בסדנה, מול מנטור:</p>
        <ul style="margin:0;padding-inline-start:20px">${LIC.practical.map(x=>`<li>${x}</li>`).join("")}</ul>
        <p class="note" style="margin:0">המנטור מאשר את הרישיון בתצוגת המנטור.</p>
        <div class="row"><button class="btn" data-go="world">לשביל המשימות</button></div></div>`
      :`<div class="result"><div class="err"><span class="ic">!</span><p><b class="mono">${G.score}/10</b>. צריך 8 כדי לעבור. עברו שוב על המשימות שבהן טעיתם ונסו שוב. השאלות מתחלפות.</p></div>
        <div class="row"><button class="btn" data-play="${LIC.id}">מבחן חדש</button><button class="btn ghost" data-go="world">לשביל המשימות</button></div></div>`);
    }
    const q=LIC.Q[G.qs[G.i]];
    return headHtml(LIC,"")+`<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="qcount">שאלה ${G.i+1} מתוך 10 · נכונות עד עכשיו: ${G.score}</span><h3 style="font-size:19px">${q.q}</h3>
      <div class="opts">${G.perm[G.qs[G.i]].map(i=>{const o=q.o[i];return `<button class="opt ${G.checked?(i===q.a?"ok":i===G.pick?"no":""):""}" data-o="${i}" aria-pressed="${G.pick===i}" ${G.checked?"disabled":""}><b>${o}</b></button>`}).join("")}</div>
      ${G.checked?`<p class="why">${G.pick===q.a?"<b>נכון.</b> ":"<b>לא בדיוק.</b> "}${q.w}</p>`:""}
      <div class="row">${G.checked?`<button class="btn" id="next">${G.i<9?"לשאלה הבאה":"לתוצאה"}</button>`:`<button class="btn" id="chk" ${G.pick===null?"disabled":""}>בדוק</button>`}</div></div>`;
  },
  bind(){
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(G.checked)return;G.pick=+b.dataset.o;render()});
    on("chk",()=>{G.checked=true;if(G.pick===LIC.Q[G.qs[G.i]].a)G.score++;render()});
    on("next",()=>{if(G.i<9){G.i++;G.pick=null;G.checked=false;render();window.scrollTo(0,0);return}
      G.done=true;G.attempts=1;
      if(G.score>=8){award(G.score===10?3:G.score===9?2:1,false);S.m[LIC.id].approved=false;save()}else failAttempt();
      render();window.scrollTo(0,0)});
  }
};
return LIC}

/* ---------- shared engines for the new worlds ----------
   makeQuiz  : scenario cards (picture + question, one or more pick groups). The answer shows only after "בדוק".
   makeOrder : put steps in the right order, then watch it built.
   makeMatch : label pictures with names.
   Every engine returns a module {title,goal,init,view,bind} for MODS. */
const pic=(name,cls)=>{const p=PARTS[name];return `<svg class="${cls||"partpic"}" viewBox="${p.vb}" aria-hidden="true">${p.s}</svg>`};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const keyAct=(el,f)=>{el.addEventListener("click",f);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}})};
const starsByMiss=m=>m===0?3:m<=2?2:1;
function loopAnim(fn){ // requestAnimationFrame loop that stops when the view changes
  let alive=true,t0=performance.now();const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step=now=>{if(!alive)return;const r=fn((now-t0)/1000,reduce);if(r===false){alive=false;return}requestAnimationFrame(step)};
  requestAnimationFrame(step);const stop=()=>{alive=false};ANIMS.push(stop);return stop;
}

function makeQuiz(id,o){
  const Q={id,title:o.title,goal:o.goal,
    init(){G.order=o.shuffle===false?o.items.map((_,i)=>i):shuffle(o.items.map((_,i)=>i));G.perm=o.items.map(it=>Q.groups(it).map(g=>it.fixed?g.o.map((_,i)=>i):shuffle(g.o.map((_,i)=>i))));G.i=0;G.pick={};G.checked=false;G.score=0;G.miss=0;G.done=false;G.log=[]},
    item(){return o.items[G.order[G.i]]},
    groups(it){return it.groups||[{label:"",o:it.o,a:it.a}]},
    okGroup(g,p){return Array.isArray(g.a)?g.a.includes(p):g.a===p},
    isOk(it){const gs=Q.groups(it);if(it.ok)return it.ok(gs.map((g,k)=>G.pick[k]));return gs.every((g,k)=>Q.okGroup(g,G.pick[k]))},
    view(){
      const n=o.items.length,pass=o.pass==null?Math.ceil(n*0.7):o.pass;
      if(G.done){
        const good=G.score>=pass;
        return headHtml(Q,"")+(good?winHtml(`<b class="mono">${G.score}/${n}</b> נכונות. ${o.winText||""}`)+(o.lesson?`<p class="why">${o.lesson}</p>`:"")
          :`<div class="result"><div class="err"><span class="ic">!</span><p><b class="mono">${G.score}/${n}</b>. צריך ${pass} כדי לעבור. קראו שוב את ההסברים ונסו שוב, הסדר מתחלף.</p></div>
          <div class="row"><button class="btn" data-play="${id}">נסו שוב</button><button class="btn ghost" data-go="world">לשביל המשימות</button></div></div>`);
      }
      const it=Q.item(),gs=Q.groups(it),ok=G.checked&&Q.isOk(it);
      const art=it.art?(typeof it.art==="function"?it.art(G.checked,ok):it.art):"";
      return headHtml(Q,o.note||"")+`<div class="card qcard">
        <span class="qcount">${it.tag?it.tag+" · ":""}${G.i+1} מתוך ${n} · נכונות עד עכשיו: ${G.score}</span>
        ${art?`<div class="art">${art}</div>`:""}<h3 style="font-size:19px">${it.q}</h3>
        ${gs.map((g,k)=>`<div>${g.label?`<p class="glabel">${g.label}</p>`:""}<div class="opts ${g.cols?"three":""}">${G.perm[G.order[G.i]][k].map(i=>{const x=g.o[i];
          const txt=typeof x==="string"?x:x.t,sub=typeof x==="string"?"":x.s||"";
          const cls=G.checked?(Q.okGroup(g,i)&&!it.ok?"ok":(i===G.pick[k]?(ok?"ok":"no"):"")):"";
          return `<button class="opt ${cls}" data-g="${k}" data-o="${i}" aria-pressed="${G.pick[k]===i}" ${G.checked?"disabled":""}><b>${txt}</b>${sub?`<small>${sub}</small>`:""}</button>`}).join("")}</div></div>`).join("")}
        ${G.checked?`<p class="why">${ok?"<b>נכון.</b> ":"<b>לא בדיוק.</b> "}${it.w}</p>`:""}
        <div class="row">${G.checked?`<button class="btn" id="next">${G.i<n-1?"הבא":"לתוצאה"}</button>`:`<button class="btn" id="chk" ${gs.every((g,k)=>G.pick[k]!=null)?"":"disabled"}>בדוק</button>`}</div></div>`;
    },
    bind(){
      app.querySelectorAll(".qcard [data-o]").forEach(b=>b.onclick=()=>{if(G.checked)return;G.pick[+b.dataset.g]=+b.dataset.o;render()});
      on("chk",()=>{G.checked=true;const ok=Q.isOk(Q.item());if(ok)G.score++;else G.miss++;render()});
      on("next",()=>{const n=o.items.length;if(G.i<n-1){G.i++;G.pick={};G.checked=false;render();window.scrollTo(0,0);return}
        G.done=true;G.attempts=1;const pass=o.pass==null?Math.ceil(n*0.7):o.pass;
        if(G.score>=pass)award(starsByMiss(G.miss),false);else failAttempt();render();window.scrollTo(0,0)});
      if(o.bindArt)o.bindArt();
    }};
  return Q;
}

/* order: tap the steps in order to fill the slots; tap a placed step to take it back */
/* pointer drag for order steps: works with mouse and touch; a press without movement counts as a tap */
function dragSteps(onDrop,onTap){
  app.querySelectorAll("[data-drag]").forEach(el=>{
    if(el.disabled)return;
    el.addEventListener("click",e=>e.preventDefault());
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onTap(el.dataset.drag)}});
    el.addEventListener("pointerdown",e=>{
      if(e.button>0)return;const src=el.dataset.drag,x0=e.clientX,y0=e.clientY;let ghost=null,over=null,raf=0,lastY=y0;
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      const target=(x,y)=>{const t=document.elementFromPoint(x,y);if(!t)return null;const s=t.closest("[data-slot]");if(s)return s;return t.closest("[data-bank]")};
      const scroll=()=>{if(!ghost)return;if(lastY<70)window.scrollBy(0,-10);else if(lastY>innerHeight-70)window.scrollBy(0,10);raf=requestAnimationFrame(scroll)};
      const move=ev=>{lastY=ev.clientY;
        if(!ghost){if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<8)return;const r=el.getBoundingClientRect();ghost=el.cloneNode(true);ghost.classList.add("dragghost");ghost.style.width=r.width+"px";ghost.dataset.dx=x0-r.left;ghost.dataset.dy=y0-r.top;document.body.appendChild(ghost);el.classList.add("dragsrc");raf=requestAnimationFrame(scroll)}
        ghost.style.left=(ev.clientX-ghost.dataset.dx)+"px";ghost.style.top=(ev.clientY-ghost.dataset.dy)+"px";
        const t=target(ev.clientX,ev.clientY);if(t!==over){if(over)over.classList.remove("dropover");over=t;if(t)t.classList.add("dropover")}};
      const up=ev=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);cancelAnimationFrame(raf);
        if(!ghost){if(ev.type==="pointerup")onTap(src);return}
        ghost.remove();el.classList.remove("dragsrc");if(over)over.classList.remove("dropover");
        const t=ev.type==="pointerup"?target(ev.clientX,ev.clientY):null;
        if(t&&t.dataset.slot!=null)onDrop(src,{slot:+t.dataset.slot});else if(t&&t.dataset.bank)onDrop(src,{bank:true});else render()};
      el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
    });
  });
}
function makeOrder(id,o){
  const M={id,title:o.title,goal:o.goal,
    init(){G.r=0;M.reset()},
    reset(){const R=o.rounds[G.r];G.bank=shuffle(R.items.map(x=>x.id));while(G.bank.join()===R.answer.join())G.bank=shuffle(G.bank);G.placed=R.items.map(()=>null);G.res=null;G.anim=0},
    R(){return o.rounds[G.r]},
    view(){
      const R=M.R(),byId=k=>R.items.find(x=>x.id===k),full=G.placed.every(Boolean),lock=G.phase==="win"||(G.res&&G.res.all),nextEmpty=G.placed.indexOf(null);
      const slots=R.items.map((_,i)=>{const k=G.placed[i],x=k&&byId(k),st=G.res?(G.res[i]?"ok":"no"):"";
        return `<li class="slot ${k?"fill":""} ${st}" data-slot="${i}">${k?`<button class="stepbtn" data-back="${i}" data-drag="s:${i}" ${lock?"disabled":""}><span class="num mono">${i+1}</span><span><b>${x.t}</b>${x.s?`<small>${x.s}</small>`:""}</span>${lock?"":`<span class="grip" aria-hidden="true">⠿</span>`}</button>`:`<span class="num mono">${i+1}</span><span class="muted">${i===nextEmpty?"גררו לכאן צעד":""}</span>`}</li>`}).join("");
      const bank=G.bank.filter(k=>!G.placed.includes(k)).map(k=>{const x=byId(k);return `<button class="stepbtn bankbtn" data-add="${k}" data-drag="b:${k}"><span><b>${x.t}</b>${x.s?`<small>${x.s}</small>`:""}</span><span class="grip" aria-hidden="true">⠿</span></button>`}).join("");
      let res="";
      if(G.res&&!G.res.all)res=`<div class="result"><div class="err"><span class="ic">!</span><p>${G.res.n} מתוך ${R.items.length} במקום הנכון (מסומנים בירוק). ${G.res.tip||""}</p></div>
        ${G.attempts>=2?`<button class="btn ghost small" id="solve" style="align-self:flex-start">הצג את הסדר (בלי כוכבים)</button>`:""}</div>`;
      if(G.res&&G.res.all){
        const last=G.r===o.rounds.length-1;
        res=last&&G.phase==="win"?winHtml(o.winText||"")+(o.lesson?`<p class="why">${o.lesson}</p>`:""):
          `<div class="win"><h3>${G.shown?"זה הסדר":"נכון!"}</h3><p style="margin:0">${R.why||""}</p><div class="row"><button class="btn" id="nextr">לשלב הבא</button></div></div>`;
      }
      return headHtml(M,o.note||"גוררים כל צעד למקום שלו. גרירה של צעד על צעד אחר מחליפה ביניהם. אפשר גם ללחוץ: לחיצה על צעד מהרשימה שמה אותו במקום הפנוי הבא, ולחיצה על צעד שהונח מחזירה אותו.")+
        `<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="qcount">שלב ${G.r+1} מתוך ${o.rounds.length}</span><h3 style="font-size:19px">${R.q}</h3>
        ${R.art?`<div class="art orderart">${R.art(G)}</div>`:""}
        <ol class="slots">${slots}</ol>${!lock?`<div class="bank" data-bank="1">${bank||`<span class="muted" style="font-size:13px">כל הצעדים במקום. גררו צעד על צעד אחר כדי להחליף ביניהם, או לכאן כדי להוציא אותו.</span>`}</div>`:""}
        ${!G.res||!G.res.all?`<div class="row"><button class="btn" id="chk" ${full?"":"disabled"}>בדוק סדר</button><button class="btn ghost small" id="clear">התחל מחדש</button></div>`:""}</div>${res}`;
    },
    bind(){
      const tapAdd=k=>{const i=G.placed.indexOf(null);if(i>=0){G.placed[i]=k;G.res=null;render()}};
      const tapBack=i=>{G.placed[i]=null;G.res=null;render()};
      dragSteps((src,dst)=>{ // src "b:id" or "s:i"; dst {slot:i} or {bank:true}
        const [t,v]=src.split(":");
        if(dst.bank){if(t==="s")G.placed[+v]=null}
        else{const j=dst.slot;if(t==="b"){G.placed[j]=v}else{const i=+v;if(i===j)return;[G.placed[i],G.placed[j]]=[G.placed[j],G.placed[i]]}}
        G.res=null;render()},(src)=>{const [t,v]=src.split(":");if(t==="b")tapAdd(v);else tapBack(+v)});
      on("clear",()=>{G.placed=M.R().items.map(()=>null);G.res=null;render()});
      on("chk",()=>{const R=M.R();G.attempts++;const T_=k=>R.items.find(x=>x.id===k).t,ok=G.placed.map((k,i)=>T_(R.answer[i])===T_(k)),n=ok.filter(Boolean).length;
        G.res=Object.assign(ok,{n,all:n===R.items.length,tip:R.tip?R.tip(G.placed):""});
        if(G.res.all){M.done()}else failAttempt();render();M.playArt();scrollTo_(G.res.all?".win":".result")});
      on("solve",()=>{const R=M.R();G.placed=R.answer.slice();G.res=Object.assign(R.answer.map(()=>true),{n:R.answer.length,all:true});G.shown=true;M.done(true);render();M.playArt()});
      on("nextr",()=>{G.r++;M.reset();render();window.scrollTo(0,0)});
      if(G.res&&G.res.all)M.playArt(true);
    },
    done(shown){if(G.r===o.rounds.length-1){const st=G.shown||shown?0:starsFor(G.attempts-(o.rounds.length-1),false);award(st,!!(G.shown||shown))}},
    playArt(still){const R=M.R();if(R.animate&&G.res&&G.res.all)R.animate(still)}
  };
  return M;
}

/* match: tap a picture, then a name. Names include decoys. */
function makeMatch(id,o){
  const M={id,title:o.title,goal:o.goal,
    init(){G.lab={};G.sel=null;G.res=null;G.names=shuffle(o.items.map(x=>x.name).concat(o.decoys||[]))},
    view(){
      const tiles=o.items.map(x=>{const st=G.res?(G.res[x.id]?"ok":"no"):"";const l=G.lab[x.id];
        return `<button class="mtile ${G.sel===x.id?"sel":""} ${st}" data-tile="${x.id}" data-slot="${o.items.indexOf(x)}" aria-pressed="${G.sel===x.id}" ${G.phase==="win"?"disabled":""}>
          <span class="partbox">${x.art?x.art:pic(x.pic)}</span><span class="mlabel">${l?`<b>${l}</b>`:`<span class="muted">?</span>`}</span>
          ${G.phase==="win"||G.shown?`<small class="role">${x.role}</small>`:""}</button>`}).join("");
      const used=Object.values(G.lab);
      const names=G.names.map((n,i)=>`<button class="chip namechip" data-name="${n}" data-drag="n:${i}" ${G.phase==="win"?"disabled":""} aria-pressed="${used.includes(n)}">${n}${G.phase==="win"?"":`<span class="grip" aria-hidden="true">⠿</span>`}</button>`).join("");
      let res="";
      if(G.phase==="win")res=winHtml(o.winText||"")+(o.lesson?`<p class="why">${o.lesson}</p>`:"");
      else if(G.res){const bad=o.items.filter(x=>!G.res[x.id]).length;res=`<div class="result"><div class="err"><span class="ic">!</span><p>${bad===1?"שם אחד לא נכון":bad+" שמות לא נכונים"} (מסומנים באדום). שימו לב גם לשמות שלא שייכים לאף תמונה.</p></div>
        ${G.attempts>=2?`<button class="btn ghost small" id="solve" style="align-self:flex-start">הצג תשובות (בלי כוכבים)</button>`:""}</div>`}
      const scene=o.scene?`<div class="card scenecard">${o.scene(G)}<p class="note" style="margin:0">${G.phase==="win"?"ככה כל החלקים יושבים בזרוע.":"כל שם שנותנים מופיע גם על הזרוע. לחיצה על חלק בזרוע בוחרת את התמונה שלו."}</p></div>`:"";
      return headHtml(M,"גוררים שם אל התמונה שלו, או לוחצים על תמונה ואז על שם. גרירה של שם אחר על תמונה מחליפה אותו.")+scene+
        `<div class="card namebar ${G.phase==="win"?"":"sticky"}"><p class="glabel" style="margin:0">${G.sel?"איזה שם מתאים לתמונה שבחרת?":"גוררים שם לתמונה"}</p><div class="chips">${names}</div></div><div class="mgrid">${tiles}</div>
        ${G.phase!=="win"?`<div class="row"><button class="btn" id="chk" ${Object.keys(G.lab).length===o.items.length?"":"disabled"}>בדוק</button></div>`:""}${res}`;
    },
    bind(){
      app.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{G.sel=G.sel===b.dataset.tile?null:b.dataset.tile;render()});
      const put=(tid,n)=>{Object.keys(G.lab).forEach(k=>{if(G.lab[k]===n)delete G.lab[k]});G.lab[tid]=n;G.lastLab=tid;G.res=null};
      app.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{if(G.phase==="win")return;G.sel=b.dataset.pick;render()}));
      if(G.phase!=="win")dragSteps((src,t)=>{const n=G.names[+src.slice(2)];if(t.slot==null){render();return}
          const tid=o.items[t.slot].id;put(tid,n);G.sel=null;render()},
        src=>{const n=G.names[+src.slice(2)];if(!G.sel){const fr=app.querySelector(".mgrid");if(fr){fr.classList.remove("nudge");void fr.offsetWidth;fr.classList.add("nudge")}return}
          put(G.sel,n);const next=o.items.find(x=>!G.lab[x.id]);G.sel=next?next.id:null;render()});
      on("chk",()=>{G.attempts++;G.res={};o.items.forEach(x=>G.res[x.id]=G.lab[x.id]===x.name);
        if(o.items.every(x=>G.res[x.id]))award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(G.phase==="win"?".win":".result")});
      on("solve",()=>{o.items.forEach(x=>G.lab[x.id]=x.name);G.res={};o.items.forEach(x=>G.res[x.id]=true);award(0,true);render()});
    }};
  return M;
}

/* slider row used by the simulations */
const slider=(id,label,val,min,max,step,fmt,dis)=>`<div class="sl"><label for="${id}"><span>${label}</span><b class="mono" id="${id}-v">${fmt(val)}</b></label>
  <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" ${dis?"disabled":""}></div>`;
const bindSlider=(id,fmt,set,live)=>{const el=document.getElementById(id);if(!el)return;
  el.addEventListener("input",()=>{set(+el.value);const v=document.getElementById(id+"-v");if(v)v.textContent=fmt(+el.value);if(live)live()});
  el.addEventListener("change",()=>{if(!live)render()})};

  m3:[{h:"הכול ביחד",p:`עכשיו בונים לוח שלם: הנתיב הראשי מהמשימה הראשונה, וערוצים עם נתיכים מהמשימה השנייה.`},
    {h:"סדר עבודה",p:`מתחילים מהנתיב הראשי (סוללה, מפסק, PDH), ורק אחר כך מוסיפים התקנים. כל חוט: לבחור צבע, לבחור עובי, ולבדוק מול הטבלה.`},
    {h:"מה הביקורת בודקת",p:`צבעים נכונים, עובי שמתאים לנתיך, מפסק במסלול הנכון, ושאין קצר: פלוס שנוגע במינוס בלי שום דבר באמצע.`}],
  can:[{h:"מה זה CAN",p:`רשת אחת שדרכה ה־roboRIO מדבר עם כל הבקרים: מנועים, PDH וחיישנים. כל ההודעות עוברות על אותם שני חוטים.`,art:L_ART.can},
    {h:"שני חוטים",p:`צהוב (CAN High) וירוק (CAN Low). תמיד צהוב לצהוב וירוק לירוק. אם מחליפים ביניהם, ההתקנים מאותה נקודה והלאה לא מדברים.`},
    {h:"שרשרת, לא כוכב",p:`לכל התקן יש זוג חוטים שנכנס וזוג שיוצא. מתחילים ב־roboRIO, עוברים מהתקן להתקן, וממשיכים עד הסוף. לא מפצלים לשני כיוונים. אם השרשרת נקטעת באמצע, כל מה שאחרי הקטע נעלם מה־Driver Station.`},
    {h:"נגד בכל קצה",p:`בכל קצה של השרשרת צריך נגד ${M_("120Ω")} בין הצהוב לירוק. ב־roboRIO הנגד כבר מובנה, אז הוא קצה אחד. בקצה השני שמים נגד, או התקן שיש בו נגד מובנה שמופעל (לפי הדוקומנטציה שלו).`},
    {h:"מספרי ID",p:`כל בקר מגיע מהמפעל עם ${M_("ID 0")}. לפני החיבור נותנים לכל אחד מספר משלו בתוכנה של היצרן: Phoenix Tuner X ל־Kraken ו־TalonFX, או REV Hardware Client ל־SPARK MAX. אותו מספר נכתב בקוד, ${M_("new TalonFX(1)")}, ועל מדבקה על המנוע. שני מנועים מאותו סוג עם אותו ID מתנגשים.`},
    {h:"הקונבנציה שלנו",p:`לכל מערכת יש עשרה מספרים משלה: הנעה ${M_("0–9")}, אינטייק ${M_("10–19")}, זרוע ${M_("20–29")}, וכך הלאה למערכות הבאות. כשרואים ${M_("ID 23")} בלוג או ב־Driver Station, יודעים מיד שזה מנוע של הזרוע.`},
    {h:"מה צריך",p:`חוטי CAN (זוג צהוב וירוק שזורים), מחברים לפי מה שהקבוצה משתמשת, ונגד ${M_("120Ω")} לקצה.`}],
  insp:[{h:"מה זו ביקורת",p:`לפני שמותר לעלות למגרש, שופט עובר על הרובוט מול המניואל. רובוט שלא עובר ביקורת לא משחק.`},
    {h:"מה בודקים בלוח החשמל",p:`סוללה מחוזקת שלא זזה. מפסק ראשי שקל להגיע אליו. צבעים נכונים. עובי חוט שמתאים לנתיך. בלי נחושת חשופה. נורית RSL שנראית מבחוץ.`},
    {h:"נורית ה־<bdi>RSL - Robot Status Light</bdi>",p:`נורית כתומה. כשהרובוט דלוק היא דולקת קבוע, וכשהוא Enabled היא מהבהבת. מהבהבת = הרובוט יכול לזוז, ומתרחקים.`},
    {h:"איך מחפשים",p:`עוברים לפי הסדר, אחד אחד, ושואלים על כל דבר: מה המניואל אומר עליו? לא כל מה שנראה מוזר הוא תקלה.`}],
  batt:[{h:"המתח יורד כשמושכים זרם",p:`לכל סוללה יש התנגדות פנימית קטנה. כשהמנועים מושכים הרבה זרם, המתח שהרובוט מקבל יורד. סוללה ישנה או לא טעונה יורדת יותר.`,art:L_ART.sag},
    {h:"בראון־אאוט",p:`כשהמתח יורד נמוך מדי, ה־roboRIO מנתק את המנועים כדי לא לכבות את עצמו. באמצע דחיפה זה אומר שהרובוט פשוט עוצר.`},
    {h:"הגבלת זרם",p:`הגבלת זרם על מנועי ההנעה שומרת שהם לא ימשכו יותר מדי. קצת פחות כוח, אבל הרובוט לא נכבה.`},
    {h:"עגלת הסוללות",p:`על כל סוללה כותבים מתי הוטענה ובודקים אותה. לרבע גמר לוקחים סוללה טעונה ובריאה, לא את מה שנשאר.`}],
  ecrimp:[{h:"קרימפ",p:`קרימפ הוא כיווץ של מחבר מתכת על החוט בעזרת פלאייר מיוחד. ברובוט לא מלפפים חוטים ולא מלחימים קצוות, כי רעידות שוברות אותם.`},
    {h:"מחבר לכל מקום",p:`SB50 לסוללה. נעל עם עין לברגים. פרול לחיבורים ב־PDH. Powerpole לחיבורים שמנתקים בפיט.`},
    {h:"כיווץ טוב",p:`מפשיטים בדיוק באורך של המחבר, משתמשים בחריץ של הפלאייר שמתאים לעובי החוט, ובסוף מושכים חזק. מה שנשלף ביד היה נשלף גם במקצה.`}],
  eroute:[{h:"למה ניתוב חשוב",p:`רוב התקלות החשמליות בתחרות הן חוט שנקרע, נשחק או נתפס. ניתוב טוב מונע אותן לפני שהן קורות.`},
    {h:"ארבעה כללים",p:`קושרים לאורך הדרך עם אזיקונים. מרחיקים ממה שמסתובב (גלגלים, שרשראות). משאירים לולאה בכל ציר שזז. ומגינים על החוט בכל מעבר דרך פח, עם גומייה.`},
    {h:"ליד מחבר",p:`אזיקון קרוב למחבר מחזיק את המשקל של החוט, כדי שהמחבר לא ייקרע ברעידות.`}],
  efault:[{h:"מהפשוט למסובך",p:`כשהרובוט לא זז, בודקים קודם את הדברים הפשוטים: סוללה, מפסק, רדיו. רק אחר כך קוד ו־CAN.`},
    {h:"ה־Driver Station",p:`שלוש נוריות למעלה: Communications (יש קשר לרובוט), Robot Code (הקוד רץ), Joysticks (הג׳ויסטיק מחובר). הנורית האדומה הראשונה אומרת איפה לחפש.`},
    {h:"נוריות על הרובוט",p:`RSL מהבהבת = Enabled. נוריות על הבקרים מספרות אם יש להם CAN ואם הם מקבלים פקודות. את המשמעות של כל צבע מוצאים בדוקומנטציה של הבקר.`}],
  /* ---- shop ---- */
  s1:[{h:"החלקים של הזרוע",p:`ציר משושה (hex) מעביר סיבוב בלי להחליק. מסב מאפשר לו להסתובב בתוך העץ בלי חיכוך. האב (hub) מחבר את הציר לזרוע. טבעת נעילה (collar) מונעת מהציר לזוז הצידה.`},
    {h:"למה hex",p:`ציר עגול מסתובב בתוך החור. ציר משושה נועל את מה שעליו, אז גלגל או זרוע מסתובבים יחד איתו.`},
    {h:"איך לומדים חלק",p:`מסתכלים על הצורה, ושואלים: מה הוא מחזיק, ומה הוא נותן לזוז?`}],
  s2:[{h:"סדר הרכבה",p:`בונים מהבסיס החוצה: קודם המסגרת, אחר כך החורים, המסבים, ובסוף הציר והזרוע. שלב שמדלגים עליו מחייב לפרק הכול אחר כך.`},
    {h:"הסדר על הציר",p:`על הציר חלקים מושחלים אחד אחרי השני. מה שנמצא באמצע חייב להיכנס לפני מה שבקצוות, וטבעת הנעילה נכנסת אחרונה וסוגרת.`}],
  s3:[{h:"כלי לכל עבודה",p:`מקדח פורסטנר עושה חור שטוח ונקי בגודל של מסב. שקע (countersink) מכין מקום לראש בורג. מסור או מסור אנכי חותכים. פטיש גומי מכניס חלקים צמודים בלי לשבור.`},
    {h:"עובד לעומת בטוח",p:`לפעמים כמה דרכים עובדות, אבל רק אחת בטוחה. בוחרים את הבטוחה, גם אם היא לוקחת עוד דקה: מהדקים לפני שקודחים, ולא מחזיקים ביד.`}],
  s4:[{h:"דרגות חופש",p:`כל ציר שמסתובב או מחליק נותן לקצה של הזרוע דרגת חופש אחת: עוד כיוון אחד שהוא יכול לזוז בו.`,art:L_ART.dof},
    {h:"כמה צריך",p:`להגיע לנקודה במישור צריך שתי דרגות חופש. אם גם הזווית של הקצה חשובה, צריך שלוש.`},
    {h:"פחות זה יותר",p:`כל ציר מוסיף משקל, מנוע, קוד ומקום לתקלה. בונים עם הכי מעט צירים שעושים את העבודה.`}],
  s5:[{h:"כללי הסדנה",p:`משקפי מגן כל הזמן. שום דבר שמשתלשל ליד כלי מסתובב: שיער אסוף, שרוולים מקופלים, בלי כפפות. חלק קטן תמיד במלחציים. היד מחוץ לקו החיתוך.`},
    {h:"אחרי העבודה",p:`שבבים מנקים במברשת, לא ביד ולא בנשיפה. כל כלי חוזר למקום. סוללה פגועה יוצאת מהשימוש ומספרים למנטור.`}],
  /* ---- motors ---- */
  mo1:[{h:"יחס תמסורת",p:`גלגל שיניים קטן מסובב גלגל גדול. הגדול מסתובב לאט יותר, אבל בכוח (מומנט) גדול יותר. היחס הוא מספר השיניים של הגדול חלקי הקטן.`,art:L_ART.gears},
    {h:"הנעה",p:`יחס קטן = מהיר אבל מאיץ לאט ודוחף חלש. יחס גדול = מאיץ מהר ודוחף חזק, אבל המהירות המקסימלית נמוכה. מחפשים את האמצע שמתאים למגרש.`},
    {h:"זרוע",p:`זרוע צריכה הרבה מומנט כדי להרים משקל, אז היחס שלה גדול בהרבה משל ההנעה. יחס גדול מדי, והזרוע זוחלת.`},
    {h:"הגבלת זרם",p:`הגבלת זרם מגבילה את המומנט של המנוע. עם הגבלה, היחס צריך לעשות יותר מהעבודה.`}],
  mo2:[{h:"שני זרמים",p:`זרם אספקה הוא מה שיוצא מהסוללה אל הבקר. זרם סטטור הוא מה שעובר בתוך המנוע ויוצר את הכוח. במהירות נמוכה, זרם הסטטור יכול להיות גדול בהרבה מזרם האספקה.`},
    {h:"הגבלת סטטור",p:`מגבילה את הכוח של המנוע. עוזרת שהגלגלים לא יחליקו ושהמנוע לא יתחמם.`},
    {h:"הגבלת אספקה",p:`מגבילה כמה הרובוט מושך מהסוללה. שומרת מבראון־אאוט ומקפיצת מפסקים.`}],
  mo3:[{h:"מאיפה בא החום",p:`חום במנוע גדל עם הזרם בריבוע (${M_("I²R")}). פי שניים זרם = פי ארבעה חום.`},
    {h:"להחזיק זה הכי חם",p:`זרוע שמוחזקת אופקית מול הכובד מושכת זרם כל הזמן, גם כשהיא לא זזה. ככה מנוע נשרף בלי שאף אחד שם לב.`},
    {h:"מה עוזר",p:`לחכות בין מחזורים, לתמוך בזרוע מכנית (קפיץ או משקל נגדי), ולהגביל זרם. כל אחד מוריד את החום בדרך אחרת.`}],
  mo4:[{h:"שלבים",p:`כשצריך יחס גדול, מחלקים אותו לכמה שלבים. היחס הכולל הוא מכפלה של כל השלבים: ${M_("5 × 4 × 5 = 100")}.`},
    {h:"שלושה סוגים",p:`קופסה פלנטרית קומפקטית ונותנת יחס קבוע (${M_("3:1")}, ${M_("4:1")}, ${M_("5:1")}). זוג גלגלי שיניים: גדול חלקי קטן. שרשרת: גלגל השרשרת הגדול חלקי הקטן.`},
    {h:"למה לא שלב אחד",p:`יחס ${M_("100:1")} בשלב אחד דורש גלגל ענק. כמה שלבים קטנים נכנסים ברובוט.`}],
  /* ---- mechanical ---- */
  me1:[{h:"מנגנון שנשבר",p:`רוב התקלות המכניות חוזרות על עצמן: שרשרת רפויה שקופצת, ציר שמוחזק רק מצד אחד ומתעקם, חבל שמחובר לא נכון, ואינטייק שלוחץ חלש מדי על החלק.`},
    {h:"אבחון לפני תיקון",p:`קודם מבינים מה קרה ולמה, ורק אחר כך מתקנים. תיקון בלי אבחון מחזיר את אותה תקלה במקצה הבא.`}],
  me2:[{h:"איך שוטר עובד",p:`גלגל מהיר (פלייוויל) זורק את הכדור. המהירות של הגלגל קובעת כמה רחוק הוא טס, והזווית קובעת כמה גבוה.`},
    {h:"להיכנס מלמעלה",p:`כדור שנכנס כשהוא כבר יורד נכנס יותר בקלות ופחות קופץ החוצה.`},
    {h:"טבלת קליעה",p:`לכל מרחק מוצאים מהירות וזווית שעובדות ושומרים בטבלה. במקצה הרובוט מודד מרחק ולוקח מהטבלה.`}],
  me3:[{h:"מעלית קסקייד",p:`מעלית עם כמה שלבים שנכנסים אחד בתוך השני. כשהשלב הראשון עולה, החבל מושך גם את הקרון, אז הקרון עולה מהר יותר מהשלב.`},
    {h:"איך מחברים חבל",p:`החבל של כל שלב מעוגן בשלב שמתחתיו, עובר מעל גלגלת בראש השלב הנוכחי, ומחובר לשלב שמעליו.`}],
  me4:[{h:"בוחרים מהמשימה",p:`לאן צריך להגיע: גובה, צד, מרחק. כמה מהר. מה קורה כשהרובוט מושבת. ואז בוחרים את הפשוט ביותר שעושה את זה.`},
    {h:"המנגנונים",p:`מעלית עולה ישר. זרוע על ציר מגיעה לכמה גבהים וצדדים. שוטר זורק מרחוק. אינטייק רחב אוסף מהר. וו עם מחגר מחזיק בטיפוס. רצועה מעבירה סיבוב בקלות לרחוק.`}],
  /* ---- FDM ---- */
  f1:[{h:"מה נותן חוזק",p:`דפנות (walls) נותנות הכי הרבה חוזק. מילוי (infill) עוזר פחות ממה שנדמה, ומוסיף הרבה זמן.`},
    {h:"כיוון",p:`חלק מודפס חזק לאורך השכבות וחלש בין השכבות. משכיבים אותו כך שהכוח לא מקלף שכבה משכבה.`,art:L_ART.layers},
    {h:"חומר וחום",p:`PLA מתרכך כבר בערך ב־${M_("55°C")}. ליד מנוע חם בוחרים PETG או חומר שמחזיק חום גבוה יותר (ABS, ASA, ניילון).`}],
  f2:[{h:"תקלות נפוצות",p:`עיוות בפינות (warping): חום והדבקה למגש. חוטים דקים בין חלקים (stringing): ריטרקשן או חומר רטוב. קירות דקים או חורים: חסר חומר, סתימה. ספגטי: החלק התנתק מהמגש.`},
    {h:"שינוי אחד",p:`משנים דבר אחד בכל פעם. ככה יודעים מה תיקן.`}],
  f3:[{h:"המדפסות בסדנה",p:`Bambu X1E ו־X1C סגורות ומחזיקות חום, טובות ל־ABS, ASA וניילון. P1S סגורה, לרוב ההדפסות. H2D גדולה עם שתי ראשים. Markforged מדפיסה Onyx עם סיבים לחלקים חזקים במיוחד.`},
    {h:"חומרים",p:`PLA: קל להדפסה, לא לחום. PETG: חזק וגמיש יותר. ABS ו־ASA: מחזיקים חום, צריכים מדפסת סגורה. ניילון וסיבים: הכי חזקים, צריכים מדפסת מתאימה ויבוש.`}],
  f4:[{h:"חזק בכיוון אחד",p:`כל שכבה מודבקת לזו שמתחתיה, וההדבקה היא החלק החלש. לאורך השכבה החלק חזק, ובין השכבות הוא נקרע.`,art:L_ART.layers},
    {h:"איך בוחרים כיוון",p:`שואלים: לאן הכוח מושך? ואז מסובבים את החלק כך שהכוח עובר לאורך השכבות. אחר כך בודקים שלא צריך המון תמיכות.`}],
  /* ---- strategy ---- */
  st1:[{h:"המניואל",p:`המניואל הוא החוקים של המשחק. כל שאלה בתחרות נענית ממנו, ולא מ״שמעתי ש...״.`},
    {h:"איך הוא בנוי",p:`החוקים מחולקים לפרקים לפי נושא, ולכל חוק יש מספר. חוקי משחק מתחילים באות אחת, וחוקי רובוט באות אחרת. מחפשים מילה (חיפוש בטקסט), ומצטטים את מספר החוק.`}],
  st2:[{h:"נקודות צפויות",p:`נקודות צפויות = נקודות × הסיכוי להצליח. משימה ששווה הרבה אבל מצליחה לעתים רחוקות יכולה להיות שווה פחות ממשימה פשוטה.`},
    {h:"נקודות לשנייה",p:`בטלאופ חוזרים על מחזור. משווים מחזורים לפי נקודות צפויות לשנייה, לא רק לפי כמה כל אחד שווה.`,art:L_ART.cycle}],
  st3:[{h:"סקאוטינג",p:`סקאוטר צופה ברובוטים ורושם מה הם עושים. מזה בונים את רשימת הבחירה לברית.`},
    {h:"לספור נכון",p:`סופרים רק מה שבאמת נקלע, לא ניסיונות. מתרכזים, ולוחצים מיד כשזה קורה.`}],
  st4:[{h:"בחירת ברית",p:`בסוף הדירוג, שמונה הקבוצות הראשונות בוחרות שותפות. הבחירה הולכת 1 עד 8, ואז חוזרת מ־8 ל־1 (נחש).`},
    {h:"לבחור חכם",p:`לא תמיד לוקחים את מי שקולע הכי הרבה. חושבים מי ישאר בסיבוב הבא, ומי משלים את מה שחסר לנו.`}],
  st5:[{h:"סוף המשחק",p:`בשניות האחרונות מחליטים מתי להפסיק לעשות מחזורים וללכת לטפס. מחזור שלא נגמר שווה אפס, וגם טיפוס שלא נגמר.`,art:L_ART.cycle},
    {h:"המקרה הגרוע",p:`משאירים זמן לפי הטיפוס הכי איטי שראינו, לא לפי הממוצע. את המספרים לוקחים מהסקאוטינג על הרובוט שלנו.`}],
  /* ---- programming ---- */
  p1:[{h:"מנוע בקוד",p:`כל מנוע בקוד הוא אובייקט עם מספר ה־ID שלו: ${M_("new TalonFX(3)")}. אם המספר לא תואם את המנוע האמיתי, הקוד מזיז מנוע אחר.`},
    {h:"הפוך (inverted)",p:`בצד אחד של הרובוט המנועים מורכבים בתמונת ראי. כדי שכל הגלגלים יסעו קדימה ביחד, הופכים את הצד הזה בקוד.`},
    {h:"Brake או Coast",p:`כשהמנוע לא מקבל פקודה: Brake בולם, Coast מסתובב חופשי. זרוע שצריכה להישאר במקום צריכה Brake.`}],
  p2:[{h:"בקרת מיקום",p:`רוצים שהזרוע תגיע לזווית מסוימת ותישאר שם. הקוד מחשב בכל רגע כמה וולט לתת למנוע. בגרף: באדום רק kP, שחורג ורועד. בכחול kP עם kG ו־kD, שנכנס חלק ליעד.`,art:L_ART.pid},
    {h:"שלושה חלקים",p:`kP: דוחף לפי כמה רחוק מהיעד. kD: בולם לפי כמה מהר זזים. kG: מחזיק את משקל הזרוע מול הכובד, גם כשהיא כבר ביעד.`},
    {h:"סדר כוונון",p:`קודם kG עד שהזרוע כמעט מחזיקה את עצמה. אחר כך kP עד שהיא מגיעה מהר. ובסוף kD כדי שלא תחרוג.`}],
  p3:[{h:"פקודות",p:`באוטונומי הרובוט מריץ רשימה של פקודות: סע, הרם, אסוף, קלע. כל פקודה רצה עד שהיא נגמרת.`},
    {h:"ברצף או במקביל",p:`פקודות שתלויות אחת בשנייה רצות ברצף. פקודות שלא תלויות זו בזו אפשר להריץ במקביל וככה לחסוך זמן. ב־WPILib אלה ${M_("sequence")} ו־${M_("parallel")}.`}],
  p4:[{h:"איך מדבגים",p:`קוראים את הלוג עד השורה הראשונה שהיא מהקוד שלנו. משחזרים את הבאג. משנים דבר אחד, ובודקים שוב.`},
    {h:"באגים נפוצים ב־Java",p:`אובייקט שלא נוצר (NullPointerException). חילוק של שני מספרים שלמים. המתנה שעוצרת את הלולאה של הרובוט. יחידות שונות ממה שחשבנו.`}]
};

function shaftStack(Gs){
  const map={s1:"bearing",s2:"collar",s3:"arm",s4:"collar",s5:"bearing",s6:"tight"};
  const R=Gs.placed.filter(Boolean).map(k=>map[k]);const n=R.length;
  const posts=`<rect x="30" y="40" width="40" height="190" fill="#E2B97F" stroke="#B47A3E" stroke-width="2"/><rect x="330" y="40" width="40" height="190" fill="#E2B97F" stroke="#B47A3E" stroke-width="2"/>
    <rect x="20" y="230" width="360" height="24" fill="#E2B97F" stroke="#B47A3E" stroke-width="2"/>`;
  // slots along the shaft: bearing L, collar, arm, collar, bearing R
  const xs=[50,105,200,295,350];let slot=0,svg="",shaftEnd=50,tight=false;
  R.forEach(p=>{if(p==="tight"){tight=true;return}const x=xs[Math.min(slot,4)];slot++;shaftEnd=Math.max(shaftEnd,x+20);
    if(p==="bearing")svg+=`<rect x="${x-14}" y="88" width="28" height="44" rx="4" fill="#BFC6CF" stroke="#7E8794" stroke-width="2"/><rect x="${x-18}" y="82" width="6" height="56" fill="#DDE2E8" stroke="#7E8794"/>`;
    if(p==="collar")svg+=`<rect x="${x-9}" y="92" width="18" height="36" rx="3" fill="#3A4250"/>${tight?`<rect x="${x-3}" y="82" width="6" height="10" fill="#BFC6CF"/>`:""}`;
    if(p==="arm")svg+=`<rect x="${x-14}" y="20" width="28" height="200" rx="5" fill="#EDCB97" stroke="#B47A3E" stroke-width="2"/><rect x="${x-22}" y="96" width="8" height="28" fill="#BFC6CF" stroke="#7E8794"/>`});
  const shaft=n?`<rect x="20" y="104" width="${Math.min(380,shaftEnd)-20}" height="12" fill="#9AA3AF" stroke="#7E8794" style="transition:width .4s"/>`:"";
  return `<svg class="sim" viewBox="0 0 400 260" aria-label="הציר והחלקים עליו">${posts}${shaft}${svg}<text x="200" y="250" text-anchor="middle" style="font-size:11px;fill:var(--muted)">מבט מלפנים: עמוד, ציר, עמוד</text></svg>`;
}
