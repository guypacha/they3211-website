/* degrees of freedom: 3 links, joints can be locked */
const DOF={id:"s4",title:"צירי חופש",
  goal:"הקצה של הזרוע צריך להגיע למטרה. בחרו כמה צירים לפתוח, והזיזו את הזרוע. מנצחים רק עם הכי מעט צירים שאפשר.",
  L:[120,90,40],B:{x:200,y:300},
  rounds:[
    {t:{x:200+250*Math.cos(Math.PI/3),y:300-250*Math.sin(Math.PI/3)},need:1,txt:"מטרה 1: הנקודה הכחולה."},
    {t:{x:300,y:180},need:2,txt:"מטרה 2: נקודה יותר קרובה לבסיס."},
    {t:{x:280,y:200},dir:-90,need:3,txt:"מטרה 3: מגיעים לנקודה כשהתפסנית מצביעה ישר למטה, כדי להרים חלק מהרצפה."}],
  init(){G.r=0;DOF.reset()},
  reset(){G.n=1;G.a=[90,0,0];G.res=null},
  fk(){const B=DOF.B,L=DOF.L;let x=B.x,y=B.y,th=0;const pts=[{x,y}];
    for(let i=0;i<3;i++){th+=(i<G.n?G.a[i]:0)*(i===0?1:1);x+=L[i]*Math.cos(th*Math.PI/180);y-=L[i]*Math.sin(th*Math.PI/180);pts.push({x,y})}
    return {pts,dir:th};},
  hit(){const R=DOF.rounds[G.r],{pts,dir}=DOF.fk(),p=pts[3],d=Math.hypot(p.x-R.t.x,p.y-R.t.y);
    let dd=0;if(R.dir!=null){dd=Math.abs(((dir-R.dir)%360+540)%360-180)}return {d,dd,ok:d<9&&dd<9}},
  svg(){
    const R=DOF.rounds[G.r],{pts,dir}=DOF.fk(),h=DOF.hit();
    const ring=G.r===0?`<circle cx="${DOF.B.x}" cy="${DOF.B.y}" r="250" fill="none" stroke="var(--line)" stroke-dasharray="4 6"/>`:"";
    const links=pts.slice(0,3).map((p,i)=>{const q=pts[i+1];const w=[16,12,8][i];
      return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${i===2?"#3A4250":"#E2B97F"}" stroke-width="${w}" stroke-linecap="round"/>`}).join("");
    const joints=pts.slice(0,3).map((p,i)=>i<G.n?`<circle cx="${p.x}" cy="${p.y}" r="9" fill="var(--accent)" stroke="#fff" stroke-width="2"/>`
      :`<g><circle cx="${p.x}" cy="${p.y}" r="8" fill="var(--muted)"/><rect x="${p.x-3}" y="${p.y-3}" width="6" height="6" fill="#fff"/></g>`).join("");
    const t=R.t,arrow=R.dir!=null?`<path d="M${t.x} ${t.y-40}V${t.y-8}M${t.x-6} ${t.y-16}L${t.x} ${t.y-6}L${t.x+6} ${t.y-16}" stroke="${h.ok?"var(--good)":"var(--accent)"}" stroke-width="3" fill="none"/>`:"";
    const tip=pts[3];
    return `<svg class="sim" id="dofsvg" viewBox="0 0 400 330" role="img" aria-label="זרוע עם ${G.n} צירים">
      <rect x="0" y="310" width="400" height="20" fill="var(--panel)"/>${ring}
      <circle class="${h.ok?"":"pulse"}" cx="${t.x}" cy="${t.y}" r="${h.ok?13:10}" fill="${h.ok?"var(--good)":"var(--accent-2)"}" opacity=".85"/>${arrow}
      <rect x="${DOF.B.x-30}" y="296" width="60" height="16" rx="4" fill="var(--ink)"/>${links}${joints}
      <circle cx="${tip.x}" cy="${tip.y}" r="4" fill="var(--bad)"/></svg>
      <p class="note" style="margin:4px 0 0;${h.ok?"color:var(--good);font-weight:700":""}">${h.ok?"✓ הקצה במטרה":`מרחק מהמטרה: <span class="mono">${Math.round(h.d)}</span>${R.dir!=null?` · סטייה בכיוון: <span class="mono">${Math.round(h.dd)}°</span>`:""}`}</p>`;
  },
  view(){
    const R=DOF.rounds[G.r];const fmt=v=>v+"°";
    const names=["ציר כתף","ציר מרפק","ציר שורש כף היד"];
    let res="";
    if(G.res==="more")res=`<div class="result"><div class="err w"><span class="ic">!</span><p><b>הגעתם, אבל עם ${G.n} צירים.</b> אפשר להגיע עם פחות. כל ציר ברובוט הוא עוד מנוע, עוד משקל, עוד תוכנה ועוד דבר שיכול להישבר. נסו לנעול ציר.</p></div></div>`;
    else if(G.res==="miss")res=`<div class="result"><div class="err"><span class="ic">!</span><p>הקצה עוד לא במטרה. ${G.n<R.need?"אולי עם הצירים הפתוחים אי אפשר להגיע לשם בכלל? נסו לפתוח עוד ציר.":"הזיזו עוד קצת."}</p></div></div>`;
    else if(G.res==="ok")res=G.r<2?`<div class="win"><h3>מעולה!</h3><p style="margin:0">${["ציר אחד מספיק כשהמטרה על המעגל שהקצה מצייר. כל נקודה אחרת לא בהישג.","עם שני צירים הקצה מגיע לכל נקודה בטבעת שבין המרחק הקצר לארוך. אבל הכיוון של התפסנית נקבע לבד."][G.r]}</p><div class="row"><button class="btn" id="nextr">למטרה הבאה</button></div></div>`
      :winHtml("שלושה צירים: מקום וגם כיוון.")+`<p class="why">כל ציר מוסיף דרגת חופש אחת. כדי לקבוע מקום במישור צריך שתיים, ואם חשוב גם הכיוון, צריך שלוש. ברובוט מתכננים עם הכי מעט צירים שעושים את העבודה.</p>`;
    return headHtml(DOF,"")+`<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="qcount">מטרה ${G.r+1} מתוך 3</span><p style="margin:0;font-weight:700">${R.txt}</p>
      <div class="row" role="group" aria-label="כמה צירים פתוחים">${[1,2,3].map(n=>`<button class="chip txt" data-n="${n}" aria-pressed="${G.n===n}" ${G.phase==="win"||G.res==="ok"?"disabled":""}>${n} ${n===1?"ציר":"צירים"}</button>`).join("")}</div>
      <div id="dofwrap">${DOF.svg()}</div>
      <div class="simgrid">${[0,1,2].filter(i=>i<G.n).map(i=>slider("j"+i,names[i],G.a[i],i?-150:0,i?150:180,1,fmt,G.res==="ok")).join("")}</div>
      ${G.res!=="ok"?`<div class="row"><button class="btn" id="chk">בדוק</button></div>`:""}</div>${res}`;
  },
  bind(){
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{G.n=+b.dataset.n;G.res=null;render()});
    [0,1,2].forEach(i=>bindSlider("j"+i,v=>v+"°",v=>{G.a[i]=v;G.res=null},()=>{document.getElementById("dofwrap").innerHTML=DOF.svg();const r=app.querySelector(".result");if(r)r.remove()}));
    on("chk",()=>{const R=DOF.rounds[G.r],h=DOF.hit();G.attempts++;
      if(!h.ok)G.res="miss";else if(G.n>R.need)G.res="more";else{G.res="ok";if(G.r===2)award(starsFor(G.attempts-2,false),false)}
      if(G.res!=="ok")failAttempt();render();scrollTo_(".result,.win")});
    on("nextr",()=>{G.r++;DOF.reset();render();window.scrollTo(0,0)});
  }};

/* Kraken X60 (trapezoidal): free 6000 rpm, stall 7.09 Nm, stall 366 A. Simplified DC motor model. */
const KR={wf:6000*2*Math.PI/60,ts:7.09,is:366,R:12/366};KR.kt=KR.ts/KR.is;
const ETA=0.9;
function armSim(Gr,Ls,o){ // arm lifted from horizontal (0) to vertical; returns time series
  o=Object.assign({mass:4,L:0.5,travel:Math.PI/2,tmax:1.2},o||{});const J=o.mass*o.L*o.L,dt=0.0005;
  let th=0,w=0,t=0,pk=0;const pts=[];let k=0;
  while(th<o.travel&&t<o.tmax){const s=w*Gr/KR.wf;let I=Math.max(0,KR.is*(1-s));I=Math.min(I,Ls);pk=Math.max(pk,I);
    const tq=KR.kt*I*Gr*ETA-o.mass*9.81*o.L*Math.cos(th);w+=tq/J*dt;if(w<0&&th<=0)w=0;th+=w*dt;t+=dt;if(k++%40===0)pts.push({t,th,I})}
  pts.push({t,th:Math.min(th,o.travel),I:0});
  return {t,ok:th>=o.travel,pts,hold:o.mass*9.81*o.L/(Gr*ETA*KR.kt)};
}
function driveSim(Gr,Ls){const r=0.0508,m=60,dt=0.001;let v=0,x=0,t=0;const pts=[];let k=0;
  while(x<8&&t<4){const s=v/r*Gr/KR.wf;let I=Math.min(Math.max(0,KR.is*(1-s)),Ls);let F=4*KR.kt*I*Gr*ETA/r;F=Math.min(F,1.1*m*9.81);v+=F/m*dt;x+=v*dt;t+=dt;if(k++%20===0)pts.push({t,x,v})}
  pts.push({t,x:8,v});return {t,pts,top:KR.wf/Gr*r*0.85,push:4*KR.kt*Ls*Gr*ETA/r};
}
const armSvg=(th,col,extra)=>{const cx=120,cy=190,L=150,x=cx+L*Math.cos(th),y=cy-L*Math.sin(th);

      :`הרובוט שוקל <span class="mono">60</span> ק״ג, גלגלים בקוטר <span class="mono">4"</span>, ארבעה מנועים עם הגבלה של <span class="mono">60A</span>. צריך לחצות <b class="mono">8</b> <b>מ׳</b> תוך <b class="mono">2.0</b> <b>שנ׳</b>, וגם לדחוף בכוח של לפחות <b class="mono">500N</b>.`;
    const R=G.run;let art;
    if(!A){const x=R?R.pts[Math.min(R.k,R.pts.length-1)].x:0;
      art=`<svg class="sim" viewBox="0 0 400 140" role="img" aria-label="הרובוט חוצה את המגרש"><rect x="0" y="30" width="400" height="80" rx="10" fill="var(--panel)"/>
        ${[0,2,4,6,8].map(m=>`<line x1="${370-m*40}" x2="${370-m*40}" y1="30" y2="110" stroke="var(--line)"/><text class="m" x="${370-m*40}" y="128" text-anchor="middle">${m}m</text>`).join("")}
        <g transform="translate(${370-x*40-36},48)"><rect width="36" height="44" rx="8" fill="var(--accent)"/><text x="18" y="27" text-anchor="middle" style="fill:#fff;font-size:10px">3211</text></g></svg>`}
    else{const p=R?R.pts[Math.min(R.k,R.pts.length-1)]:{th:0,I:0};
      art=`<svg class="sim" viewBox="0 0 400 320" role="img" aria-label="הזרוע עולה">${armSvg(p.th)}<path d="M270 190 A150 150 0 0 0 120 40" fill="none" stroke="var(--line)" stroke-dasharray="4 6"/>
        <text x="300" y="60" class="m">${(p.t||0).toFixed(2)}s</text><text x="300" y="80" class="m">${Math.round(p.I||0)}A</text></svg>`}
    let res="",kv="";
    if(R&&!R.playing){
      if(!A)kv=`<div class="kv"><div class="${R.t<=2?"good":"bad"}"><span>זמן ל־8 מ׳</span><b>${R.t.toFixed(2)}s</b></div><div class="${R.push>=500?"good":"bad"}"><span>כוח דחיפה</span><b>${Math.round(R.push)}N</b></div><div><span>מהירות מרבית</span><b>${R.top.toFixed(2)} m/s</b></div></div>`;
      else kv=`<div class="kv"><div class="${R.ok&&R.t<=0.4?"good":"bad"}"><span>זמן לזקוף</span><b ${R.ok?"":`style="direction:rtl"`}>${R.ok?R.t.toFixed(2)+"s":"לא עלתה"}</b></div><div><span>זרם להחזקה אופקית</span><b>${R.hold.toFixed(0)}A</b></div></div>`;
      if(G.res==="ok")res=A?(G.phase==="win"?winHtml("הזרוע עולה בזמן.")+`<p class="why">יחס קטן מדי: המנוע לא מספיק חזק נגד הכובד והזרוע לא עולה. יחס גדול מדי: חזק אבל איטי. יש טווח באמצע, ושם בוחרים. ובגלל הגבלת הזרם, היחס הוא מה שקובע את הכוח.</p>`:"")
        :`<div class="win"><h3>הרובוט מהיר וגם דוחף</h3><p style="margin:0">יחס קטן יותר = מהירות מרבית גבוהה, אבל פחות כוח בגלגל. יחס גדול = כוח, אבל איטי. בהנעה מחפשים את האמצע.</p><div class="row"><button class="btn" id="nextr">לשלב 2: הזרוע</button></div></div>`;
      else res=errsHtml(MO1.explain(R,A));
    }
    return headHtml(MO1,"")+`<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="qcount">שלב ${G.r+1} מתוך 2 · ${A?"זרוע":"הנעה"}</span>
      <p style="margin:0">${task}</p>
      <div><p class="glabel">יחס תמסורת</p><div class="chips">${opts.map(g=>`<button class="chip" data-gr="${g}" aria-pressed="${G.g===g}" ${R&&R.playing||G.res==="ok"?"disabled":""}>${g}:1</button>`).join("")}</div></div>
      ${art}${kv}
      ${G.res!=="ok"?`<div class="row"><button class="btn" id="run" ${G.g&&!(R&&R.playing)?"":"disabled"}>${A?"הרם":"סע"}</button></div>`:""}</div>${res}
      <p class="note" style="margin:0">החישוב: מודל מנוע פשוט (מומנט יורד לינארית עם המהירות), יעילות 90%, וחיכוך גלגל 1.1.</p>`;
  },
  explain(R,A){const e=[];
    if(!A){if(R.t>2)e.push({text:`<b>איטי מדי</b> (<span class="mono">${R.t.toFixed(2)}s</span>). ביחס של ${G.g}:1 הגלגלים מסתובבים לאט מדי. נסו יחס קטן יותר.`});
      if(R.push<500)e.push({text:`<b>חלש מדי בדחיפה</b> (<span class="mono">${Math.round(R.push)}N</span>). יחס קטן נותן מהירות על חשבון כוח. עם הגבלת זרם, הכוח בגלגל תלוי רק ביחס.`})}
    else{if(!R.ok)e.push({text:`<b>הזרוע לא עלתה.</b> ב־${G.g}:1, עם <span class="mono">40A</span>, המנוע לא מייצר מספיק מומנט נגד הכובד. צריך יחס גדול יותר.`});
      else if(R.t>0.4)e.push({text:`<b>איטי מדי</b> (<span class="mono">${R.t.toFixed(2)}s</span>). ${G.g>=150?"היחס כל כך גדול שגם במהירות המרבית של המנוע הזרוע זזה לאט.":"המנוע חזק מספיק, אבל רק בקושי. עם עוד קצת יחס יהיה לו יותר מומנט להאצה."}`})}
    return e},
  bind(){
    app.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>{G.g=+b.dataset.gr;G.run=null;G.res=null;render()});
    on("run",()=>{G.attempts++;const A=G.r===1;const R=A?armSim(G.g,40):driveSim(G.g,60);R.playing=true;R.k=0;G.run=R;G.res=null;
      const ok=A?(R.ok&&R.t<=0.4):(R.t<=2&&R.push>=500);
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?R.pts.length:Math.floor(t/(A?1.6:2.4)*R.pts.length);
        if(R.k>=R.pts.length-1){R.k=R.pts.length-1;R.playing=false;G.res=ok?"ok":"no";if(ok&&A)award(starsFor(G.attempts-1,false),false);if(!ok)failAttempt();render();scrollTo_(".result,.win");return false}
        render()})});
    on("nextr",()=>{G.r=1;G.g=null;G.run=null;G.res=null;render();window.scrollTo(0,0)});
    on("solve",()=>{G.g=G.r?75:6.75;const R=G.r?armSim(75,40):driveSim(6.75,60);R.playing=false;R.k=R.pts.length-1;G.run=R;G.res="ok";if(G.r)award(0,true);render()});
  }};

/* stator vs supply: per-drive-motor model over a 6 s scene: sprint, then push */
const MO2={id:"mo2",title:"סטטור או אספקה?",
  goal:"קבעו שתי הגבלות זרם למנועי ההנעה: על זרם הסטטור ועל זרם האספקה. בתרחיש: ספרינט לאורך המגרש ואז דחיפה מול יריב. בלי החלקת גלגלים, בלי בראון־אאוט, וגם לנצח.",
  SLIP:82,
  init(){G.ls=160;G.lp=120;G.run=null},
  sim(){const Gr=6.75,r=0.0508,m=15,dt=0.002,Ls=G.ls>=160?1e9:G.ls,Lp=G.lp>=120?1e9:G.lp;let v=0,x=0,t=0,slip=false,minV=99,tx=null;const pts=[];let k=0;
    while(t<6){const push=x>=6;const s=push?0:v/r*Gr/KR.wf;const dem=Math.max(0,KR.is*(1-s));let I=Math.min(dem,Ls);let sup=(s+I/KR.is)*I;
      if(sup>Lp){I=(-s+Math.sqrt(s*s+4*Lp/KR.is))*KR.is/2;sup=Lp}
      const V=Math.max(3,12.5-(4*sup+20)*0.022);minV=Math.min(minV,V);if(I>MO2.SLIP)slip=true;
      if(!push){v+=Math.min(KR.kt*I*Gr*ETA/r,1.3*m*9.81)/m*dt;x+=v*dt;if(x>=6){tx=t;v=0}}
      t+=dt;if(k++%25===0)pts.push({t,I:Math.min(I,200),sup,V,x:Math.min(x,6),push})}
    const pushF=4*KR.kt*Math.min(Ls,MO2.SLIP)*Gr*ETA/r;
    return {pts,slip,minV,tx,pushF,bo:minV<6.8,slow:tx===null||tx>1.6,weak:Math.min(Ls,1e9)<55}},
  view(){
    const fmtS=v=>v>=160?"ללא":v+"A",fmtP=v=>v>=120?"ללא":v+"A",R=G.run;
    const X=t=>36+t/6*354,Y=i=>150-i/200*130,YV=v=>270-(v-4)/10*90;
    const sh=R?R.pts.slice(0,R.k||R.pts.length):[],last=sh[sh.length-1];
    const pl=(f,y)=>sh.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+y(f(p)).toFixed(1)).join("");
    const rx=last?last.x:0;
    const graph=`<svg class="sim graph" viewBox="0 0 400 380" role="img" aria-label="זרם סטטור, זרם אספקה ומתח">
      <rect x="36" y="20" width="${354*6/6}" height="130" fill="none" stroke="var(--line)"/>
      ${[0,50,100,150,200].map(i=>`<text x="30" y="${Y(i)+3}" text-anchor="end">${i}A</text><line x1="36" x2="390" y1="${Y(i)}" y2="${Y(i)}" stroke="var(--line)" stroke-width=".5"/>`).join("")}
      <line class="thr" x1="36" x2="390" y1="${Y(MO2.SLIP)}" y2="${Y(MO2.SLIP)}"/><text x="388" y="${Y(MO2.SLIP)-4}" text-anchor="end" style="fill:var(--bad)">slip ${MO2.SLIP}A</text>
      <path d="${pl(p=>p.I,Y)}" fill="none" stroke="var(--accent)" stroke-width="2.4"/><path d="${pl(p=>p.sup,Y)}" fill="none" stroke="var(--warn)" stroke-width="2.4"/>
      <text x="40" y="34" style="fill:var(--accent)">stator</text><text x="90" y="34" style="fill:var(--warn)">supply</text>
      ${[6,8,10,12].map(v=>`<text x="30" y="${YV(v)+3}" text-anchor="end">${v}V</text>`).join("")}
      <line class="thr" x1="36" x2="390" y1="${YV(6.8)}" y2="${YV(6.8)}"/><path d="${pl(p=>p.V,YV)}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect x="36" y="300" width="354" height="60" rx="12" fill="var(--panel)"/>
      <g transform="translate(${360-rx*44},312)"><rect width="34" height="36" rx="8" fill="var(--accent)"/><text x="17" y="22" text-anchor="middle" style="fill:#fff;font-size:9px">3211</text></g>
      <g transform="translate(60,312)"><rect width="34" height="36" rx="8" fill="var(--bad)"/></g>
      ${R&&R.slip&&last&&last.I>MO2.SLIP?`<text x="${370-rx*44}" y="298" class="m" style="fill:var(--bad)">~~ slip</text>`:""}</svg>`;
    let res="";
    if(R&&!R.playing){const ok=!R.slip&&!R.bo&&!R.slow&&!R.weak;
      res=ok?winHtml("ספרינט מהיר, דחיפה חזקה, והמתח נשאר מעל הסף.")+`<p class="why">הגבלת סטטור שולטת במומנט: מונעת החלקה ומגינה על המנוע. הגבלת אספקה שולטת במה שיוצא מהסוללה: מונעת בראון־אאוט ונתיכים קופצים. בדחיפה המנוע כמעט עומד, ולכן זרם האספקה קטן גם כשזרם הסטטור גבוה.</p>`:errsHtml(MO2.explain(R));}
    return headHtml(MO2,"")+`<div class="manual" style="margin:0"><b>שני זרמים שונים.</b> זרם הסטטור עובר בסלילים של המנוע וקובע את המומנט. זרם האספקה יוצא מהסוללה. כשהמנוע איטי, הבקר שולח רק חלק מהמתח, ולכן <span class="mono">I_supply ≈ duty × I_stator</span>: בדחיפה הסטטור גבוה והאספקה נמוכה.</div>
      <div class="card simgrid">${slider("ls","הגבלת זרם סטטור",G.ls,20,160,5,fmtS,R&&R.playing)}${slider("lp","הגבלת זרם אספקה",G.lp,20,120,5,fmtP,R&&R.playing)}
      ${graph}${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${R&&R.playing?"disabled":""}>הרץ תרחיש</button><span class="note">${last?`<span class="mono">stator ${Math.round(last.I)}A · supply ${Math.round(last.sup)}A · ${last.V.toFixed(1)}V</span>`:"ספרינט של 6 מ׳, ואז דחיפה"}</span></div>`:""}</div>${res}`;
  },
  explain(R){const e=[];
    if(R.slip)e.push({text:`<b>הגלגלים מחליקים.</b> מעל <span class="mono">${MO2.SLIP}A</span> בסטטור, המומנט גדול מהאחיזה של הגלגל בשטיח. החלקה לא מוסיפה כוח, רק שוחקת את הגלגלים ומחממת את המנועים. מורידים את הגבלת הסטטור.`});
    if(R.bo)e.push({text:`<b>בראון־אאוט</b> (המתח ירד ל־<span class="mono">${R.minV.toFixed(1)}V</span>). זה קרה באמצע הספרינט, כשהמנועים כבר מהירים וזרם האספקה גבוה. הגבלת אספקה מטפלת בדיוק בזה.`});
    if(R.weak)e.push({sev:"w",text:"<b>הפסדתם בדחיפה.</b> הכוח בדחיפה תלוי בזרם הסטטור. הגבלת סטטור נמוכה מדי = רובוט חלש."});
    if(R.slow&&!R.bo)e.push({sev:"w",text:`<b>הספרינט איטי מדי</b> (${R.tx?`<span class="mono">${R.tx.toFixed(2)}s</span>`:"לא הגעתם"}, צריך עד <span class="mono">1.60s</span>). אחת ההגבלות חונקת את המנועים יותר מדי.`});
    return e},
  bind(){
    bindSlider("ls",v=>v>=160?"ללא":v+"A",v=>{G.ls=v;G.run=null});bindSlider("lp",v=>v>=120?"ללא":v+"A",v=>{G.lp=v;G.run=null});
    on("run",()=>{G.attempts++;const R=MO2.sim();R.playing=true;R.k=1;G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?R.pts.length:Math.floor(t/4*R.pts.length);
        if(R.k>=R.pts.length){R.k=R.pts.length;R.playing=false;const ok=!R.slip&&!R.bo&&!R.slow&&!R.weak;if(ok)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.ls=70;G.lp=50;const R=MO2.sim();R.playing=false;R.k=R.pts.length;G.run=R;award(0,true);render()});
  }};

/* hot motor: arm 6 kg x 0.5 m, 25:1, thermal model over a 150 s match */
const MO3={id:"mo3",title:"מנוע חם",
  goal:"זרוע של <span class=\"mono\">6</span> ק״ג, יחס <span class=\"mono\">25:1</span> (היא חייבת להיות מהירה, אז את היחס לא משנים). כל מחזור: 3 שניות היא מחזיקה אופקית וקולעת, ואז מחכה. שמרו את המנוע מתחת ל־<span class=\"mono\">90°C</span> עד סוף המקצה, בלי שהזרוע תיפול.",
  waits:[{id:"h",t:"מחכה אופקית",s:"מוכנה לקלוע בכל רגע"},{id:"d",t:"נחה על העצירה למטה",s:"העצירה מחזיקה את המשקל"},{id:"v",t:"מחכה זקופה",s:"המשקל מעל הציר"}],
  springs:[{id:0,t:"בלי קפיץ"},{id:0.5,t:"קפיץ גז",s:"מאזן חצי מהמשקל"}],
  lims:[{id:0,t:"בלי הגבלה"},{id:30,t:"30A",s:"הגבלת זרם סטטור"}],
  init(){G.w=null;G.sp=null;G.li=null;G.run=null},
  sim(){const Gr=25,tq=6*9.81*0.5*(1-G.sp),cap=G.li?G.li*KR.kt*Gr*ETA:1e9;const sag=tq>cap;
    let T=30;const C=150,Rth=1.0,pts=[];for(let t=0;t<=150;t+=0.5){const c=t%10,hold=c<3||G.w==="h";const need=hold?tq:0;
      const I=Math.min(need/(Gr*ETA*KR.kt),G.li||1e9);const P=I*I*KR.R;T+=(P-(T-30)/Rth)/C*0.5;pts.push({t,T,I,hold})}
    const maxT=Math.max(...pts.map(p=>p.T));return {pts,maxT,sag,hot:maxT>90}},
  view(){
    const R=G.run,sh=R?R.pts.slice(0,R.k||R.pts.length):[],last=sh[sh.length-1];
    const X=t=>36+t/150*354,Y=T=>500-(T-20)/110*150;
    const line=sh.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(Math.min(p.T,130)).toFixed(1)).join("");
    const heat=last?Math.min(1,(last.T-30)/70):0;
    const th=last?(R.sag&&last.hold?-0.5:last.hold?0:G.w==="d"?-0.5:G.w==="v"?Math.PI/2:0):0;
    const motor=`<circle cx="120" cy="190" r="26" fill="rgb(${Math.round(40+215*heat)},${Math.round(60-30*heat)},${Math.round(80-60*heat)})" opacity=".9"/>`;
    const svg=`<svg class="sim graph" viewBox="0 0 400 520" role="img" aria-label="טמפרטורת המנוע לאורך המקצה">
      ${armSvg(th,null,motor)}<rect x="225" y="258" width="26" height="14" fill="#C68D4E"/>
      ${[30,60,90,120].map(T=>`<text x="30" y="${Y(T)+3}" text-anchor="end">${T}°C</text><line x1="36" x2="390" y1="${Y(T)}" y2="${Y(T)}" stroke="var(--line)" stroke-width=".5"/>`).join("")}
      <line class="thr" x1="36" x2="390" y1="${Y(90)}" y2="${Y(90)}"/><path class="vline" d="${line}" style="stroke:var(--bad)"/>
      <text x="390" y="${Y(20)+16}" text-anchor="end">${last?Math.round(last.t)+"s · "+last.T.toFixed(0)+"°C · "+Math.round(last.I)+"A":"0s"}</text></svg>`;
    const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${R&&R.playing||G.phase==="win"?"disabled":""}><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:""}</button>`).join("");
    let res="";
    if(R&&!R.playing){if(!R.sag&&!R.hot)res=winHtml(`הטמפרטורה הכי גבוהה: <span class="mono">${R.maxT.toFixed(0)}°C</span>.`)+`<p class="why">החום במנוע הוא <span class="mono">I² × R</span>: זרם כפול = פי ארבעה חום. מנוע שמחזיק משקל מול הכובד עומד במקום ומושך זרם כל הזמן. מקטינים את הזרם: מאזנים את המשקל, נחים על עצירה, ולא מחזיקים סתם.</p>`;
      else res=errsHtml(MO3.explain(R))}
    return headHtml(MO3,"")+`<div><p class="glabel">1. איפה הזרוע מחכה בין המחזורים?</p><div class="opts three">${opt(MO3.waits,"w")}</div></div>
      <div><p class="glabel">2. קפיץ איזון</p><div class="opts three">${opt(MO3.springs,"sp")}</div></div>
      <div><p class="glabel">3. הגבלת זרם</p><div class="opts three">${opt(MO3.lims,"li")}</div></div>
      <div class="card">${svg}</div>

  D:[2,3.5,5],H0:0.6,HT:2.1,TOL:0.15,

    if(S&&!S.playing&&!done)res=`<div class="result"><div class="err ${S.desc?"":"w"}"><span class="ic">!</span><p>${!S.desc&&Math.abs(S.yd-ME2.HT)<=ME2.TOL?"<b>הכדור עוד עולה כשהוא מגיע לפתח</b> ופוגע בשפה התחתונה. צריך מסלול גבוה יותר שיורד לתוך הפתח: יותר זווית, או קצת פחות מהירות.":S.yd>ME2.HT?`<b>גבוה מדי</b> (הכדור עבר בגובה <span class="mono">${S.yd.toFixed(2)}</span> מ׳). פחות מהירות, או זווית אחרת.`:`<b>נמוך מדי</b> (<span class="mono">${S.yd.toFixed(2)}</span> מ׳). יותר מהירות.`}</p></div></div>`;
    if(done)res=G.r<2?`<div class="win"><h3>סל!</h3><p style="margin:0">רשמנו את ההגדרות בטבלה. עכשיו מרחק חדש.</p><div class="row"><button class="btn" id="nextr">למרחק הבא</button></div></div>`
      :winHtml("שלושה מרחקים, שלוש שורות בטבלה.")+`<p class="why">זה בדיוק מה שקבוצות עושות: יורים מכמה מרחקים, רושמים את ההגדרות שעובדות, ובקוד הרובוט משלים בין השורות (interpolation). ככה הרובוט יודע לקלוע גם ממרחק שלא נבדק.</p>`;
    return headHtml(ME2,"")+`<div class="card simgrid"><span class="qcount">מרחק ${G.r+1} מתוך 3 · <span class="mono">${ME2.D[G.r]}</span> מ׳</span>
      <div id="shw">${ME2.svg()}</div>
      ${slider("rpm","מהירות גלגל",G.rpm,1500,5000,50,v=>v+" RPM",done||S&&S.playing)}${slider("ang","זווית יציאה",G.ang,20,75,1,v=>v+"°",done||S&&S.playing)}
      ${!done?`<div class="row"><button class="btn" id="fire" ${S&&S.playing?"disabled":""}>ירי</button><span class="note">כל ירי נספר</span></div>`:""}${map}</div>${res}`;
  },
  bind(){
    const redraw=()=>{const w=document.getElementById("shw");if(w)w.innerHTML=ME2.svg()};
    bindSlider("rpm",v=>v+" RPM",v=>{G.rpm=v;G.shot=null},redraw);bindSlider("ang",v=>v+"°",v=>{G.ang=v;G.shot=null},redraw);
    on("fire",()=>{G.attempts++;const S=Object.assign(ME2.traj(),{playing:true,k:1});G.shot=S;
      loopAnim((t,reduce)=>{if(G.shot!==S||view!=="game")return false;S.k=reduce?S.pts.length:Math.floor(t*S.pts.length/1.1)+1;
        if(S.k>=S.pts.length){S.k=S.pts.length;S.playing=false;if(S.hit){G.res="hit";G.map.push([ME2.D[G.r],G.rpm,G.ang]);if(G.r===2)award(starsFor(Math.max(1,G.attempts-4),false),false)}else failAttempt();render();scrollTo_(".result,.win");return false}
        redraw()});render()});
    on("nextr",()=>{G.r++;G.shot=null;G.res=null;render();window.scrollTo(0,0)});
  }};

const ME3={id:"me3",title:"בנה את הקסקייד",
  goal:"מעלית קסקייד עם בסיס, שלב 1 וקרון. החבל של שלב 1 כבר מחובר לכננת. חברו את החבל שמרים את הקרון: איפה הוא מעוגן, ומעל איזו גלגלת הוא עובר.",
  anchors:[{id:"b",t:"מעוגן לבסיס"},{id:"s",t:"מעוגן לשלב 1"},{id:"c",t:"מעוגן לקרון עצמו"}],
  pulleys:[{id:"b",t:"מעל הגלגלת בראש הבסיס"},{id:"s",t:"מעל הגלגלת בראש שלב 1"}],
  init(){G.r=0;G.an=null;G.pu=null;G.run=null;G.res=null;G.pick=null},
  y2(u){const yp=G.pu==="s"?u:0,ya=G.an==="b"?0:G.an==="s"?u:null;if(ya===null)return {y:u,why:"loop"};const y=2*yp-ya;if(y<u-0.001)return {y:u,why:"jam"};return {y:Math.min(y,u+90),why:y-u<1?"same":"ok"}},
  svg(u){
    const B=280,y1=u,{y}=ME3.y2(u);const s1=B-y1,c=B-y;
    const pY=G.pu==="s"?s1-150:B-190,aY=G.an==="b"?B-10:G.an==="s"?s1-10:c-20;
    const rope=G.an&&G.pu?`<path d="M${G.an==="b"?150:G.an==="s"?166:196} ${aY} L200 ${pY} L204 ${c-60}" stroke="#C8650F" stroke-width="2.5" fill="none"/>`:"";
    return `<svg class="sim" viewBox="0 0 400 300" role="img" aria-label="מעלית קסקייד">
      <rect x="120" y="${B-190}" width="20" height="190" fill="#BFC6CF"/><rect x="260" y="${B-190}" width="20" height="190" fill="#BFC6CF"/><circle cx="200" cy="${B-190}" r="8" fill="#7E8794"/><rect x="100" y="${B}" width="200" height="12" fill="var(--ink)"/>
      <g><rect x="144" y="${s1-150}" width="16" height="150" fill="#0A6BB0"/><rect x="240" y="${s1-150}" width="16" height="150" fill="#0A6BB0"/><rect x="144" y="${s1-150}" width="112" height="8" fill="#0A6BB0"/><circle cx="200" cy="${s1-150}" r="8" fill="#7E8794"/></g>
      <rect x="166" y="${c-60}" width="68" height="56" rx="5" fill="#F2B01E" stroke="#C8650F"/><text x="200" y="${c-28}" text-anchor="middle" style="font-size:11px">קרון</text>
      ${rope}<text x="20" y="40" class="m">stage1 +${Math.round(y1)}</text><text x="20" y="58" class="m">carriage +${Math.round(y)}</text></svg>`},
  view(){
    const R=G.run,u=R?R.u:0;const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${R&&R.playing||G.res==="ok"?"disabled":""}><b>${o.t}</b></button>`).join("");
    if(G.r===1){const Q=[{t:"40 ס״מ",ok:false},{t:"80 ס״מ",ok:true},{t:"120 ס״מ",ok:false}];
      return headHtml(ME3,"")+`<div class="card qcard"><span class="qcount">שלב 2 מתוך 2</span>${`<div class="art">${ME3.svg(40)}</div>`}<h3 style="font-size:19px">שלב 1 עלה 40 ס״מ. כמה עלה הקרון ביחס לרצפה?</h3>
        <div class="opts">${Q.map((q,i)=>`<button class="opt ${G.chk?(q.ok?"ok":G.pick===i?"no":""):""}" data-q="${i}" aria-pressed="${G.pick===i}" ${G.chk?"disabled":""}><b>${q.t}</b></button>`).join("")}</div>
        ${G.chk?`<p class="why">${Q[G.pick].ok?"<b>נכון.</b> ":"<b>לא בדיוק.</b> "}החבל מעוגן לבסיס ועובר מעל גלגלת שעולה יחד עם שלב 1. כל סנטימטר ששלב 1 עולה מקצר את החבל משני הצדדים, ולכן הקרון עולה פי 2: 80 ס״מ. עם שלב נוסף זה פי 3. בגלל זה בקסקייד השלב העליון הכי מהיר, ובמעלית רציפה (continuous) הקרון עולה ראשון והשלבים אחריו.</p>`:""}
        <div class="row">${G.chk?(G.phase==="win"?"":`<button class="btn" id="again">נסו שוב</button>`):`<button class="btn" id="chkq" ${G.pick===null?"disabled":""}>בדוק</button>`}</div></div>${G.phase==="win"?winHtml("המעלית שלכם נפתחת, ואתם יודעים כמה מהר."):""}`}
    let res="";
    if(R&&!R.playing){const w=ME3.y2(90).why;
      if(w==="ok")res=`<div class="win"><h3>המעלית נפתחת!</h3><p style="margin:0">הקרון עולה יחד עם שלב 1, ועוד באותה מידה מעליו.</p><div class="row"><button class="btn" id="nextr">לשאלה האחרונה</button></div></div>`;
      else res=errsHtml([{text:{loop:"<b>חבל שמעוגן לקרון עצמו ומחובר לקרון</b> לא מושך כלום. הוא רק לולאה שזזה יחד איתו.",jam:"<b>המעלית נתקעת.</b> החבל מנסה למשוך את הקרון למטה בזמן ששלב 1 עולה. בקסקייד חבל העלייה של שלב מעוגן לשלב שמתחתיו, ועובר מעל גלגלת בשלב שמחזיק אותו.",same:"<b>הקרון עולה, אבל לא נפתח.</b> הוא זז בדיוק כמו שלב 1 ונשאר בתחתית שלו, כי החבל מעוגן לאותו שלב שהגלגלת שלו. צריך עוגן בשלב שמתחת."}[w]}])}
    return headHtml(ME3,"")+`<div class="card simgrid"><span class="qcount">שלב 1 מתוך 2</span>
      <div><p class="glabel">1. איפה הקצה הראשון של החבל מעוגן?</p><div class="opts three">${opt(ME3.anchors,"an")}</div></div>
      <div><p class="glabel">2. מעל איזו גלגלת הוא עובר? (הקצה השני מחובר לתחתית הקרון)</p><div class="opts three">${opt(ME3.pulleys,"pu")}</div></div>
      <div id="cw">${ME3.svg(u)}</div>
      ${G.res!=="ok"?`<div class="row"><button class="btn" id="run" ${G.an&&G.pu&&!(R&&R.playing)?"":"disabled"}>הפעל כננת</button></div>`:""}</div>${res}`;
  },
  bind(){
    ["an","pu"].forEach(k=>app.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=()=>{G[k]=b.dataset[k];G.run=null;G.res=null;render()}));
    on("run",()=>{G.attempts++;const R={u:0,playing:true};G.run=R;const ok=ME3.y2(90).why==="ok";
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.u=reduce?90:Math.min(90,t/2*90);const w=document.getElementById("cw");if(w)w.innerHTML=ME3.svg(R.u);
        if(R.u>=90){R.playing=false;G.res=ok?"ok":"no";if(!ok)failAttempt();render();scrollTo_(".result,.win");return false}})});
    on("nextr",()=>{G.r=1;G.pick=null;G.chk=false;render();window.scrollTo(0,0)});
    app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{if(G.chk)return;G.pick=+b.dataset.q;render()});
    on("chkq",()=>{G.chk=true;G.attempts++;if(G.pick===1)award(starsFor(G.attempts-1,false),false);else failAttempt();render()});
    on("again",()=>{G.chk=false;G.pick=null;render()});
    on("solve",()=>{G.an="b";G.pu="s";G.run={u:90,playing:false};G.res="ok";render()});
  }};

  {id:"st1",play:true,title:"ציד במניואל",short:"שאלה מהמגרש, מוצאים את הסעיף נגד השעון"},
  {id:"st2",play:true,title:"מנהל המקצה",short:"מתכננים אוטונומי, מחזורים וסוף משחק, ורואים כמה נקודות יצא"},
  {id:"st3",play:true,title:"סקאוטר",short:"צופים במקצה ומונים מה כל רובוט קלע"},
  {id:"st4",play:true,title:"דראפט נחש",short:"בוחרים ברית מול בוטים, לפי נתוני סקאוטינג"},
  {id:"stlic",play:true,title:"מבחן רישיון אסטרטגיה",short:"עשר שאלות, ואז סקאוטינג אמיתי מול מנטור"}
];
/* a practice game for the whole world: "Desert Relay" (made up, so the rules here never contradict a real manual) */
const STRAT_NOTE=`<p class="note" style="margin:0">המשחק כאן, <bdi>Desert Relay</bdi>, הומצא לתרגול. בקיקאוף 2027 עושים את אותו דבר עם המניואל האמיתי.</p>`;
const RULES=[
  {sec:"משחק",id:"G101",t:"משך המקצה: 15 שניות אוטונומי ו־2:15 טלאופ. 20 השניות האחרונות הן סוף המשחק."},
  {sec:"משחק",id:"G102",t:"בזמן האוטונומי אסור לנהגים לגעת בבקרים. הפרה: פאול מינור."},
  {sec:"משחק",id:"G203",t:"רובוט רשאי להחזיק עד 2 קוביות בכל רגע. על כל קובייה נוספת: פאול מינור."},
  {sec:"משחק",id:"G204",t:"אסור שחלק מהרובוט יבלוט יותר מ־30 ס״מ מעבר לפגושים. הפרה: פאול מייג׳ור."},
  {sec:"ניקוד",id:"G301",t:"קובייה במדף הנמוך: 2 נקודות. במדף הגבוה: 4 נקודות. באוטונומי כל קובייה שווה פי 1.5."},
  {sec:"ניקוד",id:"G302",t:"טיפוס בסוף המשחק: מוט נמוך 4 נקודות, מוט גבוה 10 נקודות. נחשב רק אם הרובוט לא נוגע בשטיח 3 שניות אחרי הבאזר."},
  {sec:"הגנה",id:"G401",t:"אסור להיכנס לאזור האיסוף של היריב. הפרה: פאול מייג׳ור על כל 3 שניות."},
  {sec:"הגנה",id:"G402",t:"אסור להצמיד רובוט יריב (pinning) יותר מ־3 שניות. אחרי השחרור מתרחקים לפחות 1.8 מ׳."},
  {sec:"רובוט",id:"R101",t:"הרובוט, בלי פגושים וסוללה, שוקל עד 52 ק״ג."},
  {sec:"רובוט",id:"R102",t:"גובה מרבי של הרובוט בכל רגע במקצה: 1.2 מ׳."},
  {sec:"רובוט",id:"R201",t:"פגושים חובה, בצבע הברית, ומכסים את כל הפינות של המסגרת."},
  {sec:"טורניר",id:"T201",t:"דירוג: ניצחון 3 נקודות דירוג, תיקו 1. עוד נקודת דירוג אם הברית קלעה 12 קוביות או יותר, ועוד אחת אם כל שלושת הרובוטים טיפסו."}
];
const ST1={id:"st1",title:"ציד במניואל",
  goal:"שש שאלות שקורות באמת בתחרות. לכל אחת מוצאים את הסעיף במניואל ובוחרים אותו. השעון רץ.",
  Q:[{q:"יריב הוציא זרוע 40 ס״מ מחוץ לפגושים. איזה סעיף אומר שזה אסור?",a:"G204"},
     {q:"הנהג שלנו נגע בבקר בזמן האוטונומי. איזה סעיף?",a:"G102"},
     {q:"כמה נקודות שווה טיפוס על המוט הגבוה?",a:"G302"},
     {q:"הרובוט שלנו אסף שלוש קוביות בבת אחת. איזה סעיף?",a:"G203"},
     {q:"כמה הרובוט יכול לשקול?",a:"R101"},
     {q:"כמה זמן מותר להצמיד יריב לקיר?",a:"G402"},
     {q:"איך מקבלים נקודת דירוג נוספת בלי לנצח?",a:"T201"}],
  init(){G.qs=shuffle(ST1.Q).slice(0,6);G.i=0;G.sel=null;G.q="";G.chk=false;G.score=0;G.miss=0;G.t0=Date.now();G.done=false},
  view(){
    if(G.done){const sec=Math.round(G.time/1000);
      return headHtml(ST1,"")+(G.score>=5?winHtml(`<b class="mono">${G.score}/6</b> ב־<span class="mono">${sec}</span> שניות.`)+`<p class="why">בתחרות לא זוכרים את כל המניואל בעל פה. יודעים איפה לחפש: משחק, ניקוד, הגנה, רובוט, טורניר. ובחיפוש מקלידים מילה מהשאלה.</p>`
        :`<div class="result"><div class="err"><span class="ic">!</span><p><b class="mono">${G.score}/6</b>. צריך 5. נסו שוב, השאלות מתחלפות.</p></div><div class="row"><button class="btn" data-play="st1">שוב</button></div></div>`)}
    const Q=G.qs[G.i],q=G.q.trim();const list=RULES.filter(r=>!q||r.t.includes(q)||r.id.toLowerCase().includes(q.toLowerCase())||r.sec.includes(q));
    const secs=[...new Set(list.map(r=>r.sec))];
    return headHtml(ST1,"")+STRAT_NOTE+`<div class="card qcard"><span class="qcount">${G.i+1} מתוך 6 · נכונות: ${G.score} · <span class="mono" id="clock">0s</span></span>
      <h3 style="font-size:19px">${Q.q}</h3>
      <div class="field"><label for="mq">חיפוש במניואל</label><input id="mq" value="${esc(G.q)}" placeholder="למשל: פגושים, טיפוס, אוטונומי" autocomplete="off" ${G.chk?"disabled":""}></div>
      <div id="mlist" class="manualbook">${secs.map(s=>`<p class="glabel" style="margin:8px 0 4px">${s}</p>`+list.filter(r=>r.sec===s).map(r=>{const cls=G.chk?(r.id===Q.a?"ok":r.id===G.sel?"no":""):"";
        return `<button class="opt rule ${cls}" data-r="${r.id}" aria-pressed="${G.sel===r.id}" ${G.chk?"disabled":""}><b class="mono">${r.id}</b><small style="color:var(--ink)">${r.t}</small></button>`}).join("")).join("")||`<p class="muted">אין סעיף עם המילה הזאת. נסו מילה אחרת.</p>`}</div>
      ${G.chk?`<p class="why">${G.sel===Q.a?"<b>נכון.</b>":"<b>לא הסעיף הזה.</b> התשובה: <b class=\"mono\">"+Q.a+"</b>."}</p>`:""}
      <div class="row">${G.chk?`<button class="btn" id="next">${G.i<5?"הבא":"לתוצאה"}</button>`:`<button class="btn" id="pickr" ${G.sel?"":"disabled"}>זה הסעיף</button>`}</div></div>`},
  bind(){
    const inp=document.getElementById("mq");if(inp){inp.addEventListener("input",()=>{G.q=inp.value;const pos=inp.selectionStart;render();const n=document.getElementById("mq");n.focus();n.setSelectionRange(pos,pos)})}
    app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{G.sel=b.dataset.r;render()});
    on("pickr",()=>{G.chk=true;if(G.sel===G.qs[G.i].a)G.score++;else G.miss++;render()});
    on("next",()=>{if(G.i<5){G.i++;G.sel=null;G.q="";G.chk=false;render();return}
      G.done=true;G.time=Date.now()-G.t0;G.attempts=1;if(G.score>=5)award(G.miss===0&&G.time<120000?3:G.miss<=1?2:1,false);else failAttempt();render();window.scrollTo(0,0)});
    const c=document.getElementById("clock");if(c&&!G.done)loopAnim(()=>{const el=document.getElementById("clock");if(!el||G.done)return false;el.textContent=Math.round((Date.now()-G.t0)/1000)+"s"});
  }};

/* match plan: expected points = probability x points, time is the currency */
const ST2={id:"st2",title:"מנהל המקצה",
  goal:"זה הרובוט שלכם. תכננו את המקצה: מה עושים באוטונומי, איזה מחזור חוזרים עליו בטלאופ, ומתי מטפסים. המטרה: לפחות <span class=\"mono\">55</span> נקודות צפויות.",
  autos:[{id:"a",t:"רק יוצאים מהאזור",s:"3 נקודות, בטוח",pts:3},{id:"b",t:"קובייה אחת למדף הגבוה",s:"6 נקודות · מצליח ב־70%",pts:3+6*0.7},{id:"c",t:"שלוש קוביות למדף הנמוך",s:"3 קוביות × 3 נקודות (פי 1.5 באוטונומי) · מצליח ב־95%",pts:3+9*0.95}],
  cycles:[{id:"low",t:"מדף נמוך, מהאיסוף הקרוב",pts:2,p:0.95,sec:6},{id:"high",t:"מדף גבוה, מהאיסוף הקרוב",pts:4,p:0.6,sec:12},{id:"far",t:"מדף גבוה, מהאיסוף הרחוק",pts:4,p:0.95,sec:13}],
  ends:[{id:"none",t:"לא מטפסים, ממשיכים לקלוע",sec:0,pts:0,p:1},{id:"lo",t:"מוט נמוך",s:"לוקח 6 שניות · 4 נקודות · 95%",sec:6,pts:4,p:0.95},{id:"hi",t:"מוט גבוה",s:"לוקח 15 שניות · 10 נקודות · 80%",sec:15,pts:10,p:0.8}],
  init(){G.au=null;G.cy=null;G.en=null;G.run=null},
  calc(){const a=ST2.autos.find(x=>x.id===G.au),c=ST2.cycles.find(x=>x.id===G.cy),e=ST2.ends.find(x=>x.id===G.en);
    const tt=135-e.sec,n=Math.floor(tt/c.sec),tele=n*c.pts*c.p,end=e.pts*e.p;return {a,c,e,n,tele,end,auto:a.pts,total:a.pts+tele+end}},
  view(){
    const R=G.run;const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${R&&R.playing||G.phase==="win"?"disabled":""}><b>${o.t}</b><small>${o.s||(o.sec&&o.pts&&o.p&&key==="cy"?`מחזור של ${o.sec} שניות · ${o.pts} נקודות · מצליח ב־${Math.round(o.p*100)}%`:"")}</small></button>`).join("");
    const k=R?R.k:0,c=R?R.c:null;const clock=R?Math.max(0,150-k*150):150,sc=R?Math.round(R.c.total*Math.min(1,k)):0;
    const mm=Math.floor(clock/60)+":"+String(Math.floor(clock%60)).padStart(2,"0");
    const field=`<svg class="sim" viewBox="0 0 400 150" role="img" aria-label="מגרש מלמעלה ושעון מקצה"><rect x="10" y="10" width="380" height="110" rx="10" fill="var(--panel)"/>
      <rect x="20" y="40" width="40" height="50" rx="4" fill="#F2B01E" opacity=".7"/><text x="40" y="104" text-anchor="middle" style="font-size:10px">איסוף</text>
      <rect x="340" y="30" width="40" height="70" rx="4" fill="var(--accent)" opacity=".5"/><text x="360" y="112" text-anchor="middle" style="font-size:10px">מדפים</text>
      ${R?(()=>{const ph=(k*150*1.0)%(c.c.sec)/c.c.sec,x=60+260*(ph<0.5?ph*2:2-ph*2);return `<rect x="${x}" y="52" width="30" height="28" rx="6" fill="var(--accent)"/>`})():`<rect x="70" y="52" width="30" height="28" rx="6" fill="var(--accent)"/>`}
      <text x="200" y="142" text-anchor="middle" class="m" style="font-size:16px;font-weight:700">${mm}  ·  ${sc} pts</text></svg>`;
    let res="",kv="";
    if(R&&!R.playing){const C=R.c;kv=`<table class="tablex"><thead><tr><th>מחזור</th><th>זמן</th><th>נקודות צפויות למחזור</th><th>לשנייה</th></tr></thead><tbody>${ST2.cycles.map(x=>`<tr class="${x.id===G.cy?"pick":""}"><td>${x.t}</td><td class="mono">${x.sec}s</td><td class="mono">${(x.pts*x.p).toFixed(2)}</td><td class="mono">${(x.pts*x.p/x.sec).toFixed(2)}</td></tr>`).join("")}</tbody></table>
      <div class="kv"><div><span>אוטונומי</span><b>${C.auto.toFixed(1)}</b></div><div><span>טלאופ (${C.n} מחזורים)</span><b>${C.tele.toFixed(1)}</b></div><div><span>סוף משחק</span><b>${C.end.toFixed(1)}</b></div><div class="${C.total>=55?"good":"bad"}"><span>סה״כ צפוי</span><b>${C.total.toFixed(1)}</b></div></div>`;
      res=C.total>=55?winHtml("תוכנית מקצה שעוברת את היעד.")+`<p class="why">המדף הגבוה שווה כפול, אבל לוקח כפול זמן ומחטיא יותר. מה שקובע הוא <b>נקודות צפויות לשנייה</b>: נקודות × סיכוי הצלחה ÷ זמן מחזור. ומוט גבוה שווה את 15 השניות שלו, כי בזמן הזה הייתם קולעים פחות.</p>`
        :errsHtml([{text:`<b>${C.total.toFixed(1)} נקודות צפויות</b>, צריך 55. בדקו בטבלה איזה מחזור נותן הכי הרבה נקודות לשנייה, ומה כל החלטה עולה בזמן.`}])}
    return headHtml(ST2,"")+STRAT_NOTE+`<div><p class="glabel">1. אוטונומי (15 שניות)</p><div class="opts">${opt(ST2.autos,"au")}</div></div>
      <div><p class="glabel">2. המחזור שחוזרים עליו בטלאופ</p><div class="opts">${opt(ST2.cycles,"cy")}</div></div>
      <div><p class="glabel">3. סוף משחק</p><div class="opts">${opt(ST2.ends,"en")}</div></div>
      <div class="card simgrid">${field}${kv}</div>
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${G.au&&G.cy&&G.en&&!(R&&R.playing)?"":"disabled"}>שחק את המקצה</button></div>`:""}${res}`},
  bind(){
    ["au","cy","en"].forEach(k=>app.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=()=>{G[k]=b.dataset[k];G.run=null;render()}));
    on("run",()=>{G.attempts++;const R={c:ST2.calc(),playing:true,k:0};G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?1:t/5;if(R.k>=1){R.k=1;R.playing=false;if(R.c.total>=55)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.au="c";G.cy="low";G.en="hi";G.run={c:ST2.calc(),playing:false,k:1};award(0,true);render()});
  }};

/* scouting: three robots cycle for 24 s, the player counts scored cubes per robot */
const ST3={id:"st3",title:"סקאוטר",
  goal:"קטע של 24 שניות מהמקצה. ספרו כמה קוביות כל רובוט <b>קלע</b> (החטאה לא נספרת). לוחצים +1 בכל פעם שרובוט קולע.",
  bots:[{id:"A",name:"כחול",col:"#0A6BB0",y:34,ev:[[3.2,1],[7.6,1],[12.4,0],[16.6,1],[21.2,1]]},
        {id:"B",name:"כתום",col:"#C8650F",y:78,ev:[[4.8,1],[10.6,0],[15.9,1],[22.4,1]]},
        {id:"C",name:"ירוק",col:"#1D8A57",y:122,ev:[[6.4,1],[14.1,1],[19.8,0]]}],
  init(){G.cnt={A:0,B:0,C:0};G.t=null;G.over=false;G.chk=false},
  truth(b){return b.ev.filter(e=>e[1]).length},
  svg(t){
    const bot=b=>{let last=0,x;for(const e of b.ev){if(t<e[0]){const ph=(t-last)/(e[0]-last);x=330-270*Math.sin(Math.min(1,ph)*Math.PI);break}last=e[0]}if(x===undefined)x=330-270*Math.sin(Math.min(1,(t-last)/6)*Math.PI/2);
      const near=b.ev.find(e=>t>=e[0]&&t<e[0]+0.7);
      return `<g><rect x="${x}" y="${b.y-14}" width="34" height="28" rx="7" fill="${b.col}"/>${near?(near[1]?`<text x="364" y="${b.y+5}" style="fill:var(--good);font-size:18px;font-weight:800">+</text><rect x="340" y="${b.y-16}" width="10" height="32" fill="var(--good)"/>`
        :`<text x="352" y="${b.y-6}" style="fill:var(--bad);font-size:16px;font-weight:800">✕</text><circle cx="${330+(t-near[0])*40}" cy="${b.y+10+(t-near[0])*20}" r="5" fill="#F2B01E"/>`):""}</g>`};
    return `<svg class="sim" viewBox="0 0 400 160" role="img" aria-label="מקצה: שלושה רובוטים"><rect x="10" y="10" width="380" height="140" rx="10" fill="var(--panel)"/>
      <rect x="18" y="20" width="30" height="120" rx="4" fill="#F2B01E" opacity=".6"/><rect x="340" y="20" width="12" height="120" fill="var(--comp-edge)"/>
      ${ST3.bots.map(bot).join("")}<text x="200" y="146" text-anchor="middle" class="m">${t==null?"":Math.max(0,24-t).toFixed(0)+"s"}</text></svg>`},
  view(){
    const playing=G.t!=null&&!G.over;
    const counters=ST3.bots.map(b=>{const tr=ST3.truth(b),st=G.chk?(G.cnt[b.id]===tr?"ok":"no"):"";
      return `<div class="opt ${st}" style="flex-direction:row;align-items:center;justify-content:space-between;gap:8px"><span><b style="color:${b.col}">רובוט ${b.name}</b>${G.chk?`<small style="display:block">קלע באמת: <span class="mono">${tr}</span></small>`:""}</span>
        <span class="row" style="gap:6px"><button class="btn ghost small" data-m="${b.id}" ${G.chk?"disabled":""}>−</button><b class="mono" style="min-width:24px;text-align:center">${G.cnt[b.id]}</b><button class="btn small" data-p="${b.id}" ${G.chk||!playing&&!G.over?"disabled":""}>+1</button></span></div>`}).join("");
    let res="";
    if(G.chk){const off=ST3.bots.reduce((s,b)=>s+Math.abs(G.cnt[b.id]-ST3.truth(b)),0);
      res=off<=1?winHtml(off?"טעות אחת קטנה, וזה בסדר.":"ספירה מדויקת.")+`<p class="why">סקאוטר טוב מסתכל על התוצאה, לא על הניסיון: קובייה שנזרקה ולא נכנסה לא נספרת. ובתחרות אמיתית כל סקאוטר עוקב אחרי רובוט אחד בלבד.</p>`
        :errsHtml([{text:`<b>הפרש של ${off}</b> מהנתונים האמיתיים. הנתונים שלכם הם מה שהברית תבחר לפיו, אז דיוק חשוב יותר ממהירות. שימו לב להחטאות: הן מסומנות ב־✕ ולא נספרות.`}],"")}
    return headHtml(ST3,"")+`<div class="card simgrid"><div id="scw">${ST3.svg(G.t==null?0:G.t)}</div>
      <div class="opts">${counters}</div>
      ${G.t==null?`<div class="row"><button class="btn" id="go">הפעל מקצה</button></div>`:G.over&&!G.chk?`<div class="row"><button class="btn" id="chk">השווה לנתונים</button></div>`:""}
      ${G.chk&&G.phase!=="win"?`<div class="row"><button class="btn" data-play="st3">צפו שוב מההתחלה</button></div>`:""}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{G.cnt[b.dataset.p]++;const v=b.previousElementSibling;if(v)v.textContent=G.cnt[b.dataset.p]});
    app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{G.cnt[b.dataset.m]=Math.max(0,G.cnt[b.dataset.m]-1);const v=b.nextElementSibling;if(v)v.textContent=G.cnt[b.dataset.m]});
    on("go",()=>{G.t=0;render();const t0=performance.now();

    if(done)res=G.nm==="brake"?winHtml("הזרוע כמעט לא זזה אחרי ה־disable.")+`<p class="why">Brake מקצר את הסלילים כשאין פקודה, והמנוע מתנגד לתנועה. לזרועות ומעליות כמעט תמיד Brake. Coast מתאים כשרוצים שמשהו ימשיך להסתובב חופשי, למשל גלגל של שוטר.</p>`
      :errsHtml([{text:"<b>הזרוע נפלה</b> ברגע שהרובוט הושבת. ב־Coast המנוע מסתובב חופשי כשאין פקודה. בסוף מקצה, או כשמישהו לוחץ disable, היא תיפול על מה שמתחתיה."}]);
    return headHtml(P1,"")+`<div class="card simgrid"><span class="qcount">שלב 2 מתוך 2 · זרוע</span><p style="margin:0">הזרוע מוחזקת באוויר. בסוף המקצה הרובוט מושבת (disabled). איזה מצב עצירה (NeutralMode) למנוע שלה?</p>
      <div class="opts three">${["brake","coast"].map(k=>`<button class="opt" data-nm="${k}" aria-pressed="${G.nm===k}" ${G.phase==="win"?"disabled":""}><b class="mono">${k==="brake"?"Brake":"Coast"}</b></button>`).join("")}</div>
      ${svg}${G.phase!=="win"?`<div class="row"><button class="btn" id="run2" ${G.nm&&!(G.run&&G.run.playing)?"":"disabled"}>השבת את הרובוט</button></div>`:""}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-mid]").forEach(b=>b.onclick=()=>{const [k,n]=b.dataset.mid.split(":");G.cfg[k].id=+n;G.run=null;G.res=null;render()});
    app.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>{const [k,n]=b.dataset.inv.split(":");G.cfg[k].inv=n==="1";G.run=null;G.res=null;render()});
    app.querySelectorAll("[data-nm]").forEach(b=>b.onclick=()=>{G.nm=b.dataset.nm;G.run=null;render()});
    const go=fin=>{G.attempts++;const R={t:0,playing:true};G.run=R;loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.t=reduce?1.2:t;if(R.t>=1.2){R.playing=false;fin();render();scrollTo_(".result,.win");return false}render()})};
    on("run",()=>go(()=>{const o=P1.outcome();G.res=o.ok?"ok":"no";if(!o.ok)failAttempt()}));
    on("run2",()=>go(()=>{if(G.nm==="brake")award(starsFor(G.attempts-1,false),false);else failAttempt()}));
    on("nextr",()=>{G.r=1;G.run=null;render();window.scrollTo(0,0)});
    on("solve",()=>{if(G.r===0){P1.M.forEach(m=>G.cfg[m.k]={id:m.id,inv:m.side==="R"});G.run={t:1.2,playing:false};G.res="ok"}else{G.nm="brake";G.run={t:1.2,playing:false};award(0,true)}render()});
  }};

/* p2: arm position PID with gravity feedforward */
const P2={id:"p2",title:"כוונון PID",
  goal:"הזרוע צריכה לעלות מ־<span class=\"mono\">0°</span> ל־<span class=\"mono\">60°</span>. כוונו את <span class=\"mono\">kP</span>, <span class=\"mono\">kD</span> ו־<span class=\"mono\">kG</span>. היעד: להגיע תוך שנייה, לחרוג לכל היותר ב־<span class=\"mono\">4°</span>, ולעצור בטווח של חצי מעלה.",
  T:60,
  init(){G.kp=10;G.kd=0;G.kg=0;G.run=null},
  sim(){const a=20,c=3,g=24,dt=0.002,tgt=P2.T*Math.PI/180;let th=0,w=0;const pts=[];
    for(let t=0;t<=2;t+=dt){const e=tgt-th;let V=G.kp*e-G.kd*w+G.kg*Math.cos(th);V=Math.max(-12,Math.min(12,V));
      w+=(a*V-c*w-g*Math.cos(th))*dt;th+=w*dt;if(th<0){th=0;w=Math.max(0,w)}if(Math.round(t/dt)%10===0)pts.push({t,d:th*180/Math.PI,V})}
    const max=Math.max(...pts.map(p=>p.d)),fin=pts[pts.length-1].d;let settle=null;for(let i=pts.length-1;i>=0;i--){if(Math.abs(pts[i].d-P2.T)>2){settle=pts[i+1]?pts[i+1].t:null;break}if(i===0)settle=0}
    return {pts,over:Math.max(0,max-P2.T),err:Math.abs(fin-P2.T),settle}},
  view(){
    const R=G.run,X=t=>36+t/2*354,Y=d=>200-d/90*180,sh=R?R.pts.slice(0,R.k):[];
    const line=sh.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.d).toFixed(1)).join(""),last=sh[sh.length-1];
    const th=(last?last.d:0)*Math.PI/180;
    const svg=`<svg class="sim graph" viewBox="0 0 400 330" role="img" aria-label="זווית הזרוע לאורך הזמן">
      ${[0,30,60,90].map(d=>`<text x="30" y="${Y(d)+3}" text-anchor="end">${d}°</text><line x1="36" x2="390" y1="${Y(d)}" y2="${Y(d)}" stroke="var(--line)" stroke-width=".5"/>`).join("")}
      <rect x="36" y="${Y(P2.T+2)}" width="354" height="${Y(P2.T-2)-Y(P2.T+2)}" fill="var(--good)" opacity=".15"/><line x1="${X(1)}" x2="${X(1)}" y1="20" y2="200" stroke="var(--muted)" stroke-dasharray="3 4"/>
      <text x="${X(1)+4}" y="30">1.0s</text><path class="vline" d="${line}"/>
      <g transform="translate(0 30)"><rect x="40" y="250" width="16" height="40" fill="var(--comp-edge)"/><line x1="48" y1="250" x2="${48+70*Math.cos(th)}" y2="${250-70*Math.sin(th)}" stroke="#E2B97F" stroke-width="10" stroke-linecap="round"/><line x1="48" y1="250" x2="${48+80*Math.cos(P2.T*Math.PI/180)}" y2="${250-80*Math.sin(P2.T*Math.PI/180)}" stroke="var(--good)" stroke-dasharray="4 4"/></g>
      <text x="390" y="290" text-anchor="end">${last?`${last.t.toFixed(2)}s · ${last.d.toFixed(1)}° · ${last.V.toFixed(1)}V`:""}</text></svg>`;
    const ok=R&&!R.playing&&R.over<=4&&R.err<=0.5&&R.settle!==null&&R.settle<=1;
    let res="";
    if(R&&!R.playing)res=ok?winHtml(`חריגה <span class="mono">${R.over.toFixed(1)}°</span>, מתייצב אחרי <span class="mono">${R.settle.toFixed(2)}s</span>.`)+`<p class="why"><span class="mono">kG</span> מחזיק את המשקל מול הכובד, כך ש־<span class="mono">kP</span> לא צריך "לשלם" על זה בשגיאה. <span class="mono">kP</span> דוחף לכיוון היעד, ו־<span class="mono">kD</span> בולם כשמתקרבים מהר. הסדר בסדנה: קודם kG עד שהזרוע מרחפת, אחר כך kP, ואז kD אם יש חריגה.</p>`
      :errsHtml(P2.explain(R));
    return headHtml(P2,"")+`<div class="card simgrid">${svg}
      ${slider("kp","kP (וולט לרדיאן)",G.kp,0,60,1,v=>v,R&&R.playing)}${slider("kd","kD",G.kd,0,4,0.1,v=>(+v).toFixed(1),R&&R.playing)}${slider("kg","kG (וולט)",G.kg,0,3,0.1,v=>(+v).toFixed(1),R&&R.playing)}
      ${codeBox(`<span class="kw">double</span> volts = <b>${G.kp}</b> * error - <b>${(+G.kd).toFixed(1)}</b> * velocity + <b>${(+G.kg).toFixed(1)}</b> * Math.cos(angle);`)}
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${R&&R.playing?"disabled":""}>הרץ</button></div>`:""}</div>${res}`},
  explain(R){const e=[];
    if(R.err>0.5&&R.over<=4)e.push({text:`<b>הזרוע עוצרת מתחת ליעד</b> (חסרות <span class="mono">${R.err.toFixed(1)}°</span>). הכובד מושך אותה למטה, ו־kP לבד צריך שגיאה כדי לייצר מתח שמחזיק אותה. זה מה ש־kG פותר.`});
    if(R.over>4)e.push({text:`<b>חריגה של <span class="mono">${R.over.toFixed(1)}°</span>.</b> הזרוע מגיעה מהר מדי ועוברת את היעד. kD בולם אותה ככל שהיא מתקרבת מהר, או הורידו קצת את kP.`});
    if(R.settle===null||R.settle>1)e.push({sev:"w",text:"<b>לא מתייצב תוך שנייה.</b> אם היא איטית, יותר kP. אם היא רועדת, יותר kD."});
    return e},
  bind(){
    bindSlider("kp",v=>v,v=>{G.kp=v;G.run=null});bindSlider("kd",v=>(+v).toFixed(1),v=>{G.kd=v;G.run=null});bindSlider("kg",v=>(+v).toFixed(1),v=>{G.kg=v;G.run=null});
    on("run",()=>{G.attempts++;const R=Object.assign(P2.sim(),{playing:true,k:1});G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?R.pts.length:Math.floor(t/2*R.pts.length)+1;
        if(R.k>=R.pts.length){R.k=R.pts.length;R.playing=false;const ok=R.over<=4&&R.err<=0.5&&R.settle!==null&&R.settle<=1;if(ok)award(starsFor(Math.max(1,G.attempts-2),false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.kp=30;G.kd=1.5;G.kg=1.2;const R=Object.assign(P2.sim(),{playing:false});R.k=R.pts.length;G.run=R;award(0,true);render()});
  }};

/* p3: autonomous from command blocks; a block can run in parallel with the one before it */
const P3B={drive1:{t:"סע לקובייה",d:2.5},drive2:{t:"סע למדף",d:2.5},armUp:{t:"הרם זרוע",d:1.2},armDown:{t:"הורד זרוע",d:1.0},
  intDown:{t:"הורד אינטייק",d:0.8},collect:{t:"אסוף קובייה",d:1.0},intUp:{t:"הרם אינטייק",d:0.6},score:{t:"קלע",d:0.5}};
const P3={id:"p3",title:"בונה האוטונומי",
  goal:"הרובוט מתחיל ליד המדף עם קובייה אחת. באוטונומי של <span class=\"mono\">9</span> שניות: לקלוע אותה, לאסוף עוד קובייה ולקלוע גם אותה. סמנו פקודה כ״במקביל״ כדי שתרוץ יחד עם הפקודה שלפניה.",
  LIMIT:9,
  init(){G.seq=[];G.run=null},
  groups(){const gs=[];G.seq.forEach((s,i)=>{if(s.par&&gs.length)gs[gs.length-1].push(s.k);else gs.push([s.k])});return gs},
  check(){const st={at:"shelf",arm:"down",int:"up",cubes:1,scored:0};let t=0;const log=[];const gs=P3.groups();
    for(const g of gs){
      if(g.includes("drive1")&&g.includes("drive2"))return {err:"<b>שתי נסיעות במקביל.</b> הרובוט לא יכול לנסוע לשני מקומות בבת אחת."};
      for(const k of g){
        if(k==="score"){if(st.arm!=="up")return {err:"<b>קלעתם עם זרוע למטה.</b> קודם \"הרם זרוע\", ורק כשהיא למעלה \"קלע\". פקודות שרצות במקביל מתחילות באותו רגע, אז הזרוע עוד לא למעלה."};if(st.at!=="shelf")return {err:"<b>קלעתם רחוק מהמדף.</b> צריך לנסוע למדף לפני שקולעים."};if(!st.cubes)return {err:"<b>אין קובייה לקלוע.</b>"}}
        if(k==="collect"){if(st.int!=="down")return {err:"<b>אספתם עם אינטייק למעלה.</b> קודם \"הורד אינטייק\", בפקודה נפרדת לפני האיסוף."};if(st.at!=="cube")return {err:"<b>האינטייק אסף אוויר.</b> צריך לנסוע לקובייה לפני האיסוף."}}
        if((k==="drive1"||k==="drive2")&&st.arm==="up"&&!g.includes("armDown"))return {err:"<b>נסיעה עם זרוע מורמת.</b> בתרגיל הזה זה אסור: הרובוט עלול להתהפך. מורידים את הזרוע לפני הנסיעה, או במקביל אליה. (להרים אותה בזמן הנסיעה כן מותר.)"};
      }
      for(const k of g){if(k==="drive1")st.at="cube";if(k==="drive2")st.at="shelf";if(k==="armUp")st.arm="up";if(k==="armDown")st.arm="down";if(k==="intDown")st.int="down";if(k==="intUp")st.int="up";if(k==="collect")st.cubes++;if(k==="score"){st.cubes--;st.scored++}}
      const d=Math.max(...g.map(k=>P3B[k].d));log.push({g,t0:t,d});t+=d}
    return {t,log,scored:st.scored,ok:st.scored>=2&&t<=P3.LIMIT}},
  view(){
    const R=G.run;const pal=Object.keys(P3B).map(k=>`<button class="chip txt" data-add="${k}" ${G.phase==="win"||R&&R.playing?"disabled":""}>${P3B[k].t} <span class="mono" style="color:var(--muted)">${P3B[k].d}s</span></button>`).join("");
    const seq=G.seq.map((s,i)=>`<li class="cmd ${s.par?"par":""}"><span class="mono num">${i+1}</span><b>${P3B[s.k].t}</b>${i?`<label class="note"><input type="checkbox" data-par="${i}" ${s.par?"checked":""}> במקביל לקודמת</label>`:""}<button class="btn ghost small" data-del="${i}" aria-label="הסר">✕</button></li>`).join("");
    const c=G.seq.length?P3.check():null;
    let res="";
    if(R&&!R.playing){if(c.err)res=errsHtml([{text:c.err}]);else if(c.ok)res=winHtml(`שתי קוביות ב־<span class="mono">${c.t.toFixed(1)}</span> שניות.`)+`<p class="why">ב־WPILib זה בדיוק <span class="mono">Commands.sequence(...)</span> ו־<span class="mono">Commands.parallel(...)</span>. מה שלא תלוי זה בזה רץ במקביל, ומה שצריך תנאי (אינטייק למטה לפני איסוף) רץ אחריו.</p>`;
      else res=errsHtml([{text:c.scored<2?`<b>קלעתם ${c.scored} ${c.scored===1?"קובייה":"קוביות"}.</b> צריך שתיים.`:`<b>לקח <span class="mono">${c.t.toFixed(1)}</span> שניות</b>, והאוטונומי נגמר ב־9. חפשו פקודות שלא תלויות זו בזו והריצו אותן במקביל. רמז: מותר להתחיל להרים זרוע בזמן שהרובוט כבר נוסע למדף.`}])}
    const bar=R&&c&&c.log?`<div class="tl">${c.log.map(l=>`<span style="flex:${l.d}" class="${R.t>=l.t0?"on":""}">${l.g.map(k=>P3B[k].t).join(" + ")}</span>`).join("")}</div><p class="note" style="margin:0">זמן: <span class="mono">${Math.min(R.t,c.t||0).toFixed(1)}s / ${P3.LIMIT}s</span></p>`:"";
    return headHtml(P3,"")+`<div class="card simgrid"><p class="glabel" style="margin:0">פקודות (לחיצה מוסיפה לסוף)</p><div class="chips">${pal}</div>
      <ol class="cmds">${seq||`<li class="muted" style="list-style:none">עוד אין פקודות</li>`}</ol>${bar}
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${G.seq.length&&!(R&&R.playing)?"":"disabled"}>הרץ אוטונומי</button><button class="btn ghost small" id="clr">נקה</button></div>`:""}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{G.seq.push({k:b.dataset.add,par:false});G.run=null;render()});
    app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{G.seq.splice(+b.dataset.del,1);G.run=null;render()});
    app.querySelectorAll("[data-par]").forEach(b=>b.onchange=()=>{G.seq[+b.dataset.par].par=b.checked;G.run=null;render()});
    on("clr",()=>{G.seq=[];G.run=null;render()});
    on("run",()=>{G.attempts++;const c=P3.check(),R={t:0,playing:true};G.run=R;const end=c.err?0.01:Math.min(c.t,P3.LIMIT+1);
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.t=reduce?end:t*3;if(R.t>=end){R.t=end;R.playing=false;if(!c.err&&c.ok)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.seq=[{k:"armUp"},{k:"score"},{k:"drive1"},{k:"armDown",par:true},{k:"intDown",par:true},{k:"collect"},{k:"drive2"},{k:"intUp",par:true},{k:"armUp",par:true},{k:"score"}].map(s=>({k:s.k,par:!!s.par}));G.run={t:99,playing:false};award(0,true);render()});
  }};

/* p4: debugging quiz */
const BUG=(code,log,q,o,a,w)=>({art:`<div style="width:100%;display:grid;gap:6px">${codeBox(code)}${log?`<pre class="code log" dir="ltr">${log}</pre>`:""}</div>`,q,o,a,w});
const MOD_P4=makeQuiz("p4",{title:"בלש הבאגים",pass:4,
  goal:"חמישה באגים אמיתיים מעונות קודמות. בכל אחד: קוד, מה קרה, ומה התיקון.",

/* ---------- mo4: build a 100:1 reduction from three stages ---------- */
const MO4={id:"mo4",title:"מגדל התמסורת",
  goal:"לזרוע צריך יחס של בערך <span class=\"mono\">100:1</span> (מותר <span class=\"mono\">96</span> עד <span class=\"mono\">104</span>). בונים אותו משלושה שלבים: קופסה פלנטרית, זוג גלגלי שיניים ושרשרת. בוחרים, ולוחצים בדוק.",
  OPT:{p:[3,4,5],x:[10,12,14],y:[36,40,48,50,60],u:[12,16,18],v:[36,42,48,54,60]},
  LBL:{p:"קופסה פלנטרית",x:"פיניון (על המנוע)",y:"גלגל שיניים גדול",u:"גלגל שרשרת קטן",v:"גלגל שרשרת גדול"},
  init(){G.sel={p:3,x:12,y:36,u:16,v:36};G.res=null},
  ratio(s){return s.p*(s.y/s.x)*(s.v/s.u)},
  gear(cx,cy,t,col,dur,dir){const r=t*0.9,c=2*Math.PI*r;
    const spin=dur?`<animateTransform attributeName="transform" type="rotate" from="0 ${cx} ${cy}" to="${dir*360} ${cx} ${cy}" dur="${dur}s" repeatCount="indefinite"/>`:"";
    return `<g><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col}" stroke-width="7" stroke-dasharray="${(c/t/2).toFixed(2)}"/><circle cx="${cx}" cy="${cy}" r="${r-4}" fill="${col}" opacity=".35"/><path d="M${cx} ${cy}V${cy-r+6}" stroke="${col}" stroke-width="3"/>${spin}</g>`},
  svg(){const s=G.sel,ok=G.res!=null,base=0.6;
    const d1=ok?base*s.p:0,d2=ok?d1*s.y/s.x:0,d3=ok?d2*s.v/s.u:0;
    const x1=150,cy=120,ry=s.y*0.9,rx=s.x*0.9,x2=x1+rx+ry+2,x3=x2+150,ru=s.u*0.9,rv=s.v*0.9;
    const arm=`<g><path d="M${x3} ${cy}h70" stroke="#E2B97F" stroke-width="10" stroke-linecap="round"/>${ok?`<animateTransform attributeName="transform" type="rotate" from="0 ${x3} ${cy}" to="${-Math.min(90,360*4/d3).toFixed(1)} ${x3} ${cy}" dur="4s" fill="freeze"/>`:""}</g>`;
    return `<svg class="sim" viewBox="0 0 470 240" role="img" aria-label="שרשרת תמסורת מהמנוע לזרוע">
      <rect x="10" y="95" width="46" height="50" rx="6" fill="#3A4250"/><text x="33" y="160" text-anchor="middle">Kraken</text>
      <rect x="58" y="100" width="56" height="40" rx="6" fill="#7E8794"/><text x="86" y="125" text-anchor="middle" style="fill:#fff;font-weight:700">${s.p}:1</text>
      <path d="M114 ${cy}H${x1}" stroke="#5A6B7F" stroke-width="5"/>
      <path d="M${x2} ${cy-ru}L${x3} ${cy-rv}M${x2} ${cy+ru}L${x3} ${cy+rv}" stroke="#3A4250" stroke-width="4" stroke-dasharray="5 3"${ok?``:""}>${ok?`<animate attributeName="stroke-dashoffset" from="0" to="-16" dur="${(d2/4).toFixed(2)}s" repeatCount="indefinite"/>`:""}</path>
      ${MO4.gear(x1,cy,s.x,"#0A6BB0",d1,1)}${MO4.gear(x2,cy,s.y,"#0A6BB0",d2,-1)}${MO4.gear(x2,cy,s.u,"#C9302A",d2,-1)}${MO4.gear(x3,cy,s.v,"#C9302A",d3,-1)}${arm}
      <text x="${x1}" y="236" text-anchor="middle">${s.x}T</text><text x="${x2}" y="16" text-anchor="middle">${s.y}T / ${s.u}T</text><text x="${x3}" y="16" text-anchor="middle">${s.v}T</text></svg>`},
  view(){const s=G.sel,r=MO4.ratio(s),won=G.phase==="win";
    const groups=Object.keys(MO4.OPT).map(k=>`<div><p class="glabel" style="margin:0 0 4px">${MO4.LBL[k]}</p><div class="chips">${MO4.OPT[k].map(v=>`<button class="chip" data-g="${k}:${v}" aria-pressed="${s[k]===v}" ${won?"disabled":""}><span class="mono">${k==="p"?v+":1":v+"T"}</span></button>`).join("")}</div></div>`).join("");
    let res="";
    if(G.res!=null){const eq=`<bdi class="mono" dir="ltr" style="white-space:nowrap">${s.p} × ${s.y}/${s.x} × ${s.v}/${s.u} = ${r.toFixed(1)}:1</bdi>`;
      const rpm=6000/r,t90=(0.25/(rpm/60)).toFixed(2);
      if(won)res=winHtml(`${eq}. הזרוע מסתובבת רבע סיבוב תוך בערך <span class="mono">${t90}</span> שניות במהירות מלאה.`)+`<p class="why">היחס הכולל הוא מכפלה של כל השלבים. בכל זוג: גדול חלקי קטן. ככה בונים יחס גדול בלי גלגל ענק אחד: <span class="mono">5 × 5 × 4 = 100</span>.</p>`;
      else res=errsHtml([{text:`יצא ${eq}. ${r<96?"<b>מהיר מדי.</b> הזרוע תהיה חלשה ותתקשה להחזיק משקל. צריך שלב אחד עם יחס גדול יותר.":"<b>איטי מדי.</b> הזרוע חזקה אבל זוחלת. הקטינו את אחד השלבים."}`}])}
    return headHtml(MO4,"")+`<div class="card simgrid">${MO4.svg()}${groups}
      ${won?"":`<div class="row"><button class="btn" id="chk">בדוק</button></div>`}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.g.split(":");G.sel[k]=+v;G.res=null;render()});
    on("chk",()=>{G.attempts++;const r=MO4.ratio(G.sel);G.res=r;if(r>=96&&r<=104)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win")});
    on("solve",()=>{G.sel={p:5,x:10,y:50,u:12,v:48};G.res=MO4.ratio(G.sel);award(0,true);render()});
  }};

/* ---------- st5: when to leave for the climb ---------- */
const ST5={id:"st5",title:"מתי לטפס?",
  goal:"נשארו <span class=\"mono\">30</span> שניות. כל סייקל לוקח <span class=\"mono\">8</span> שניות ונותן <span class=\"mono\">5</span> נקודות. טיפוס נותן <span class=\"mono\">15</span> נקודות, ולוקח בין <span class=\"mono\">6</span> ל־<span class=\"mono\">9</span> שניות. סייקל שלא נגמר לא שווה כלום, וגם טיפוס שלא נגמר. מתי מתחילים לטפס?",
  T:30,CY:8,WORST:9,
  init(){G.x=4;G.run=null},
  pts(x){const cyc=Math.floor((ST5.T-x)/ST5.CY);return {cyc,cp:cyc*5,climb:x>=ST5.WORST?15:0}},
  view(){const R=G.run,x=G.x,p=ST5.pts(x),X=s=>20+(ST5.T-s)/ST5.T*360,now=R?R.t:ST5.T,won=G.phase==="win";
    let segs="";for(let i=0;i<p.cyc;i++){const a=ST5.T-i*ST5.CY,b=a-ST5.CY;segs+=`<rect x="${X(a)}" y="40" width="${X(b)-X(a)}" height="26" rx="4" fill="#0A6BB0" opacity="${now<=b?1:.35}"/><text x="${(X(a)+X(b))/2}" y="58" text-anchor="middle" style="fill:#fff;font-size:11px">+5</text>`}
    const idle=ST5.T-p.cyc*ST5.CY-x;if(idle>0)segs+=`<rect x="${X(x+idle)}" y="40" width="${X(x)-X(x+idle)}" height="26" rx="4" fill="#C9D3DE"/>`;
    const cEnd=x-ST5.WORST,climbOk=cEnd>=0;segs+=`<rect x="${X(x)}" y="40" width="${X(Math.max(0,cEnd))-X(x)}" height="26" rx="4" fill="${climbOk?"#1D8A57":"#C9302A"}" opacity="${R&&now<=Math.max(0,cEnd)?1:.35}"/>${!climbOk?`<rect x="${X(0)}" y="40" width="${X(cEnd)-X(0)}" height="26" fill="none" stroke="#C9302A" stroke-dasharray="4 3"/>`:""}`;
    const svg=`<svg class="sim" viewBox="0 0 400 110" role="img" aria-label="ציר זמן של 30 השניות האחרונות">
      ${[30,25,20,15,10,5,0].map(s=>`<text x="${X(s)}" y="30" text-anchor="middle">${s}</text><line x1="${X(s)}" x2="${X(s)}" y1="34" y2="72" stroke="var(--line)"/>`).join("")}${segs}
      <line x1="${X(now)}" x2="${X(now)}" y1="34" y2="78" stroke="#0B2A45" stroke-width="2"/><text x="${X(now)}" y="96" text-anchor="middle" style="font-weight:700">${now.toFixed(1)}s</text></svg>`;
    let res="";
    if(R&&!R.playing){const tot=p.cp+p.climb,best=25;
      if(won)res=winHtml(`<span class="mono">${p.cyc}</span> סייקלים ועוד טיפוס: <span class="mono">${tot}</span> נקודות, גם כשהטיפוס הכי איטי.`)+`<p class="why">שני כללים: משאירים זמן לטיפוס במקרה הגרוע (לא הממוצע), ולא מתחילים סייקל שלא יספיק להיגמר. כל זמן בין <span class="mono">9</span> ל־<span class="mono">14</span> שניות לפני הסוף נותן את המקסימום. את המספרים האלה בונים מהסקאוטינג של הרובוט שלנו.</p>`;
      else res=errsHtml([{text:x<ST5.WORST?`<b>הטיפוס לא נגמר.</b> הפעם הוא לקח <span class="mono">9</span> שניות, ונשארו רק <span class="mono">${x}</span>. קיבלתם <span class="mono">${tot}</span> נקודות. משאירים זמן למקרה הגרוע.`:`<b>קיבלתם <span class="mono">${tot}</span> נקודות</b>, אבל היה אפשר <span class="mono">${best}</span>. עזבתם מוקדם מדי, והיה זמן לעוד סייקל.`}])}
    return headHtml(ST5,"")+`<div class="card simgrid">${svg}
      ${slider("x","מתחילים לטפס כשנשארו (שניות)",x,0,30,1,v=>v,(R&&R.playing)||won)}
      <p class="note" style="margin:0">הפס הכחול: סייקלים. הירוק או האדום: הטיפוס, לפי המקרה הגרוע של <span class="mono">9</span> שניות. אפור: זמן מת.</p>
      ${won?"":`<div class="row"><button class="btn" id="run" ${R&&R.playing?"disabled":""}>שחקו את הסוף</button></div>`}</div>${res}`},
  bind(){
    bindSlider("x",v=>v,v=>{G.x=+v;G.run=null});
    on("run",()=>{G.attempts++;const R={t:ST5.T,playing:true};G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.t=reduce?0:Math.max(0,ST5.T-t*10);
        if(R.t<=0){R.playing=false;const x=G.x;if(x>=9&&x<=14)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.x=10;G.run={t:0,playing:false};award(0,true);render()});
  }};

Object.assign(MODS,{s5:MOD_S5,mo4:MO4,me4:MOD_ME4,f4:MOD_F4,st5:ST5});

    <div class="tablebox"><table class="m"><thead><tr><th>תלמיד</th>${cols.map(c=>`<th>${c}</th>`).join("")}<th>XP</th><th>רישיון</th></tr></thead><tbody>
    ${rows.map((r,i)=>`<tr><td><b>${esc(r[0])}</b></td>${MISSIONS.map(m=>`<td>${cell(r[1][m.id])}</td>`).join("")}<td class="mono">${r[2]}</td>
      <td>${r[1][licId]==="p"?`<button class="btn small" data-lic="${i}">אשר רישיון</button>`:`<span class="note">${r[1][licId]?"אושר":"עוד לא"}</span>`}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note" style="margin:0">בגרסה האמיתית: נתונים מכל המכשירים, ייצוא לאקסל לסימון ב־AttendX, והוספת תלמיד עם קוד אישי.</p>
    <label class="row note" style="gap:8px"><input type="checkbox" id="allopen" ${S.all?"checked":""}> פתח את כל המשימות בכל העולמות (לבדיקה של מנטור)</label>
    <div class="row"><button class="btn ghost small" id="logout">החלף משתמש</button><button class="btn ghost small" id="reset">אפס את ההתקדמות שלי</button></div>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- global clicks ---------- */
app.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]");if(go){closeSheet();stopAnims();view=go.dataset.go;render();window.scrollTo(0,0);return}
  const wd=e.target.closest("[data-world]");if(wd){setWorld(wd.dataset.world);view="world";render();window.scrollTo(0,0);return}
  const mw=e.target.closest("[data-mw]");if(mw){setWorld(mw.dataset.mw);render();return}
  const pl=e.target.closest("[data-play]");if(pl&&!pl.disabled){const w=worldOf(pl.dataset.play);if(w){setWorld(w);const m=MISSIONS.find(x=>x.id===pl.dataset.play);if(m&&m.play){stopAnims();startGame(m.id)}}return}
  if(e.target.id==="allopen"){S.all=e.target.checked;save();return}
  const lic=e.target.closest("[data-lic]");if(lic){lic.outerHTML='<span class="pill p-done">אושר</span>';toast("הרישיון אושר (בתצוגה בלבד)");return}
  if(e.target.id==="logout"){S.user=null;save();view="home";render();return}
  if(e.target.id==="reset"){if(e.target.dataset.sure){S={user:S.user,xp:0,m:{}};save();render();toast("ההתקדמות אופסה")}else{e.target.dataset.sure="1";e.target.textContent="בטוח? לחץ שוב לאיפוס"}}
});
/* count a failed check as an attempt for the mentor view */
const _check=check;
check=function(){_check();if(G.phase!=="win")recordAttempt()};
setWorld("shop");
render();
</script>

</body></html>
