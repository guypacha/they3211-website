/* ---------- shared engines for the new worlds ----------
   makeQuiz  : scenario cards (picture + question, one or more pick groups). The answer shows only after "Check".
   makeOrder : put steps in the right order, then watch it built.
   makeMatch : label pictures with names.
   Every engine returns a module {title,goal,init,view,bind} for MODS. */
const pic=(name,cls)=>{const p=PARTS[name];return `<svg class="${cls||"partpic"}" viewBox="${p.vb}" aria-hidden="true">${p.s}</svg>`};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const keyAct=(el,f)=>{el.addEventListener("click",f);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}})};
const starsByMiss=m=>m===0?3:m<=2?2:1;
function loopAnim(fn){ // requestAnimationFrame loop that stops when the view changes
  let alive=true,t0=performance.now();const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const step=now=>{if(!alive)return;const r=fn((now-t0)/1000,reduce);if(r===false){alive=false;return}requestAnimationFrame(step)};
  requestAnimationFrame(step);const stop=()=>{alive=false};ANIMS.push(stop);return stop;
}

function makeQuiz(id,o){
  const Q={id,title:o.title,goal:o.goal,
    init(){G.order=o.shuffle===false?o.items.map((_,i)=>i):shuffle(o.items.map((_,i)=>i));G.perm=o.items.map(it=>Q.groups(it).map(g=>it.fixed?g.o.map((_,i)=>i):shuffle(g.o.map((_,i)=>i))));G.i=0;G.pick={};G.checked=false;G.score=0;G.miss=0;G.done=false;G.log=[]},
    item(){return o.items[G.order[G.i]]},
    groups(it){return it.groups||[{label:"",o:it.o,a:it.a}]},
    okGroup(g,p){return Array.isArray(g.a)?g.a.includes(p):g.a===p},
    isOk(it){const gs=Q.groups(it);if(it.ok)return it.ok(gs.map((g,k)=>G.pick[k]));return gs.every((g,k)=>Q.okGroup(g,G.pick[k]))},
    view(){
      const n=o.items.length,pass=o.pass==null?Math.ceil(n*0.7):o.pass;
      if(G.done){
        const good=G.score>=pass;
        return headHtml(Q,"")+(good?winHtml(`<b class="mono">${G.score}/${n}</b> correct. ${o.winText||""}`)+(o.lesson?`<p class="why">${o.lesson}</p>`:"")
          :`<div class="result"><div class="err"><span class="ic">!</span><p><b class="mono">${G.score}/${n}</b>. needs ${pass} to pass. Read the explanations again and retry; the order changes.</p></div>
          <div class="row"><button class="btn" data-play="${id}">Try again</button><button class="btn ghost" data-go="world">To the mission path</button></div></div>`);
      }
      const it=Q.item(),gs=Q.groups(it),ok=G.checked&&Q.isOk(it);
      const art=it.art?(typeof it.art==="function"?it.art(G.checked,ok):it.art):"";
      return headHtml(Q,o.note||"")+`<div class="card qcard">
        <span class="qcount">${it.tag?it.tag+" · ":""}${G.i+1} of ${n} · Correct so far: ${G.score}</span>
        ${art?`<div class="art">${art}</div>`:""}<h3 style="font-size:19px">${it.q}</h3>
        ${gs.map((g,k)=>`<div>${g.label?`<p class="glabel">${g.label}</p>`:""}<div class="opts ${g.cols?"three":""}">${G.perm[G.order[G.i]][k].map(i=>{const x=g.o[i];
          const txt=typeof x==="string"?x:x.t,sub=typeof x==="string"?"":x.s||"";
          const cls=G.checked?(Q.okGroup(g,i)&&!it.ok?"ok":(i===G.pick[k]?(ok?"ok":"no"):"")):"";
          return `<button class="opt ${cls}" data-g="${k}" data-o="${i}" aria-pressed="${G.pick[k]===i}" ${G.checked?"disabled":""}><b>${txt}</b>${sub?`<small>${sub}</small>`:""}</button>`}).join("")}</div></div>`).join("")}
        ${G.checked?`<p class="why">${ok?"<b>Correct.</b> ":"<b>Not quite.</b> "}${it.w}</p>`:""}
        <div class="row">${G.checked?`<button class="btn" id="next">${G.i<n-1?"Next":"To the result"}</button>`:`<button class="btn" id="chk" ${gs.every((g,k)=>G.pick[k]!=null)?"":"disabled"}>Check</button>`}</div></div>`;
    },
    bind(){
      app.querySelectorAll(".qcard [data-o]").forEach(b=>b.onclick=()=>{if(G.checked)return;G.pick[+b.dataset.g]=+b.dataset.o;render()});
      on("chk",()=>{G.checked=true;const ok=Q.isOk(Q.item());if(ok)G.score++;else G.miss++;render()});
      on("next",()=>{const n=o.items.length;if(G.i<n-1){G.i++;G.pick={};G.checked=false;render();window.scrollTo(0,0);return}
        G.done=true;G.attempts=1;const pass=o.pass==null?Math.ceil(n*0.7):o.pass;
        if(G.score>=pass)award(starsByMiss(G.miss),false);else failAttempt();render();window.scrollTo(0,0)});
      if(o.bindArt)o.bindArt();
    }};
  return Q;
}

/* order: tap the steps in order to fill the slots; tap a placed step to take it back */
/* pointer drag for order steps: works with mouse and touch; a press without movement counts as a tap */
function dragSteps(onDrop,onTap){
  app.querySelectorAll("[data-drag]").forEach(el=>{
    if(el.disabled)return;
    el.addEventListener("click",e=>e.preventDefault());
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onTap(el.dataset.drag)}});
    el.addEventListener("pointerdown",e=>{
      if(e.button>0)return;const src=el.dataset.drag,x0=e.clientX,y0=e.clientY;let ghost=null,over=null,raf=0,lastY=y0;
      try{el.setPointerCapture(e.pointerId)}catch(_){}
      const target=(x,y)=>{const t=document.elementFromPoint(x,y);if(!t)return null;const s=t.closest("[data-slot]");if(s)return s;return t.closest("[data-bank]")};
      const scroll=()=>{if(!ghost)return;if(lastY<70)window.scrollBy(0,-10);else if(lastY>innerHeight-70)window.scrollBy(0,10);raf=requestAnimationFrame(scroll)};
      const move=ev=>{lastY=ev.clientY;
        if(!ghost){if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<8)return;const r=el.getBoundingClientRect();ghost=el.cloneNode(true);ghost.classList.add("dragghost");ghost.style.width=r.width+"px";ghost.dataset.dx=x0-r.left;ghost.dataset.dy=y0-r.top;document.body.appendChild(ghost);el.classList.add("dragsrc");raf=requestAnimationFrame(scroll)}
        ghost.style.left=(ev.clientX-ghost.dataset.dx)+"px";ghost.style.top=(ev.clientY-ghost.dataset.dy)+"px";
        const t=target(ev.clientX,ev.clientY);if(t!==over){if(over)over.classList.remove("dropover");over=t;if(t)t.classList.add("dropover")}};
      const up=ev=>{el.removeEventListener("pointermove",move);el.removeEventListener("pointerup",up);el.removeEventListener("pointercancel",up);cancelAnimationFrame(raf);
        if(!ghost){if(ev.type==="pointerup")onTap(src);return}
        ghost.remove();el.classList.remove("dragsrc");if(over)over.classList.remove("dropover");
        const t=ev.type==="pointerup"?target(ev.clientX,ev.clientY):null;
        if(t&&t.dataset.slot!=null)onDrop(src,{slot:+t.dataset.slot});else if(t&&t.dataset.bank)onDrop(src,{bank:true});else render()};
      el.addEventListener("pointermove",move);el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
    });
  });
}
function makeOrder(id,o){
  const M={id,title:o.title,goal:o.goal,
    init(){G.r=0;M.reset()},
    reset(){const R=o.rounds[G.r];G.bank=shuffle(R.items.map(x=>x.id));while(G.bank.join()===R.answer.join())G.bank=shuffle(G.bank);G.placed=R.items.map(()=>null);G.res=null;G.anim=0},
    R(){return o.rounds[G.r]},
    view(){
      const R=M.R(),byId=k=>R.items.find(x=>x.id===k),full=G.placed.every(Boolean),lock=G.phase==="win"||(G.res&&G.res.all),nextEmpty=G.placed.indexOf(null);
      const slots=R.items.map((_,i)=>{const k=G.placed[i],x=k&&byId(k),st=G.res?(G.res[i]?"ok":"no"):"";
        return `<li class="slot ${k?"fill":""} ${st}" data-slot="${i}">${k?`<button class="stepbtn" data-back="${i}" data-drag="s:${i}" ${lock?"disabled":""}><span class="num mono">${i+1}</span><span><b>${x.t}</b>${x.s?`<small>${x.s}</small>`:""}</span>${lock?"":`<span class="grip" aria-hidden="true">⠿</span>`}</button>`:`<span class="num mono">${i+1}</span><span class="muted">${i===nextEmpty?"Drag a step here":""}</span>`}</li>`}).join("");
      const bank=G.bank.filter(k=>!G.placed.includes(k)).map(k=>{const x=byId(k);return `<button class="stepbtn bankbtn" data-add="${k}" data-drag="b:${k}"><span><b>${x.t}</b>${x.s?`<small>${x.s}</small>`:""}</span><span class="grip" aria-hidden="true">⠿</span></button>`}).join("");
      let res="";
      if(G.res&&!G.res.all)res=`<div class="result"><div class="err"><span class="ic">!</span><p>${G.res.n} of ${R.items.length} in the right place (marked in green). ${G.res.tip||""}</p></div>
        ${G.attempts>=2?`<button class="btn ghost small" id="solve" style="align-self:flex-start">Show the order (no stars)</button>`:""}</div>`;
      if(G.res&&G.res.all){
        const last=G.r===o.rounds.length-1;
        res=last&&G.phase==="win"?winHtml(o.winText||"")+(o.lesson?`<p class="why">${o.lesson}</p>`:""):
          `<div class="win"><h3>${G.shown?"That’s the order":"Correct!"}</h3><p style="margin:0">${R.why||""}</p><div class="row"><button class="btn" id="nextr">Next stage</button></div></div>`;
      }
      return headHtml(M,o.note||"Drag each step to its place. Dragging a step onto another step swaps them. You can also tap: tapping a step in the list puts it in the next empty slot, and tapping a placed step sends it back.")+
        `<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="qcount">Stage ${G.r+1} of ${o.rounds.length}</span><h3 style="font-size:19px">${R.q}</h3>
        ${R.art?`<div class="art orderart">${R.art(G)}</div>`:""}
        <ol class="slots">${slots}</ol>${!lock?`<div class="bank" data-bank="1">${bank||`<span class="muted" style="font-size:13px">All steps are placed. Drag a step onto another to swap them, or down here to take it out.</span>`}</div>`:""}
        ${!G.res||!G.res.all?`<div class="row"><button class="btn" id="chk" ${full?"":"disabled"}>Check order</button><button class="btn ghost small" id="clear">Start over</button></div>`:""}</div>${res}`;
    },
    bind(){
      const tapAdd=k=>{const i=G.placed.indexOf(null);if(i>=0){G.placed[i]=k;G.res=null;render()}};
      const tapBack=i=>{G.placed[i]=null;G.res=null;render()};
      dragSteps((src,dst)=>{ // src "b:id" or "s:i"; dst {slot:i} or {bank:true}
        const [t,v]=src.split(":");
        if(dst.bank){if(t==="s")G.placed[+v]=null}
        else{const j=dst.slot;if(t==="b"){G.placed[j]=v}else{const i=+v;if(i===j)return;[G.placed[i],G.placed[j]]=[G.placed[j],G.placed[i]]}}
        G.res=null;render()},(src)=>{const [t,v]=src.split(":");if(t==="b")tapAdd(v);else tapBack(+v)});
      on("clear",()=>{G.placed=M.R().items.map(()=>null);G.res=null;render()});
      on("chk",()=>{const R=M.R();G.attempts++;const T_=k=>R.items.find(x=>x.id===k).t,ok=G.placed.map((k,i)=>T_(R.answer[i])===T_(k)),n=ok.filter(Boolean).length;
        G.res=Object.assign(ok,{n,all:n===R.items.length,tip:R.tip?R.tip(G.placed):""});
        if(G.res.all){M.done()}else failAttempt();render();M.playArt();scrollTo_(G.res.all?".win":".result")});
      on("solve",()=>{const R=M.R();G.placed=R.answer.slice();G.res=Object.assign(R.answer.map(()=>true),{n:R.answer.length,all:true});G.shown=true;M.done(true);render();M.playArt()});
      on("nextr",()=>{G.r++;M.reset();render();window.scrollTo(0,0)});
      if(G.res&&G.res.all)M.playArt(true);
    },
    done(shown){if(G.r===o.rounds.length-1){const st=G.shown||shown?0:starsFor(G.attempts-(o.rounds.length-1),false);award(st,!!(G.shown||shown))}},
    playArt(still){const R=M.R();if(R.animate&&G.res&&G.res.all)R.animate(still)}
  };
  return M;
}

/* match: tap a picture, then a name. Names include decoys. */
function makeMatch(id,o){
  const M={id,title:o.title,goal:o.goal,
    init(){G.lab={};G.sel=null;G.res=null;G.names=shuffle(o.items.map(x=>x.name).concat(o.decoys||[]))},
    view(){
      const tiles=o.items.map(x=>{const st=G.res?(G.res[x.id]?"ok":"no"):"";const l=G.lab[x.id];
        return `<button class="mtile ${G.sel===x.id?"sel":""} ${st}" data-tile="${x.id}" data-slot="${o.items.indexOf(x)}" aria-pressed="${G.sel===x.id}" ${G.phase==="win"?"disabled":""}>
          <span class="partbox">${x.art?x.art:pic(x.pic)}</span><span class="mlabel">${l?`<b>${l}</b>`:`<span class="muted">?</span>`}</span>
          ${G.phase==="win"||G.shown?`<small class="role">${x.role}</small>`:""}</button>`}).join("");
      const used=Object.values(G.lab);
      const names=G.names.map((n,i)=>`<button class="chip namechip" data-name="${n}" data-drag="n:${i}" ${G.phase==="win"?"disabled":""} aria-pressed="${used.includes(n)}">${n}${G.phase==="win"?"":`<span class="grip" aria-hidden="true">⠿</span>`}</button>`).join("");
      let res="";
      if(G.phase==="win")res=winHtml(o.winText||"")+(o.lesson?`<p class="why">${o.lesson}</p>`:"");
      else if(G.res){const bad=o.items.filter(x=>!G.res[x.id]).length;res=`<div class="result"><div class="err"><span class="ic">!</span><p>${bad===1?"One name is wrong":bad+" names are wrong"} (marked in red). Watch out for names that don’t belong to any picture.</p></div>
        ${G.attempts>=2?`<button class="btn ghost small" id="solve" style="align-self:flex-start">Show answers (no stars)</button>`:""}</div>`}
      const scene=o.scene?`<div class="card scenecard">${o.scene(G)}<p class="note" style="margin:0">${G.phase==="win"?"This is where every part sits in the arm.":"Every name you give also shows up on the arm. Tap a part on the arm to pick its picture."}</p></div>`:"";
      return headHtml(M,"Drag a name onto its picture, or tap a picture and then a name. Dragging another name onto a picture replaces it.")+scene+
        `<div class="card namebar ${G.phase==="win"?"":"sticky"}"><p class="glabel" style="margin:0">${G.sel?"Which name fits the picture you picked?":"Drag a name to a picture"}</p><div class="chips">${names}</div></div><div class="mgrid">${tiles}</div>
        ${G.phase!=="win"?`<div class="row"><button class="btn" id="chk" ${Object.keys(G.lab).length===o.items.length?"":"disabled"}>Check</button></div>`:""}${res}`;
    },
    bind(){
      app.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{G.sel=G.sel===b.dataset.tile?null:b.dataset.tile;render()});
      const put=(tid,n)=>{Object.keys(G.lab).forEach(k=>{if(G.lab[k]===n)delete G.lab[k]});G.lab[tid]=n;G.lastLab=tid;G.res=null};
      app.querySelectorAll("[data-pick]").forEach(b=>b.addEventListener("click",()=>{if(G.phase==="win")return;G.sel=b.dataset.pick;render()}));
      if(G.phase!=="win")dragSteps((src,t)=>{const n=G.names[+src.slice(2)];if(t.slot==null){render();return}
          const tid=o.items[t.slot].id;put(tid,n);G.sel=null;render()},
        src=>{const n=G.names[+src.slice(2)];if(!G.sel){const fr=app.querySelector(".mgrid");if(fr){fr.classList.remove("nudge");void fr.offsetWidth;fr.classList.add("nudge")}return}
          put(G.sel,n);const next=o.items.find(x=>!G.lab[x.id]);G.sel=next?next.id:null;render()});
      on("chk",()=>{G.attempts++;G.res={};o.items.forEach(x=>G.res[x.id]=G.lab[x.id]===x.name);
        if(o.items.every(x=>G.res[x.id]))award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(G.phase==="win"?".win":".result")});
      on("solve",()=>{o.items.forEach(x=>G.lab[x.id]=x.name);G.res={};o.items.forEach(x=>G.res[x.id]=true);award(0,true);render()});
    }};
  return M;
}

/* slider row used by the simulations */
const slider=(id,label,val,min,max,step,fmt,dis)=>`<div class="sl"><label for="${id}"><span>${label}</span><b class="mono" id="${id}-v">${fmt(val)}</b></label>
  <input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}" ${dis?"disabled":""}></div>`;
const bindSlider=(id,fmt,set,live)=>{const el=document.getElementById(id);if(!el)return;
  el.addEventListener("input",()=>{set(+el.value);const v=document.getElementById(id+"-v");if(v)v.textContent=fmt(+el.value);if(live)live()});
  el.addEventListener("change",()=>{if(!live)render()})};

  /* ---- electrical ---- */
  m1:[{h:"The main path",p:`All of the robot’s current leaves the battery, goes through the main breaker and reaches the PDH, which splits it to every device. From there it returns on the black wire to the battery. There’s no other way.`,art:L_ART.power},

    {h:"Two wires",p:`Yellow (CAN High) and green (CAN Low). Always yellow to yellow and green to green. If you swap them, devices from that point on don’t talk.`},
    {h:"A chain, not a star",p:`Each device has one pair of wires coming in and one going out. You start at the roboRIO, go from device to device, and continue to the end. You don’t split into two directions. If the chain breaks in the middle, everything after the break disappears from the Driver Station.`},
    {h:"A resistor at each end",p:`Each end of the chain needs a ${M_("120Ω")} resistor between yellow and green. The roboRIO has one built in, so it’s one end. At the other end you put a resistor, or a device with a built-in resistor switched on (per its documentation).`},
    {h:"Setting ID",p:`Every controller comes from the factory with ${M_("ID 0")}. Before connecting, each one gets its own number in the maker’s software: Phoenix Tuner X for Kraken and TalonFX, or REV Hardware Client for SPARK MAX. The same number goes in the code, ${M_("new TalonFX(1)")}, and on a sticker on the motor. Two motors of the same type with the same ID conflict.`},
    {h:"Our convention",p:`Each system gets ten numbers of its own: drive ${M_("0–9")}, Intake ${M_("10–19")}, Arm ${M_("20–29")}, and so on for the next systems. When you see ${M_("ID 23")} in a log or the Driver Station, you know right away it’s an arm motor.`},
    {h:"What you need",p:`CAN wires (a twisted yellow and green pair), connectors the team uses, and a ${M_("120Ω")} for the end.`}],
  insp:[{h:"What inspection is",p:`Before you’re allowed on the field, an inspector checks the robot against the manual. A robot that fails inspection doesn’t play.`},
    {h:"What’s checked on the electrical board",p:`A secured battery that doesn’t move. A main breaker that’s easy to reach. Correct colors. Wire gauge that matches the fuse. No exposed copper. An RSL light visible from outside.`},
    {h:"The <bdi>RSL - Robot Status Light</bdi>",p:`An orange light. When the robot is on it’s solid, and when it’s Enabled it blinks. Blinking = the robot can move, so step back.`},
    {h:"How to search",p:`Go in order, one by one, and ask about each thing: what does the manual say about it? Not everything that looks odd is a fault.`}],
  batt:[{h:"Voltage drops when you draw current",p:`Every battery has a small internal resistance. When the motors draw a lot of current, the voltage the robot gets drops. An old or uncharged battery drops more.`,art:L_ART.sag},
    {h:"Brownout",p:`When the voltage drops too low, the roboRIO cuts the motors so it doesn’t shut itself off. Mid-push that means the robot just stops.`},
    {h:"Current limit",p:`A current limit on the drive motors keeps them from drawing too much. A bit less force, but the robot doesn’t cut out.`},
    {h:"The battery cart",p:`On each battery write when it was charged, and test it. For a quarterfinal take a charged, healthy battery, not whatever is left.`}],
  ecrimp:[{h:"Crimping",p:`Crimping squeezes a metal connector onto the wire with a special tool. On a robot you don’t twist wires together or solder the ends, because vibration breaks them.`},
    {h:"A connector for every place",p:`SB50 for the battery. Ring lugs for screws. Ferrules for PDH connections. Powerpole for connections you unplug in the pit.`},
    {h:"A good crimp",p:`Strip exactly the connector’s length, use the crimper slot that matches the wire gauge, and finally pull hard. Whatever comes out by hand would have come out in a match too.`}],
  eroute:[{h:"Why routing matters",p:`Most electrical failures at competition are a wire that tore, wore through or got caught. Good routing prevents them before they happen.`},
    {h:"Four rules",p:`Tie down along the way with zip ties. Keep away from what spins (wheels, chains). Leave a loop at every moving joint. And protect the wire at every pass through sheet metal, with a grommet.`},
    {h:"Near a connector",p:`A zip tie close to the connector holds the wire’s weight, so vibration doesn’t tear the connector off.`}],
  efault:[{h:"From simple to complex",p:`When the robot won’t move, check the simple things first: battery, breaker, radio. Only then code and CAN.`},
    {h:"The Driver Station",p:`Three lights at the top: Communications (there’s a link to the robot), Robot Code (the code is running), Joysticks (the joystick is connected). The first red light tells you where to look.`},
    {h:"Lights on the robot",p:`RSL blinking = Enabled. Lights on the controllers tell you whether they have CAN and are getting commands. The meaning of each color is in the controller’s documentation.`}],
  /* ---- shop ---- */
  s1:[{h:"The arm’s parts",p:`A hex shaft transfers rotation without slipping. A bearing lets it spin inside the wood without friction. The hub connects the shaft to the arm. A shaft collar keeps the shaft from sliding sideways.`},
    {h:"Why hex",p:`A round shaft spins inside the hole. A hex shaft locks whatever is on it, so a wheel or arm turns with it.`},
    {h:"How to learn a part",p:`Look at the shape and ask: what does it hold, and what does it let move?`}],
  s2:[{h:"Assembly order",p:`Build from the base outward: first the frame, then the holes, the bearings, and finally the shaft and the arm. A step you skip means taking everything apart later.`},
    {h:"The order on the shaft",p:`Parts slide onto the shaft one after another. Whatever sits in the middle must go on before what’s at the ends, and the collar goes on last and closes it.`}],
  s3:[{h:"A tool for every job",p:`A Forstner bit makes a flat, clean hole the size of a bearing. A countersink makes room for a screw head. A saw or jigsaw cuts. A rubber mallet seats tight parts without breaking them.`},
    {h:"Works versus safe",p:`Sometimes several ways work, but only one is safe. Pick the safe one, even if it takes another minute: clamp before drilling, and don’t hold it by hand.`}],
  s4:[{h:"Degrees of freedom",p:`Every joint that rotates or slides gives the tip of the arm one degree of freedom: one more direction it can move in.`,art:L_ART.dof},
    {h:"How many you need",p:`To reach a point in a plane you need two degrees of freedom. If the angle of the tip matters too, you need three.`},
    {h:"Less is more",p:`Every joint adds weight, a motor, code and a place to fail. Build with the fewest joints that do the job.`}],
  s5:[{h:"Workshop rules",p:`Safety glasses at all times. Nothing dangling near a spinning tool: hair tied back, sleeves rolled up, no gloves. Small parts always in a vise. Hands out of the cut line.`},
    {h:"After work",p:`Clean chips with a brush, not your hand and not by blowing. Every tool goes back in its place. A damaged battery is taken out of use and you tell a mentor.`}],
  /* ---- motors ---- */
  mo1:[{h:"Gear ratio",p:`A small gear turns a big gear. The big one turns slower, but with more force (torque). The ratio is the big gear’s tooth count divided by the small one’s.`,art:L_ART.gears},
    {h:"Drive",p:`Small ratio = fast but accelerates slowly and pushes weakly. Big ratio = accelerates quickly and pushes hard, but top speed is low. Look for the middle that fits the field.`},
    {h:"Arm",p:`An arm needs lots of torque to lift weight, so its ratio is much bigger than the drive’s. Too big, and the arm crawls.`},
    {h:"Current limit",p:`A current limit caps the motor’s torque. With a limit, the ratio has to do more of the work.`}],
  mo2:[{h:"Two currents",p:`Supply current is what leaves the battery for the controller. Stator current is what flows inside the motor and makes the force. At low speed, stator current can be much bigger than supply current.`},
    {h:"Stator limit",p:`Limits the motor’s force. Helps keep the wheels from slipping and the motor from heating up.`},
    {h:"Supply limit",p:`Limits how much the robot draws from the battery. Protects against brownouts and tripped breakers.`}],
  mo3:[{h:"Where heat comes from",p:`Heat in a motor grows with the current squared (${M_("I²R")}). Twice the current = four times the heat.`},
    {h:"Holding is the hottest",p:`An arm held level against gravity draws current all the time, even when it isn’t moving. That’s how a motor burns out without anyone noticing.`},
    {h:"What helps",p:`Waiting between cycles, supporting the arm mechanically (a spring or counterweight), and limiting current. Each lowers the heat in a different way.`}],
  mo4:[{h:"Stages",p:`When you need a big ratio, split it into several stages. The total ratio is the product of all the stages: ${M_("5 × 4 × 5 = 100")}.`},
    {h:"Three kinds",p:`A planetary gearbox is compact and gives a fixed ratio (${M_("3:1")}, ${M_("4:1")}, ${M_("5:1")}). A gear pair: big over small. Chain: the big sprocket over the small one.`},
    {h:"Why not one stage",p:`A ratio of ${M_("100:1")} in one stage needs a giant gear. Several small stages fit in the robot.`}],
  /* ---- mechanical ---- */
  me1:[{h:"A broken mechanism",p:`Most mechanical failures repeat: a loose chain that jumps, an axle supported on one side only that bends, a rope rigged wrong, and an intake that squeezes the game piece too lightly.`},
    {h:"Diagnose before fixing",p:`First understand what happened and why, and only then fix. A fix without a diagnosis brings the same failure back next match.`}],
  me2:[{h:"How a shooter works",p:`A fast wheel (flywheel) throws the ball. The wheel speed sets how far it flies, and the angle sets how high.`},
    {h:"Enter from above",p:`A ball that goes in while already falling goes in more easily and bounces out less.`},
    {h:"Shooting table",p:`For each distance find a speed and angle that work and save them in a table. In a match the robot measures distance and takes values from the table.`}],
  me3:[{h:"Cascade elevator",p:`An elevator with several stages that nest inside each other. When the first stage rises, the rope also pulls the carriage, so the carriage rises faster than the stage.`},
    {h:"How to rig the rope",p:`Each stage’s rope is anchored to the stage below it, runs over a pulley at the top of the current stage, and attaches to the stage above it.`}],
  me4:[{h:"Pick from the task",p:`Where you need to reach: height, side, distance. How fast. What happens when the robot is disabled. Then pick the simplest thing that does it.`},
    {h:"The mechanisms",p:`An elevator goes straight up. A pivot arm reaches several heights and sides. A shooter throws from a distance. A wide intake collects fast. A hook with a ratchet holds the climb. A belt carries rotation easily to a far place.`}],
  /* ---- FDM ---- */
  f1:[{h:"What gives strength",p:`Walls give the most strength. Infill helps less than you’d think, and adds a lot of time.`},
    {h:"Orientation",p:`A printed part is strong along the layers and weak between them. Lay it so the force doesn’t peel one layer off another.`,art:L_ART.layers},
    {h:"Material and heat",p:`PLA softens at around${M_("55°C")}. Next to a hot motor pick PETG or a material that handles more heat (ABS, ASA, nylon).`}],
  f2:[{h:"Common failures",p:`Warped corners (warping): heat and bed adhesion. Thin strings between parts (stringing): retraction or wet filament. Thin walls or gaps: under-extrusion, a clog. Spaghetti: the part came off the bed.`},
    {h:"One change",p:`Change one thing at a time. That way you know what fixed it.`}],
  f3:[{h:"Printers in the workshop",p:`Bambu X1E and X1C are enclosed and hold heat, good for ABS, ASA and nylon. The P1S is enclosed, for most prints. The H2D is large with two nozzles. The Markforged prints Onyx with fiber for extra-strong parts.`},
    {h:"Materials",p:`PLA: easy to print, not for heat. PETG: stronger and more flexible. ABS and ASA: handle heat, need an enclosed printer. Nylon and fiber: the strongest, need a suitable printer and drying.`}],
  f4:[{h:"Strong in one direction",p:`Each layer is bonded to the one below it, and the bond is the weak part. Along the layer the part is strong, and between layers it tears.`,art:L_ART.layers},
    {h:"How to pick an orientation",p:`Ask: where does the force pull? Then rotate the part so the force runs along the layers. After that check that it doesn’t need lots of supports.`}],
  /* ---- strategy ---- */
  st1:[{h:"The manual",p:`The manual is the game’s rules. Every question at competition is answered from it, not from “I heard that...”.`},
    {h:"How it’s organized",p:`The rules are split into sections by topic, and every rule has a number. Game rules start with one letter, and robot rules with another. Search for a word (text search), and quote the rule number.`}],
  st2:[{h:"Expected points",p:`Expected points = points × chance of success. A task worth a lot that rarely succeeds can be worth less than a simple one.`},
    {h:"Points per second",p:`In teleop you repeat a cycle. Compare cycles by expected points per second, not just by how much each is worth.`,art:L_ART.cycle}],
  st3:[{h:"Scouting",p:`A scout watches robots and records what they do. That’s what the alliance pick list is built from.`},
    {h:"Count correctly",p:`Count only what actually scored, not attempts. Focus, and tap right when it happens.`}],
  st4:[{h:"Alliance selection",p:`At the end of the rankings, the top eight teams pick partners. Picks go 1 to 8, then come back from 8 to 1 (snake).`},
    {h:"Pick smart",p:`You don’t always take whoever scores the most. Think about who will still be there next round, and who fills what we’re missing.`}],
  st5:[{h:"End of the match",p:`In the last seconds you decide when to stop cycling and go climb. A cycle that doesn’t finish is worth zero, and so is a climb that doesn’t finish.`,art:L_ART.cycle},
    {h:"The worst case",p:`Leave time for the slowest climb we’ve seen, not the average. Take the numbers from scouting our own robot.`}],
  /* ---- programming ---- */
  p1:[{h:"A motor in code",p:`Every motor in code is an object with its ID number: ${M_("new TalonFX(3)")}. If the number doesn’t match the real motor, the code moves a different motor.`},
    {h:"Inverted",p:`On one side of the robot the motors are mounted as a mirror image. So that all the wheels drive forward together, you invert that side in code.`},
    {h:"Brake or Coast",p:`When the motor gets no command: Brake stops it, Coast spins freely. An arm that has to stay in place needs Brake.`}],
  p2:[{h:"Position control",p:`You want the arm to reach a certain angle and stay there. The code calculates at every moment how many volts to give the motor. In the graph: red is kP only, which overshoots and shakes. Blue is kP with kG and kD, which settles smoothly on the target.`,art:L_ART.pid},
    {h:"Three parts",p:`kP: pushes by how far from the target. kD: brakes by how fast it’s moving. kG: holds the arm’s weight against gravity, even when it’s already on target.`},
    {h:"Tuning order",p:`First kG until the arm almost holds itself. Then kP until it gets there fast. And finally kD so it doesn’t overshoot.`}],
  p3:[{h:"Commands",p:`In autonomous the robot runs a list of commands: drive, lift, collect, score. Each command runs until it finishes.`},
    {h:"In sequence or in parallel",p:`Commands that depend on each other run in sequence. Commands that don’t depend on each other can run in parallel and save time. In WPILib these are ${M_("sequence")} and${M_("parallel")}.`}],
  p4:[{h:"How to debug",p:`Read the log down to the first line that’s from our code. Reproduce the bug. Change one thing, and check again.`},
    {h:"Common bugs in Java",p:`An object that was never created (NullPointerException). Dividing two integers. A wait that stalls the robot’s loop. Units different from what we thought.`}]
};
function learnView(){
  const cards=LEARN[G.id],title=(MODS[G.id]||LEVELS[G.id]||{}).title||"";
  return `<section class="gamehead"><div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 280px">
    <button class="btn ghost small" data-go="world" style="align-self:flex-start">← Mission path</button>
    <span class="eyebrow">Before the mission · ${WN().name}</span><h2>${title}: what you need to know</h2></div></section>
    <div class="learn">${cards.map((c,i)=>`<article class="card lcard"><h3><span class="lnum mono">${i+1}</span><span>${c.h}</span></h3><p>${c.p}</p>${c.art?`<div class="lart">${c.art}</div>`:""}</article>`).join("")}</div>
    <div class="row"><button class="btn" id="learned">Got it, to the task →</button></div>`;
}

}

/* front view of the shaft stack: draws the parts in the order the player placed them */
function shaftStack(Gs){
  const map={s1:"bearing",s2:"collar",s3:"arm",s4:"collar",s5:"bearing",s6:"tight"};
  const R=Gs.placed.filter(Boolean).map(k=>map[k]);const n=R.length;
  const posts=`<rect x="30" y="40" width="40" height="190" fill="#E2B97F" stroke="#B47A3E" stroke-width="2"/><rect x="330" y="40" width="40" height="190" fill="#E2B97F" stroke="#B47A3E" stroke-width="2"/>
    <rect x="20" y="230" width="360" height="24" fill="#E2B97F" stroke="#B47A3E" stroke-width="2"/>`;
  // slots along the shaft: bearing L, collar, arm, collar, bearing R
  const xs=[50,105,200,295,350];let slot=0,svg="",shaftEnd=50,tight=false;
  R.forEach(p=>{if(p==="tight"){tight=true;return}const x=xs[Math.min(slot,4)];slot++;shaftEnd=Math.max(shaftEnd,x+20);
    if(p==="bearing")svg+=`<rect x="${x-14}" y="88" width="28" height="44" rx="4" fill="#BFC6CF" stroke="#7E8794" stroke-width="2"/><rect x="${x-18}" y="82" width="6" height="56" fill="#DDE2E8" stroke="#7E8794"/>`;
    if(p==="collar")svg+=`<rect x="${x-9}" y="92" width="18" height="36" rx="3" fill="#3A4250"/>${tight?`<rect x="${x-3}" y="82" width="6" height="10" fill="#BFC6CF"/>`:""}`;
    if(p==="arm")svg+=`<rect x="${x-14}" y="20" width="28" height="200" rx="5" fill="#EDCB97" stroke="#B47A3E" stroke-width="2"/><rect x="${x-22}" y="96" width="8" height="28" fill="#BFC6CF" stroke="#7E8794"/>`});
  const shaft=n?`<rect x="20" y="104" width="${Math.min(380,shaftEnd)-20}" height="12" fill="#9AA3AF" stroke="#7E8794" style="transition:width .4s"/>`:"";
  return `<svg class="sim" viewBox="0 0 400 260" aria-label="The shaft and the parts on it">${posts}${shaft}${svg}<text x="200" y="250" text-anchor="middle" style="font-size:11px;fill:var(--muted)">Front view: post, shaft, post</text></svg>`;
}

/* degrees of freedom: 3 links, joints can be locked */
const DOF={id:"s4",title:"Degrees of freedom",
  goal:"The tip of the arm has to reach the target. Pick how many joints to unlock, and move the arm. You only win with the fewest joints possible.",
  L:[120,90,40],B:{x:200,y:300},
  rounds:[
    {t:{x:200+250*Math.cos(Math.PI/3),y:300-250*Math.sin(Math.PI/3)},need:1,txt:"Target 1: the blue point."},
    {t:{x:300,y:180},need:2,txt:"Target 2: a point closer to the base."},
    {t:{x:280,y:200},dir:-90,need:3,txt:"Target 3: reach the point with the gripper pointing straight down, to pick a part up off the floor."}],
  init(){G.r=0;DOF.reset()},
  reset(){G.n=1;G.a=[90,0,0];G.res=null},
  fk(){const B=DOF.B,L=DOF.L;let x=B.x,y=B.y,th=0;const pts=[{x,y}];
    for(let i=0;i<3;i++){th+=(i<G.n?G.a[i]:0)*(i===0?1:1);x+=L[i]*Math.cos(th*Math.PI/180);y-=L[i]*Math.sin(th*Math.PI/180);pts.push({x,y})}
    return {pts,dir:th};},
  hit(){const R=DOF.rounds[G.r],{pts,dir}=DOF.fk(),p=pts[3],d=Math.hypot(p.x-R.t.x,p.y-R.t.y);
    let dd=0;if(R.dir!=null){dd=Math.abs(((dir-R.dir)%360+540)%360-180)}return {d,dd,ok:d<9&&dd<9}},
  svg(){
    const R=DOF.rounds[G.r],{pts,dir}=DOF.fk(),h=DOF.hit();
    const ring=G.r===0?`<circle cx="${DOF.B.x}" cy="${DOF.B.y}" r="250" fill="none" stroke="var(--line)" stroke-dasharray="4 6"/>`:"";
    const links=pts.slice(0,3).map((p,i)=>{const q=pts[i+1];const w=[16,12,8][i];
      return `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" stroke="${i===2?"#3A4250":"#E2B97F"}" stroke-width="${w}" stroke-linecap="round"/>`}).join("");
    const joints=pts.slice(0,3).map((p,i)=>i<G.n?`<circle cx="${p.x}" cy="${p.y}" r="9" fill="var(--accent)" stroke="#fff" stroke-width="2"/>`
      :`<g><circle cx="${p.x}" cy="${p.y}" r="8" fill="var(--muted)"/><rect x="${p.x-3}" y="${p.y-3}" width="6" height="6" fill="#fff"/></g>`).join("");
    const t=R.t,arrow=R.dir!=null?`<path d="M${t.x} ${t.y-40}V${t.y-8}M${t.x-6} ${t.y-16}L${t.x} ${t.y-6}L${t.x+6} ${t.y-16}" stroke="${h.ok?"var(--good)":"var(--accent)"}" stroke-width="3" fill="none"/>`:"";
    const tip=pts[3];
    return `<svg class="sim" id="dofsvg" viewBox="0 0 400 330" role="img" aria-label="An arm with ${G.n} joints">
      <rect x="0" y="310" width="400" height="20" fill="var(--panel)"/>${ring}
      <circle class="${h.ok?"":"pulse"}" cx="${t.x}" cy="${t.y}" r="${h.ok?13:10}" fill="${h.ok?"var(--good)":"var(--accent-2)"}" opacity=".85"/>${arrow}
      <rect x="${DOF.B.x-30}" y="296" width="60" height="16" rx="4" fill="var(--ink)"/>${links}${joints}
      <circle cx="${tip.x}" cy="${tip.y}" r="4" fill="var(--bad)"/></svg>
      <p class="note" style="margin:4px 0 0;${h.ok?"color:var(--good);font-weight:700":""}">${h.ok?"✓ The tip is on the target":`Distance from target: <span class="mono">${Math.round(h.d)}</span>${R.dir!=null?` · Angle off: <span class="mono">${Math.round(h.dd)}°</span>`:""}`}</p>`;
  },
  view(){
    const R=DOF.rounds[G.r];const fmt=v=>v+"°";
    const names=["Shoulder joint","Elbow joint","Wrist joint"];
    let res="";
    if(G.res==="more")res=`<div class="result"><div class="err w"><span class="ic">!</span><p><b>You got there, but with ${G.n} joints.</b> You can do it with fewer. Every joint on a robot is another motor, more weight, more code and one more thing that can break. Try locking a joint.</p></div></div>`;
    else if(G.res==="miss")res=`<div class="result"><div class="err"><span class="ic">!</span><p>The tip isn’t on the target yet. ${G.n<R.need?"Maybe the unlocked joints can’t reach there at all? Try unlocking another joint.":"Move it a bit more."}</p></div></div>`;
    else if(G.res==="ok")res=G.r<2?`<div class="win"><h3>Excellent!</h3><p style="margin:0">${["One joint is enough when the target is on the circle the tip draws. Any other point is out of reach.","With two joints the tip reaches any point in the ring between the short and long reach. But the gripper’s direction is decided for you."][G.r]}</p><div class="row"><button class="btn" id="nextr">Next target</button></div></div>`
      :winHtml("Three joints: position and direction.")+`<p class="why">Each joint adds one degree of freedom. To set a position in a plane you need two, and if direction matters too, you need three. On a robot we design with the fewest joints that do the job.</p>`;
    return headHtml(DOF,"")+`<div class="card" style="display:flex;flex-direction:column;gap:12px">
      <span class="qcount">Target ${G.r+1} of 3</span><p style="margin:0;font-weight:700">${R.txt}</p>
      <div class="row" role="group" aria-label="How many joints unlocked">${[1,2,3].map(n=>`<button class="chip txt" data-n="${n}" aria-pressed="${G.n===n}" ${G.phase==="win"||G.res==="ok"?"disabled":""}>${n} ${n===1?"joint":"joints"}</button>`).join("")}</div>
      <div id="dofwrap">${DOF.svg()}</div>
      <div class="simgrid">${[0,1,2].filter(i=>i<G.n).map(i=>slider("j"+i,names[i],G.a[i],i?-150:0,i?150:180,1,fmt,G.res==="ok")).join("")}</div>
      ${G.res!=="ok"?`<div class="row"><button class="btn" id="chk">Check</button></div>`:""}</div>${res}`;
  },
  bind(){
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{G.n=+b.dataset.n;G.res=null;render()});
    [0,1,2].forEach(i=>bindSlider("j"+i,v=>v+"°",v=>{G.a[i]=v;G.res=null},()=>{document.getElementById("dofwrap").innerHTML=DOF.svg();const r=app.querySelector(".result");if(r)r.remove()}));
    on("chk",()=>{const R=DOF.rounds[G.r],h=DOF.hit();G.attempts++;
      if(!h.ok)G.res="miss";else if(G.n>R.need)G.res="more";else{G.res="ok";if(G.r===2)award(starsFor(G.attempts-2,false),false)}
      if(G.res!=="ok")failAttempt();render();scrollTo_(".result,.win")});
    on("nextr",()=>{G.r++;DOF.reset();render();window.scrollTo(0,0)});
  }};

    RT(`<rect x="60" y="40" width="20" height="120" fill="#BFC6CF"/><rect x="80" y="90" width="220" height="16" fill="#0A6BB0" transform="rotate(-25 80 98)"/><path d="M90 140 L200 70" stroke="#C9302A" stroke-width="5" fill="none"/>`,"A wire pulled tight straight from the frame to the arm.",false,"When the arm rises the wire will stretch and rip out the connector. It needs a service loop around the pivot."),

    RT(`<rect x="100" y="70" width="120" height="50" rx="6" fill="#1C1F24"/><path d="M220 86 H360" stroke="#C9302A" stroke-width="5"/><path d="M220 104 H360" stroke="#1C1F24" stroke-width="5"/><rect x="250" y="80" width="6" height="30" fill="#3A4250"/>`,"Wires leaving a motor controller, with a zip tie close to the connector holding them.",true,"A zip tie by the connector takes the pull, so the connector doesn’t take the hit. That’s strain relief."),

/* fault finding from Driver Station + lights */

  ${[["Communications",comm],["Robot Code",code],["Joysticks",joy]].map((r,i)=>`<rect x="40" y="${58+i*26}" width="18" height="18" rx="3" fill="${r[1]?"#4CC98A":"#F2675F"}"/><text x="68" y="${72+i*26}" style="font-size:13px;fill:#E5EEF7;font-family:var(--f-mono)">${r[0]}</text>`).join("")}${extra||""}</svg>`;
const MOD_EFAULT=makeQuiz("efault",{title:"Fault detective",pass:5,
  goal:"Six real faults from the pit. For each one: what’s the most likely cause, based on what you see. Check from simple to complex.",
  items:[
    {art:DS(false,false,true),q:"All lights red except Joysticks. What do you check first?",o:["The link to the robot: is the radio on? Is the Ethernet cable plugged in? Is the robot even on?","The code","One motor"],a:0,w:"Without Communications you can’t know anything about the code. First radio power and the link, then everything else."},
    {art:DS(true,false,true),q:"Communications green, Robot Code red.",o:["The code isn’t running on the roboRIO: not deployed, or it crashed on startup","The radio is disconnected","The battery is empty"],a:0,w:"There’s a link, but no code. Redeploy the code and check the log for why it crashed."},
    {art:DS(true,true,true,`<text x="230" y="72" style="font-size:12px;fill:#F2B01E;font-family:var(--f-mono)">CAN: ID 3 not found</text>`),q:"Everything is green, but one motor won’t move, and the log says ID 3 can’t be found.",o:["Check that motor’s CAN connection and its ID","Swap the battery","Redeploy the code"],a:0,w:"One motor missing from CAN: a loose CAN connector, or a wrong ID on the controller. Start there."},
    {art:DS(true,true,true,`<text x="230" y="72" style="font-size:12px;fill:#F2B01E;font-family:var(--f-mono)">CAN: IDs 4,5,6 missing</text>`),q:"Three motors at the end of the CAN chain disappeared together.",o:["The break in the chain before the first missing motor","All three broke at the same moment","The code"],a:0,w:"When several devices in a row vanish, the chain broke at one point. Look for the connector between the last one that works and the first one that doesn’t."},
    {art:DS(true,true,true,`<path d="M230 120 l16 -40 l16 30 l16 -50 l16 60" stroke="#F2B01E" stroke-width="2" fill="none"/><text x="230" y="140" style="font-size:11px;fill:#F2B01E;font-family:var(--f-mono)">voltage dips</text>`),q:"When pushing the robot stutters, and the voltage graph shows sharp dips.",o:["Brownout: a weak battery or no current limit","A broken CAN chain","A loose joystick"],a:0,w:"This is exactly what we saw in the battery mission. Check the battery and add a current limit."},
    {art:`<svg viewBox="0 0 400 170" aria-hidden="true"><rect x="160" y="40" width="80" height="80" rx="12" fill="#F2A23B"><animate attributeName="opacity" values="1;.25;1" dur="0.8s" repeatCount="indefinite"/></rect><text x="200" y="146" text-anchor="middle" style="font-size:12px;fill:#5A6B7F">Blinking RSL light</text></svg>`,q:"The <bdi>RSL - Robot Status Light</bdi> is blinking. What does it mean?",o:["The robot is enabled, careful approaching","The robot is off","There’s a short"],a:0,w:"RSL Solid when the robot is on but not enabled, and blinking when it’s enabled. If it’s blinking, keep your hands out."}],

PATHS.motor=[
  {id:"mo1",play:true,title:"Gearbox builder",short:"Pick ratios for the drive and the arm, and see speed, force and current"},
  {id:"mo2",play:true,title:"Stator or supply?",short:"Tune two current limits: no slipping and no brownout"},
  {id:"mo3",play:true,title:"Hot motor",short:"Keep the arm motor cool until the end of the match"},
  {id:"molic",play:true,title:"Motors license test",short:"Ten questions, then a practical task a mentor signs off"}
];
/* Kraken X60 (trapezoidal): free 6000 rpm, stall 7.09 Nm, stall 366 A. Simplified DC motor model. */
const KR={wf:6000*2*Math.PI/60,ts:7.09,is:366,R:12/366};KR.kt=KR.ts/KR.is;
const ETA=0.9;
function armSim(Gr,Ls,o){ // arm lifted from horizontal (0) to vertical; returns time series
  o=Object.assign({mass:4,L:0.5,travel:Math.PI/2,tmax:1.2},o||{});const J=o.mass*o.L*o.L,dt=0.0005;
  let th=0,w=0,t=0,pk=0;const pts=[];let k=0;
  while(th<o.travel&&t<o.tmax){const s=w*Gr/KR.wf;let I=Math.max(0,KR.is*(1-s));I=Math.min(I,Ls);pk=Math.max(pk,I);
    const tq=KR.kt*I*Gr*ETA-o.mass*9.81*o.L*Math.cos(th);w+=tq/J*dt;if(w<0&&th<=0)w=0;th+=w*dt;t+=dt;if(k++%40===0)pts.push({t,th,I})}
  pts.push({t,th:Math.min(th,o.travel),I:0});
  return {t,ok:th>=o.travel,pts,hold:o.mass*9.81*o.L/(Gr*ETA*KR.kt)};
}
function driveSim(Gr,Ls){const r=0.0508,m=60,dt=0.001;let v=0,x=0,t=0;const pts=[];let k=0;
  while(x<8&&t<4){const s=v/r*Gr/KR.wf;let I=Math.min(Math.max(0,KR.is*(1-s)),Ls);let F=4*KR.kt*I*Gr*ETA/r;F=Math.min(F,1.1*m*9.81);v+=F/m*dt;x+=v*dt;t+=dt;if(k++%20===0)pts.push({t,x,v})}
  pts.push({t,x:8,v});return {t,pts,top:KR.wf/Gr*r*0.85,push:4*KR.kt*Ls*Gr*ETA/r};
}
const armSvg=(th,col,extra)=>{const cx=120,cy=190,L=150,x=cx+L*Math.cos(th),y=cy-L*Math.sin(th);
  return `<rect x="${cx-14}" y="${cy}" width="28" height="110" fill="var(--comp-edge)"/><rect x="${cx-70}" y="${cy+100}" width="140" height="14" rx="4" fill="var(--ink)"/>
  <line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${col||"#E2B97F"}" stroke-width="16" stroke-linecap="round"/>
  <circle cx="${x}" cy="${y}" r="14" fill="var(--accent)"/><circle cx="${cx}" cy="${cy}" r="10" fill="var(--ink)"/>${extra||""}`};

const MO1={id:"mo1",title:"Gearbox builder",
  goal:"Two stages. First a ratio for the robot’s drive, then a ratio for the arm. Same motor, Kraken X60, with a current limit.",
  driveR:[8.14,6.75,6.12,5.36],armR:[16,45,75,125,200],
  init(){G.r=0;G.g=null;G.res=null;G.run=null},
  view(){
    const A=G.r===1,opts=A?MO1.armR:MO1.driveR;
    const task=A?`An arm of <span class="mono">4</span> kg, length <span class="mono">0.5</span> m has to rise from level to vertical within <b class="mono">0.40</b> <b>s</b>. Current limit: <span class="mono">40A</span>.`
      :`The robot weighs <span class="mono">60</span> kg, wheels with diameter <span class="mono">4"</span>, Four motors limited to <span class="mono">60A</span>. It needs to cross <b class="mono">8</b> <b>m</b> within <b class="mono">2.0</b> <b>s</b>, and also push with a force of at least <b class="mono">500N</b>.`;
    const R=G.run;let art;
    if(!A){const x=R?R.pts[Math.min(R.k,R.pts.length-1)].x:0;
      art=`<svg class="sim" viewBox="0 0 400 140" role="img" aria-label="The robot crosses the field"><rect x="0" y="30" width="400" height="80" rx="10" fill="var(--panel)"/>
        ${[0,2,4,6,8].map(m=>`<line x1="${370-m*40}" x2="${370-m*40}" y1="30" y2="110" stroke="var(--line)"/><text class="m" x="${370-m*40}" y="128" text-anchor="middle">${m}m</text>`).join("")}
        <g transform="translate(${370-x*40-36},48)"><rect width="36" height="44" rx="8" fill="var(--accent)"/><text x="18" y="27" text-anchor="middle" style="fill:#fff;font-size:10px">3211</text></g></svg>`}
    else{const p=R?R.pts[Math.min(R.k,R.pts.length-1)]:{th:0,I:0};
      art=`<svg class="sim" viewBox="0 0 400 320" role="img" aria-label="The arm rises">${armSvg(p.th)}<path d="M270 190 A150 150 0 0 0 120 40" fill="none" stroke="var(--line)" stroke-dasharray="4 6"/>
        <text x="300" y="60" class="m">${(p.t||0).toFixed(2)}s</text><text x="300" y="80" class="m">${Math.round(p.I||0)}A</text></svg>`}
    let res="",kv="";
    if(R&&!R.playing){
      if(!A)kv=`<div class="kv"><div class="${R.t<=2?"good":"bad"}"><span>Time to 8 m</span><b>${R.t.toFixed(2)}s</b></div><div class="${R.push>=500?"good":"bad"}"><span>Pushing force</span><b>${Math.round(R.push)}N</b></div><div><span>Top speed</span><b>${R.top.toFixed(2)} m/s</b></div></div>`;
      else kv=`<div class="kv"><div class="${R.ok&&R.t<=0.4?"good":"bad"}"><span>Time to vertical</span><b ${R.ok?"":`style="direction:rtl"`}>${R.ok?R.t.toFixed(2)+"s":"didn’t rise"}</b></div><div><span>Current to hold level</span><b>${R.hold.toFixed(0)}A</b></div></div>`;
      if(G.res==="ok")res=A?(G.phase==="win"?winHtml("The arm rises in time.")+`<p class="why">Ratio too small: the motor isn’t strong enough against gravity and the arm doesn’t rise. Ratio too big: strong but slow. There’s a range in the middle, and that’s where you pick. And because of the current limit, the ratio is what sets the force.</p>`:"")
        :`<div class="win"><h3>The robot is fast and also pushes</h3><p style="margin:0">A smaller ratio = higher top speed, but less force at the wheel. A big ratio = force, but slow. For a drive you look for the middle.</p><div class="row"><button class="btn" id="nextr">To stage 2: the arm</button></div></div>`;
      else res=errsHtml(MO1.explain(R,A));
    }
    return headHtml(MO1,"")+`<div class="card" style="display:flex;flex-direction:column;gap:12px"><span class="qcount">Stage ${G.r+1} of 2 · ${A?"Arm":"Drive"}</span>
      <p style="margin:0">${task}</p>
      <div><p class="glabel">Gear ratio</p><div class="chips">${opts.map(g=>`<button class="chip" data-gr="${g}" aria-pressed="${G.g===g}" ${R&&R.playing||G.res==="ok"?"disabled":""}>${g}:1</button>`).join("")}</div></div>
      ${art}${kv}
      ${G.res!=="ok"?`<div class="row"><button class="btn" id="run" ${G.g&&!(R&&R.playing)?"":"disabled"}>${A?"Lift":"Drive"}</button></div>`:""}</div>${res}
      <p class="note" style="margin:0">The calculation: a simple motor model (torque drops linearly with speed), 90% efficiency, and wheel friction 1.1.</p>`;
  },
  explain(R,A){const e=[];
    if(!A){if(R.t>2)e.push({text:`<b>Too slow</b> (<span class="mono">${R.t.toFixed(2)}s</span>). At a ratio of ${G.g}:1 the wheels turn too slowly. Try a smaller ratio.`});
      if(R.push<500)e.push({text:`<b>Too weak when pushing</b> (<span class="mono">${Math.round(R.push)}N</span>). A small ratio gives speed at the expense of force. With a current limit, the force at the wheel depends only on the ratio.`})}
    else{if(!R.ok)e.push({text:`<b>The arm didn’t rise.</b> In${G.g}:1, With <span class="mono">40A</span>, the motor doesn’t make enough torque against gravity. You need a bigger ratio.`});
      else if(R.t>0.4)e.push({text:`<b>Too slow</b> (<span class="mono">${R.t.toFixed(2)}s</span>). ${G.g>=150?"The ratio is so big that even at the motor’s top speed the arm moves slowly.":"The motor is strong enough, but only just. With a bit more ratio it would have more torque to accelerate."}`})}
    return e},
  bind(){
    app.querySelectorAll("[data-gr]").forEach(b=>b.onclick=()=>{G.g=+b.dataset.gr;G.run=null;G.res=null;render()});
    on("run",()=>{G.attempts++;const A=G.r===1;const R=A?armSim(G.g,40):driveSim(G.g,60);R.playing=true;R.k=0;G.run=R;G.res=null;
      const ok=A?(R.ok&&R.t<=0.4):(R.t<=2&&R.push>=500);
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?R.pts.length:Math.floor(t/(A?1.6:2.4)*R.pts.length);
        if(R.k>=R.pts.length-1){R.k=R.pts.length-1;R.playing=false;G.res=ok?"ok":"no";if(ok&&A)award(starsFor(G.attempts-1,false),false);if(!ok)failAttempt();render();scrollTo_(".result,.win");return false}
        render()})});
    on("nextr",()=>{G.r=1;G.g=null;G.run=null;G.res=null;render();window.scrollTo(0,0)});
    on("solve",()=>{G.g=G.r?75:6.75;const R=G.r?armSim(75,40):driveSim(6.75,60);R.playing=false;R.k=R.pts.length-1;G.run=R;G.res="ok";if(G.r)award(0,true);render()});
  }};

/* stator vs supply: per-drive-motor model over a 6 s scene: sprint, then push */
const MO2={id:"mo2",title:"Stator or supply?",
  goal:"Set two current limits for the drive motors: on stator current and on supply current. The scenario: a sprint across the field and then a push against an opponent. No wheel slip, no brownout, and win.",
  SLIP:82,
  init(){G.ls=160;G.lp=120;G.run=null},
  sim(){const Gr=6.75,r=0.0508,m=15,dt=0.002,Ls=G.ls>=160?1e9:G.ls,Lp=G.lp>=120?1e9:G.lp;let v=0,x=0,t=0,slip=false,minV=99,tx=null;const pts=[];let k=0;
    while(t<6){const push=x>=6;const s=push?0:v/r*Gr/KR.wf;const dem=Math.max(0,KR.is*(1-s));let I=Math.min(dem,Ls);let sup=(s+I/KR.is)*I;
      if(sup>Lp){I=(-s+Math.sqrt(s*s+4*Lp/KR.is))*KR.is/2;sup=Lp}
      const V=Math.max(3,12.5-(4*sup+20)*0.022);minV=Math.min(minV,V);if(I>MO2.SLIP)slip=true;
      if(!push){v+=Math.min(KR.kt*I*Gr*ETA/r,1.3*m*9.81)/m*dt;x+=v*dt;if(x>=6){tx=t;v=0}}
      t+=dt;if(k++%25===0)pts.push({t,I:Math.min(I,200),sup,V,x:Math.min(x,6),push})}
    const pushF=4*KR.kt*Math.min(Ls,MO2.SLIP)*Gr*ETA/r;
    return {pts,slip,minV,tx,pushF,bo:minV<6.8,slow:tx===null||tx>1.6,weak:Math.min(Ls,1e9)<55}},
  view(){
    const fmtS=v=>v>=160?"No":v+"A",fmtP=v=>v>=120?"No":v+"A",R=G.run;
    const X=t=>36+t/6*354,Y=i=>150-i/200*130,YV=v=>270-(v-4)/10*90;
    const sh=R?R.pts.slice(0,R.k||R.pts.length):[],last=sh[sh.length-1];
    const pl=(f,y)=>sh.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+y(f(p)).toFixed(1)).join("");
    const rx=last?last.x:0;
    const graph=`<svg class="sim graph" viewBox="0 0 400 380" role="img" aria-label="Stator current, supply current and voltage">
      <rect x="36" y="20" width="${354*6/6}" height="130" fill="none" stroke="var(--line)"/>
      ${[0,50,100,150,200].map(i=>`<text x="30" y="${Y(i)+3}" text-anchor="end">${i}A</text><line x1="36" x2="390" y1="${Y(i)}" y2="${Y(i)}" stroke="var(--line)" stroke-width=".5"/>`).join("")}
      <line class="thr" x1="36" x2="390" y1="${Y(MO2.SLIP)}" y2="${Y(MO2.SLIP)}"/><text x="388" y="${Y(MO2.SLIP)-4}" text-anchor="end" style="fill:var(--bad)">slip ${MO2.SLIP}A</text>
      <path d="${pl(p=>p.I,Y)}" fill="none" stroke="var(--accent)" stroke-width="2.4"/><path d="${pl(p=>p.sup,Y)}" fill="none" stroke="var(--warn)" stroke-width="2.4"/>
      <text x="40" y="34" style="fill:var(--accent)">stator</text><text x="90" y="34" style="fill:var(--warn)">supply</text>
      ${[6,8,10,12].map(v=>`<text x="30" y="${YV(v)+3}" text-anchor="end">${v}V</text>`).join("")}
      <line class="thr" x1="36" x2="390" y1="${YV(6.8)}" y2="${YV(6.8)}"/><path d="${pl(p=>p.V,YV)}" fill="none" stroke="var(--ink)" stroke-width="2"/>
      <rect x="36" y="300" width="354" height="60" rx="12" fill="var(--panel)"/>
      <g transform="translate(${360-rx*44},312)"><rect width="34" height="36" rx="8" fill="var(--accent)"/><text x="17" y="22" text-anchor="middle" style="fill:#fff;font-size:9px">3211</text></g>
      <g transform="translate(60,312)"><rect width="34" height="36" rx="8" fill="var(--bad)"/></g>
      ${R&&R.slip&&last&&last.I>MO2.SLIP?`<text x="${370-rx*44}" y="298" class="m" style="fill:var(--bad)">~~ slip</text>`:""}</svg>`;
    let res="";
    if(R&&!R.playing){const ok=!R.slip&&!R.bo&&!R.slow&&!R.weak;
      res=ok?winHtml("A fast sprint, a strong push, and the voltage stays above the threshold.")+`<p class="why">The stator limit controls torque: it prevents slipping and protects the motor. The supply limit controls what leaves the battery: it prevents brownouts and tripped fuses. When pushing the motor is almost stalled, so supply current is small even when stator current is high.</p>`:errsHtml(MO2.explain(R));}
    return headHtml(MO2,"")+`<div class="manual" style="margin:0"><b>Two different currents.</b> Stator current flows through the motor’s windings and sets the torque. Supply current leaves the battery. When the motor is slow, the controller sends only part of the voltage, so <span class="mono">I_supply ≈ duty × I_stator</span>: when pushing the stator is high and the supply low.</div>
      <div class="card simgrid">${slider("ls","Stator current limit",G.ls,20,160,5,fmtS,R&&R.playing)}${slider("lp","Supply current limit",G.lp,20,120,5,fmtP,R&&R.playing)}
      ${graph}${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${R&&R.playing?"disabled":""}>Run scenario</button><span class="note">${last?`<span class="mono">stator ${Math.round(last.I)}A · supply ${Math.round(last.sup)}A · ${last.V.toFixed(1)}V</span>`:"A 6 m sprint, then a push"}</span></div>`:""}</div>${res}`;
  },
  explain(R){const e=[];
    if(R.slip)e.push({text:`<b>The wheels slip.</b> Above <span class="mono">${MO2.SLIP}A</span> on the stator, the torque is greater than the wheel’s grip on the carpet. Slipping adds no force; it just wears the wheels and heats the motors. Lower the stator limit.`});
    if(R.bo)e.push({text:`<b>Brownout</b> (The voltage dropped to<span class="mono">${R.minV.toFixed(1)}V</span>). This happened mid-sprint, when the motors were already fast and supply current was high. A supply limit handles exactly that.`});
    if(R.weak)e.push({sev:"w",text:"<b>You lost the push.</b> Pushing force depends on stator current. A stator limit that’s too low = a weak robot."});
    if(R.slow&&!R.bo)e.push({sev:"w",text:`<b>The sprint is too slow</b> (${R.tx?`<span class="mono">${R.tx.toFixed(2)}s</span>`:"You didn’t make it"}, You need under <span class="mono">1.60s</span>). One of the limits is choking the motors too much.`});
    return e},
  bind(){
    bindSlider("ls",v=>v>=160?"No":v+"A",v=>{G.ls=v;G.run=null});bindSlider("lp",v=>v>=120?"No":v+"A",v=>{G.lp=v;G.run=null});
    on("run",()=>{G.attempts++;const R=MO2.sim();R.playing=true;R.k=1;G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?R.pts.length:Math.floor(t/4*R.pts.length);
        if(R.k>=R.pts.length){R.k=R.pts.length;R.playing=false;const ok=!R.slip&&!R.bo&&!R.slow&&!R.weak;if(ok)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.ls=70;G.lp=50;const R=MO2.sim();R.playing=false;R.k=R.pts.length;G.run=R;award(0,true);render()});
  }};

/* hot motor: arm 6 kg x 0.5 m, 25:1, thermal model over a 150 s match */
const MO3={id:"mo3",title:"Hot motor",
  goal:"An arm of <span class=\"mono\">6</span> kg, ratio <span class=\"mono\">25:1</span> (it has to be fast, so the ratio stays). Each cycle: for 3 seconds it holds level and scores, then waits. Keep the motor below<span class=\"mono\">90°C</span> until the end of the match, without the arm dropping.",
  waits:[{id:"h",t:"Waits level",s:"Ready to score any moment"},{id:"d",t:"Rests on the bottom stop",s:"The stop holds the weight"},{id:"v",t:"Waits upright",s:"The weight is above the pivot"}],
  springs:[{id:0,t:"No spring"},{id:0.5,t:"Gas spring",s:"Balances half the weight"}],
  lims:[{id:0,t:"No limit"},{id:30,t:"30A",s:"Stator current limit"}],
  init(){G.w=null;G.sp=null;G.li=null;G.run=null},
  sim(){const Gr=25,tq=6*9.81*0.5*(1-G.sp),cap=G.li?G.li*KR.kt*Gr*ETA:1e9;const sag=tq>cap;
    let T=30;const C=150,Rth=1.0,pts=[];for(let t=0;t<=150;t+=0.5){const c=t%10,hold=c<3||G.w==="h";const need=hold?tq:0;
      const I=Math.min(need/(Gr*ETA*KR.kt),G.li||1e9);const P=I*I*KR.R;T+=(P-(T-30)/Rth)/C*0.5;pts.push({t,T,I,hold})}
    const maxT=Math.max(...pts.map(p=>p.T));return {pts,maxT,sag,hot:maxT>90}},
  view(){
    const R=G.run,sh=R?R.pts.slice(0,R.k||R.pts.length):[],last=sh[sh.length-1];
    const X=t=>36+t/150*354,Y=T=>500-(T-20)/110*150;
    const line=sh.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(Math.min(p.T,130)).toFixed(1)).join("");
    const heat=last?Math.min(1,(last.T-30)/70):0;
    const th=last?(R.sag&&last.hold?-0.5:last.hold?0:G.w==="d"?-0.5:G.w==="v"?Math.PI/2:0):0;
    const motor=`<circle cx="120" cy="190" r="26" fill="rgb(${Math.round(40+215*heat)},${Math.round(60-30*heat)},${Math.round(80-60*heat)})" opacity=".9"/>`;
    const svg=`<svg class="sim graph" viewBox="0 0 400 520" role="img" aria-label="Motor temperature during the match">
      ${armSvg(th,null,motor)}<rect x="225" y="258" width="26" height="14" fill="#C68D4E"/>
      ${[30,60,90,120].map(T=>`<text x="30" y="${Y(T)+3}" text-anchor="end">${T}°C</text><line x1="36" x2="390" y1="${Y(T)}" y2="${Y(T)}" stroke="var(--line)" stroke-width=".5"/>`).join("")}
      <line class="thr" x1="36" x2="390" y1="${Y(90)}" y2="${Y(90)}"/><path class="vline" d="${line}" style="stroke:var(--bad)"/>
      <text x="390" y="${Y(20)+16}" text-anchor="end">${last?Math.round(last.t)+"s · "+last.T.toFixed(0)+"°C · "+Math.round(last.I)+"A":"0s"}</text></svg>`;
    const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${R&&R.playing||G.phase==="win"?"disabled":""}><b>${o.t}</b>${o.s?`<small>${o.s}</small>`:""}</button>`).join("");
    let res="";
    if(R&&!R.playing){if(!R.sag&&!R.hot)res=winHtml(`Highest temperature: <span class="mono">${R.maxT.toFixed(0)}°C</span>.`)+`<p class="why">Heat in the motor is <span class="mono">I² × R</span>: Double the current = four times the heat. A motor holding weight against gravity is stalled and draws current the whole time. Lower the current: balance the weight, rest on a stop, and don’t hold for no reason.</p>`;
      else res=errsHtml(MO3.explain(R))}
    return headHtml(MO3,"")+`<div><p class="glabel">1. Where does the arm wait between cycles?</p><div class="opts three">${opt(MO3.waits,"w")}</div></div>
      <div><p class="glabel">2. Balance spring</p><div class="opts three">${opt(MO3.springs,"sp")}</div></div>
      <div><p class="glabel">3. Current limit</p><div class="opts three">${opt(MO3.lims,"li")}</div></div>
      <div class="card">${svg}</div>
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${G.w&&G.sp!==null&&G.li!==null&&!(R&&R.playing)?"":"disabled"}>Play a match</button></div>`:""}${res}`;
  },
  explain(R){const e=[];
    if(R.sag)e.push({text:"<b>The arm drops.</b> With a limit of <span class=\"mono\">30A</span> the motor doesn’t make enough torque to hold it level. A current limit lowers heat, but also force."});
    if(R.hot)e.push({text:`<b>The motor reached<span class="mono">${R.maxT.toFixed(0)}°C</span>.</b> It holds weight almost the whole match and draws high current. A hot motor gets weaker, and the controller can limit or cut it mid-match.`});
    return e},
  bind(){
    ["w","sp","li"].forEach(k=>app.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=()=>{const v=b.dataset[k];G[k]=k==="w"?v:+v;G.run=null;render()}));
    on("run",()=>{G.attempts++;const R=MO3.sim();R.playing=true;R.k=1;G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?R.pts.length:Math.floor(t/6*R.pts.length);
        if(R.k>=R.pts.length){R.k=R.pts.length;R.playing=false;if(!R.sag&&!R.hot)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.w="d";G.sp=0.5;G.li=0;const R=MO3.sim();R.playing=false;R.k=R.pts.length;G.run=R;award(0,true);render()});
  }};

const MOLIC=makeLicense("molic",{title:"Motors license test",

    {q:"An arm holds weight level most of the match, and the motor heats up. What helps most?",o:["A balance spring, or resting on a stop between cycles","Lower the ratio so it’s faster","Add another screw"],a:0,w:"Anything that lowers the torque the motor holds lowers current, and so heat."},

    {q:"Why not connect a wheel straight to the motor, with no gearbox?",o:["The motor is too fast and too weak for the mechanism","The manual forbids it","Because there’s no room"],a:0,w:"An electric motor gives its power at high speed and low torque. The gearbox matches it to the mechanism."}]});

/* shooter: wheel speed + hood angle, three distances */
const ME2={id:"me2",title:"Tune the shooter",
  goal:"The shooter has to score into an opening at a height of <span class=\"mono\">2.1</span> m from three distances. Change wheel speed and angle. The ball must go in while it’s already falling.",
  D:[2,3.5,5],H0:0.6,HT:2.1,TOL:0.15,
  init(){G.r=0;G.rpm=3000;G.ang=50;G.shot=null;G.map=[];G.res=null},
  traj(){const v=G.rpm*2*Math.PI/60*0.05*0.45,th=G.ang*Math.PI/180,vx=v*Math.cos(th),vy=v*Math.sin(th),pts=[];
    for(let t=0;t<3;t+=0.01){const x=vx*t,y=ME2.H0+vy*t-4.9*t*t;pts.push({x,y});if(y<0||x>6.5)break}
    const d=ME2.D[G.r],tt=d/vx,yd=ME2.H0+vy*tt-4.9*tt*tt,desc=vy-9.81*tt<0;
    return {pts,yd,desc,v,hit:Math.abs(yd-ME2.HT)<=ME2.TOL&&desc}},
  svg(){
    const d=ME2.D[G.r],X=x=>20+x*60,Y=y=>250-y*60,S=G.shot;
    const sh=S?S.pts.slice(0,S.k):[],path=sh.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(""),ball=sh[sh.length-1];
    return `<svg class="sim" viewBox="0 0 410 270" role="img" aria-label="Ball path">
      <rect x="0" y="250" width="410" height="20" fill="var(--panel)"/>
      ${[0,1,2,3,4,5,6].map(m=>`<text class="m" x="${X(m)}" y="265" text-anchor="middle">${m}m</text>`).join("")}
      <g transform="rotate(${-G.ang} ${X(0)} ${Y(ME2.H0)})"><rect x="${X(0)-6}" y="${Y(ME2.H0)-7}" width="34" height="14" rx="4" fill="var(--ink)"/></g>
      <rect x="${X(0)-14}" y="${Y(ME2.H0)}" width="28" height="${250-Y(ME2.H0)}" fill="var(--accent)" rx="4"/>
      <rect x="${X(d)}" y="${Y(ME2.HT+ME2.TOL)-4}" width="40" height="4" fill="var(--bad)"/><rect x="${X(d)}" y="${Y(ME2.HT-ME2.TOL)}" width="40" height="4" fill="var(--bad)"/>
      <rect x="${X(d)+36}" y="${Y(ME2.HT+ME2.TOL)-4}" width="6" height="${250-Y(ME2.HT+ME2.TOL)+4}" fill="var(--comp-edge)"/>
      <path d="${path}" fill="none" stroke="var(--accent-2)" stroke-width="2" stroke-dasharray="4 3"/>
      ${ball?`<circle cx="${X(ball.x)}" cy="${Y(ball.y)}" r="7" fill="#F2B01E" stroke="#C8650F"/>`:""}</svg>`},
  view(){
    const S=G.shot,done=G.res==="hit";
    const map=G.map.length?`<table class="tablex"><thead><tr><th>Distance</th><th>Wheel speed</th><th>Angle</th></tr></thead><tbody>${G.map.map(m=>`<tr><td class="mono">${m[0]}m</td><td class="mono">${m[1]} RPM</td><td class="mono">${m[2]}°</td></tr>`).join("")}</tbody></table>`:"";
    let res="";
    if(S&&!S.playing&&!done)res=`<div class="result"><div class="err ${S.desc?"":"w"}"><span class="ic">!</span><p>${!S.desc&&Math.abs(S.yd-ME2.HT)<=ME2.TOL?"<b>The ball is still rising when it reaches the opening</b> and hits the bottom lip. You need a higher path that drops into the opening: more angle, or a bit less speed.":S.yd>ME2.HT?`<b>Too high</b> (The ball passed at a height of <span class="mono">${S.yd.toFixed(2)}</span> m). Less speed, or a different angle.`:`<b>Too low</b> (<span class="mono">${S.yd.toFixed(2)}</span> m). More speed.`}</p></div></div>`;
    if(done)res=G.r<2?`<div class="win"><h3>Score!</h3><p style="margin:0">We wrote the settings in the table. Now a new distance.</p><div class="row"><button class="btn" id="nextr">Next distance</button></div></div>`
      :winHtml("Three distances, three rows in the table.")+`<p class="why">This is exactly what teams do: shoot from several distances, write down the settings that work, and in code the robot fills in between rows (interpolation). That way the robot can score even from a distance nobody tested.</p>`;
    return headHtml(ME2,"")+`<div class="card simgrid"><span class="qcount">Distance ${G.r+1} of 3 · <span class="mono">${ME2.D[G.r]}</span> m</span>
      <div id="shw">${ME2.svg()}</div>
      ${slider("rpm","Wheel speed",G.rpm,1500,5000,50,v=>v+" RPM",done||S&&S.playing)}${slider("ang","Launch angle",G.ang,20,75,1,v=>v+"°",done||S&&S.playing)}
      ${!done?`<div class="row"><button class="btn" id="fire" ${S&&S.playing?"disabled":""}>Shoot</button><span class="note">Every shot counts</span></div>`:""}${map}</div>${res}`;
  },
  bind(){
    const redraw=()=>{const w=document.getElementById("shw");if(w)w.innerHTML=ME2.svg()};
    bindSlider("rpm",v=>v+" RPM",v=>{G.rpm=v;G.shot=null},redraw);bindSlider("ang",v=>v+"°",v=>{G.ang=v;G.shot=null},redraw);
    on("fire",()=>{G.attempts++;const S=Object.assign(ME2.traj(),{playing:true,k:1});G.shot=S;
      loopAnim((t,reduce)=>{if(G.shot!==S||view!=="game")return false;S.k=reduce?S.pts.length:Math.floor(t*S.pts.length/1.1)+1;
        if(S.k>=S.pts.length){S.k=S.pts.length;S.playing=false;if(S.hit){G.res="hit";G.map.push([ME2.D[G.r],G.rpm,G.ang]);if(G.r===2)award(starsFor(Math.max(1,G.attempts-4),false),false)}else failAttempt();render();scrollTo_(".result,.win");return false}
        redraw()});render()});
    on("nextr",()=>{G.r++;G.shot=null;G.res=null;render();window.scrollTo(0,0)});
  }};

/* cascade: rig the rope of stage 2, then predict the speed */
const ME3={id:"me3",title:"Build the cascade",
  goal:"A cascade elevator with a base, stage 1 and a carriage. Stage 1’s rope is already connected to the winch. Rig the rope that lifts the carriage: where it’s anchored, and over which pulley it runs.",
  anchors:[{id:"b",t:"Anchored to the base"},{id:"s",t:"Anchored to stage 1"},{id:"c",t:"Anchored to the carriage itself"}],
  pulleys:[{id:"b",t:"Over the pulley at the top of the base"},{id:"s",t:"Over the pulley at the top of stage 1"}],
  init(){G.r=0;G.an=null;G.pu=null;G.run=null;G.res=null;G.pick=null},
  y2(u){const yp=G.pu==="s"?u:0,ya=G.an==="b"?0:G.an==="s"?u:null;if(ya===null)return {y:u,why:"loop"};const y=2*yp-ya;if(y<u-0.001)return {y:u,why:"jam"};return {y:Math.min(y,u+90),why:y-u<1?"same":"ok"}},
  svg(u){
    const B=280,y1=u,{y}=ME3.y2(u);const s1=B-y1,c=B-y;
    const pY=G.pu==="s"?s1-150:B-190,aY=G.an==="b"?B-10:G.an==="s"?s1-10:c-20;
    const rope=G.an&&G.pu?`<path d="M${G.an==="b"?150:G.an==="s"?166:196} ${aY} L200 ${pY} L204 ${c-60}" stroke="#C8650F" stroke-width="2.5" fill="none"/>`:"";
    return `<svg class="sim" viewBox="0 0 400 300" role="img" aria-label="Cascade elevator">
      <rect x="120" y="${B-190}" width="20" height="190" fill="#BFC6CF"/><rect x="260" y="${B-190}" width="20" height="190" fill="#BFC6CF"/><circle cx="200" cy="${B-190}" r="8" fill="#7E8794"/><rect x="100" y="${B}" width="200" height="12" fill="var(--ink)"/>
      <g><rect x="144" y="${s1-150}" width="16" height="150" fill="#0A6BB0"/><rect x="240" y="${s1-150}" width="16" height="150" fill="#0A6BB0"/><rect x="144" y="${s1-150}" width="112" height="8" fill="#0A6BB0"/><circle cx="200" cy="${s1-150}" r="8" fill="#7E8794"/></g>
      <rect x="166" y="${c-60}" width="68" height="56" rx="5" fill="#F2B01E" stroke="#C8650F"/><text x="200" y="${c-28}" text-anchor="middle" style="font-size:11px">Carriage</text>
      ${rope}<text x="20" y="40" class="m">stage1 +${Math.round(y1)}</text><text x="20" y="58" class="m">carriage +${Math.round(y)}</text></svg>`},
  view(){
    const R=G.run,u=R?R.u:0;const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${R&&R.playing||G.res==="ok"?"disabled":""}><b>${o.t}</b></button>`).join("");
    if(G.r===1){const Q=[{t:"40 cm",ok:false},{t:"80 cm",ok:true},{t:"120 cm",ok:false}];
      return headHtml(ME3,"")+`<div class="card qcard"><span class="qcount">Stage 2 of 2</span>${`<div class="art">${ME3.svg(40)}</div>`}<h3 style="font-size:19px">Stage 1 rose 40 cm. How much did the carriage rise relative to the floor?</h3>
        <div class="opts">${Q.map((q,i)=>`<button class="opt ${G.chk?(q.ok?"ok":G.pick===i?"no":""):""}" data-q="${i}" aria-pressed="${G.pick===i}" ${G.chk?"disabled":""}><b>${q.t}</b></button>`).join("")}</div>
        ${G.chk?`<p class="why">${Q[G.pick].ok?"<b>Correct.</b> ":"<b>Not quite.</b> "}The rope is anchored to the base and runs over a pulley that rises with stage 1. Every centimeter stage 1 rises shortens the rope on both sides, so the carriage rises twice as much: 80 cm. With another stage it’s 3×. That’s why in a cascade the top stage is fastest, and in a continuous elevator the carriage rises first and the stages after.</p>`:""}
        <div class="row">${G.chk?(G.phase==="win"?"":`<button class="btn" id="again">Try again</button>`):`<button class="btn" id="chkq" ${G.pick===null?"disabled":""}>Check</button>`}</div></div>${G.phase==="win"?winHtml("Your elevator extends, and you know how fast."):""}`}
    let res="";
    if(R&&!R.playing){const w=ME3.y2(90).why;
      if(w==="ok")res=`<div class="win"><h3>The elevator extends!</h3><p style="margin:0">The carriage rises with stage 1, and the same amount again above it.</p><div class="row"><button class="btn" id="nextr">To the last question</button></div></div>`;
      else res=errsHtml([{text:{loop:"<b>A rope anchored to the carriage itself and attached to the carriage</b> doesn’t pull anything. It’s just a loop that moves with it.",jam:"<b>The elevator jams.</b> The rope tries to pull the carriage down while stage 1 rises. In a cascade a stage’s lift rope is anchored to the stage below it, and runs over a pulley on the stage that holds it.",same:"<b>The carriage rises, but doesn’t extend.</b> It moves exactly like stage 1 and stays at its bottom, because the rope is anchored to the same stage as its pulley. You need an anchor on the stage below."}[w]}])}
    return headHtml(ME3,"")+`<div class="card simgrid"><span class="qcount">Stage 1 of 2</span>
      <div><p class="glabel">1. Where is the rope’s first end anchored?</p><div class="opts three">${opt(ME3.anchors,"an")}</div></div>
      <div><p class="glabel">2. Over which pulley does it run? (the other end attaches to the bottom of the carriage)</p><div class="opts three">${opt(ME3.pulleys,"pu")}</div></div>
      <div id="cw">${ME3.svg(u)}</div>
      ${G.res!=="ok"?`<div class="row"><button class="btn" id="run" ${G.an&&G.pu&&!(R&&R.playing)?"":"disabled"}>Run winch</button></div>`:""}</div>${res}`;
  },
  bind(){
    ["an","pu"].forEach(k=>app.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=()=>{G[k]=b.dataset[k];G.run=null;G.res=null;render()}));
    on("run",()=>{G.attempts++;const R={u:0,playing:true};G.run=R;const ok=ME3.y2(90).why==="ok";
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.u=reduce?90:Math.min(90,t/2*90);const w=document.getElementById("cw");if(w)w.innerHTML=ME3.svg(R.u);
        if(R.u>=90){R.playing=false;G.res=ok?"ok":"no";if(!ok)failAttempt();render();scrollTo_(".result,.win");return false}})});
    on("nextr",()=>{G.r=1;G.pick=null;G.chk=false;render();window.scrollTo(0,0)});
    app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{if(G.chk)return;G.pick=+b.dataset.q;render()});
    on("chkq",()=>{G.chk=true;G.attempts++;if(G.pick===1)award(starsFor(G.attempts-1,false),false);else failAttempt();render()});
    on("again",()=>{G.chk=false;G.pick=null;render()});
    on("solve",()=>{G.an="b";G.pu="s";G.run={u:90,playing:false};G.res="ok";render()});
  }};

    {q:"What’s the advantage of a slapdown over a fixed intake outside the robot?",o:["It tucks inside the frame when not needed, protected from hits","It’s cheaper","It has no pivot"],a:0,w:"It comes down only when collecting, and folds in so it doesn’t get hit."},
    {q:"What do you check on a mechanism after every match?",o:["Bolts, chain and rope tension, and nothing rubbing","Only the battery","Nothing, if it worked"],a:0,w:"A fixed pit checklist finds faults before they lose a match."}]});
