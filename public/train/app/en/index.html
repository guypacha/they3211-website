PATHS.fdm=[
  {id:"f1",play:true,title:"Pocket slicer",short:"Orientation, walls, infill and material. Load it and see if the part holds"},
  {id:"f2",play:true,title:"Print doctor",short:"Five failed prints: what happened and what to change"},
  {id:"f3",play:true,title:"Which printer and which material?",short:"A task from the robot: pick a printer and material from the workshop"},
  {id:"flic",play:true,title:"Printer license test",short:"Ten questions, then a print on your own in front of a mentor"}
];
const F1={id:"f1",title:"Pocket slicer",
  goal:"An L bracket that holds an arm. The force pulls on the standing leg, and the bracket sits next to a motor that reaches<span class=\"mono\">70°C</span>. It must hold at least <span class=\"mono\">300N</span>, and the print must take under two hours.",
  orients:[{id:"flat",t:"Base on the bed",s:"The standing leg is built upward",k:0.35},{id:"side",t:"On its side",s:"The L shape lies on the bed",k:1},{id:"leg",t:"Upside down, on the leg",s:"The base is built upward",k:0.5}],
  mats:[{id:"PLA",s:1.0,heat:55,t:1.0,sub:"easy to print, softens at~55°C"},{id:"PETG",s:0.9,heat:75,t:1.1,sub:"tougher, ~75°C"},{id:"ABS",s:0.85,heat:95,t:1.1,sub:"heat resistant, needs an enclosed printer"},{id:"Onyx",s:1.4,heat:140,t:2.2,sub:"Carbon fiber nylon, Markforged, slow"}],
  init(){G.o=null;G.w=2;G.inf=15;G.mat=null;G.run=null},
  calc(){const o=F1.orients.find(x=>x.id===G.o),m=F1.mats.find(x=>x.id===G.mat);
    const str=600*m.s*o.k*(0.25+0.09*G.w+0.35*G.inf/100),time=30*m.t*(1+0.15*G.w+1.5*G.inf/100);
    return {str,time,heat:m.heat>=70,o,m}},
  partSvg(load,crack){
    const o=G.o||"flat",bend=Math.min(load,1)*10,ln=(x1,y1,x2,y2)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#0B2A45" stroke-opacity=".28"/>`;
    let legL="",baseL="";
    if(o==="flat"){for(let y=70;y<250;y+=10)legL+=ln(150,y,190,y);for(let y=260;y<290;y+=10)baseL+=ln(150,y,330,y)}
    if(o==="leg"){for(let x=160;x<190;x+=10)legL+=ln(x,60,x,250);for(let x=160;x<330;x+=10)baseL+=ln(x,250,x,290)}
    if(o==="side")baseL=`<path d="M156 66 V284 H324 V256 H184 V66" fill="none" stroke="#0B2A45" stroke-opacity=".3" stroke-width="2"/>`;
    const col={PLA:"#6FB7E9",PETG:"#9AD1C2",ABS:"#F2B01E",Onyx:"#3A4250"}[G.mat]||"#BFC6CF";
    const crackP=o==="flat"?"M150 246 L170 250 L190 245":"M150 250 L172 238 L190 252";
    return `<svg class="sim" viewBox="0 0 400 320" role="img" aria-label="L bracket under load">
      <rect x="140" y="290" width="200" height="14" fill="var(--comp-edge)"/>
      <g transform="rotate(${crack?-14:-bend*0.4} 170 250)"><path d="M150 60 H190 V250 H150 Z" fill="${col}"/>${legL}
        <line x1="150" y1="80" x2="${60-bend}" y2="80" stroke="var(--bad)" stroke-width="3"/><path d="M${66-bend} 72 L${56-bend} 80 L${66-bend} 88" fill="none" stroke="var(--bad)" stroke-width="3"/>
        <text x="${100-bend}" y="70" class="m" text-anchor="middle" style="fill:var(--bad)">${Math.round(load*300)}N</text></g>
      <path d="M150 250 H330 V290 H150 Z" fill="${col}"/>${baseL}
      ${crack?`<path d="${crackP}" stroke="var(--bad)" stroke-width="4" fill="none"/>`:""}
      <text x="390" y="24" text-anchor="end" style="font-size:11px;fill:var(--muted)">${{flat:"Layers horizontal in the standing leg",side:"Layers in the plane of the L",leg:"Layers vertical"}[o]}</text></svg>`},
  view(){
    const R=G.run,c=G.o&&G.mat?F1.calc():null;
    const opt=(arr,key,lab)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${R&&R.playing||G.phase==="win"?"disabled":""}><b>${lab?lab(o):o.t}</b><small>${o.sub!=null?o.sub:(o.s||"")}</small></button>`).join("");
    const load=R?Math.min(R.k,R.limit):0,crack=R&&!R.playing&&R.broke;
    let kv="",res="";
    if(R&&!R.playing){kv=`<div class="kv"><div class="${c.str>=300?"good":"bad"}"><span>Strength</span><b>${Math.round(c.str)}N</b></div><div class="${c.time<=120?"good":"bad"}"><span>Print time</span><b>${Math.round(c.time)} min</b></div><div class="${c.heat?"good":"bad"}"><span>Heat resistance</span><b>${c.m.heat}°C</b></div></div>`;
      const ok=c.str>=300&&c.time<=120&&c.heat;
      res=ok?winHtml("The bracket holds, prints in time and doesn’t soften.")+`<p class="why">The most important thing is orientation. Layers are the weak part of a print, so rotate the part so the load doesn’t pull them apart. After that, walls help more than infill: most bending strength is in the outer walls.</p>`:errsHtml(F1.explain(c))}
    return headHtml(F1,"")+`<div><p class="glabel">1. Orientation on the bed</p><div class="opts three">${opt(F1.orients,"o")}</div></div>
      <div class="card simgrid">${slider("fw","Walls (wall loops)",G.w,1,6,1,v=>v,R&&R.playing)}${slider("fi","Infill",G.inf,5,100,5,v=>v+"%",R&&R.playing)}</div>
      <div><p class="glabel">2. Material</p><div class="opts three">${opt(F1.mats,"mat",o=>o.id)}</div></div>
      <div class="card" id="fpart">${F1.partSvg(load,crack)}${kv}</div>
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${G.o&&G.mat&&!(R&&R.playing)?"":"disabled"}>Print and load</button></div>`:""}${res}
      <p class="note" style="margin:0">The numbers are simplified for the game, but the ratios are right: layer orientation changes strength 2 to 3×, walls more than infill.</p>`;
  },
  explain(c){const e=[];
    if(!c.heat)e.push({text:`<b>${c.m.id} softens with heat.</b> Next to a motor at <span class="mono">70°C</span> the part will warp within a few matches, even if it’s strong at room temperature.`});
    if(c.str<300){if(c.o.id!=="side")e.push({text:`<b>Snapped between layers</b> (<span class="mono">${Math.round(c.str)}N</span>). ${c.o.id==="flat"?"With the base on the bed, the standing leg is built of horizontal layers, and the force just peels them apart at the corner.":"In this orientation the corner is still made of layers the load pulls apart."} Try another orientation before adding material.`});
      else e.push({text:`<b>Too weak</b> (<span class="mono">${Math.round(c.str)}N</span>). The orientation is good; now more walls. Walls add more bending strength than infill.`})}
    if(c.time>120)e.push({sev:"w",text:`<b>The print takes <span class="mono">${Math.round(c.time)}</span> minutes.</b> It has to be under two hours. High infill adds a lot of time and little strength.`});
    return e},
  bind(){
    ["o","mat"].forEach(k=>app.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=()=>{G[k]=b.dataset[k];G.run=null;render()}));
    bindSlider("fw",v=>v,v=>{G.w=v;G.run=null});bindSlider("fi",v=>v+"%",v=>{G.inf=v;G.run=null});
    on("run",()=>{G.attempts++;const c=F1.calc(),ok=c.str>=300&&c.time<=120&&c.heat;const R={playing:true,k:0,limit:Math.min(1,c.str/300),broke:c.str<300};G.run=R;render();
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?1:t/2;const w=document.getElementById("fpart");
        if(R.k>=1){R.playing=false;if(ok)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}
        if(w)w.firstElementChild.outerHTML=F1.partSvg(Math.min(R.k,R.limit),false)})});
    on("solve",()=>{G.o="side";G.w=4;G.inf=15;G.mat="PETG";G.run={playing:false,k:1,limit:1,broke:false};award(0,true);render()});
  }};

const DIAG=(key,tag,q1,o1,a1,q2,o2,a2,w)=>({tag,art:PRINT_ART[key],q:"What happened and what do you change?",groups:[{label:q1,o:o1,a:a1},{label:q2,o:o2,a:a2}],w});
const MOD_F2=makeQuiz("f2",{title:"Print doctor",pass:4,
  goal:"Five prints failed overnight. For each one: what’s the problem, and what to change so the next print works. Both parts have to be right.",
  items:[
    DIAG("warp","Corners lifting","What’s the problem?",["Warping: the plastic shrinks as it cools, and the corners lift off the bed","The filament is wet","The nozzle is clogged"],0,
      "What do you change?",["Print ABS with the door and lid closed, a brim, and a clean bed","Increase speed","Lower the infill to 0%"],0,
      "ABS shrinks a lot as it cools. An enclosed printer keeps the air warm, a brim increases the grip area, and a bed clean of finger grease holds better."),
    DIAG("string","Hairs between parts","What’s the problem?",["Stringing: thin strings drawn out as the nozzle travels between parts","The bed isn’t leveled","The layers shifted"],0,
      "What do you change?",["Dry the filament, and check temperature and retraction","Add walls","Print without a bed"],0,
      "PETG that’s wet or too hot oozes while traveling. Drying in a filament dryer (or in the AMS with silica) solves most cases."),
    DIAG("spaghetti","Spaghetti","What’s the problem?",["The part came off the bed halfway, and the nozzle keeps printing in the air","The filament ran out","The printer is too cold"],0,
      "What do you change?",["Wash the bed with dish soap, a brim for a part with a small contact area, and glue if needed","Lower the fan speed","Add infill"],0,
      "A part with a small, tall base is a lever. Every bump of the nozzle moves it. A clean bed and a brim hold it down."),
    DIAG("first","First layer","What’s the problem?",["The first layer is too far from the bed, and the lines aren’t pressed into each other","The filament is wet","The part is too hot"],0,
      "What do you change?",["Bed leveling before printing, and cleaning the bed","Increase infill","Print faster"],0,
      "A good first layer is half the print. Lines that touch each other and press slightly into the bed. In Bambu Studio, tick bed leveling before printing."),
    DIAG("shift","The layers shifted","What’s the problem?",["Layer shift: The nozzle caught or slipped, and every layer from here on shifted sideways","Warping","Stringing"],0,
      "What do you change?",["Check there’s no warped part the nozzle caught on, and that the belts and cables are fine","Change material","Add brim"],0,
      "Usually it’s a corner that lifted and the nozzle hit it, or something blocking the motion. Fix the cause, then print again.")],
  lesson:"Before changing a setting, look at what happened and at what stage. A first-layer fault, warped corners and spaghetti halfway are three different problems with three different fixes."});

const PRN=[{t:"Bambu P1S",s:"enclosed, AMS"},{t:"Bambu X1E",s:"enclosed with a heated chamber"},{t:"Bambu H2D",s:"two nozzles, large volume (coming soon)"},{t:"Markforged",s:"Onyx and continuous fiber"}];

const FLIC=makeLicense("flic",{title:"Printer license test",

/* a practice game for the whole world: "Desert Relay" (made up, so the rules here never contradict a real manual) */
const STRAT_NOTE=`<p class="note" style="margin:0">The game here, <bdi>Desert Relay</bdi>, was made up for practice. At the 2027 kickoff you do the same with the real manual.</p>`;
const RULES=[
  {sec:"Game",id:"G101",t:"Match length: 15 seconds of autonomous and 2:15 of teleop. The last 20 seconds are the endgame."},
  {sec:"Game",id:"G102",t:"During autonomous drivers may not touch the controllers. Violation: minor foul."},
  {sec:"Game",id:"G203",t:"A robot may hold up to 2 cubes at any moment. For each extra cube: minor foul."},
  {sec:"Game",id:"G204",t:"No part of the robot may extend more than 30 cm beyond the bumpers. Violation: major foul."},
  {sec:"Scoring",id:"G301",t:"A cube on the low shelf: 2 points. On the high shelf: 4 points. In autonomous each cube is worth 1.5×."},
  {sec:"Scoring",id:"G302",t:"Endgame climb: low bar 4 points, high bar 10 points. Counts only if the robot isn’t touching the carpet 3 seconds after the buzzer."},
  {sec:"Defense",id:"G401",t:"You may not enter the opponent’s collection zone. Violation: a major foul for every 3 seconds."},
  {sec:"Defense",id:"G402",t:"You may not pin an opponent robot for more than 3 seconds. After releasing, back off at least 1.8 m."},
  {sec:"Robot",id:"R101",t:"The robot, without bumpers and battery, weighs up to 52 kg."},
  {sec:"Robot",id:"R102",t:"Maximum robot height at any moment in a match: 1.2 m."},
  {sec:"Robot",id:"R201",t:"Bumpers are required, in the alliance color, and cover every corner of the frame."},
  {sec:"Tournament",id:"T201",t:"Ranking: a win is 3 ranking points, a tie 1. One more ranking point if the alliance scored 12 or more cubes, and one more if all three robots climbed."}
];
const ST1={id:"st1",title:"Manual hunt",
  goal:"Six questions that really come up at competition. For each one find the rule in the manual and pick it. The clock is running.",
  Q:[{q:"An opponent extended an arm 40 cm outside its bumpers. Which rule says that’s not allowed?",a:"G204"},
     {q:"Our driver touched the controller during autonomous. Which rule?",a:"G102"},
     {q:"How many points is a high bar climb worth?",a:"G302"},
     {q:"Our robot picked up three cubes at once. Which rule?",a:"G203"},
     {q:"How much can the robot weigh?",a:"R101"},
     {q:"How long may you pin an opponent against the wall?",a:"G402"},
     {q:"How do you get an extra ranking point without winning?",a:"T201"}],
  init(){G.qs=shuffle(ST1.Q).slice(0,6);G.i=0;G.sel=null;G.q="";G.chk=false;G.score=0;G.miss=0;G.t0=Date.now();G.done=false},
  view(){
    if(G.done){const sec=Math.round(G.time/1000);
      return headHtml(ST1,"")+(G.score>=5?winHtml(`<b class="mono">${G.score}/6</b> In<span class="mono">${sec}</span> seconds.`)+`<p class="why">At competition nobody remembers the whole manual by heart. You know where to look: game, scoring, defense, robot, tournament. And in search you type a word from the question.</p>`
        :`<div class="result"><div class="err"><span class="ic">!</span><p><b class="mono">${G.score}/6</b>. You need 5. Try again; the questions change.</p></div><div class="row"><button class="btn" data-play="st1">Again</button></div></div>`)}
    const Q=G.qs[G.i],q=G.q.trim();const list=RULES.filter(r=>!q||r.t.includes(q)||r.id.toLowerCase().includes(q.toLowerCase())||r.sec.includes(q));
    const secs=[...new Set(list.map(r=>r.sec))];
    return headHtml(ST1,"")+STRAT_NOTE+`<div class="card qcard"><span class="qcount">${G.i+1} of 6 · correct: ${G.score} · <span class="mono" id="clock">0s</span></span>
      <h3 style="font-size:19px">${Q.q}</h3>
      <div class="field"><label for="mq">Search the manual</label><input id="mq" value="${esc(G.q)}" placeholder="e.g. bumpers, climb, autonomous" autocomplete="off" ${G.chk?"disabled":""}></div>
      <div id="mlist" class="manualbook">${secs.map(s=>`<p class="glabel" style="margin:8px 0 4px">${s}</p>`+list.filter(r=>r.sec===s).map(r=>{const cls=G.chk?(r.id===Q.a?"ok":r.id===G.sel?"no":""):"";
        return `<button class="opt rule ${cls}" data-r="${r.id}" aria-pressed="${G.sel===r.id}" ${G.chk?"disabled":""}><b class="mono">${r.id}</b><small style="color:var(--ink)">${r.t}</small></button>`}).join("")).join("")||`<p class="muted">No rule has that word. Try another word.</p>`}</div>
      ${G.chk?`<p class="why">${G.sel===Q.a?"<b>Correct.</b>":"<b>Not this rule.</b> The answer: <b class=\"mono\">"+Q.a+"</b>."}</p>`:""}
      <div class="row">${G.chk?`<button class="btn" id="next">${G.i<5?"Next":"To the result"}</button>`:`<button class="btn" id="pickr" ${G.sel?"":"disabled"}>This is the rule</button>`}</div></div>`},
  bind(){
    const inp=document.getElementById("mq");if(inp){inp.addEventListener("input",()=>{G.q=inp.value;const pos=inp.selectionStart;render();const n=document.getElementById("mq");n.focus();n.setSelectionRange(pos,pos)})}
    app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{G.sel=b.dataset.r;render()});
    on("pickr",()=>{G.chk=true;if(G.sel===G.qs[G.i].a)G.score++;else G.miss++;render()});
    on("next",()=>{if(G.i<5){G.i++;G.sel=null;G.q="";G.chk=false;render();return}
      G.done=true;G.time=Date.now()-G.t0;G.attempts=1;if(G.score>=5)award(G.miss===0&&G.time<120000?3:G.miss<=1?2:1,false);else failAttempt();render();window.scrollTo(0,0)});
    const c=document.getElementById("clock");if(c&&!G.done)loopAnim(()=>{const el=document.getElementById("clock");if(!el||G.done)return false;el.textContent=Math.round((Date.now()-G.t0)/1000)+"s"});
  }};

/* match plan: expected points = probability x points, time is the currency */
const ST2={id:"st2",title:"Match manager",
  goal:"This is your robot. Plan the match: what you do in autonomous, which cycle you repeat in teleop, and when you climb. The goal: at least <span class=\"mono\">55</span> expected points.",
  autos:[{id:"a",t:"Just leave the zone",s:"3 points, guaranteed",pts:3},{id:"b",t:"One cube to the high shelf",s:"6 points · succeeds 70%",pts:3+6*0.7},{id:"c",t:"Three cubes to the low shelf",s:"3 cubes × 3 points (1.5× in autonomous) · succeeds 95%",pts:3+9*0.95}],
  cycles:[{id:"low",t:"Low shelf, from the near collection",pts:2,p:0.95,sec:6},{id:"high",t:"High shelf, from the near collection",pts:4,p:0.6,sec:12},{id:"far",t:"High shelf, from the far collection",pts:4,p:0.95,sec:13}],
  ends:[{id:"none",t:"Don’t climb, keep scoring",sec:0,pts:0,p:1},{id:"lo",t:"Low bar",s:"takes 6 seconds · 4 points · 95%",sec:6,pts:4,p:0.95},{id:"hi",t:"High bar",s:"takes 15 seconds · 10 points · 80%",sec:15,pts:10,p:0.8}],
  init(){G.au=null;G.cy=null;G.en=null;G.run=null},
  calc(){const a=ST2.autos.find(x=>x.id===G.au),c=ST2.cycles.find(x=>x.id===G.cy),e=ST2.ends.find(x=>x.id===G.en);
    const tt=135-e.sec,n=Math.floor(tt/c.sec),tele=n*c.pts*c.p,end=e.pts*e.p;return {a,c,e,n,tele,end,auto:a.pts,total:a.pts+tele+end}},
  view(){
    const R=G.run;const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${R&&R.playing||G.phase==="win"?"disabled":""}><b>${o.t}</b><small>${o.s||(o.sec&&o.pts&&o.p&&key==="cy"?`A cycle of ${o.sec} seconds · ${o.pts} points · succeeds${Math.round(o.p*100)}%`:"")}</small></button>`).join("");
    const k=R?R.k:0,c=R?R.c:null;const clock=R?Math.max(0,150-k*150):150,sc=R?Math.round(R.c.total*Math.min(1,k)):0;
    const mm=Math.floor(clock/60)+":"+String(Math.floor(clock%60)).padStart(2,"0");
    const field=`<svg class="sim" viewBox="0 0 400 150" role="img" aria-label="The field from above and a match clock"><rect x="10" y="10" width="380" height="110" rx="10" fill="var(--panel)"/>
      <rect x="20" y="40" width="40" height="50" rx="4" fill="#F2B01E" opacity=".7"/><text x="40" y="104" text-anchor="middle" style="font-size:10px">Collect</text>
      <rect x="340" y="30" width="40" height="70" rx="4" fill="var(--accent)" opacity=".5"/><text x="360" y="112" text-anchor="middle" style="font-size:10px">Shelves</text>
      ${R?(()=>{const ph=(k*150*1.0)%(c.c.sec)/c.c.sec,x=60+260*(ph<0.5?ph*2:2-ph*2);return `<rect x="${x}" y="52" width="30" height="28" rx="6" fill="var(--accent)"/>`})():`<rect x="70" y="52" width="30" height="28" rx="6" fill="var(--accent)"/>`}
      <text x="200" y="142" text-anchor="middle" class="m" style="font-size:16px;font-weight:700">${mm}  ·  ${sc} pts</text></svg>`;
    let res="",kv="";
    if(R&&!R.playing){const C=R.c;kv=`<table class="tablex"><thead><tr><th>Cycle</th><th>Time</th><th>Expected points per cycle</th><th>per second</th></tr></thead><tbody>${ST2.cycles.map(x=>`<tr class="${x.id===G.cy?"pick":""}"><td>${x.t}</td><td class="mono">${x.sec}s</td><td class="mono">${(x.pts*x.p).toFixed(2)}</td><td class="mono">${(x.pts*x.p/x.sec).toFixed(2)}</td></tr>`).join("")}</tbody></table>
      <div class="kv"><div><span>Autonomous</span><b>${C.auto.toFixed(1)}</b></div><div><span>Teleop (${C.n} cycles)</span><b>${C.tele.toFixed(1)}</b></div><div><span>Endgame</span><b>${C.end.toFixed(1)}</b></div><div class="${C.total>=55?"good":"bad"}"><span>Total expected</span><b>${C.total.toFixed(1)}</b></div></div>`;
      res=C.total>=55?winHtml("A match plan that beats the goal.")+`<p class="why">The high shelf is worth double, but takes double the time and misses more. What decides is <b>expected points per second</b>: points × success chance ÷ cycle time. And the high bar is worth its 15 seconds, because in that time you’d score less.</p>`
        :errsHtml([{text:`<b>${C.total.toFixed(1)} Expected points</b>, You need 55. Check in the table which cycle gives the most points per second, and what each decision costs in time.`}])}
    return headHtml(ST2,"")+STRAT_NOTE+`<div><p class="glabel">1. Autonomous (15 seconds)</p><div class="opts">${opt(ST2.autos,"au")}</div></div>
      <div><p class="glabel">2. The cycle you repeat in teleop</p><div class="opts">${opt(ST2.cycles,"cy")}</div></div>
      <div><p class="glabel">3. Endgame</p><div class="opts">${opt(ST2.ends,"en")}</div></div>
      <div class="card simgrid">${field}${kv}</div>
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${G.au&&G.cy&&G.en&&!(R&&R.playing)?"":"disabled"}>Play the match</button></div>`:""}${res}`},
  bind(){
    ["au","cy","en"].forEach(k=>app.querySelectorAll(`[data-${k}]`).forEach(b=>b.onclick=()=>{G[k]=b.dataset[k];G.run=null;render()}));
    on("run",()=>{G.attempts++;const R={c:ST2.calc(),playing:true,k:0};G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?1:t/5;if(R.k>=1){R.k=1;R.playing=false;if(R.c.total>=55)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.au="c";G.cy="low";G.en="hi";G.run={c:ST2.calc(),playing:false,k:1};award(0,true);render()});
  }};

/* scouting: three robots cycle for 24 s, the player counts scored cubes per robot */
const ST3={id:"st3",title:"Scout",
  goal:"A 24-second clip from the match. Count how many cubes each robot <b>scored</b> (a miss doesn’t count). Tap +1 every time a robot scores.",
  bots:[{id:"A",name:"Blue",col:"#0A6BB0",y:34,ev:[[3.2,1],[7.6,1],[12.4,0],[16.6,1],[21.2,1]]},
        {id:"B",name:"Orange",col:"#C8650F",y:78,ev:[[4.8,1],[10.6,0],[15.9,1],[22.4,1]]},
        {id:"C",name:"Green",col:"#1D8A57",y:122,ev:[[6.4,1],[14.1,1],[19.8,0]]}],
  init(){G.cnt={A:0,B:0,C:0};G.t=null;G.over=false;G.chk=false},
  truth(b){return b.ev.filter(e=>e[1]).length},
  svg(t){
    const bot=b=>{let last=0,x;for(const e of b.ev){if(t<e[0]){const ph=(t-last)/(e[0]-last);x=330-270*Math.sin(Math.min(1,ph)*Math.PI);break}last=e[0]}if(x===undefined)x=330-270*Math.sin(Math.min(1,(t-last)/6)*Math.PI/2);
      const near=b.ev.find(e=>t>=e[0]&&t<e[0]+0.7);
      return `<g><rect x="${x}" y="${b.y-14}" width="34" height="28" rx="7" fill="${b.col}"/>${near?(near[1]?`<text x="364" y="${b.y+5}" style="fill:var(--good);font-size:18px;font-weight:800">+</text><rect x="340" y="${b.y-16}" width="10" height="32" fill="var(--good)"/>`
        :`<text x="352" y="${b.y-6}" style="fill:var(--bad);font-size:16px;font-weight:800">✕</text><circle cx="${330+(t-near[0])*40}" cy="${b.y+10+(t-near[0])*20}" r="5" fill="#F2B01E"/>`):""}</g>`};
    return `<svg class="sim" viewBox="0 0 400 160" role="img" aria-label="Match: three robots"><rect x="10" y="10" width="380" height="140" rx="10" fill="var(--panel)"/>
      <rect x="18" y="20" width="30" height="120" rx="4" fill="#F2B01E" opacity=".6"/><rect x="340" y="20" width="12" height="120" fill="var(--comp-edge)"/>
      ${ST3.bots.map(bot).join("")}<text x="200" y="146" text-anchor="middle" class="m">${t==null?"":Math.max(0,24-t).toFixed(0)+"s"}</text></svg>`},
  view(){
    const playing=G.t!=null&&!G.over;
    const counters=ST3.bots.map(b=>{const tr=ST3.truth(b),st=G.chk?(G.cnt[b.id]===tr?"ok":"no"):"";
      return `<div class="opt ${st}" style="flex-direction:row;align-items:center;justify-content:space-between;gap:8px"><span><b style="color:${b.col}">Robot ${b.name}</b>${G.chk?`<small style="display:block">Actually scored: <span class="mono">${tr}</span></small>`:""}</span>
        <span class="row" style="gap:6px"><button class="btn ghost small" data-m="${b.id}" ${G.chk?"disabled":""}>−</button><b class="mono" style="min-width:24px;text-align:center">${G.cnt[b.id]}</b><button class="btn small" data-p="${b.id}" ${G.chk||!playing&&!G.over?"disabled":""}>+1</button></span></div>`}).join("");
    let res="";
    if(G.chk){const off=ST3.bots.reduce((s,b)=>s+Math.abs(G.cnt[b.id]-ST3.truth(b)),0);
      res=off<=1?winHtml(off?"One small mistake, and that’s fine.":"An exact count.")+`<p class="why">A good scout looks at the result, not the attempt: a cube that was thrown and didn’t go in doesn’t count. And at a real competition each scout follows only one robot.</p>`
        :errsHtml([{text:`<b>A difference of ${off}</b> from the real data. Your data is what the alliance will pick by, so accuracy matters more than speed. Watch for misses: they’re marked with ✕ and don’t count.`}],"")}
    return headHtml(ST3,"")+`<div class="card simgrid"><div id="scw">${ST3.svg(G.t==null?0:G.t)}</div>
      <div class="opts">${counters}</div>
      ${G.t==null?`<div class="row"><button class="btn" id="go">Start match</button></div>`:G.over&&!G.chk?`<div class="row"><button class="btn" id="chk">Compare to the data</button></div>`:""}
      ${G.chk&&G.phase!=="win"?`<div class="row"><button class="btn" data-play="st3">Watch again from the start</button></div>`:""}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{G.cnt[b.dataset.p]++;const v=b.previousElementSibling;if(v)v.textContent=G.cnt[b.dataset.p]});
    app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{G.cnt[b.dataset.m]=Math.max(0,G.cnt[b.dataset.m]-1);const v=b.nextElementSibling;if(v)v.textContent=G.cnt[b.dataset.m]});
    on("go",()=>{G.t=0;render();const t0=performance.now();
      loopAnim((t,reduce)=>{if(view!=="game"||G.id!=="st3")return false;G.t=reduce?Math.min(24,t*2):t;const w=document.getElementById("scw");if(w)w.innerHTML=ST3.svg(G.t);
        if(G.t>=24){G.over=true;render();return false}})});
    on("chk",()=>{G.chk=true;G.attempts++;const off=ST3.bots.reduce((s,b)=>s+Math.abs(G.cnt[b.id]-ST3.truth(b)),0);if(off<=1)award(off?2:3,false);else failAttempt();render();scrollTo_(".result,.win")});
  }};

/* snake draft: 4 alliances, bots pick by average points only */
const DR={c1:{n:"1001",p:26,c:.7,d:2},c2:{n:"1002",p:25,c:.6,d:2},us:{n:"3211",p:24,c:.2,d:3},c4:{n:"1004",p:22,c:.7,d:2},
  p1:{n:"2101",p:28,c:.6,d:2},p2:{n:"2102",p:27,c:.5,d:1},p3:{n:"2103",p:27,c:.3,d:2},p4:{n:"2104",p:25,c:.95,d:3},
  p5:{n:"2105",p:17,c:.9,d:9},p6:{n:"2106",p:21,c:.2,d:4},p7:{n:"2107",p:16,c:.4,d:6},p8:{n:"2108",p:15,c:.1,d:8}};
const ST4={id:"st4",title:"Snake draft",
  goal:"You’re the captain of alliance 3 (team <span class=\"mono\">3211</span>). Picks go 1, 2, 3, 4 and then back 4, 3, 2, 1. The bots always pick whoever scores the most points. Build the strongest alliance in the tournament.",
  ORDER:[0,1,2,3,3,2,1,0],
  init(){G.al=[["c1"],["c2"],["us"],["c4"]];G.pool=["p1","p2","p3","p4","p5","p6","p7","p8"];G.step=0;G.log=[];G.fin=false;ST4.auto()},
  power(a){const s=a.map(k=>DR[k]).sort((x,y)=>y.p-x.p);const third=Math.max(s[2].p,s[2].d*1.6);return {score:s[0].p+s[1].p,third,thirdDef:s[2].d*1.6>s[2].p,climb:10*a.reduce((q,k)=>q+DR[k].c,0),get total(){return this.score+this.third+this.climb}}},
  auto(){while(G.step<8&&ST4.ORDER[G.step]!==2){const a=ST4.ORDER[G.step],pick=G.pool.slice().sort((x,y)=>DR[y].p-DR[x].p)[0];G.al[a].push(pick);G.pool=G.pool.filter(k=>k!==pick);G.log.push(`Alliance ${a+1} picked<span class="mono">${DR[pick].n}</span>`);G.step++}
    if(G.step>=8)G.fin=true},
  view(){
    const myTurn=!G.fin&&ST4.ORDER[G.step]===2;
    const rows=Object.keys(DR).filter(k=>k[0]==="p"||k==="us").map(k=>{const t=DR[k],gone=!G.pool.includes(k)&&k!=="us",mine=G.al[2].includes(k);
      return `<tr class="${mine?"pick":gone?"gone":""}"><td class="mono">${t.n}</td><td class="mono">${t.p}</td><td class="mono">${Math.round(t.c*100)}%</td><td class="mono">${t.d}</td><td>${myTurn&&G.pool.includes(k)?`<button class="btn small" data-pk="${k}">Pick</button>`:mine?"ours":gone?"picked":""}</td></tr>`}).join("");
    const al=G.al.map((a,i)=>{const P=G.fin?ST4.power(a):null;return `<div class="${i===2?"good":""}"><span>Alliance ${i+1}</span><b>${a.map(k=>DR[k].n).join(" · ")}</b>${G.fin?`<span>Expected: <span class="mono">${P.total.toFixed(1)}</span></span>`:""}</div>`}).join("");
    let res="";
    if(G.fin){const P=G.al.map(a=>ST4.power(a).total),best=Math.max(...P),win=P[2]>=best;
      res=win?winHtml("Your alliance is the strongest in the tournament.")+`<p class="why">The bots picked by points only. You picked by what the alliance was missing: our robot hardly ever climbs, so the first pick is a reliable climber, and in round two a strong defender who also climbs, whom nobody else wanted. That’s exactly what a pick list is for.</p>`
        :errsHtml([{text:`<b>Your alliance: ${P[2].toFixed(1)}</b>, and the strongest: ${best.toFixed(1)}. ${!G.al[2].includes("p4")?"Our robot climbs in only 20% of matches. Your first pick should fill what’s missing, not just score more.":"By round two there are no good scorers left. The third robot can also defend: look for the one whose defense and climbing are worth more than its points."}`}],"")+`<div class="row"><button class="btn" data-play="st4">New draft</button></div>`}
    return headHtml(ST4,"")+STRAT_NOTE+`<div class="manual" style="margin:0">This is how an alliance’s expected score is calculated: the two best scorers score, the third robot scores <b>or</b> defends (defense of 1 to 10 takes away roughly 1.6× that in opponent points), plus 10 points × each robot’s climb chance.</div>
      <div class="card simgrid"><span class="qcount">${G.fin?"The draft is over":myTurn?`Your turn: pick ${G.al[2].length===1?"first":"second"}`:""}</span>
      <div class="tablebox"><table class="tablex"><thead><tr><th>Team</th><th>Points per match</th><th>Climb</th><th>Defense</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="kv">${al}</div>${G.log.length?`<p class="note" style="margin:0">${G.log.slice(-4).join(" · ")}</p>`:""}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>{const k=b.dataset.pk;G.al[2].push(k);G.pool=G.pool.filter(x=>x!==k);G.log.push(`You picked<span class="mono">${DR[k].n}</span>`);G.step++;ST4.auto();
      if(G.fin){G.attempts=(S.m.st4&&S.m.st4.attempts||0)+1;const P=G.al.map(a=>ST4.power(a).total);if(P[2]<Math.max(...P))failAttempt();else award(starsFor(G.attempts,false),false)}render()});
  }};

/* p1: tank drive with 4 motors; the right side is mounted mirrored */
const P1={id:"p1",title:"Motor setup",
  goal:"The robot has four Kraken motors. Each motor has a sticker with the ID set on it. Complete the code: which ID for each motor, and which motors are inverted. On the right side the motors are mounted as a mirror image.",
  M:[{k:"lf",n:"leftFront",id:3,side:"L",x:120,y:70},{k:"lb",n:"leftBack",id:1,side:"L",x:120,y:190},{k:"rf",n:"rightFront",id:4,side:"R",x:280,y:70},{k:"rb",n:"rightBack",id:2,side:"R",x:280,y:190}],
  init(){G.r=0;G.cfg={lf:{id:null,inv:null},lb:{id:null,inv:null},rf:{id:null,inv:null},rb:{id:null,inv:null}};G.run=null;G.nm=null},
  wheelDir(k){ // +1 forward. a motor with id X physically sits where P1.M has id X
    const phys=P1.M.find(m=>m.id===G.cfg[k].id);if(!phys)return {where:null,dir:0};
    const mirrored=phys.side==="R";const dir=(G.cfg[k].inv?-1:1)*(mirrored?-1:1);return {where:phys.k,dir}},
  outcome(){const w={};let dup=false;P1.M.forEach(m=>{const r=P1.wheelDir(m.k);if(!r.where)return;if(w[r.where])dup=true;w[r.where]=r.dir});
    const L=(w.lf||0)+(w.lb||0),R=(w.rf||0)+(w.rb||0);
    const fight=(w.lf&&w.lb&&w.lf!==w.lb)||(w.rf&&w.rb&&w.rf!==w.rb);
    return {w,dup,fight,ok:!dup&&!fight&&L===2&&R===2,spin:L*R<0,back:L===-2&&R===-2,mapped:P1.M.every(m=>G.cfg[m.k].id===m.id)}},
  svg(t){
    const o=G.run?P1.outcome():null;let rot=0,dy=0;
    if(o&&t){if(o.ok||o.back)dy=(o.back?1:-1)*Math.min(t,1)*60;else if(o.spin)rot=Math.min(t,1)*200*(((o.w.lf||0)+(o.w.lb||0))>0?1:-1)}
    const wheel=m=>{const d=o?o.w[m.k]||0:0;return `<rect x="${m.x-14}" y="${m.y-26}" width="28" height="52" rx="6" fill="#1C1F24"/>${d?`<path d="M${m.x} ${m.y+(d>0?14:-14)}V${m.y+(d>0?-14:14)}M${m.x-6} ${m.y+(d>0?-6:6)}L${m.x} ${m.y+(d>0?-14:14)}L${m.x+6} ${m.y+(d>0?-6:6)}" stroke="${d>0?"#4CC98A":"#F2675F"}" stroke-width="3" fill="none"/>`:""}
      <rect x="${m.x+(m.side==="L"?-62:24)}" y="${m.y-12}" width="38" height="24" rx="12" fill="#F2B01E"/><text x="${m.x+(m.side==="L"?-43:43)}" y="${m.y+4}" text-anchor="middle" style="font-size:11px;font-family:var(--f-mono);fill:#1C1F24">ID ${m.id}</text>`};
    return `<svg class="sim" viewBox="0 0 400 270" role="img" aria-label="Chassis from above"><text x="200" y="16" text-anchor="middle" style="font-size:11px;fill:var(--muted)">Forward ↑</text>
      <g transform="translate(0 ${dy}) rotate(${rot} 200 130)"><rect x="130" y="40" width="140" height="180" rx="14" fill="var(--accent)" opacity=".25" stroke="var(--accent)" stroke-width="2"/>${P1.M.map(wheel).join("")}</g></svg>`},
  view(){
    if(G.r===1)return P1.view2();
    const o=G.run&&!G.run.playing?P1.outcome():null;
    const rows=P1.M.map(m=>`<tr><td class="mono">${m.n}</td><td><div class="chips">${[1,2,3,4].map(n=>`<button class="chip" data-mid="${m.k}:${n}" aria-pressed="${G.cfg[m.k].id===n}" ${G.res==="ok"?"disabled":""}>${n}</button>`).join("")}</div></td>
      <td><div class="chips"><button class="chip" data-inv="${m.k}:0" aria-pressed="${G.cfg[m.k].inv===false}">false</button><button class="chip" data-inv="${m.k}:1" aria-pressed="${G.cfg[m.k].inv===true}">true</button></div></td></tr>`).join("");
    const code=P1.M.map(m=>`<span class="kw">TalonFX</span> ${m.n} = <span class="kw">new</span> TalonFX(<b>${G.cfg[m.k].id??"?"}</b>);`).join("\n")+"\n"+P1.M.map(m=>`${m.n}.setInverted(<b>${G.cfg[m.k].inv==null?"?":G.cfg[m.k].inv}</b>);`).join("\n");
    const full=P1.M.every(m=>G.cfg[m.k].id&&G.cfg[m.k].inv!==null);
    let res="";
    if(o){if(o.ok)res=`<div class="win"><h3>Drives straight!</h3><p style="margin:0">The ID in code must be the one set on the controller itself (in Phoenix Tuner). And the mirrored side needs inverting, otherwise its "Forward" is backwards.</p><div class="row"><button class="btn" id="nextr">To stage 2: the arm</button></div></div>`;
      else res=errsHtml([{text:o.dup?"<b>The same ID twice.</b> Two objects in code talk to the same motor, and another motor gets no commands at all.":o.fight?"<b>Two motors on the same side pull in opposite directions.</b> They fight each other: high current, heat, and the robot barely moves. Check the ID and the inversion.":o.spin?"<b>The robot spins in place.</b> One side drives forward and the other backward. The mirrored side needs its motors inverted.":o.back?"<b>The robot drove backward.</b> You inverted the wrong side.":"<b>Something isn’t set up right.</b> Check each motor: ID by the sticker, and inversion by the side."}])}
    return headHtml(P1,"")+`<div class="card simgrid"><span class="qcount">Stage 1 of 2 · Drive</span>${P1.svg(G.run?G.run.t:0)}
      <div class="tablebox"><table class="tablex p1cfg"><thead><tr><th>A motor in code</th><th>ID</th><th>inverted</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${codeBox(code)}${G.res!=="ok"?`<div class="row"><button class="btn" id="run" ${full&&!(G.run&&G.run.playing)?"":"disabled"}>Drive forward</button></div>`:""}</div>${res}`},
  view2(){
    const t=G.run?G.run.t:0,fall=G.nm==="coast"&&G.run?Math.min(t,1)*70:G.nm==="brake"&&G.run?Math.min(t,1)*6:0;
    const th=(40-fall)*Math.PI/180,x=120+150*Math.cos(th),y=200-150*Math.sin(th);
    const svg=`<svg class="sim" viewBox="0 0 400 260" role="img" aria-label="Arm after disable"><rect x="106" y="200" width="28" height="50" fill="var(--comp-edge)"/><line x1="120" y1="200" x2="${x}" y2="${y}" stroke="#E2B97F" stroke-width="16" stroke-linecap="round"/><circle cx="120" cy="200" r="10" fill="var(--ink)"/>
      <text x="390" y="24" text-anchor="end" style="font-size:12px;fill:var(--muted)">${G.run?"Robot disabled":""}</text></svg>`;
    const done=G.run&&!G.run.playing;let res="";
    if(done)res=G.nm==="brake"?winHtml("The arm barely moves after disable.")+`<p class="why">Brake shorts the windings when there’s no command, and the motor resists motion. Arms and elevators almost always use Brake. Coast fits when you want something to keep spinning freely, like a shooter wheel.</p>`
      :errsHtml([{text:"<b>The arm dropped</b> the moment the robot was disabled. In Coast the motor spins freely with no command. At the end of a match, or when someone hits disable, it falls onto whatever is below."}]);
    return headHtml(P1,"")+`<div class="card simgrid"><span class="qcount">Stage 2 of 2 · Arm</span><p style="margin:0">The arm is held up in the air. At the end of the match the robot is disabled. Which neutral mode for its motor?</p>
      <div class="opts three">${["brake","coast"].map(k=>`<button class="opt" data-nm="${k}" aria-pressed="${G.nm===k}" ${G.phase==="win"?"disabled":""}><b class="mono">${k==="brake"?"Brake":"Coast"}</b></button>`).join("")}</div>
      ${svg}${G.phase!=="win"?`<div class="row"><button class="btn" id="run2" ${G.nm&&!(G.run&&G.run.playing)?"":"disabled"}>Disable the robot</button></div>`:""}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-mid]").forEach(b=>b.onclick=()=>{const [k,n]=b.dataset.mid.split(":");G.cfg[k].id=+n;G.run=null;G.res=null;render()});
    app.querySelectorAll("[data-inv]").forEach(b=>b.onclick=()=>{const [k,n]=b.dataset.inv.split(":");G.cfg[k].inv=n==="1";G.run=null;G.res=null;render()});
    app.querySelectorAll("[data-nm]").forEach(b=>b.onclick=()=>{G.nm=b.dataset.nm;G.run=null;render()});
    const go=fin=>{G.attempts++;const R={t:0,playing:true};G.run=R;loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.t=reduce?1.2:t;if(R.t>=1.2){R.playing=false;fin();render();scrollTo_(".result,.win");return false}render()})};
    on("run",()=>go(()=>{const o=P1.outcome();G.res=o.ok?"ok":"no";if(!o.ok)failAttempt()}));
    on("run2",()=>go(()=>{if(G.nm==="brake")award(starsFor(G.attempts-1,false),false);else failAttempt()}));
    on("nextr",()=>{G.r=1;G.run=null;render();window.scrollTo(0,0)});
    on("solve",()=>{if(G.r===0){P1.M.forEach(m=>G.cfg[m.k]={id:m.id,inv:m.side==="R"});G.run={t:1.2,playing:false};G.res="ok"}else{G.nm="brake";G.run={t:1.2,playing:false};award(0,true)}render()});
  }};

/* p2: arm position PID with gravity feedforward */
const P2={id:"p2",title:"Tuning PID",
  goal:"The arm has to rise from<span class=\"mono\">0°</span> to<span class=\"mono\">60°</span>. Tune <span class=\"mono\">kP</span>, <span class=\"mono\">kD</span> and<span class=\"mono\">kG</span>. The goal: get there within a second, overshoot by at most<span class=\"mono\">4°</span>, and stop within half a degree.",
  T:60,
  init(){G.kp=10;G.kd=0;G.kg=0;G.run=null},
  sim(){const a=20,c=3,g=24,dt=0.002,tgt=P2.T*Math.PI/180;let th=0,w=0;const pts=[];
    for(let t=0;t<=2;t+=dt){const e=tgt-th;let V=G.kp*e-G.kd*w+G.kg*Math.cos(th);V=Math.max(-12,Math.min(12,V));
      w+=(a*V-c*w-g*Math.cos(th))*dt;th+=w*dt;if(th<0){th=0;w=Math.max(0,w)}if(Math.round(t/dt)%10===0)pts.push({t,d:th*180/Math.PI,V})}
    const max=Math.max(...pts.map(p=>p.d)),fin=pts[pts.length-1].d;let settle=null;for(let i=pts.length-1;i>=0;i--){if(Math.abs(pts[i].d-P2.T)>2){settle=pts[i+1]?pts[i+1].t:null;break}if(i===0)settle=0}
    return {pts,over:Math.max(0,max-P2.T),err:Math.abs(fin-P2.T),settle}},
  view(){
    const R=G.run,X=t=>36+t/2*354,Y=d=>200-d/90*180,sh=R?R.pts.slice(0,R.k):[];
    const line=sh.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.d).toFixed(1)).join(""),last=sh[sh.length-1];
    const th=(last?last.d:0)*Math.PI/180;
    const svg=`<svg class="sim graph" viewBox="0 0 400 330" role="img" aria-label="Arm angle over time">
      ${[0,30,60,90].map(d=>`<text x="30" y="${Y(d)+3}" text-anchor="end">${d}°</text><line x1="36" x2="390" y1="${Y(d)}" y2="${Y(d)}" stroke="var(--line)" stroke-width=".5"/>`).join("")}
      <rect x="36" y="${Y(P2.T+2)}" width="354" height="${Y(P2.T-2)-Y(P2.T+2)}" fill="var(--good)" opacity=".15"/><line x1="${X(1)}" x2="${X(1)}" y1="20" y2="200" stroke="var(--muted)" stroke-dasharray="3 4"/>
      <text x="${X(1)+4}" y="30">1.0s</text><path class="vline" d="${line}"/>
      <g transform="translate(0 30)"><rect x="40" y="250" width="16" height="40" fill="var(--comp-edge)"/><line x1="48" y1="250" x2="${48+70*Math.cos(th)}" y2="${250-70*Math.sin(th)}" stroke="#E2B97F" stroke-width="10" stroke-linecap="round"/><line x1="48" y1="250" x2="${48+80*Math.cos(P2.T*Math.PI/180)}" y2="${250-80*Math.sin(P2.T*Math.PI/180)}" stroke="var(--good)" stroke-dasharray="4 4"/></g>
      <text x="390" y="290" text-anchor="end">${last?`${last.t.toFixed(2)}s · ${last.d.toFixed(1)}° · ${last.V.toFixed(1)}V`:""}</text></svg>`;
    const ok=R&&!R.playing&&R.over<=4&&R.err<=0.5&&R.settle!==null&&R.settle<=1;
    let res="";
    if(R&&!R.playing)res=ok?winHtml(`Overshoot <span class="mono">${R.over.toFixed(1)}°</span>, settles after <span class="mono">${R.settle.toFixed(2)}s</span>.`)+`<p class="why"><span class="mono">kG</span> holds the weight against gravity, so<span class="mono">kP</span> doesn’t have to "pay" for it with error. <span class="mono">kP</span> pushes toward the target, and<span class="mono">kD</span> brakes when approaching fast. The order in the workshop: first kG until the arm floats, then kP, then kD if there’s overshoot.</p>`
      :errsHtml(P2.explain(R));
    return headHtml(P2,"")+`<div class="card simgrid">${svg}
      ${slider("kp","kP (volts per radian)",G.kp,0,60,1,v=>v,R&&R.playing)}${slider("kd","kD",G.kd,0,4,0.1,v=>(+v).toFixed(1),R&&R.playing)}${slider("kg","kG (volts)",G.kg,0,3,0.1,v=>(+v).toFixed(1),R&&R.playing)}
      ${codeBox(`<span class="kw">double</span> volts = <b>${G.kp}</b> * error - <b>${(+G.kd).toFixed(1)}</b> * velocity + <b>${(+G.kg).toFixed(1)}</b> * Math.cos(angle);`)}
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${R&&R.playing?"disabled":""}>Run</button></div>`:""}</div>${res}`},
  explain(R){const e=[];
    if(R.err>0.5&&R.over<=4)e.push({text:`<b>The arm stops below the target</b> (missing <span class="mono">${R.err.toFixed(1)}°</span>). Gravity pulls it down, and kP alone needs error to make the voltage that holds it. That’s what kG solves.`});
    if(R.over>4)e.push({text:`<b>Overshoot of <span class="mono">${R.over.toFixed(1)}°</span>.</b> The arm arrives too fast and goes past the target. kD brakes it as it approaches fast, or lower kP a bit.`});
    if(R.settle===null||R.settle>1)e.push({sev:"w",text:"<b>Doesn’t settle within a second.</b> If it’s slow, more kP. If it shakes, more kD."});
    return e},
  bind(){
    bindSlider("kp",v=>v,v=>{G.kp=v;G.run=null});bindSlider("kd",v=>(+v).toFixed(1),v=>{G.kd=v;G.run=null});bindSlider("kg",v=>(+v).toFixed(1),v=>{G.kg=v;G.run=null});
    on("run",()=>{G.attempts++;const R=Object.assign(P2.sim(),{playing:true,k:1});G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.k=reduce?R.pts.length:Math.floor(t/2*R.pts.length)+1;
        if(R.k>=R.pts.length){R.k=R.pts.length;R.playing=false;const ok=R.over<=4&&R.err<=0.5&&R.settle!==null&&R.settle<=1;if(ok)award(starsFor(Math.max(1,G.attempts-2),false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.kp=30;G.kd=1.5;G.kg=1.2;const R=Object.assign(P2.sim(),{playing:false});R.k=R.pts.length;G.run=R;award(0,true);render()});
  }};

/* p3: autonomous from command blocks; a block can run in parallel with the one before it */
const P3B={drive1:{t:"Drive to cube",d:2.5},drive2:{t:"Drive to shelf",d:2.5},armUp:{t:"Raise arm",d:1.2},armDown:{t:"Lower arm",d:1.0},
  intDown:{t:"Lower intake",d:0.8},collect:{t:"Collect cube",d:1.0},intUp:{t:"Raise intake",d:0.6},score:{t:"scored",d:0.5}};
const P3={id:"p3",title:"Auto builder",
  goal:"The robot starts next to the shelf with one cube. In an autonomous of <span class=\"mono\">9</span> seconds: score it, collect another cube and score that too. Mark a command as “parallel” so it runs together with the command before it.",
  LIMIT:9,
  init(){G.seq=[];G.run=null},
  groups(){const gs=[];G.seq.forEach((s,i)=>{if(s.par&&gs.length)gs[gs.length-1].push(s.k);else gs.push([s.k])});return gs},
  check(){const st={at:"shelf",arm:"down",int:"up",cubes:1,scored:0};let t=0;const log=[];const gs=P3.groups();
    for(const g of gs){
      if(g.includes("drive1")&&g.includes("drive2"))return {err:"<b>Two drives in parallel.</b> The robot can’t drive to two places at once."};
      for(const k of g){
        if(k==="score"){if(st.arm!=="up")return {err:"<b>You scored with the arm down.</b> First \"Raise arm\", and only when it’s up \"scored\". Commands running in parallel start at the same moment, so the arm isn’t up yet."};if(st.at!=="shelf")return {err:"<b>You scored far from the shelf.</b> You need to drive to the shelf before scoring."};if(!st.cubes)return {err:"<b>There’s no cube to score.</b>"}}
        if(k==="collect"){if(st.int!=="down")return {err:"<b>You collected with the intake up.</b> First \"Lower intake\", in a separate command before collecting."};if(st.at!=="cube")return {err:"<b>The intake collected air.</b> You need to drive to the cube before collecting."}}
        if((k==="drive1"||k==="drive2")&&st.arm==="up"&&!g.includes("armDown"))return {err:"<b>Driving with the arm raised.</b> In this exercise it’s not allowed: the robot could tip over. Lower the arm before driving, or in parallel with it. (Raising it while driving is allowed.)"};
      }
      for(const k of g){if(k==="drive1")st.at="cube";if(k==="drive2")st.at="shelf";if(k==="armUp")st.arm="up";if(k==="armDown")st.arm="down";if(k==="intDown")st.int="down";if(k==="intUp")st.int="up";if(k==="collect")st.cubes++;if(k==="score"){st.cubes--;st.scored++}}
      const d=Math.max(...g.map(k=>P3B[k].d));log.push({g,t0:t,d});t+=d}
    return {t,log,scored:st.scored,ok:st.scored>=2&&t<=P3.LIMIT}},
  view(){
    const R=G.run;const pal=Object.keys(P3B).map(k=>`<button class="chip txt" data-add="${k}" ${G.phase==="win"||R&&R.playing?"disabled":""}>${P3B[k].t} <span class="mono" style="color:var(--muted)">${P3B[k].d}s</span></button>`).join("");
    const seq=G.seq.map((s,i)=>`<li class="cmd ${s.par?"par":""}"><span class="mono num">${i+1}</span><b>${P3B[s.k].t}</b>${i?`<label class="note"><input type="checkbox" data-par="${i}" ${s.par?"checked":""}> Parallel with previous</label>`:""}<button class="btn ghost small" data-del="${i}" aria-label="Remove">✕</button></li>`).join("");
    const c=G.seq.length?P3.check():null;
    let res="";
    if(R&&!R.playing){if(c.err)res=errsHtml([{text:c.err}]);else if(c.ok)res=winHtml(`Two cubes in<span class="mono">${c.t.toFixed(1)}</span> seconds.`)+`<p class="why">In WPILib this is exactly <span class="mono">Commands.sequence(...)</span> and<span class="mono">Commands.parallel(...)</span>. What doesn’t depend on each other runs in parallel, and what needs a condition (intake down before collecting) runs after it.</p>`;
      else res=errsHtml([{text:c.scored<2?`<b>You scored ${c.scored} ${c.scored===1?"cube":"cubes"}.</b> You need two.`:`<b>It took <span class="mono">${c.t.toFixed(1)}</span> seconds</b>, and autonomous ends at 9. Look for commands that don’t depend on each other and run them in parallel. Hint: you may start raising the arm while the robot is already driving to the shelf.`}])}
    const bar=R&&c&&c.log?`<div class="tl">${c.log.map(l=>`<span style="flex:${l.d}" class="${R.t>=l.t0?"on":""}">${l.g.map(k=>P3B[k].t).join(" + ")}</span>`).join("")}</div><p class="note" style="margin:0">Time: <span class="mono">${Math.min(R.t,c.t||0).toFixed(1)}s / ${P3.LIMIT}s</span></p>`:"";
    return headHtml(P3,"")+`<div class="card simgrid"><p class="glabel" style="margin:0">Commands (tap to add at the end)</p><div class="chips">${pal}</div>
      <ol class="cmds">${seq||`<li class="muted" style="list-style:none">No commands yet</li>`}</ol>${bar}
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="run" ${G.seq.length&&!(R&&R.playing)?"":"disabled"}>Run autonomous</button><button class="btn ghost small" id="clr">Clear</button></div>`:""}</div>${res}`},
  bind(){
    app.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{G.seq.push({k:b.dataset.add,par:false});G.run=null;render()});
    app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{G.seq.splice(+b.dataset.del,1);G.run=null;render()});
    app.querySelectorAll("[data-par]").forEach(b=>b.onchange=()=>{G.seq[+b.dataset.par].par=b.checked;G.run=null;render()});
    on("clr",()=>{G.seq=[];G.run=null;render()});
    on("run",()=>{G.attempts++;const c=P3.check(),R={t:0,playing:true};G.run=R;const end=c.err?0.01:Math.min(c.t,P3.LIMIT+1);
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.t=reduce?end:t*3;if(R.t>=end){R.t=end;R.playing=false;if(!c.err&&c.ok)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.seq=[{k:"armUp"},{k:"score"},{k:"drive1"},{k:"armDown",par:true},{k:"intDown",par:true},{k:"collect"},{k:"drive2"},{k:"intUp",par:true},{k:"armUp",par:true},{k:"score"}].map(s=>({k:s.k,par:!!s.par}));G.run={t:99,playing:false};award(0,true);render()});
  }};

/* p4: debugging quiz */
const BUG=(code,log,q,o,a,w)=>({art:`<div style="width:100%;display:grid;gap:6px">${codeBox(code)}${log?`<pre class="code log" dir="ltr">${log}</pre>`:""}</div>`,q,o,a,w});
const MOD_P4=makeQuiz("p4",{title:"Bug detective",pass:4,
  goal:"Five real bugs from past seasons. In each: code, what happened, and what the fix is.",
  items:[
    BUG(`<span class="kw">private</span> TalonFX arm;\n\n<span class="kw">public void</span> raise() {\n  arm.set(0.3);\n}`,`ERROR  java.lang.NullPointerException\n  at Arm.raise(Arm.java:4)`,"The code builds, but crashes the moment you press the button. Why?",["arm was never created with new TalonFX(id)","The motor isn’t connected to CAN","0.3 It’s too fast"],0,"NullPointerException means you’re using an object that is null. A line like this is missing: <span class=\"mono\">arm = new TalonFX(5);</span>"),
    BUG(`<span class="kw">double</span> speed = -joystick.getY();\ndrive.arcadeDrive(speed, turn);`,"","Why is there a minus before <span class=\"mono\">getY()</span>?",["On a joystick, pushing forward gives a negative value on axis Y","So the robot drives slowly","It’s a mistake, it should be deleted"],0,"In WPILib a joystick’s Y axis is negative when you push forward. Without the minus, forward on the joystick = backward on the robot."),
    BUG(`<span class="kw">public void</span> robotPeriodic() {\n  System.out.println(arm.getPosition());\n  Thread.sleep(100);\n}`,`Warning  Loop time of 0.02s overrun`,"The robot responds late and an overrun warning appears. What’s the main problem?",["Thread.sleep stops the whole robot loop, which is supposed to run every 20ms","println is slow","getPosition doesn’t exist"],0,"The loop runs every 20 milliseconds. A 100 ms sleep stops everything. And anyway, for printing use SmartDashboard or a log, not println every cycle."),
    BUG(`<span class="comment">// Phoenix 6</span>\n<span class="kw">double</span> angle = arm.getPosition().getValueAsDouble();\n<span class="kw">if</span> (angle > 90) arm.set(0);`,"","The arm never stops at 90 degrees. Why?",["In Phoenix 6 position is in rotations, not degrees","needs >= instead of >","The arm is broken"],0,"Phoenix 6 returns rotor rotations (or mechanism rotations, if you set a ratio). 90 rotations is way past 90 degrees. Convert units, preferably with Units."),
    BUG(`<span class="kw">int</span> ticks = 1;\n<span class="kw">int</span> ratio = 4;\n<span class="kw">double</span> out = ticks / ratio;`,`out = 0.0`,"Why <span class=\"mono\">out</span> comes out <span class=\"mono\">0</span> and not <span class=\"mono\">0.25</span>?",["Dividing two ints gives an int, and the remainder is thrown away","double can’t hold fractions","ratio should be 0"],0,"<span class=\"mono\">1 / 4</span> between two ints is 0. Write <span class=\"mono\">1.0 / 4</span> or declare it double.")],
  lesson:"How to debug: read the log down to the first line from our code, reproduce the bug, change one thing, and check again."});

/* ---------- mo4: build a 100:1 reduction from three stages ---------- */
const MO4={id:"mo4",title:"Gearbox tower",
  goal:"The arm needs a ratio of about <span class=\"mono\">100:1</span> (allowed <span class=\"mono\">96</span> to <span class=\"mono\">104</span>). Build it from three stages: a planetary gearbox, a gear pair and a chain. Pick, then tap Check.",
  OPT:{p:[3,4,5],x:[10,12,14],y:[36,40,48,50,60],u:[12,16,18],v:[36,42,48,54,60]},
  LBL:{p:"Planetary gearbox",x:"Pinion (on the motor)",y:"Big gear",u:"Small sprocket",v:"Big sprocket"},
  init(){G.sel={p:3,x:12,y:36,u:16,v:36};G.res=null},
  ratio(s){return s.p*(s.y/s.x)*(s.v/s.u)},
  gear(cx,cy,t,col,dur,dir){const r=t*0.9,c=2*Math.PI*r;

    const arm=`<g><path d="M${x3} ${cy}h70" stroke="#E2B97F" stroke-width="10" stroke-linecap="round"/>${ok?`<animateTransform attributeName="transform" type="rotate" from="0 ${x3} ${cy}" to="${-Math.min(90,360*4/d3).toFixed(1)} ${x3} ${cy}" dur="4s" fill="freeze"/>`:""}</g>`;
    return `<svg class="sim" viewBox="0 0 470 240" role="img" aria-label="Drive train from the motor to the arm">
      <rect x="10" y="95" width="46" height="50" rx="6" fill="#3A4250"/><text x="33" y="160" text-anchor="middle">Kraken</text>
      <rect x="58" y="100" width="56" height="40" rx="6" fill="#7E8794"/><text x="86" y="125" text-anchor="middle" style="fill:#fff;font-weight:700">${s.p}:1</text>
      <path d="M114 ${cy}H${x1}" stroke="#5A6B7F" stroke-width="5"/>
      <path d="M${x2} ${cy-ru}L${x3} ${cy-rv}M${x2} ${cy+ru}L${x3} ${cy+rv}" stroke="#3A4250" stroke-width="4" stroke-dasharray="5 3"${ok?``:""}>${ok?`<animate attributeName="stroke-dashoffset" from="0" to="-16" dur="${(d2/4).toFixed(2)}s" repeatCount="indefinite"/>`:""}</path>
      ${MO4.gear(x1,cy,s.x,"#0A6BB0",d1,1)}${MO4.gear(x2,cy,s.y,"#0A6BB0",d2,-1)}${MO4.gear(x2,cy,s.u,"#C9302A",d2,-1)}${MO4.gear(x3,cy,s.v,"#C9302A",d3,-1)}${arm}
      <text x="${x1}" y="236" text-anchor="middle">${s.x}T</text><text x="${x2}" y="16" text-anchor="middle">${s.y}T / ${s.u}T</text><text x="${x3}" y="16" text-anchor="middle">${s.v}T</text></svg>`},
  view(){const s=G.sel,r=MO4.ratio(s),won=G.phase==="win";

    let res="";

    on("solve",()=>{G.sel={p:5,x:10,y:50,u:12,v:48};G.res=MO4.ratio(G.sel);award(0,true);render()});

/* ---------- me4: pick the mechanism for the task ---------- */

const MOD_ME4=makeQuiz("me4",{title:"Which mechanism?",pass:5,

    {tag:"Arm",art:SC(`${robotBox(150)}<path d="M195 108l-70 -40M195 108l70 -40M195 108l-90 30" stroke="#E2B97F" stroke-width="6" stroke-dasharray="2 6" stroke-linecap="round"/><text x="60" y="40" style="font-size:12px;fill:#5A6B7F">Front</text><text x="290" y="40" style="font-size:12px;fill:#5A6B7F">Back</text>`),q:"You need to score at mid height both in front and behind, and collect from the floor.",o:["A pivot arm that swings over the robot","Elevator","Shooter"],a:0,w:"A pivot arm reaches several heights and both sides. An elevator rises along one line only."},
    {tag:"Climb",art:SC(`<path d="M150 20h120" stroke="#3A4250" stroke-width="8"/>${robotBox(160)}<path d="M205 108V30" stroke="#5A6B7F" stroke-width="4"/><path d="M205 30q-10 -12 -20 0" stroke="#5A6B7F" stroke-width="4" fill="none"/>`),q:"You hang the robot on a bar at the end of the match. The moment the match ends the robot is disabled, and it has to stay in the air.",o:["A hook with a winch and a ratchet or brake","A hook with a motor in mode coast","An elevator with no brake"],a:0,w:"When the robot is disabled the motors don’t hold. A ratchet or mechanical brake keeps it up until the points are counted."},

/* ---------- f4: print orientation ---------- */
const layers=(x,y,w,h,horiz)=>{let s="";if(horiz)for(let yy=y+6;yy<y+h;yy+=7)s+=`<path d="M${x} ${yy}h${w}" stroke="#0B2A45" stroke-width=".8" opacity=".5"/>`;else for(let xx=x+6;xx<x+w;xx+=7)s+=`<path d="M${xx} ${y}v${h}" stroke="#0B2A45" stroke-width=".8" opacity=".5"/>`;return s};
const FA=(body,arrow,lay)=>c=>`<svg viewBox="0 0 400 170" aria-hidden="true"><defs><clipPath id="fclip">${body}</clipPath></defs><g fill="#F2A33A" stroke="#B26E12" stroke-width="2">${body}</g>${c?`<g clip-path="url(#fclip)">${lay}</g>`:""}${arrow}<rect x="20" y="158" width="360" height="6" fill="#7E8794"/><text x="380" y="152" text-anchor="end" style="font-size:11px;fill:#5A6B7F">${c?"Layer lines in the right direction":"Print bed"}</text></svg>`;
const arrowDown=(x,y)=>`<path d="M${x} ${y}v34M${x-8} ${y+24}l8 10 8-10" stroke="#C9302A" stroke-width="4" fill="none"/>`;
const MOD_F4=makeQuiz("f4",{title:"Print orientation",pass:4,
  goal:"A printed part is strong along the layers and weak between them. For each part pick how to lay it on the bed. After checking you see the layer lines.",
  items:[
    {tag:"Hook",art:FA(`<path d="M120 30h30v70a30 30 0 0 0 60 0v-20h30v20a60 60 0 0 1-120 0z"/>`,arrowDown(225,40),layers(100,20,170,140,true)),q:"A hook with a tool bag hanging on it. The force pulls the tip down and tries to straighten the hook. How do you print it?",o:["Lying on the bed, so the whole J shape is inside every layer","Standing, with the J upright","Doesn’t matter, just high infill"],a:0,w:"When the hook lies flat, the bending runs along the lines inside the layer. When it stands, the bending tries to peel layer from layer, and it snaps at a layer line."},
    {tag:"Spacer",art:FA(`<rect x="170" y="40" width="60" height="110" rx="4"/>`,arrowDown(200,4),layers(160,40,80,110,true)),q:"A round spacer with a hole, squeezed between two extrusions along its axis. How do you print it?",o:["Standing, axis vertical","Lying on its side","At an angle"],a:0,w:"Standing: the hole comes out round with no supports, and the load along the axis presses layers onto each other, which is fine. Pressing isn’t peeling."},
    {tag:"Pulley",art:FA(`<rect x="120" y="70" width="160" height="70" rx="6"/>`,"",layers(110,70,180,70,true)),q:"A belt pulley with teeth and a hex hole in the middle. How do you print it?",o:["With the axis vertical, so the teeth and hex are built in every layer","With the axis lying down","Upside down, with supports"],a:0,w:"With the axis vertical, each layer is a cross section of the pulley with all the teeth and the hex. The printer is most accurate within a layer."},
    {tag:"Bracket",art:FA(`<path d="M150 20h40v100h80v30H150z"/>`,`<path d="M265 135h50M305 125l10 10-10 10" stroke="#C9302A" stroke-width="4" fill="none"/>`,layers(140,10,140,150,false)),q:"An L bracket. The force pulls the short leg sideways, trying to open the corner. How do you print it?",o:["On its side, so the whole L shape is in every layer","Standing on the short leg, like in the picture","Standing on the long leg"],a:0,w:"On its side, the whole corner is built in every layer, and the force runs along the lines. Just like the pocket slicer mission."},
    {tag:"Clip",art:FA(`<path d="M120 60h160v20H140v40h140v20H120z"/>`,`<path d="M290 70v-24M282 54l8-10 8 10" stroke="#C9302A" stroke-width="4" fill="none"/>`,layers(110,50,180,100,true)),q:"A clip that bends every time you close it. How do you print it?",o:["Lying down, so the arm that bends is printed along the layer","Standing, so the arm is built from short layers","Standing, with 100% infill"],a:0,w:"Anything that bends again and again must be built along the lines. If it’s made of short layers, after a few times it cracks between two of them."}],
  lesson:"Ask: where does the force pull? Then lay the part so the force runs along the layers and doesn’t peel them. After that check it doesn’t need lots of supports."});

/* ---------- st5: when to leave for the climb ---------- */
const ST5={id:"st5",title:"When to climb?",
  goal:"There are <span class=\"mono\">30</span> seconds left. Each cycle takes <span class=\"mono\">8</span> seconds and gives <span class=\"mono\">5</span> points. A climb gives <span class=\"mono\">15</span> points, and takes between <span class=\"mono\">6</span> to<span class=\"mono\">9</span> seconds. A cycle that doesn’t finish is worth nothing, and neither is a climb that doesn’t finish. When do you start climbing?",
  T:30,CY:8,WORST:9,
  init(){G.x=4;G.run=null},
  pts(x){const cyc=Math.floor((ST5.T-x)/ST5.CY);return {cyc,cp:cyc*5,climb:x>=ST5.WORST?15:0}},
  view(){const R=G.run,x=G.x,p=ST5.pts(x),X=s=>20+(ST5.T-s)/ST5.T*360,now=R?R.t:ST5.T,won=G.phase==="win";
    let segs="";for(let i=0;i<p.cyc;i++){const a=ST5.T-i*ST5.CY,b=a-ST5.CY;segs+=`<rect x="${X(a)}" y="40" width="${X(b)-X(a)}" height="26" rx="4" fill="#0A6BB0" opacity="${now<=b?1:.35}"/><text x="${(X(a)+X(b))/2}" y="58" text-anchor="middle" style="fill:#fff;font-size:11px">+5</text>`}
    const idle=ST5.T-p.cyc*ST5.CY-x;if(idle>0)segs+=`<rect x="${X(x+idle)}" y="40" width="${X(x)-X(x+idle)}" height="26" rx="4" fill="#C9D3DE"/>`;
    const cEnd=x-ST5.WORST,climbOk=cEnd>=0;segs+=`<rect x="${X(x)}" y="40" width="${X(Math.max(0,cEnd))-X(x)}" height="26" rx="4" fill="${climbOk?"#1D8A57":"#C9302A"}" opacity="${R&&now<=Math.max(0,cEnd)?1:.35}"/>${!climbOk?`<rect x="${X(0)}" y="40" width="${X(cEnd)-X(0)}" height="26" fill="none" stroke="#C9302A" stroke-dasharray="4 3"/>`:""}`;
    const svg=`<svg class="sim" viewBox="0 0 400 110" role="img" aria-label="Timeline of the last 30 seconds">
      ${[30,25,20,15,10,5,0].map(s=>`<text x="${X(s)}" y="30" text-anchor="middle">${s}</text><line x1="${X(s)}" x2="${X(s)}" y1="34" y2="72" stroke="var(--line)"/>`).join("")}${segs}
      <line x1="${X(now)}" x2="${X(now)}" y1="34" y2="78" stroke="#0B2A45" stroke-width="2"/><text x="${X(now)}" y="96" text-anchor="middle" style="font-weight:700">${now.toFixed(1)}s</text></svg>`;
    let res="";
    if(R&&!R.playing){const tot=p.cp+p.climb,best=25;
      if(won)res=winHtml(`<span class="mono">${p.cyc}</span> cycles plus a climb: <span class="mono">${tot}</span> points, even with the slowest climb.`)+`<p class="why">Two rules: leave time for the climb’s worst case (not the average), and don’t start a cycle that won’t have time to finish. Any time between <span class="mono">9</span> to<span class="mono">14</span> seconds before the end gives the maximum. You build these numbers from scouting our own robot.</p>`;
      else res=errsHtml([{text:x<ST5.WORST?`<b>The climb didn’t finish.</b> This time it took <span class="mono">9</span> seconds, and only <span class="mono">${x}</span>. You got <span class="mono">${tot}</span> points. Leave time for the worst case.`:`<b>You got <span class="mono">${tot}</span> points</b>, but you could have had <span class="mono">${best}</span>. You left too early, and there was time for another cycle.`}])}
    return headHtml(ST5,"")+`<div class="card simgrid">${svg}
      ${slider("x","Start climbing with this many seconds left",x,0,30,1,v=>v,(R&&R.playing)||won)}
      <p class="note" style="margin:0">The blue bar: cycles. Green or red: the climb, by the worst case of <span class="mono">9</span> seconds. Gray: dead time.</p>
      ${won?"":`<div class="row"><button class="btn" id="run" ${R&&R.playing?"disabled":""}>Play the ending</button></div>`}</div>${res}`},
  bind(){
    bindSlider("x",v=>v,v=>{G.x=+v;G.run=null});
    on("run",()=>{G.attempts++;const R={t:ST5.T,playing:true};G.run=R;
      loopAnim((t,reduce)=>{if(G.run!==R||view!=="game")return false;R.t=reduce?0:Math.max(0,ST5.T-t*10);
        if(R.t<=0){R.playing=false;const x=G.x;if(x>=9&&x<=14)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(".result,.win");return false}render()})});
    on("solve",()=>{G.x=10;G.run={t:0,playing:false};award(0,true);render()});
  }};

Object.assign(MODS,{s5:MOD_S5,mo4:MO4,me4:MOD_ME4,f4:MOD_F4,st5:ST5});

/* ---------- site account (window.Y3211Sync, injected by the site) ---------- */
let SYNCWAIT=!!(window.Y3211Sync||document.querySelector('script[src*="sync.js"]'));
function accApply(){
  const m={};
  Object.keys(ACC.m||{}).forEach(id=>{const r=ACC.m[id]||{};m[id]={done:true,stars:r.stars||0,attempts:r.n||1}});
  Object.keys(ACC.lic||{}).forEach(id=>{m[id]=m[id]||{done:true,stars:0,attempts:1}});
  Object.keys(m).forEach(id=>{if(isLic(id))m[id].approved=!!(ACC.lic&&ACC.lic[id])});
  S.m=m;S.xp=Object.values(m).reduce((a,r)=>a+(r.stars||0)*30+10,0);
}
function accAfter(prev,st,shown){
  if(!ACC)return;const id=G.id;
  const undo=()=>{if(prev&&prev.done)S.m[id]=prev;else delete S.m[id];S.xp=Object.values(S.m).reduce((a,r)=>a+(r.done?(r.stars||0)*30+10:0),0)};
  if(shown||!st){undo();return}
  let p;try{p=window.Y3211Sync.finish(id,st)}catch(e){p="offline"}
  Promise.resolve(p).catch(()=>"offline").then(r=>{
    if(r==="ok"){ACC.m=ACC.m||{};const o=ACC.m[id]||{};ACC.m[id]={stars:Math.max(st,o.stars||0),n:(o.n||0)+1};accApply();if(isLic(id)&&!S.m[id].approved)toast("Saved. The license is waiting for a mentor")}
    else{undo();FX={};toast(r==="rejected"?"Not saved: mission locked or finished too fast":"No connection, try again")}
    render()});
}
