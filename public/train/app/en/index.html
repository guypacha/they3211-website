<!doctype html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><script>try{var y3=localStorage.getItem("y3211-theme");if(y3==="light"||y3==="dark")document.documentElement.dataset.theme=y3}catch(e){}</script><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script type="module" src="../../sync.js"></script>
</head><body>
<title>Training Grounds 3211</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Heebo:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column mobile app; top bar with XP, views swap in place; the game board is an SVG "electrical panel" scaled to width. */
:root{
  --bg:#F3F7FB; --surface:#FFFFFF; --ink:#0B2A45; --muted:#5A6B7F; --line:#D3DFEB;
  --accent:#0A6BB0; --accent-2:#0F86D8; --accent-soft:#E4F0FA;
  --good:#1D8A57; --good-soft:#E3F4EB; --warn:#C8650F; --warn-soft:#FCEFE2; --bad:#C9302A; --bad-soft:#FBE7E5;
  --panel:#DCE5EE; --panel-hole:#B9C8D7; --comp:#FFFFFF; --comp-edge:#8FA3B8;
  --wire-red:#D3302A; --wire-black:#1C1F24; --wire-edge:#FFFFFF; --star:#F2B01E;
  --f-head:"Rubik","Heebo",system-ui,sans-serif; --f-body:"Heebo",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131F; --surface:#0F2134; --ink:#E5EEF7; --muted:#93A7BC; --line:#22394F;
  --accent:#4BAEF2; --accent-2:#7CC8F8; --accent-soft:#12304A;
  --good:#4CC98A; --good-soft:#123426; --warn:#F09A4A; --warn-soft:#3A2613; --bad:#F2675F; --bad-soft:#3A1715;
  --panel:#16293D; --panel-hole:#0C1A29; --comp:#1E3550; --comp-edge:#4F6B88;
  --wire-red:#E8473F; --wire-black:#0A0C0F; --wire-edge:#8DA2B8; --star:#F5C04A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08131F; --surface:#0F2134; --ink:#E5EEF7; --muted:#93A7BC; --line:#22394F;
  --accent:#4BAEF2; --accent-2:#7CC8F8; --accent-soft:#12304A;
  --good:#4CC98A; --good-soft:#123426; --warn:#F09A4A; --warn-soft:#3A2613; --bad:#F2675F; --bad-soft:#3A1715;
  --panel:#16293D; --panel-hole:#0C1A29; --comp:#1E3550; --comp-edge:#4F6B88;
  --wire-red:#E8473F; --wire-black:#0A0C0F; --wire-edge:#8DA2B8; --star:#F5C04A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;direction:ltr;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.2}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.term:focus-visible{outline:3px solid var(--accent-2);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.ltr{direction:ltr;unicode-bidi:isolate}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;margin-inline-end:auto;background:none;border:0;padding:0}
.brand .mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:13px}
.brand b{font-family:var(--f-head);font-size:17px;white-space:nowrap}
@media (max-width:460px){.brand small,.xp .track,.xp .mono{display:none}.brand b{font-size:15px}.bar{gap:6px}.bar .tabbtn{padding:6px 9px}}.brand{min-width:0}.brand>span:last-child{min-width:0}.brand b{display:block;overflow:hidden;text-overflow:ellipsis}@media (max-width:430px){.brand b{display:none}}
.brand small{display:block;color:var(--muted);font-size:12px;line-height:1}
.xp{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.xp .lvl{font-family:var(--f-head);font-weight:700;color:var(--ink);background:var(--accent-soft);border-radius:999px;padding:2px 10px}
.xp .track{width:72px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.xp .fill{height:100%;background:var(--accent);transition:width .6s}
.tabbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.tabbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.btn{border:0;border-radius:12px;padding:12px 20px;font-weight:700;background:var(--accent);color:#fff;font-size:16px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:.02em}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}

/* login */
.login{display:grid;gap:16px;padding-top:24px}
.login .hero{display:flex;flex-direction:column;gap:8px}
.login h1{font-size:clamp(28px,7vw,40px);font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field input{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px}

/* world map */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.world{display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;min-height:132px}
.world.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.world.off{opacity:.62;cursor:default}
.world .ico{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.world h3{font-size:18px}
.world .meta{font-size:13px;color:var(--muted);margin-top:auto}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}

/* mission path */
.path{display:flex;flex-direction:column;gap:0;position:relative}
.mission{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 0;text-align:left;background:none;border:0;width:100%}
.mission .node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-head);font-weight:800;font-size:18px;border:3px solid var(--line);background:var(--surface);position:relative;z-index:1}
.mission.done .node{background:var(--good);border-color:var(--good);color:#fff}
.mission.open .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.mission.lock{cursor:default}
.mission.lock .node{color:var(--muted)}
.mission h3{font-size:17px}
.mission p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.path::before{content:"";position:absolute;right:25px;top:30px;bottom:30px;width:3px;background:var(--line)}
.stars{display:flex;gap:2px;direction:ltr}
.stars svg{width:18px;height:18px}

/* game */
.gamehead{display:flex;align-items:flex-start;gap:12px;justify-content:space-between;flex-wrap:wrap}
.gamehead h2{font-size:22px}
.goal{font-size:15px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.boardwrap{background:var(--panel);border-radius:18px;padding:6px;position:relative;touch-action:manipulation}
.board{display:block;width:100%;height:auto;max-height:72vh;user-select:none;-webkit-user-select:none}
.board text{font-family:var(--f-head);fill:var(--ink)}
.board .lbl{font-size:13px;font-weight:700}
.board .sub{font-size:10.5px;fill:var(--muted);font-family:var(--f-mono)}
.board .tag{font-family:var(--f-mono);font-size:11px;font-weight:700}
.comp{fill:var(--comp);stroke:var(--comp-edge);stroke-width:1.5}
.hole{fill:var(--panel-hole)}
.term{cursor:pointer;touch-action:none}
.learn{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.lcard .mono{white-space:nowrap}.lcard{display:grid;gap:8px;align-content:start}.lcard h3{margin:0;font-size:17px;display:flex;gap:8px;align-items:center}.lcard p{margin:0;line-height:1.6}
.lnum{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;flex:none}
.lart{border-radius:12px;padding:6px;background:#EEF3F8;color:#0B2A45}.lart svg{direction:ltr;width:100%;height:auto;display:block}.lart text{fill:#0B2A45}
.dragline{fill:none;stroke:var(--accent-2);stroke-width:5;stroke-linecap:round;stroke-dasharray:8 6;pointer-events:none}.dragline.snap{stroke-dasharray:none}
.wire.unset .core{stroke-dasharray:6 5}.qbadge circle{fill:var(--accent-2);stroke:#fff;stroke-width:2}.qbadge text{fill:#fff;font:700 13px var(--f-mono)}
.term .hit{fill:transparent}
.term .stud{stroke:var(--comp-edge);stroke-width:2;fill:#C7CFD8}
.term.pos .ring{stroke:var(--wire-red)} .term.neg .ring{stroke:var(--wire-black)}
.term .ring{fill:none;stroke-width:2.5;stroke:#8A939E}
.term.sel .stud{fill:var(--accent-2)}
.term.sel .halo{opacity:1}
.term .halo{fill:none;stroke:var(--accent-2);stroke-width:3;opacity:0;animation:pulse 1s infinite}
@keyframes pulse{0%{r:11}100%{r:19;stroke-opacity:0}}
.wire{fill:none;stroke-linecap:round;stroke-linejoin:round;cursor:pointer}
.wire .edge{stroke:var(--wire-edge);stroke-opacity:.9}
.wire.hot .core{animation:glow .5s ease-in-out infinite alternate}
@keyframes glow{from{stroke:#FF8A1F}to{stroke:#FFD15A}}
.wire.bad .edge{stroke:var(--bad);stroke-opacity:1}
.wire.live .flow{stroke:#FFE36E;stroke-dasharray:2 12;animation:flow .6s linear infinite;opacity:1}
.wire .flow{opacity:0}
@keyframes flow{to{stroke-dashoffset:-14}}
.smoke{fill:var(--muted);opacity:.0;animation:smoke 1.6s ease-out infinite}
@keyframes smoke{0%{opacity:.55;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-34px) scale(1.6)}}
.spark{stroke:#FFC83A;stroke-width:3;stroke-linecap:round;animation:spark .45s ease-out infinite}
@keyframes spark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.4)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ledon{animation:led 1.2s linear infinite}
@keyframes led{0%{fill:#FF4D4D}33%{fill:#4DFF88}66%{fill:#4DA6FF}}

/* sheet */
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.18);
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet .in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-family:var(--f-mono);font-weight:700;font-size:14px;min-width:64px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip .sw{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-inline-start:6px;border:1px solid var(--wire-edge)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* feedback */
.result{display:flex;flex-direction:column;gap:10px}
.err{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px;border-radius:12px;background:var(--bad-soft)}
.err.w{background:var(--warn-soft)}
.err .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--bad);color:#fff;font-weight:800;font-family:var(--f-head)}
.err.w .ic{background:var(--warn)}
.err p{margin:0}
.win{background:var(--good-soft);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.win .stars svg{width:30px;height:30px}
.win h3{font-size:22px;color:var(--good)}
.manual{border:1px dashed var(--accent);background:var(--accent-soft);border-radius:12px;padding:14px}
.manual table{border-collapse:collapse;width:100%;font-size:14px}
.manual th,.manual td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90vw}

/* mentor */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.m{border-collapse:collapse;min-width:640px;width:100%;font-size:14px}
table.m th,table.m td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.m th{font-size:12px;color:var(--muted);font-weight:700}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.p-done{background:var(--good-soft);color:var(--good)} .p-stuck{background:var(--bad-soft);color:var(--bad)} .p-none{color:var(--muted)} .p-prog{background:var(--accent-soft);color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-head);font-size:26px}
.demo{display:inline-block;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:2px 8px;font-size:12px;font-weight:700}
/* missions 4-7 */
.opt{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt small{color:var(--muted);font-size:13px}
.opts{display:grid;gap:8px}
.opts.three{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.can-y{stroke:#E2BE12}.can-g{stroke:#24955A}
.link{fill:none;stroke-width:3.2;stroke-linecap:round}
.linkhit{fill:none;stroke:transparent;stroke-width:18;cursor:pointer}
.lk.bad .link{stroke:var(--bad)}
.lk.live .flowdot{opacity:1}
.flowdot{fill:#FFE36E;opacity:0}
.idtag{cursor:pointer}
.idtag rect{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.2}
.idtag.bad rect{fill:var(--bad-soft);stroke:var(--bad)}
.idtag text{font-family:var(--f-mono)!important;font-size:12px;font-weight:700;fill:var(--accent)!important}
.idtag.bad text{fill:var(--bad)!important}
.itile{cursor:pointer}
.itile .frame{fill:var(--comp);stroke:var(--comp-edge);stroke-width:1.2}
.itile.mk .frame{stroke:var(--bad);stroke-width:3.5}
.itile .badge{opacity:0}
.itile.mk .badge{opacity:1}
.itile.ok .frame{stroke:var(--good);stroke-width:3.5}
.itile.miss .frame{stroke:var(--warn);stroke-width:3.5;stroke-dasharray:6 4}
.itile:focus-visible{outline:none}.itile:focus-visible .frame{stroke:var(--accent-2);stroke-width:3.5}
.graph text{font-family:var(--f-mono);font-size:10px;fill:var(--muted)}
.board .tag,.board .sub,.graph text,.idtag text{direction:ltr;unicode-bidi:isolate}
.vline{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round}
.thr{stroke:var(--bad);stroke-dasharray:5 4;stroke-width:1.5}
.qcount{font-size:13px;color:var(--muted)}
.why{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin:0}

.world{cursor:pointer}.world.full{border-color:var(--good)}
.tabbtn.site{color:inherit;text-decoration:none;display:inline-flex;align-items:center;min-height:32px;white-space:nowrap}.bar .tabbtn.site{margin-inline-start:auto}.login>.tabbtn.site{justify-self:start;margin-bottom:8px}.bar .tabbtn.lang{margin-inline-start:0}svg text.bi{direction:ltr}.tabbtn.back{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700;white-space:nowrap;min-height:32px}@media (max-width:460px){.bar:has(.back) .xp{display:none}}.tabbtn.lang{font-family:var(--f-mono);font-weight:700}
@media (max-width:460px){.xp .mono,.brand small{display:none}}
@media (max-width:380px){.xp{display:none}}
/* ==== WORLDS CSS ==== */
/* engines */
.qcard{display:flex;flex-direction:column;gap:12px}
.glabel{margin:0 0 6px;font-weight:700;font-size:14px;color:var(--muted)}
.art{display:flex;justify-content:center;background:var(--panel);border-radius:14px;padding:10px;min-height:60px}
.art svg{width:100%;max-width:420px;height:auto;max-height:240px}
.partpic{width:100%;height:auto;max-height:110px}
.art .partpic{max-height:150px}
.slots{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:10px;min-height:52px;border:1.5px dashed var(--line);border-radius:12px;padding:6px 10px}
.slot.fill{border-style:solid;padding:0;border:0}
.slot .num{width:28px;height:28px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.stepbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px;min-height:52px}
.stepbtn small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.slot.ok .stepbtn{border-color:var(--good);background:var(--good-soft)}
.slot.no .stepbtn{border-color:var(--bad);background:var(--bad-soft)}
.bank{display:grid;gap:6px;padding-top:6px;border-top:1px solid var(--line)}
.bankbtn{background:var(--accent-soft);border-color:transparent}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mtile{display:flex;flex-direction:column;gap:8px;align-items:stretch;text-align:center;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:10px}
.mtile .partbox{background:#F4F7FA;border-radius:10px;padding:8px;display:grid;place-items:center;height:110px}
.mtile.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mtile.ok{border-color:var(--good);background:var(--good-soft)}
.mtile.no{border-color:var(--bad);background:var(--bad-soft)}
.mtile .role{color:var(--muted);font-size:13px;line-height:1.35;text-align:left}
.namechip{font-family:var(--f-body);min-width:0}
.sl{display:flex;flex-direction:column;gap:4px}
.sl label{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700}
.sl input{width:100%;accent-color:var(--accent);height:28px}
.simgrid{display:grid;gap:14px}
@media (min-width:640px){.simgrid.two{grid-template-columns:1fr 1fr}}
.meter{display:flex;flex-direction:column;gap:4px;font-size:13px}
.meter .bar2{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.meter .bar2 i{display:block;height:100%;background:var(--accent);transition:width .15s}
.meter.hot .bar2 i{background:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kv div{background:var(--panel);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.kv span{font-size:12px;color:var(--muted)}.kv b{font-family:var(--f-mono);font-size:17px;direction:ltr;unicode-bidi:isolate;text-align:left}
.kv .bad b{color:var(--bad)}.kv .good b{color:var(--good)}
.sim{display:block;width:100%;height:auto;background:var(--surface);border-radius:14px}
.sim text{font-family:var(--f-head);fill:var(--ink);font-size:12px}
.sim .m{font-family:var(--f-mono);direction:ltr;unicode-bidi:isolate}
.pulse{animation:pulse2 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}

const PATHS={};
PATHS.elec=[
  {id:"m1",play:true},{id:"m2",play:true},{id:"m3",play:true},

/* ---------- SVG drawing helpers ---------- */
function pdhBox(x,y,w,h,t,s){
  let holes="";for(let i=0;i<4;i++){holes+=`<circle class="hole" cx="${x+12+(i%2)*(w-24)}" cy="${y+12+(i>1)*(h-24)}" r="4"/>`}
  return `<rect class="comp" x="${x}" y="${y}" width="${w}" height="${h}" rx="12"/>${holes}
  <text class="lbl" x="${x+w/2}" y="${y+30}" text-anchor="middle" style="font-size:17px">${t}</text>
  <text class="sub bi" x="${x+w/2}" y="${y+48}" text-anchor="middle">${s}</text>`;
}
function battery(x,y){
  return `<rect class="comp" x="${x}" y="${y}" width="150" height="95" rx="8"/>
  <rect x="${x}" y="${y}" width="150" height="18" rx="8" fill="var(--ink)" opacity=".85"/>
  <text class="lbl" x="${x+75}" y="${y+52}" text-anchor="middle">Battery</text>
  <text class="sub" x="${x+75}" y="${y+70}" text-anchor="middle">12V · 18Ah</text>
  <text class="tag" x="${x+35}" y="${y+33}" text-anchor="middle" fill="var(--wire-red)">+</text>
  <text class="tag" x="${x+115}" y="${y+33}" text-anchor="middle" style="fill:var(--ink)">−</text>`;
}
function breaker(x,y){
  return `<rect class="comp" x="${x}" y="${y}" width="120" height="62" rx="8"/>
  <rect x="${x+48}" y="${y+40}" width="24" height="12" rx="3" fill="var(--wire-red)"/>
  <text class="lbl" x="${x+60}" y="${y+28}" text-anchor="middle" style="font-size:12px">Main breaker</text>
  <text class="sub" x="${x+60}" y="${y+-8}" text-anchor="middle">120A</text>`;
}
function breakerV(x,y){
  return `<rect class="comp" x="${x}" y="${y}" width="62" height="130" rx="8"/>
  <rect x="${x+43}" y="${y+45}" width="12" height="24" rx="3" fill="var(--wire-red)"/>
  <text class="lbl" x="${x+24}" y="${y+57}" text-anchor="middle" transform="rotate(-90 ${x+24} ${y+57})" style="font-size:12px">Main breaker</text>
  <text class="sub" x="${x+31}" y="${y+112}" text-anchor="middle" style="font-size:10px">120A</text>`;
}

  <text class="sub" x="${x}" y="${y+33}" text-anchor="middle">ch ${ch}</text>`;
}

/* twisted pair along a curve P(t), t in 0..1: returns two paths, half a twist apart */
function twistD(P,amp,pitch){
  const n=60,pts=[];let L=0,prev=P(0);for(let i=0;i<=n;i++){const q=P(i/n);L+=Math.hypot(q.x-prev.x,q.y-prev.y);prev=q;pts.push(q)}
  const tw=Math.max(1,Math.round(L/pitch)),out=[[],[]];
  pts.forEach((q,i)=>{const a=pts[Math.max(0,i-1)],b=pts[Math.min(n,i+1)],dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
    const o=amp*Math.sin(Math.PI*2*tw*i/n);
    out[0].push((i?"L":"M")+(q.x+nx*o).toFixed(1)+" "+(q.y+ny*o).toFixed(1));out[1].push((i?"L":"M")+(q.x-nx*o).toFixed(1)+" "+(q.y-ny*o).toFixed(1))});
  return out.map(a=>a.join(""))}
function wirePath(a,b,k){
  const my=(a.y+b.y)/2+((k%3)-1)*16;
  return `M${a.x} ${a.y}V${my}H${b.x}V${b.y}`;
}
function wireMid(a,b,k){ // a point on the wire path, away from terminals, for the "?" badge
  const my=(a.y+b.y)/2+((k%3)-1)*16,P=[[a.x,a.y],[a.x,my],[b.x,my],[b.x,b.y]];
  const L=[0];for(let i=1;i<4;i++)L.push(L[i-1]+Math.abs(P[i][0]-P[i-1][0])+Math.abs(P[i][1]-P[i-1][1]));
  const at=f=>{const d=L[3]*f;for(let i=1;i<4;i++)if(d<=L[i]){const s=L[i]-L[i-1]||1,u=(d-L[i-1])/s;return {x:P[i-1][0]+(P[i][0]-P[i-1][0])*u,y:P[i-1][1]+(P[i][1]-P[i-1][1])*u}}return {x:b.x,y:b.y}};
  for(const f of [.5,.38,.62,.28,.72]){const q=at(f);if(!G.L.terms.some(t=>Math.hypot(t.x-q.x,t.y-q.y)<26))return q}
  return at(.5)}
const gaugeWidth=g=>({4:9,6:8,10:6.5,12:5.5,14:4.8,18:3.8,22:3})[g]||4;

/* ---------- state for current game ---------- */
let G=null; // {id,L,wires:[],sel,attempts,hint,errors,phase}
let sheet=null,toastT=null;
const T=id=>G.L.terms.find(t=>t.id===id);

/* ---------- rendering ---------- */
const app=document.getElementById("app");
let view="home";
function topbar(){
  const lv=level(S.xp),pct=Math.round((S.xp%150)/150*100);
  return `<header class="bar">
    <button class="brand" data-go="home" aria-label="Home screen"><span class="mark">3211</span><span><b>Training Grounds</b><small>The Y Team · Yeruham</small></span></button>
    ${view==="game"||view==="world"?`<button class="tabbtn back" data-go="${view==="game"?"world":"home"}" aria-label="${view==="game"?"Back to the mission path":"Back to all worlds"}">← Back</button>`:""}
    <div class="xp" title="${S.xp} XP"><span class="lvl">Level ${lv}</span><span class="track"><span class="fill" style="width:${pct}%;display:block"></span></span><span class="mono">${S.xp} XP</span></div>
    <a class="tabbtn site" href="../../../en/" aria-label="Back to the team site">← Site</a>
    <a class="tabbtn site lang" href="../" lang="he" dir="rtl" aria-label="עברית">עברית</a>
    ${canMentor()?`<button class="tabbtn" data-go="mentor" aria-pressed="${view==="mentor"}">Mentor</button>`:""}
  </header>`;
}
function stars(n,max=3){
  let s="";for(let i=0;i<max;i++)s+=`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z" fill="${i<n?"var(--star)":"var(--line)"}"/></svg>`;
  return `<span class="stars" aria-label="${n} stars">${s}</span>`;
}
function missionState(i){
  const m=MISSIONS[i];if(!m.play)return"lock";
  if(S.m[m.id]&&S.m[m.id].done)return"done";
  if(i===0||(S.all&&canMentor())||(S.m[MISSIONS[i-1].id]&&S.m[MISSIONS[i-1].id].done))return"open";
  return"lock";
}
function render(){
  if(SYNCWAIT){app.innerHTML=`<section class="login"><p class="muted" style="margin:40px 0;text-align:center">Loading your account…</p></section>`;return}
  if(view==="mentor"&&!canMentor())view="home";
  if(!S.user){app.innerHTML=loginView();bindLogin();return}
  let body="";
  if(view==="home")body=homeView();
  else if(view==="world")body=worldView();
  else if(view==="game")body=gameView();
  else if(view==="mentor")body=mentorView();
  app.innerHTML=topbar()+body;
  if(view==="game")bindGame();
}
function loginView(){
  return `<section class="login"><div class="row" style="gap:8px;justify-self:start;margin-bottom:8px"><a class="tabbtn site" href="../../../en/">← Back to the site</a><a class="tabbtn site lang" href="../" lang="he" dir="rtl" aria-label="עברית">עברית</a></div>
    <div class="hero"><span class="eyebrow">The Y Team · 3211 · Yeruham</span>
      <h1>Training Grounds</h1>
      <p class="muted">Everything you need to know to build a robot, in short missions. Start with electrical.</p></div>
    <form class="card" id="lf" style="display:grid;gap:14px">
      <div class="field"><label for="ln">Your name</label><input id="ln" required maxlength="30" autocomplete="nickname" placeholder="e.g. Noa K."></div>
      <div class="field"><label for="lp">Personal code (4 digits, from your mentor)</label><input id="lp" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" class="mono ltr" style="text-align:left" placeholder="1234"></div>

  document.getElementById("lf").addEventListener("submit",e=>{e.preventDefault();
    S.user={name:document.getElementById("ln").value.trim(),pin:document.getElementById("lp").value};save();view="home";render()});
}
function homeView(){
  return `<section style="display:flex;flex-direction:column;gap:6px;padding-top:8px">
      <span class="eyebrow">Hi ${esc(S.user.name)}</span>
      <h1 style="font-size:28px">Pick a world</h1>
      <p class="muted" style="margin:0">Each world is a mission path. At the end of each world there is a license test that a mentor signs off in the workshop.</p></section>

      `<button class="world ${done===P.length?"full":""}" data-world="${w.id}"><span class="ico">${ico(w.icon)}</span><h3>${w.name}</h3><span class="muted" style="font-size:14px">${w.desc}</span>
        <span class="meta">${done} of ${P.length} missions</span><span class="prog"><i style="width:${done/P.length*100}%"></i></span></button>`:
      `<div class="world off"><span class="ico">${ico(w.icon)}</span><h3>${w.name}</h3><span class="muted" style="font-size:14px">${w.desc}</span><span class="meta">Coming soon</span></div>`}).join("")}</div>`;
}
function worldView(){
  return `<section style="display:flex;flex-direction:column;gap:6px;padding-top:8px">
    <button class="btn ghost small" data-go="home" style="align-self:flex-start">← All worlds</button>
    <span class="eyebrow">World ${WORLDS.indexOf(WN())+1}</span><h1 style="font-size:28px">${WN().name}</h1>

    <div class="path">${(()=>{const nx=MISSIONS.findIndex((m,i)=>missionState(i)==="open"),fx=FX;FX={};return MISSIONS.map((m,i)=>{
      const st=missionState(i),L=LEVELS[m.id]||m,rec=S.m[m.id],cx=[i===nx?"next":"",fx.done===m.id?"justdone":"",fx.open===m.id?"justopen":""].join(" ");
      const wait=ACC&&isLic(m.id)&&st==="done"&&!rec.approved;
      const right=wait?`<span class="pill p-prog">Waiting for a mentor</span>`:st==="done"?stars(rec.stars):st==="open"?`<span class="pill p-prog">Play</span>`:`<span class="pill p-none">${m.play?"Locked":"Coming soon"}</span>`;
      return `<button class="mission ${st} ${cx}" ${st==="lock"?"disabled":""} data-play="${m.id}">
        <span class="node">${st==="done"?"✓":i+1}</span><span><h3>${L.title}</h3><p>${L.short}</p></span>${right}</button>`}).join("")})()}</div>`;

function gameView(){
  if(typeof LEARN!=="undefined"&&LEARN[G.id]&&!G.learned)return learnView();
  const h=MODS[G.id]?MODS[G.id].view():wireView();
  if(typeof LEARN==="undefined"||!LEARN[G.id])return h;
  return h.replace(`<button class="btn ghost small" data-go="world" style="align-self:flex-start">← Mission path</button>`,`<div class="row" style="gap:8px"><button class="btn ghost small" data-go="world">← Mission path</button><button class="btn ghost small" id="relearn">Explain again</button></div>`)}
function wireView(){
  const L=G.L;
  const wires=G.wires.map((w,k)=>{
    const a=T(w.a),b=T(w.b),d=wirePath(a,b,k),cls=["wire",G.flags[w.id]||"",wireDone(w)?"":"unset"].join(" ");
    const m=wireMid(a,b,k),qm=wireDone(w)?"":`<g class="qbadge"><circle cx="${m.x}" cy="${m.y}" r="10"/><text x="${m.x}" y="${m.y+4}" text-anchor="middle">?</text></g>`;
    if(w.type==="pair"){
      const gw=gaugeWidth(w.gauge);
      const d2=wirePath({x:a.x+7,y:a.y},{x:b.x+7,y:b.y},k);
      return `<g class="${cls}" data-w="${w.id}">
        <path class="edge" d="${d}" stroke-width="${gw+3}"/><path class="core" d="${d}" stroke="var(--wire-red)" stroke-width="${gw}"/>
        <path class="edge" d="${d2}" stroke-width="${gw+3}"/><path class="core" d="${d2}" stroke="var(--wire-black)" stroke-width="${gw}"/>
        <path class="flow" d="${d}" stroke-width="2.5"/>
        <path d="${d}" stroke="transparent" stroke-width="18"/>${qm}</g>`;
    }
    const gw=gaugeWidth(w.gauge);
    return `<g class="${cls}" data-w="${w.id}">
      <path class="edge" d="${d}" stroke-width="${gw+3}"/><path class="core" d="${d}" stroke="${w.color==="red"?"var(--wire-red)":w.color==="black"?"var(--wire-black)":"var(--muted)"}" stroke-width="${gw}"/>
      <path class="flow" d="${d}" stroke-width="2.5"/><path d="${d}" stroke="transparent" stroke-width="18"/>${qm}</g>`;
  }).join("");
  const fx=(G.fx||[]).join("");
  const svg=`<svg class="board" viewBox="${L.vb}" role="application" aria-label="Electrical board">${L.draw(L)}${wires}${L.terms.map(t=>termSvg(t,G.sel===t.id)).join("")}${fx}</svg>`;
  let res="";
  if(G.phase==="win"){
    const r=S.m[G.id];
    res=`<div class="win"><h3>${G.shown?"Here’s the solution":"The robot is alive!"}</h3>${stars(G.earned)}
      <p style="margin:0">${G.shown?"We went through the solution together. Try again without help to earn stars.":`You earned <b class="mono">+${G.gain} XP</b>. ${G.attempts===1?"On the first try!":`In${G.attempts} tries.`}`}</p>
      <div class="row"><button class="btn" data-go="world">To the mission path</button><button class="btn ghost" data-play="${G.id}">Play again</button></div></div>`;
  }else if(G.errors&&G.errors.length){
    res=`<div class="result"><p style="margin:0;font-weight:700">${G.errors.length===1?"One problem":G.errors.length+" problems"} on the board. Fix it and check again.</p>
      ${G.errors.map(e=>`<div class="err ${e.sev==="w"?"w":""}"><span class="ic">!</span><p>${e.text}</p></div>`).join("")}
      ${G.attempts>=2?`<button class="btn ghost small" id="solve" style="align-self:flex-start">Show solution (no stars)</button>`:""}</div>`;
  }
  const manual=G.manualOpen?`<div class="manual"><p style="margin:0 0 8px;font-weight:700">From the manual: fuse and minimum wire gauge</p>
    <table><thead><tr><th>Channel fuse</th><th>Minimum wire</th></tr></thead><tbody>
    <tr><td class="mono">40A</td><td class="mono">12 AWG</td></tr><tr><td class="mono">30A</td><td class="mono">14 AWG</td></tr><tr><td class="mono">20A</td><td class="mono">18 AWG</td></tr>
    <tr><td>Main path (battery, breaker, PDH)</td><td class="mono">6 AWG</td></tr></tbody></table>
    <p class="note" style="margin:8px 0 0">A smaller AWG number = a thicker wire. Based on the 2025 and 2026 manuals; check against the 2027 manual.</p></div>`:"";
  return `<section class="gamehead">
      <div style="display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 280px">
        <button class="btn ghost small" data-go="world" style="align-self:flex-start">← Mission path</button>
        <span class="eyebrow">Mission ${MISSIONS.findIndex(m=>m.id===G.id)+1} · ${WN().name}</span>
        <h2>${L.title}</h2><p class="goal" style="margin:0">${L.goal}</p>
        <p class="note" style="margin:0">Drag from screw to screw to run a wire (or tap one, then the other). Tapping a wire opens its color and gauge, and you can delete it there.</p></div>
    </section>
    ${manual}<div class="boardwrap">${svg}</div>
    ${G.phase!=="win"?`<div class="row">
      <button class="btn" id="check" ${G.wires.length?"":"disabled"}>Check wiring</button>
      ${L.manual?`<button class="btn ghost" id="man">${G.manualOpen?"Close manual":"Open manual"}</button>`:""}
      <button class="btn ghost" id="hint">${G.hint?"Hint: "+L.hint:"Hint (−1 star)"}</button>
      <button class="btn ghost small" id="clear">Clear all</button></div>`:""}
    ${res}`;
}

/* ---------- game logic ---------- */
let ANIMS=[];const stopAnims=()=>{ANIMS.forEach(f=>{try{f()}catch(e){}});ANIMS=[]};
function startGame(id){
  G={id,L:LEVELS[id],wires:[],sel:null,attempts:0,hint:false,errors:null,flags:{},fx:[],phase:"play",n:0,learned:false};
  if(MODS[id])MODS[id].init();
  if(ACC)try{Promise.resolve(window.Y3211Sync.start(id)).catch(()=>{})}catch(e){}
  view="game";render();window.scrollTo(0,0);
}
function bindGame(){
  if(typeof LEARN!=="undefined"&&LEARN[G.id]){
    if(!G.learned){const b=document.getElementById("learned");if(b)b.addEventListener("click",()=>{G.learned=true;render();window.scrollTo(0,0)});return}
    const r=document.getElementById("relearn");if(r)r.addEventListener("click",()=>{closeSheet();G.learned=false;render();window.scrollTo(0,0)});
  }
  if(MODS[G.id]){MODS[G.id].bind();return}
  const svg=app.querySelector(".board");if(!svg)return;
  dragWire(svg,()=>G.L.terms,tapTerm,(a,b)=>{G.sel=a;tapTerm(b)});
  svg.querySelectorAll(".wire").forEach(el=>el.addEventListener("click",()=>editWire(el.dataset.w)));
  const on=(id,f)=>{const b=document.getElementById(id);if(b)b.addEventListener("click",f)};
  on("check",check);on("clear",()=>{if(G.phase==="win")return;G.wires=[];G.flags={};G.fx=[];G.errors=null;render()});
  on("hint",()=>{if(!G.hint){G.hint=true;render()}});
  on("man",()=>{G.manualOpen=!G.manualOpen;render()});
  on("solve",showSolution);
  if(G.phase==="win")animateDevices();
}
function tapTerm(id){
  if(G.phase==="win")return;
  if(!G.sel){G.sel=id;render();return}
  if(G.sel===id){G.sel=null;render();return}
  const a=T(G.sel),b=T(id);
  const kinds=[a.kind,b.kind].sort().join("-");
  if(kinds==="ch-dev")addWire({a:a.kind==="ch"?a.id:b.id,b:a.kind==="ch"?b.id:a.id,type:"pair"});
  else if(kinds==="pw-pw")addWire({a:a.id,b:b.id,type:"single"});
  else{G.sel=id;render();toast(a.kind==="dev"&&b.kind==="dev"?"A device connects to a PDH channel, not to another device":a.kind==="ch"&&b.kind==="ch"?"Connect a channel to a device, not a channel to a channel":"PDH channels connect to devices, not to the battery");return}
}
function addWire(w){
  if(G.wires.some(x=>(x.a===w.a&&x.b===w.b)||(x.a===w.b&&x.b===w.a))){G.sel=null;render();toast("There’s already a wire between these two");return}
  w.id="w"+(++G.n);w.color=null;w.gauge=null;G.wires.push(w);G.sel=null;clearFx();render();
  toast(w.type==="pair"?"Wire connected. Tap it to pick a gauge":"Wire connected. Tap it to pick a color and gauge");
}
const wireDone=w=>w.gauge&&(w.type==="pair"||w.color);
function editWire(wid){if(G.phase==="win")return;const w=G.wires.find(x=>x.id===wid);openSheet(Object.assign({},w),true)}
function openSheet(w,existing){
  closeSheet();
  w.color=w.color||(w.type==="single"?null:undefined);w.gauge=w.gauge||null;
  const a=T(w.a),b=T(w.b);
  const el=document.createElement("div");el.className="sheet";el.setAttribute("role","dialog");el.setAttribute("aria-label","Wire settings");
  const draw=()=>{
    el.innerHTML=`<div class="in"><h3 style="font-size:18px">${existing?"Wire":"New wire"}: ${a.name} → ${b.name}</h3>
    ${w.type==="single"?`<div><p style="margin:0 0 6px" class="muted">Color</p><div class="chips">
      <button class="chip" data-c="red" aria-pressed="${w.color==="red"}">Red<span class="sw" style="background:var(--wire-red)"></span></button>
      <button class="chip" data-c="black" aria-pressed="${w.color==="black"}">Black<span class="sw" style="background:var(--wire-black)"></span></button></div></div>`
      :`<p style="margin:0" class="muted">Paired cable: red for plus, black for minus.</p>`}
    <div><p style="margin:0 0 6px" class="muted">Gauge (AWG)</p><div class="chips">${GAUGES.map(g=>`<button class="chip" data-g="${g}" aria-pressed="${w.gauge===g}">${g}</button>`).join("")}</div></div>
    <div class="row"><button class="btn" id="ok" ${existing||wireDone(w)?"":"disabled"}>${existing?"Close":"Connect"}</button>
      ${existing?`<button class="btn ghost" id="del" style="color:var(--bad)">Delete wire</button>`:`<button class="btn ghost" id="cancel">Cancel</button>`}</div></div>`;
    const live=()=>{if(existing){const i=G.wires.findIndex(x=>x.id===w.id);if(i>=0){G.wires[i]=Object.assign({},w);clearFx();render()}}draw()};
    el.querySelectorAll("[data-c]").forEach(c=>c.onclick=()=>{w.color=c.dataset.c;live()});
    el.querySelectorAll("[data-g]").forEach(c=>c.onclick=()=>{w.gauge=+c.dataset.g;live()});
    const cn=el.querySelector("#cancel");if(cn)cn.onclick=()=>{closeSheet();G.sel=null;render()};
    const d=el.querySelector("#del");if(d)d.onclick=()=>{G.wires=G.wires.filter(x=>x.id!==w.id);clearFx();closeSheet();render()};
    el.querySelector("#ok").onclick=()=>{
      if(existing){const i=G.wires.findIndex(x=>x.id===w.id);G.wires[i]=w}
      else{w.id="w"+(++G.n);G.wires.push(w)}
      G.sel=null;clearFx();closeSheet();render()};
  };
  draw();document.body.appendChild(el);sheet=el;
  const first=el.querySelector(".chip");if(first)first.focus();
}
function closeSheet(){if(sheet){sheet.remove();sheet=null}}
/* drag from one terminal to another to lay a wire; a tap without a drag still selects (tap-tap also works) */
function dragWire(svg,terms,onTap,onConnect){
  const toSvg=e=>{const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
  const near=(q,skip)=>{let best=null,bd=30;terms().forEach(t=>{const d=Math.hypot(t.x-q.x,t.y-q.y);if(d<bd&&t.id!==skip){bd=d;best=t}});return best};
  svg.querySelectorAll(".term").forEach(el=>{
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onTap(el.dataset.t)}});
    el.addEventListener("pointerdown",e=>{
      if(G.phase==="win"||e.button>0)return;e.preventDefault();
      const id=el.dataset.t,a=terms().find(t=>t.id===id),start={x:e.clientX,y:e.clientY};let moved=false,line=null,hot=null;
      try{svg.setPointerCapture(e.pointerId)}catch(_){}
      const move=ev=>{if(ev.pointerId!==e.pointerId)return;
        if(!moved&&Math.hypot(ev.clientX-start.x,ev.clientY-start.y)<8)return;
        if(!moved){moved=true;line=document.createElementNS("http://www.w3.org/2000/svg","path");line.setAttribute("class","dragline");svg.insertBefore(line,svg.querySelector(".term"));el.classList.add("sel")}
        const q=toSvg(ev),t=near(q,id);
        line.setAttribute("d",`M${a.x} ${a.y}L${t?t.x:q.x} ${t?t.y:q.y}`);line.classList.toggle("snap",!!t);
        if(hot!==t){if(hot){const h=svg.querySelector(`.term[data-t="${hot.id}"]`);if(h)h.classList.remove("sel")}hot=t;if(t){const h=svg.querySelector(`.term[data-t="${t.id}"]`);if(h)h.classList.add("sel")}}};
      const up=ev=>{if(ev.pointerId!==e.pointerId)return;svg.removeEventListener("pointermove",move);svg.removeEventListener("pointerup",up);svg.removeEventListener("pointercancel",up);
        if(line)line.remove();
        if(!moved){onTap(id);return}
        const t=ev.type==="pointerup"?near(toSvg(ev),id):null;
        if(t)onConnect(id,t.id);else{G.sel=null;render()}};
      svg.addEventListener("pointermove",move);svg.addEventListener("pointerup",up);svg.addEventListener("pointercancel",up);
    });
  });
}
function clearFx(){G.flags={};G.fx=[];G.errors=null}
function toast(msg){let t=document.querySelector(".toast");if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t)}
  t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),2600)}

/* union-find over power terminals */
function nets(wires,withBreaker){
  const p={};const f=x=>{p[x]=p[x]||x;return p[x]===x?x:(p[x]=f(p[x]))};const u=(a,b)=>{p[f(a)]=f(b)};
  wires.forEach(w=>u(w.a,w.b));if(withBreaker)u("BR1","BR2");return (a,b)=>f(a)===f(b);
}
function evaluate(){
  const L=G.L,errs=[],flags={},fx=[];
  const mark=(ids,cls)=>ids.forEach(i=>flags[i]=(flags[i]?flags[i]+" ":"")+cls);
  const mid=w=>{const a=T(w.a),b=T(w.b);return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};
  if(L.power){
    const pw=G.wires.filter(w=>w.type==="single");
    const same=nets(pw,true),sameNoBr=nets(pw,false);
    if(same("B+","B-")){
      errs.push({text:"<b>Short circuit!</b> Battery plus is connected straight to minus. On a real battery that’s hundreds of amps in a split second: wires melt and a fire can start."});
      mark(pw.map(w=>w.id),"bad");["B+","B-"].forEach(id=>{const t=T(id);fx.push(sparkAt(t.x,t.y))});
    }else{
      if(same("P+","B-")||same("P-","B+")){errs.push({text:"<b>Reversed polarity.</b> The PDH gets minus where it needs plus. That’s how you burn the PDH and the controllers."});mark(pw.map(w=>w.id),"bad")}
      else{
        if(!same("P+","B+"))errs.push({text:"The PDH isn’t getting plus from the battery. Plus has to reach it through the main breaker."});
        if(!same("P-","B-"))errs.push({text:"The PDH minus doesn’t return to the battery. Without a closed loop no current flows."});
      }
      const direct=pw.filter(w=>[w.a,w.b].sort().join()==="BR1,BR2");
      if(direct.length){errs.push({text:"<b>A wire between the two breaker screws</b> bypasses it. The breaker can no longer turn the robot off."});mark(direct.map(w=>w.id),"bad")}
      else if(sameNoBr("B+","P+")){errs.push({text:"<b>You bypassed the main breaker.</b> Without a breaker there’s no way to shut the robot down in an emergency, and it won’t pass inspection."});mark(pw.filter(w=>w.a==="B+"||w.b==="B+").map(w=>w.id),"bad")}
      const thin=pw.filter(w=>w.gauge>6);
      if(thin.length){errs.push({text:`Wire ${thin.map(w=>w.gauge+" AWG").join(", ")} is too thin for the main path. All of the robot’s current goes through here, sometimes more than 100A. You need <b class="mono">6 AWG</b> or thicker.`});
        mark(thin.map(w=>w.id),"hot");thin.forEach(w=>fx.push(smokeAt(mid(w))))}
      const posSide=id=>same(id,"B+"),wrongCol=pw.filter(w=>(posSide(w.a)&&w.color!=="red")||(!posSide(w.a)&&same(w.a,"B-")&&w.color!=="black"));

  }
  const pairs=G.wires.filter(w=>w.type==="pair");

  chs.forEach(c=>{const ws=pairs.filter(w=>w.a===c.id);if(ws.length>1){errs.push({text:`<b>${c.name}</b> feeds more than one device. Each device gets its own channel and fuse.`});mark(ws.map(w=>w.id),"bad")}});
  devs.forEach(d=>{
    const ws=pairs.filter(w=>w.b===d.id);
    if(!ws.length){errs.push({text:`<b>${d.name}</b> isn’t connected to any channel.`});return}
    if(ws.length>1){errs.push({text:`<b>${d.name}</b> is connected to more than one channel.`});mark(ws.map(w=>w.id),"bad");return}
    const w=ws[0],c=T(w.a);
    if(c.amps<d.need){errs.push({text:`<b>${d.name}</b> needs a fuse of ${d.need}A and you connected it to a channel with ${c.amps}A. The fuse will trip mid-match and the motor will cut out.`});mark([w.id],"bad")}
    else if(c.amps>d.need){errs.push({text:`<b>${d.name}</b> needs a fuse of ${d.need}A and you connected it to a channel with ${c.amps}A. A fuse that’s too big doesn’t protect: in a short, the wire burns before the fuse trips.`});mark([w.id],"bad")}
    const req=GAUGE_FOR[c.amps];
    if(w.gauge>req){errs.push({text:`Cable <span class="mono">${w.gauge} AWG</span> to ${d.name} is too thin for a fuse of ${c.amps}A. You need at least <b class="mono">${req} AWG</b>. The wire heats up before the fuse has time to trip.`});mark([w.id],"hot");fx.push(smokeAt(mid(w)))}

}
function sparkAt(x,y){let s="";for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<line class="spark" style="transform-origin:${x}px ${y}px" x1="${x+Math.cos(a)*8}" y1="${y+Math.sin(a)*8}" x2="${x+Math.cos(a)*20}" y2="${y+Math.sin(a)*20}"/>`}return s}
function smokeAt(p){return [0,1,2].map(i=>`<circle class="smoke" cx="${p.x+(i-1)*7}" cy="${p.y-4}" r="6" style="animation-delay:${i*.45}s;transform-box:fill-box;transform-origin:center"/>`).join("")}
function check(){
  closeSheet();G.sel=null;
  const un=G.wires.filter(w=>!wireDone(w));
  if(un.length){G.flags={};un.forEach(w=>G.flags[w.id]="bad");G.fx=[];G.errors=[{text:`<b>${un.length===1?"There’s one wire":`There are ${un.length} wires`} without ${un.some(w=>w.type==="single")?"a color or gauge":"a gauge"}</b> (marked with ?). Tap each wire and choose.`}];render();const r=app.querySelector(".result");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});return}
  G.attempts++;
  const {errs,flags,fx}=evaluate();
  G.flags=flags;G.fx=fx;G.errors=errs;
  if(!errs.length){win(false);return}
  render();
  const r=app.querySelector(".result");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function win(shown){
  G.phase="win";G.shown=shown;G.errors=null;G.fx=[];
  G.wires.forEach(w=>G.flags[w.id]="live");
  let st=shown?0:G.attempts===1?3:G.attempts<=3?2:1;if(G.hint&&st>1)st--;
  G.earned=st;const prev=S.m[G.id]||{stars:0,attempts:0};
  const gain=shown?0:Math.max(0,(st*30+10)-(prev.done?prev.stars*30+10:0));
  G.gain=gain;S.xp+=gain;
  S.m[G.id]={done:true,stars:Math.max(prev.stars||0,st),attempts:(prev.attempts||0)+1,at:Date.now()};
  if(!shown)markFx(G.id,prev);save();accAfter(prev,st,shown);render();
  const r=app.querySelector(".win");if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function showSolution(){
  G.wires=G.L.solution.map((s,i)=>Object.assign({id:"s"+i,type:s.color?"single":"pair"},s));
  win(true);
}
function animateDevices(){

/* track failed attempts for the mentor view */
function recordAttempt(){if(!G||G.phase==="win")return;const r=S.m[G.id]||{stars:0,attempts:0};r.attempts=(r.attempts||0)+1;S.m[G.id]=r;save()}

/* ---------- missions 4-7: shared helpers ---------- */
function starsFor(attempts,hint){let st=attempts<=1?3:attempts<=3?2:1;if(hint&&st>1)st--;return st}
function award(st,shown){
  const prev=S.m[G.id]||{stars:0,attempts:0};
  const gain=shown?0:Math.max(0,(st*30+10)-(prev.done?(prev.stars||0)*30+10:0));
  S.xp+=gain;
  S.m[G.id]=Object.assign({},prev,{done:true,stars:Math.max(prev.stars||0,shown?0:st),attempts:(prev.attempts||0)+1,at:Date.now()});
  G.phase="win";G.shown=shown;G.earned=shown?0:st;G.gain=gain;if(!shown)markFx(G.id,prev);save();accAfter(prev,shown?0:st,shown);
}
function failAttempt(){const r=S.m[G.id]||{stars:0,attempts:0};r.attempts=(r.attempts||0)+1;S.m[G.id]=r;save()}
function headHtml(L,note){

}
function winHtml(text){
  return `<div class="win"><h3>${G.shown?"Here’s the solution":"Passed!"}</h3>${stars(G.earned)}
    <p style="margin:0">${G.shown?"We went through the solution together. Try again without help to earn stars.":`You earned <b class="mono">+${G.gain} XP</b>. ${text||""}`}</p>
    <div class="row"><button class="btn" data-go="world">To the mission path</button><button class="btn ghost" data-play="${G.id}">Play again</button></div></div>`;

function errsHtml(errs,solveLabel){

}
const on=(id,f)=>{const b=document.getElementById(id);if(b)b.addEventListener("click",f)};
const scrollTo_=sel=>{const r=app.querySelector(sel);if(r)r.scrollIntoView({behavior:"smooth",block:"nearest"})};

/* ---------- mission 4: CAN chain ---------- */
const CAN={
  title:"Chain CAN",
  goal:"Connect all the devices into one CAN chain, from the roboRIO to the resistor, and give each motor an ID by our convention: drive <span class=\"mono\">0–9</span>, Intake <span class=\"mono\">10–19</span>, Arm <span class=\"mono\">20–29</span>.",
  hint:"One chain with no branches: roboRIO at one end, a 120Ω resistor at the other, and every motor in between. Yellow always to yellow. Each motor gets a different ID, in its system’s range.",
  SYS:{K1:["Drive",0],K2:["Drive",0],K3:["Intake",10],K4:["Arm",20]},
  vb:"0 0 400 560",
  terms:[
    {id:"RIO",x:200,y:122,name:"roboRIO"},
    {id:"K1",x:85,y:210,name:"Drive left"},{id:"K2",x:315,y:210,name:"Drive right"},
    {id:"K3",x:85,y:360,name:"Intake"},{id:"K4",x:315,y:360,name:"Arm"},
    {id:"TR",x:200,y:490,name:"Resistor 120Ω"}],
  init(){G.links=[];G.ids={K1:0,K2:0,K3:0,K4:0};G.flags={}},
  T(id){return CAN.terms.find(t=>t.id===id)},
  draw(){
    const rio=`<rect class="comp" x="110" y="30" width="180" height="92" rx="16"/><text class="lbl" x="200" y="66" text-anchor="middle" style="font-size:16px">roboRIO</text>
      <text class="sub" x="200" y="86" text-anchor="middle">CAN · 120Ω built-in</text>`;
    const motor=t=>{const x=t.x,y=t.y,idb=(G.flags["id"+t.id]||"");
      return `<rect class="comp" x="${x-56}" y="${y}" width="112" height="122" rx="18"/>
      <g class="dv"><circle cx="${x}" cy="${y+40}" r="20" fill="var(--ink)"/><circle cx="${x}" cy="${y+40}" r="13" fill="none" stroke="var(--comp)" stroke-width="2"/><path class="rotor" d="M${x} ${y+28}v24M${x-12} ${y+40}h24" stroke="var(--comp)" stroke-width="3"/></g>
      <text class="lbl" x="${x}" y="${y+80}" text-anchor="middle" style="font-size:11.5px">${t.name.replace("Motor ","")}</text>
      <g class="idtag ${idb}" data-id="${t.id}" tabindex="0" role="button" aria-label="ID of ${t.name}"><rect x="${x-30}" y="${y+90}" width="60" height="22" rx="11"/><text x="${x}" y="${y+105}" text-anchor="middle">ID ${G.ids[t.id]}</text></g>`};
    const tr=`<rect class="comp" x="150" y="490" width="100" height="44" rx="22"/><text class="tag" x="200" y="517" text-anchor="middle">120Ω</text>`;

  },
  linkSvg(l,k){
    const a=CAN.T(l.a),b=CAN.T(l.b),mx=(a.x+b.x)/2,my=(a.y+b.y)/2,dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy)||1;
    const off=(k%2?1:-1)*28,cx=mx-dy/len*off,cy=my+dx/len*off,nx=-dy/len*3.2,ny=dx/len*3.2;
    const P=(s1,s2)=>`M${a.x+nx*s1} ${a.y+ny*s1}Q${cx} ${cy} ${b.x+nx*s2} ${b.y+ny*s2}`;
    const mid=`M${a.x} ${a.y}Q${cx} ${cy} ${b.x} ${b.y}`,Q=t=>({x:(1-t)*(1-t)*a.x+2*(1-t)*t*cx+t*t*b.x,y:(1-t)*(1-t)*a.y+2*(1-t)*t*cy+t*t*b.y});

  },
  view(){

      `<div class="boardwrap">${svg}</div>
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="check" ${G.links.length?"":"disabled"}>Check chain</button>
        <button class="btn ghost" id="hint">${G.hint?"Hint: "+CAN.hint:"Hint (−1 star)"}</button><button class="btn ghost small" id="clear">Clear all</button></div>`:""}${res}`;
  },
  bind(){
    const svg=app.querySelector(".board");

    svg.querySelectorAll(".idtag").forEach(el=>{const f=()=>CAN.idSheet(el.dataset.id);el.addEventListener("click",f);el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}})});

  },
  linkSheet(l,existing){
    closeSheet();const el=document.createElement("div");el.className="sheet";el.setAttribute("role","dialog");el.setAttribute("aria-label","Cable CAN");
    const draw=()=>{el.innerHTML=`<div class="in"><h3 style="font-size:18px">${existing?"Edit cable":"New CAN cable"}: ${CAN.T(l.a).name} → ${CAN.T(l.b).name}</h3>
      <p class="muted" style="margin:0">How do you connect the two wires?</p><div class="opts">
      <button class="opt" data-x="0" aria-pressed="${l.cross===false}"><b>Yellow to yellow, green to green</b></button>
      <button class="opt" data-x="1" aria-pressed="${l.cross===true}"><b>Yellow to green, green to yellow</b></button></div>
      <div class="row"><button class="btn" id="ok" ${l.cross===null?"disabled":""}>${existing?"Save":"Connect"}</button>
      ${existing?`<button class="btn ghost" id="del" style="color:var(--bad)">Delete cable</button>`:""}<button class="btn ghost" id="cancel">Cancel</button></div></div>`;
      el.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{l.cross=b.dataset.x==="1";draw()});

    };draw();document.body.appendChild(el);sheet=el;
  },
  idSheet(k){
    if(G.phase==="win")return;closeSheet();const t=CAN.T(k);
    const el=document.createElement("div");el.className="sheet";el.setAttribute("role","dialog");el.setAttribute("aria-label","ID ID");
    el.innerHTML=`<div class="in"><h3 style="font-size:18px">ID: ${t.name}</h3><p class="muted" style="margin:0">From the factory every motor has ID 0. The ID is set in the maker’s software before connecting to the robot.</p>
      ${[["Drive",0],["Intake",10],["Arm",20]].map(([nm,b])=>`<div><p class="muted" style="margin:0 0 4px;font-size:13px">${nm} <bdi class="mono">${b}–${b+9}</bdi></p><div class="chips">${Array.from({length:10},(_,i)=>b+i).map(n=>`<button class="chip" data-n="${n}" aria-pressed="${G.ids[k]===n}">${n}</button>`).join("")}</div></div>`).join("")}

  check(){
    closeSheet();G.attempts++;G.sel=null;const errs=[],flags={},L=G.links,deg={};
    const mark=(ids,c)=>ids.forEach(i=>flags[i]=c);
    CAN.terms.forEach(t=>deg[t.id]=0);L.forEach(l=>{deg[l.a]++;deg[l.b]++});
    const nm=id=>`<b>${CAN.T(id).name}</b>`;
    CAN.terms.filter(t=>deg[t.id]>2).forEach(t=>{errs.push({text:`${nm(t.id)} is connected to three or more cables. CAN is a chain, not a star: each device gets one cable in and one cable out, with no branches.`});mark(L.filter(l=>l.a===t.id||l.b===t.id).map(l=>l.id),"bad")});
    const lonely=CAN.terms.filter(t=>deg[t.id]===0&&t.id!=="TR");
    lonely.forEach(t=>errs.push({text:`${nm(t.id)} isn’t connected to CAN at all. The roboRIO can’t see it, and the motor won’t move.`}));
    if(deg.TR===0)errs.push({text:"<b>There’s no resistor at the end of the chain.</b> Without termination the signal bounces off the end and collides with itself: CAN errors, and motors that stutter or vanish mid-match."});
    if(deg.TR===2)errs.push({text:"<b>The resistor is in the middle of the chain.</b> The 120Ω resistor goes only at the end, after the last device."});
    if(deg.RIO===2)errs.push({text:"<b>The roboRIO is in the middle of the chain.</b> It has a built-in 120Ω resistor, so it must be one end of the chain. The resistor is the other end."});
    const p={};const f=x=>{p[x]=p[x]||x;return p[x]===x?x:(p[x]=f(p[x]))};
    let loop=false;L.forEach(l=>{if(f(l.a)===f(l.b))loop=true;p[f(l.a)]=f(l.b)});
    if(loop)errs.push({text:"<b>You made a loop.</b> The chain comes back to itself and has no two ends. CAN needs one line with a start and an end."});
    const used=CAN.terms.filter(t=>deg[t.id]>0),roots=new Set(used.map(t=>f(t.id)));
    if(roots.size>1)errs.push({text:"<b>The chain is broken.</b> There are two parts that aren’t connected to each other. Devices in the part that doesn’t reach the roboRIO won’t get commands."});
    const crossed=L.filter(l=>l.cross);
    if(crossed.length){errs.push({text:`<b>Yellow and green are crossed</b> (${crossed.length===1?"one cable":crossed.length+" cables"}, marked in red). Yellow is CAN High and green is CAN Low. Always yellow to yellow and green to green, or no device after the cross talks to the roboRIO.`});mark(crossed.map(l=>l.id),"bad")}

    ["K1","K2","K3","K4"].forEach(k=>{const [nm,b]=CAN.SYS[k],n=G.ids[k];if(n<b||n>b+9){errs.push({text:`<b>${CAN.T(k).name}</b> got <span class="mono">ID ${n}</span>, but our${nm} system uses<span class="mono">${b}–${b+9}</span>. That way when you see an ID in a log you know right away which system it belongs to.`});flags["id"+k]="bad"}});

  },
  winFx(){G.flags={};G.links.forEach(l=>G.flags[l.id]="live")}
};

/* ---------- mission 5: inspection ---------- */

    {id:"main",cap:"The main path",bad:false,why:"<b>The main path is fine.</b> Red 6 AWG wire from the battery to the breaker."}
  ],
  init(){G.marks={};G.res=null},
  tile(it,i){
    const col=i%3,row=Math.floor(i/3),x=6+col*131,y=6+row*186,w=125,h=178,cx=x+w/2;

const BATT={
  title:"Battery push",
  goal:"Quarterfinal. The opponent pushes you for 15 seconds. Pick a battery from the cart and a current limit for the drive motors, and win the push without a brownout.",
  bats:[
    {id:"a",name:"Battery 3",sub:"Charged last night · <bdi>13.0V</bdi> · <bdi>0.011Ω</bdi>",v:13.0,r:0.011},
    {id:"b",name:"Battery 1",sub:"From 2022 · <bdi>12.6V</bdi> · <bdi>0.026Ω</bdi>",v:12.6,r:0.026},
    {id:"c",name:"Battery 5",sub:"From the last match · <bdi>12.2V</bdi> · <bdi>0.014Ω</bdi>",v:12.2,r:0.014}],
  lims:[{id:0,name:"No limit",sub:"Each motor draws as much as it wants"},{id:60,name:"60A per motor",sub:"Current limit in software"},{id:40,name:"40A per motor",sub:"Current limit in software"}],
  RW:0.008,BO:6.8,NEED:220,
  init(){G.bat=null;G.lim=null;G.run=null},
  sim(){
    const b=BATT.bats.find(x=>x.id===G.bat),per=G.lim||100,I0=per*4,pts=[];let off=0,bo=0,pos=0,soc=0;
    for(let t=0;t<=15;t+=0.1){
      const I=off>0?0:I0,voc=b.v-soc;soc+=I*0.1*0.00006;
      let V=voc-I*(b.r+BATT.RW);
      if(off<=0&&V<BATT.BO){off=0.5;bo++;V=BATT.BO-0.15}
      off-=0.1;pos=Math.max(-1,Math.min(1,pos+(I-BATT.NEED)*0.1*0.0009));
      pts.push({t,V:Math.max(4,V),I,pos});
    }
    const minV=Math.min(...pts.map(p=>p.V));
    return {pts,bo,I0,minV,win:!bo&&I0>=BATT.NEED};
  },
  view(){
    const opt=(arr,key)=>arr.map(o=>`<button class="opt" data-${key}="${o.id}" aria-pressed="${G[key]===o.id}" ${G.run&&G.run.playing?"disabled":""}><b>${o.name}</b><small>${o.sub}</small></button>`).join("");
    const r=G.run;
    const X=t=>36+t/15*354,Y=v=>200-(v-4)/10*180;
    const shown=r?r.pts.slice(0,r.k||r.pts.length):[];
    const line=shown.map((p,i)=>(i?"L":"M")+X(p.t).toFixed(1)+" "+Y(p.V).toFixed(1)).join("");
    const last=shown[shown.length-1];
    const graph=`<svg class="board graph" viewBox="0 0 400 300" role="img" aria-label="Battery voltage during the push">
      ${[4,6,8,10,12,14].map(v=>`<line x1="36" x2="390" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="30" y="${Y(v)+3}" text-anchor="end">${v}V</text>`).join("")}
      <line class="thr" x1="36" x2="390" y1="${Y(BATT.BO)}" y2="${Y(BATT.BO)}"/><text x="388" y="${Y(BATT.BO)-5}" text-anchor="end" style="fill:var(--bad)">6.8V brownout</text>
      <path class="vline" d="${line}"/>${last?`<circle cx="${X(last.t)}" cy="${Y(last.V)}" r="4" fill="var(--accent)"/>`:""}
      <rect x="36" y="232" width="354" height="52" rx="26" fill="var(--panel)"/><line x1="213" x2="213" y1="236" y2="280" stroke="var(--comp-edge)" stroke-dasharray="3 3"/>
      ${(()=>{const px=213+(last?last.pos:0)*120;return `<rect x="${px-58}" y="240" width="54" height="36" rx="12" fill="var(--accent)"/><text x="${px-31}" y="262" text-anchor="middle" style="fill:#fff;font-family:var(--f-head);font-size:12px">3211</text>
        <rect x="${px+4}" y="240" width="54" height="36" rx="12" fill="var(--bad)"/><text x="${px+31}" y="262" text-anchor="middle" style="fill:#fff;font-family:var(--f-head);font-size:12px">Opponent</text>`})()}
      </svg>`;
    let res="";
    if(r&&!r.playing){
      if(G.phase==="win")res=winHtml(`The lowest voltage was <span class="mono">${r.minV.toFixed(1)}V</span>, and you pushed with a current of <span class="mono">${r.I0}A</span>.`)+`<p class="why">${BATT.lesson()}</p>`;
      else res=errsHtml(BATT.explain(r),"Show solution (no stars)");
    }
    return headHtml(BATT,"")+`<div><p style="margin:0 0 8px;font-weight:700">1. Which battery?</p><div class="opts three">${opt(BATT.bats,"bat")}</div></div>
      <div><p style="margin:0 0 8px;font-weight:700">2. Current limit for each of the 4 drive motors</p><div class="opts three">${opt(BATT.lims,"lim")}</div></div>
      <div class="boardwrap" style="background:var(--surface)">${graph}</div>
      ${G.phase!=="win"?`<div class="row"><button class="btn" id="go" ${G.bat&&G.lim!==null&&!(r&&r.playing)?"":"disabled"}>${r?"Push again":"Start push"}</button>
        <span class="note">${last?`<span class="mono">${last.V.toFixed(1)}V</span> · <span class="mono">${last.I}A</span>`:"Live voltage will show on the graph"}</span></div>`:""}${res}
      <p class="note" style="margin:0">Voltage is calculated like a real battery, <span class="mono">V = V₀ − I × R</span>, with simplified numbers for the game.</p>`;
  },
  explain(r){
    const e=[];const b=BATT.bats.find(x=>x.id===G.bat);
    if(r.bo){
      if(!G.lim)e.push({text:`<b>Brownout ${r.bo===1?"once":r.bo+" times"}.</b> With no limit, four motors pushing draw about <span class="mono">400A</span>. Every amp drops voltage across the battery and cable resistance, and the voltage fell below 6.8V. The roboRIO cut the motors, the voltage rose, they came back on, and so on. That’s why the robot stutters.`});
      if(b.id==="b")e.push({text:"<b>Battery 1 has high internal resistance</b> (<span class=\"mono\">0.026Ω</span>). An old battery drops much more voltage per amp. A battery tester would have ruled it out for matches."});
      if(b.id==="c")e.push({text:"<b>Battery 5 is already half empty</b> (<span class=\"mono\">12.2V</span> at rest). It held at first, but the voltage dropped during the push and finally fell below the threshold. Swap the battery after every match."});
      if(G.lim&&b.id==="a")e.push({text:"Brownout with a good battery. Try lowering the current."});
    }else if(r.I0<BATT.NEED){
      e.push({sev:"w",text:`<b>No brownout, but you lost the push.</b> 40A Per motor that’s <span class="mono">160A</span> in total, and the opponent pushes harder. You need as much force as possible without dropping below 6.8V.`});
      if(b.id!=="a")e.push({sev:"w",text:"Also: with a better battery you can afford more current."});
    }
    return e;
  },
  lesson(){return "Take this to the workshop: before every match put in a charged battery that was checked on the tester, and set a current limit on the drive in software. That gives enough force to push, and the voltage doesn’t fall below the roboRIO’s threshold."},
  bind(){
    app.querySelectorAll("[data-bat]").forEach(b=>b.onclick=()=>{if(G.phase==="win")return;G.bat=b.dataset.bat;G.run=null;render()});
    app.querySelectorAll("[data-lim]").forEach(b=>b.onclick=()=>{if(G.phase==="win")return;G.lim=+b.dataset.lim;G.run=null;render()});
    on("go",BATT.go);
    on("solve",()=>{G.bat="a";G.lim=60;G.run=Object.assign(BATT.sim(),{playing:false});award(0,true);render()});
  },
  go(){
    G.attempts++;const r=BATT.sim();r.playing=true;r.k=1;G.run=r;render();
    const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
    const step=()=>{if(G.run!==r||view!=="game")return;r.k+=reduce?r.pts.length:3;
      if(r.k>=r.pts.length){r.k=r.pts.length;r.playing=false;if(r.win)award(starsFor(G.attempts,false),false);else failAttempt();render();scrollTo_(G.phase==="win"?".win":".result");return}
      render();requestAnimationFrame(step)};
    requestAnimationFrame(step);
  }
};

function makeLicense(id,o){const LIC={id,title:o.title,goal:o.goal||"Ten questions from across the world. You need 8 correct to move on to the practical part in the workshop.",Q:o.Q,practical:o.practical,

      <span class="qcount">Question ${G.i+1} of 10 · correct so far: ${G.score}</span><h3 style="font-size:19px">${q.q}</h3>

      ${G.checked?`<p class="why">${G.pick===q.a?"<b>Correct.</b> ":"<b>Not quite.</b> "}${q.w}</p>`:""}
      <div class="row">${G.checked?`<button class="btn" id="next">${G.i<9?"Next question":"To the result"}</button>`:`<button class="btn" id="chk" ${G.pick===null?"disabled":""}>Check</button>`}</div></div>`;
  },
  bind(){
    app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{if(G.checked)return;G.pick=+b.dataset.o;render()});

    on("next",()=>{if(G.i<9){G.i++;G.pick=null;G.checked=false;render();window.scrollTo(0,0);return}
      G.done=true;G.attempts=1;
      if(G.score>=8){award(G.score===10?3:G.score===9?2:1,false);S.m[LIC.id].approved=false;save()}else failAttempt();
      render();window.scrollTo(0,0)});
  }
};
return LIC}
